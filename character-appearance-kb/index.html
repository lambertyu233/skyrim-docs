--filter<\/code> 当正则<\/td><\/tr><tr><td style=\"text-align:left\"><code>--targetdir &lt;path&gt;<\/code><\/td><td style=\"text-align:left\"><code>-t<\/code><\/td><td style=\"text-align:left\">构建输出目录（默认游戏 Data 路径）<\/td><\/tr><tr><td style=\"text-align:left\">`--preset &lt;name\\<\/td><td style=\"text-align:left\">file&gt;`<\/td><td style=\"text-align:left\"><code>-p<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><code>--trimorphs<\/code><\/td><td style=\"text-align:left\"><code>-tri<\/code><\/td><td style=\"text-align:left\">启用 tri morph 输出（等价于 GUI 勾 <code>Build Morphs<\/code>）<\/td><\/tr><tr><td style=\"text-align:left\"><code>--preview &lt;files&gt;<\/code><\/td><td style=\"text-align:left\">—<\/td><td style=\"text-align:left\">直接进入预览模式（支持 <code>.nif<\/code> 与 <code>.osp<\/code>）<\/td><\/tr><\/tbody><\/table>\n<p><strong>官方示例<\/strong>：<\/p>\n<pre class=\"code\"><code>BodySlide --groupbuild \"CBBE,CBBE Vanilla Outfits\" --targetdir \"C:\\Output\" --preset \"CBBE Curvy\" --trimorphs\nBodySlide --build \"CBBE Body\"\nBodySlide --preset \"C:\\MyPresets\\MyBodies.xml?My Curvy Body\"<\/code><\/pre>\n<h3>Outfit Studio<\/h3>\n<p><code>--project<\/code> / <code>-proj<\/code>、<code>--single-instance<\/code> / <code>-single<\/code>、 <code>--automation<\/code> / <code>-a &lt;script&gt;<\/code>（无头运行自动化脚本），外加位置参数指定文件。<\/p>\n<h2>来源<\/h2>\n<ul><li>分工、文件格式、CLI 参数、版本：<strong>官方 GitHub 仓库 README 与 wiki<\/strong> —— <strong>一手<\/strong><\/li><\/ul>\n<p><code>https://github.com/ousnius/BodySlide-and-Outfit-Studio/wiki/Command%E2%80%90line-arguments<\/code><\/p>\n<ul><li><code>.osp<\/code> / <code>.osd<\/code> 的区别：<strong>ousnius 本人在 LoversLab 的解释<\/strong> —— <strong>一手<\/strong><\/li><li><code>Build Morphs<\/code> ↔ <code>.tri<\/code> / <code>BODYTRI<\/code> ↔ RaceMenu：官方仓库提交记录（\"Write only a single BODYTRI extra data when building\"）<ul><li>社区一致确认 —— <strong>一手（机制）+ 社区经验（联动细节）<\/strong><\/li><\/ul><\/li><li>\"<code>-o<\/code> / <code>-m<\/code> 不存在\"：<strong>与官方 wiki 参数表逐条比对后得出的纠错结论<\/strong>，属本资料库的辨析<\/li><li><code>BuildSelection.xml<\/code> 冲突解析：官方 wiki —— <strong>一手<\/strong><\/li><\/ul>", "_file": "03-body/bodyslide-outfit-studio.md", "_chars": 3769}, {"id": "cbbe-3ba", "title": "CBBE 3BA（3BBB Advanced）—— 当代事实标准", "category": "03-body", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["身形", "3BA", "3BBB", "CBBE", "物理身形"], "aliases": ["cbbe 3ba", "三乳骨", "acro", "事实标准身形", "amazing body"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/30174", "summary": "3BA 的命名、作者、它为什么成为当代女性身形事实标准，以及它与 CBBE 的关系（同基底网格，不是替代品）。", "content": "<h2>术语先分清<\/h2>\n<table><thead><tr><th style=\"text-align:left\">缩写<\/th><th style=\"text-align:left\">含义<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>3BBB<\/strong><\/td><td style=\"text-align:left\"><strong>3 Breast Bones Body<\/strong> —— 带 3 根乳房骨的身体（术语，不是文件名）<\/td><\/tr><tr><td style=\"text-align:left\"><strong>3BA<\/strong><\/td><td style=\"text-align:left\"><strong>CBBE 3BBB Advanced<\/strong>，也常被称作 \"Amazing Body\"<\/td><\/tr><\/tbody><\/table>\n<p><strong>3BA 是 CBBE 的扩展，使用与 CBBE 相同的基底网格<\/strong> —— 这一点很重要： 它意味着<strong>任何为 CBBE 设计的皮肤与服装都与 3BA 兼容<\/strong>。<\/p>\n<h2>作者与来源<\/h2>\n<ul><li>作者 <strong>Acro<\/strong>（LoversLab ID <code>Acro748<\/code>）。<\/li><li>历史：先有 <strong>CBBE 3BBB Advanced<\/strong>（Acro 制作，经 <strong>Ousnius 授权<\/strong>），<\/li><\/ul>\n<p>后并入 CBBE 3BBB 页，并以 <strong>CBBE 3BA<\/strong> 名义上传 Nexus。<\/p>\n<ul><li>Nexus：<code>https://www.nexusmods.com/skyrimspecialedition/mods/30174<\/code><\/li><li>LoversLab 官方文件页：<code>https://www.loverslab.com/files/file/11063-cbbe-3bbb-advanced<\/code><\/li><\/ul>\n<h2>它增加了什么<\/h2>\n<p>在 CBBE 基底上新增：<\/p>\n<ul><li><strong>受物理控制的骨骼<\/strong>：3 根乳房骨，以及腹部 / 大腿 / 小腿等；<\/li><li><strong>大量额外 morph<\/strong>（因此 RaceMenu 里会多出一批滑杆）。<\/li><li>提供 <strong>RaceMenu Morphs 组件<\/strong>（如 <code>RaceMenuMorphsCBBE.esp<\/code>）—— 它决定捏脸菜单里<\/li><\/ul>\n<p>「身形那一栏」<strong>有哪些滑块、叫什么名字<\/strong>。真正的变形数据仍来自你自己构建的 <code>.tri<\/code>。 这三层来源的对应关系见 <a href=\"morph-runtime-vs-bake.md\" target=\"_blank\" rel=\"noopener\"><code>morph-runtime-vs-bake.md<\/code><\/a>。<\/p>\n<p>技术上：装了 3BA 不一定要再装基础 CBBE，但<strong>基础 CBBE 自带所有原版服装转换<\/strong>， 所以通常两者都装（3BA 覆盖身体，CBBE 提供服装基础）。<\/p>\n<h2>为什么它成了事实标准<\/h2>\n<ol><li><strong>同时支持 CBPC 与 HDT-SMP<\/strong>，可自由切换，甚至能在游戏内切；<\/li><li>对 CPU 友好（相对纯 SMP 方案）；<\/li><li><strong>morph 与预设生态庞大<\/strong> —— 绝大多数新服装、预设都写明 for CBBE 3BA；<\/li><li>有 <strong>3BAv2<\/strong> 迭代。<\/li><\/ol>\n<blockquote><strong>3BAv2 的重要后果<\/strong>：2021 年底之后为 3BAv2 制作的服装才与 3BAv2 兼容， 更老的 CBBE/3BBB 服装需要转换。这是\"跟随从/穿某件衣服时穿模\"的一个隐蔽成因。<\/blockquote>\n<h2>依赖<\/h2>\n<table><thead><tr><th style=\"text-align:left\">依赖<\/th><th style=\"text-align:left\">说明<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">CBBE<\/td><td style=\"text-align:left\">基底网格（3BA 是扩展，不是替代）<\/td><\/tr><tr><td style=\"text-align:left\"><strong>XPMSSE 4.61+<\/strong><\/td><td style=\"text-align:left\">骨骼节点<\/td><\/tr><tr><td style=\"text-align:left\"><strong>CBPC 1.5.1+<\/strong><\/td><td style=\"text-align:left\">碰撞物理<\/td><\/tr><tr><td style=\"text-align:left\">BodySlide<\/td><td style=\"text-align:left\">构建身形与服装<\/td><\/tr><tr><td style=\"text-align:left\">HDT-SMP / <strong>FSMP<\/strong><\/td><td style=\"text-align:left\">可选（SE 下可选 SMP；AE 下可选 FSMP）<\/td><\/tr><tr><td style=\"text-align:left\">PapyrusUtil<\/td><td style=\"text-align:left\">部分版本的分发描述里被列为依赖<\/td><\/tr><\/tbody><\/table>\n<h2>版本<\/h2>\n<ul><li>Nolvus 指南使用的文件名对应 <strong>2.45<\/strong> 左右（2022）。<\/li><li>存在 <strong>3BAv2<\/strong> 迭代。<\/li><li><strong>当前最新版本：未确认<\/strong> —— 请以 Nexus Files 页为准。<\/li><\/ul>\n<h2>来源<\/h2>\n<ul><li>作者 Acro、与 CBBE 同基底、物理支持、3BAv2：LoversLab 官方文件页 + Nolvus 指南 —— <strong>一手 + 社区指南（一致）<\/strong><\/li><li>\"3BBB = 3 Breast Bones Body\"：LoversLab 术语表 —— <strong>社区经验<\/strong><\/li><li>\"成为事实标准\"的原因：<strong>社区共识 + 机制归纳<\/strong>（不是某个官方声明）<\/li><li>依赖清单（XPMSSE 4.61+ / CBPC 1.5.1+）：描述正文经转述 —— <strong>一手（经转述）<\/strong><\/li><li>当前最新版本：<strong>未确认<\/strong><\/li><\/ul>", "_file": "03-body/cbbe-3ba.md", "_chars": 2138}, {"id": "cbbe", "title": "CBBE（Caliente's Beautiful Bodies Enhancer）", "category": "03-body", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["身形", "CBBE", "女性身形", "体模"], "aliases": ["caliente", "beautiful bodies", "beautiful bodies enhancer", "cbbe 身形", "女性体模"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/198", "summary": "CBBE 的作者、构成、UV 与体型选项，以及它与 BodySlide 的绑定关系与\"不能与其他女性身形共存\"这条硬约束。", "content": "<h2>作者与命名<\/h2>\n<table><thead><tr><th style=\"text-align:left\">角色<\/th><th style=\"text-align:left\">人<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">原作者<\/td><td style=\"text-align:left\"><strong>Caliente<\/strong>（CBBE 鼻祖，软件工程师）<\/td><\/tr><tr><td style=\"text-align:left\">共同开发者 / SE 维护<\/td><td style=\"text-align:left\"><strong>Ousnius<\/strong><\/td><\/tr><tr><td style=\"text-align:left\">重要贡献者<\/td><td style=\"text-align:left\"><strong>Jeir<\/strong>（BodySlide 使用教程与社区支持）<\/td><\/tr><\/tbody><\/table>\n<blockquote><strong>命名<\/strong>：LE 时代叫 <em>Edition<\/em>，SE 页改叫 <em>Enhancer<\/em>。搜索时两种写法都会遇到。<\/blockquote>\n<ul><li>Nexus SE：<code>https://www.nexusmods.com/skyrimspecialedition/mods/198<\/code>（该页在成人内容墙后，需登录）<\/li><li>作者访谈（官方）：<code>https://www.nexusmods.com/skyrim/news/12985<\/code><\/li><\/ul>\n<h2>它是什么<\/h2>\n<p>女性身体网格 + 配套原版服装转换。官方描述称网格规模约 <strong>13,554 顶点<\/strong>， 约为原版的 20 倍、老版 CBBE 的 6 倍。<\/p>\n<p><strong>必须靠 BodySlide 构建形状<\/strong> —— CBBE 本体只提供\"基础网格 + 滑块定义\"， 你实际在游戏里看到的体型是 BodySlide 构建出来的。<\/p>\n<h2>体型选项（Shape Options）<\/h2>\n<pre class=\"code\"><code>Slim / Curvy / Vanilla\n以上各带 NeverNude 版本\n+ Underwear（黑 / 紫 / 红 / 浅蓝 / 灰 五色）<\/code><\/pre>\n<p>所有原版与 DLC 服装已转换为这三种基础体型，并能吃滑块与预设。<\/p>\n<h2>UV：一条必须记住的约束<\/h2>\n<blockquote><strong>CBBE 有独立的 UV 映射。为 CBBE 做的皮肤贴图不能直接用在 UNP 系，反之亦然。<\/strong><\/blockquote>\n<p>错配的表现是手 / 颈 / 脚接缝、纹理错位。这不是\"皮肤 mod 不好\"，而是<strong>两套 UV 本来就不兼容<\/strong>。 所以选身形 = 同时选定了皮肤的可用范围。<\/p>\n<h2>硬约束：互斥<\/h2>\n<blockquote><strong>CBBE 不能与任何其他女性身形替换 mod 共存。<\/strong><\/blockquote>\n<p>想同时拥有\"女性 CBBE\"和\"男性身形\"是可以的（那是两条独立的链）， 但<strong>女性身形只能有一个<\/strong>。<\/p>\n<h2>版本<\/h2>\n<ul><li>SE 版本号在不同二手来源里出现过 <strong>1.6.1<\/strong> 与 <strong>1.6.2<\/strong>（Nolvus 指南下载的文件名为<\/li><\/ul>\n<p><code>...v1.6.2-198-1-6-2-1628020768.7z<\/code>）。<\/p>\n<ul><li><strong>当前最新版本：未确认<\/strong> —— Nexus 页在成人内容墙后，本轮未能读取 Files 页。<\/li><\/ul>\n<p><strong>请以 Nexus 页面为准。<\/strong><\/p>\n<h2>依赖<\/h2>\n<table><thead><tr><th style=\"text-align:left\">依赖<\/th><th style=\"text-align:left\">是否必须<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">BodySlide and Outfit Studio<\/td><td style=\"text-align:left\"><strong>是<\/strong>（构建形状）<\/td><\/tr><tr><td style=\"text-align:left\">SKSE64<\/td><td style=\"text-align:left\">否（CBBE 本身是纯网格/纹理）<\/td><\/tr><tr><td style=\"text-align:left\">物理（CBPC / FSMP）<\/td><td style=\"text-align:left\">否（但 <strong>3BA<\/strong> 的物理扩展需要）<\/td><\/tr><tr><td style=\"text-align:left\">XPMSE<\/td><td style=\"text-align:left\">否（但物理需要它提供骨骼节点）<\/td><\/tr><\/tbody><\/table>\n<h2>来源<\/h2>\n<ul><li>作者与 SE 维护者：Nexus 采访页（<code>/news/12985<\/code>）+ FO4 版 BodySlide 页署名 \"Created by Ousnius and Caliente\" —— <strong>一手<\/strong><\/li><li>顶点数、体型选项、需 BodySlide 构建、原版服装已转换：CBBE 描述正文（经转述引用）—— <strong>一手（描述正文）<\/strong><\/li><li>UV 独立、与 UNP 互斥：描述正文 + 社区一致确认 —— <strong>一手 + 社区经验（一致）<\/strong><\/li><li>版本 1.6.1 / 1.6.2：<strong>二手来源不一致，已标注未确认<\/strong><\/li><li>适用游戏版本（SE/AE 通用，1.6.1170 可用）：社区实践一致 —— <strong>社区经验<\/strong><\/li><\/ul>", "_file": "03-body/cbbe.md", "_chars": 1998}, {"id": "unp-bhunp", "title": "UNP 家族与 BHUNP", "category": "03-body", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["身形", "UNP", "BHUNP", "UUNP", "女性身形"], "aliases": ["unpb", "dimon99", "bakafactory"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/31126", "summary": "UNP 家族的演变（UNP → UUNP → Legacy UUNP → BHUNP）、BHUNP 的物理能力与硬依赖，以及它与 CBBE 不兼容的原因。", "content": "<h2>家族演变<\/h2>\n<table><thead><tr><th style=\"text-align:left\">名称<\/th><th style=\"text-align:left\">说明<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Dimonized UNP<\/strong><\/td><td style=\"text-align:left\">作者 <strong>dimon99<\/strong>。最初只是\"原版的替代身形\"，<strong>并非<\/strong>为\"让装甲贴合某体型\"设计 —— 那是 BodySlide / CBBE 时代的产物<\/td><\/tr><tr><td style=\"text-align:left\"><strong>UUNP（Unified UNP）<\/strong><\/td><td style=\"text-align:left\">把各种 UNP 变体统一进 BodySlide，用于 LE<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Legacy UUNP<\/strong><\/td><td style=\"text-align:left\">SE 下 UUNP 官方不再支持后的过渡方案（SE <code>mods/43773<\/code>），用于 LE→SE 转换<\/td><\/tr><tr><td style=\"text-align:left\"><strong>UNP Female Body Renewal<\/strong><\/td><td style=\"text-align:left\">原始 UNP 的 SE 直移植（SE <code>mods/1699<\/code>）。<strong>不支持 BodySlide<\/strong>，已过时<\/td><\/tr><tr><td style=\"text-align:left\"><strong>UNPB<\/strong><\/td><td style=\"text-align:left\">UNP Blessed Body，丰胸丰臀重制版，仍属 UNP 家族<\/td><\/tr><tr><td style=\"text-align:left\"><strong>BHUNP<\/strong><\/td><td style=\"text-align:left\">见下<\/td><\/tr><\/tbody><\/table>\n<h2>BHUNP<\/h2>\n<ul><li><strong>全称<\/strong>：BHUNP (UUNP Next Generation) SSE<\/li><li><strong>作者<\/strong>：<strong>Bakafactory 与 Haeun<\/strong>（在 LoversLab 亦以 \"Baka Haeun\" / \"factoryclose\" 出现）<\/li><li>Nexus SE：<code>https://www.nexusmods.com/skyrimspecialedition/mods/31126<\/code>（LE：<code>mods/100306<\/code>）<\/li><li>LoversLab 官方文件页：<code>https://www.loverslab.com/files/file/10630-bhunp-3bbb-body-for-le<\/code><\/li><\/ul>\n<h3>特点<\/h3>\n<ul><li>基于 HDT 的自然运动的大幅改进 UNP 身形；<\/li><li><strong>3 根乳房骨<\/strong>；<\/li><li>支持 Breasts / Butt / Thighs / Calves / Vagina / Belly 的<strong>物理与碰撞<\/strong>；<\/li><li>基础身形分 <strong>BHUNP 3BBB / TBBP / BBP<\/strong> 三档；<\/li><li>另有仅供 modder 使用的 <strong>Ref 体<\/strong>（Vagina / Breasts Ref，明确标注\"不可用于游玩\"）。<\/li><\/ul>\n<h3>硬依赖<\/h3>\n<pre class=\"code\"><code>BodySlide and Outfit Studio\nCBPC\nHDT-SMP\nSKSE64\nXPMSSE 4.67+<\/code><\/pre>\n<p><strong>注意<\/strong>：BHUNP 同时要求 CBPC <strong>和<\/strong> HDT-SMP —— 而这两个默认都想要 body 插槽。 BHUNP 的分档与配置正是为了让它们各管一部分，装完务必按说明配置， 否则会出现\"物理打架\"（详见 <a href=\"../04-physics/physics-overview.md\" target=\"_blank\" rel=\"noopener\"><code>../04-physics/physics-overview.md<\/code><\/a>）。<\/p>\n<h3>与 CBBE 的关系<\/h3>\n<blockquote><strong>不兼容。<\/strong> 不同 UV、不同皮肤体系。BHUNP 与 <strong>UUNP 系<\/strong>完全兼容。<\/blockquote>\n<h2>关于\"BHUNP\"这个缩写<\/h2>\n<p>社区普遍读作 <strong>\"UNP Bearer\"<\/strong> 或 <strong>\"Baka Haeun UNP\"<\/strong>， 但<strong>官方未给出正式展开式<\/strong> —— 引用时请标注为\"社区惯例，未确认\"。<\/p>\n<h2>版本与维护状态<\/h2>\n<p>LE 官方文件可见 <strong>1.41V<\/strong>；<strong>SE 侧的最新版本与维护状态本轮未确认<\/strong>（Nexus 页未能直读）。 请以 Nexus / LoversLab 文件页为准。<\/p>\n<h2>选择判据<\/h2>\n<p>选 UNP 系（而非 CBBE 系）的典型理由：<\/p>\n<ul><li>你已经在用 UNP 系的皮肤或预设；<\/li><li>你要装的服装包写明 for UNP / BHUNP；<\/li><li>你偏好 BHUNP 的物理分档方式。<\/li><\/ul>\n<p><strong>不要为了\"对比一下\"同时装 CBBE 与 BHUNP。<\/strong><\/p>\n<h2>来源<\/h2>\n<ul><li>BHUNP 作者、3 乳房骨、物理部位、依赖、不兼容 CBBE：LoversLab 官方文件页 + Nexus 发布页 —— <strong>一手<\/strong><\/li><li>UNP → UUNP → Legacy UUNP → UNP Renewal 的演变：Nexus 论坛 UNP 专题帖（资深用户/版主）—— <strong>社区经验（多源一致）<\/strong><\/li><li>\"UUNP 在 SE 官方不再支持、Legacy UUNP 为过渡\"：Nexus 页面与指南 —— <strong>社区经验<\/strong><\/li><li>\"BHUNP\" 缩写含义：<strong>社区惯例，未确认官方展开式<\/strong><\/li><li>BHUNP SE 最新版本 / 维护状态：<strong>未确认<\/strong><\/li><\/ul>", "_file": "03-body/unp-bhunp.md", "_chars": 2272}, {"id": "body-textures", "title": "身体皮肤材质", "category": "03-body", "kind": "reference", "version": "1.0.0", "updated": "2026-09-22", "tags": ["身形", "皮肤", "材质", "贴图", "UV"], "aliases": ["身体皮肤", "皮肤材质", "skin", "男性皮肤", "cbbe 皮肤", "unp 皮肤"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/798", "summary": "身体皮肤与身形家族的绑定关系、常见皮肤 mod、以及\"换皮肤后出现接缝\"的判断顺序。", "content": "<h2>核心规则：皮肤必须与身形家族同族<\/h2>\n<table><thead><tr><th style=\"text-align:left\">身形家族<\/th><th style=\"text-align:left\">可选皮肤<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>CBBE / 3BA<\/strong><\/td><td style=\"text-align:left\">仅 CBBE 系皮肤（CBBE UV）<\/td><\/tr><tr><td style=\"text-align:left\"><strong>UNP / BHUNP<\/strong><\/td><td style=\"text-align:left\">仅 UNP 系皮肤（UNP UV）<\/td><\/tr><\/tbody><\/table>\n<p>原因：CBBE 与 UNP 使用<strong>不同的 UV 映射<\/strong>，贴图无法互换。 错配的表现是手 / 颈 / 脚接缝、纹理错位。<\/p>\n<h2>常见皮肤 mod<\/h2>\n<table><thead><tr><th style=\"text-align:left\">mod<\/th><th style=\"text-align:left\">Nexus<\/th><th style=\"text-align:left\">覆盖<\/th><th style=\"text-align:left\">备注<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Fair Skin Complexion<\/strong><\/td><td style=\"text-align:left\">798<\/td><td style=\"text-align:left\">女性（脸+身）<\/td><td style=\"text-align:left\">提供 <strong>CBBE 与 UNP 两种选项<\/strong>；CBBE 装完后的常见推荐<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Tempered Skins for Males<\/strong><\/td><td style=\"text-align:left\">—<\/td><td style=\"text-align:left\">男性<\/td><td style=\"text-align:left\">男性皮肤的代表作<\/td><\/tr><tr><td style=\"text-align:left\">BnP (Female / Male Skin)<\/td><td style=\"text-align:left\">—<\/td><td style=\"text-align:left\">双向<\/td><td style=\"text-align:left\">社区常用<\/td><\/tr><tr><td style=\"text-align:left\">Mature / Leyenda / Diamond / The Pure / Demoniac<\/td><td style=\"text-align:left\">—<\/td><td style=\"text-align:left\">女性为主<\/td><td style=\"text-align:left\">社区点名较多<\/td><\/tr><\/tbody><\/table>\n<blockquote>上表中除 Fair Skin 与 Tempered Skins 外的一批名字来自 Nexus 论坛的皮肤讨论帖 —— <strong>社区经验，且清单随时期变化<\/strong>。写文档时不要把它当成\"权威排行\"。<\/blockquote>\n<h2>男性与女性是两条独立链<\/h2>\n<ul><li>女性身形（CBBE 系 / UNP 系）<strong>二选一<\/strong>；<\/li><li>男性身形（如 <strong>HIMBO<\/strong>）是<strong>另一条<\/strong>链，可与女性身形<strong>同时启用<\/strong>；<\/li><li>男性皮肤（Tempered Skins for Males 等）也自成一套 UV。<\/li><\/ul>\n<h2>排查顺序：出现接缝时<\/h2>\n<ol><li><strong>头 / 手 / 身体是否来自同一套皮肤的同一种选项？<\/strong>（一支 FOMOD 里的 12 个选项要全选同一档）<\/li><li><strong>皮肤与身形是否同族？<\/strong><\/li><li>是否装了自定义头网格（HPH / CITRUS 等）而没做配套？<\/li><li>FaceGen 的 tint 是否与 CK 里 NPC 的 Face Tinting Color 一致？<\/li><li><strong>最后<\/strong>才考虑\"脖缝修补 mod\" —— 它是创可贴，不解决根因。<\/li><\/ol>\n<p>完整排查见 <a href=\"../06-troubleshooting/neck-seam.md\" target=\"_blank\" rel=\"noopener\"><code>../06-troubleshooting/neck-seam.md<\/code><\/a>。<\/p>\n<h2>来源<\/h2>\n<ul><li>Fair Skin Complexion：<code>https://www.nexusmods.com/skyrimspecialedition/mods/798<\/code> —— <strong>一手<\/strong><\/li><li>\"CBBE / UNP 的 UV 不通用\"：Nexus 发布页描述 + 社区一致确认 —— <strong>一手 + 社区经验<\/strong><\/li><li>皮肤清单中的非 Fair Skin / Tempered Skins 项：Nexus 论坛皮肤讨论 —— <strong>社区经验（随时间变化）<\/strong><\/li><li>接缝排查顺序：综合脖子接缝帖（Nexus 论坛 / LoversLab）归纳 —— <strong>社区经验<\/strong><\/li><\/ul>", "_file": "03-body/body-textures.md", "_chars": 1648}, {"id": "bodyslide-presets", "title": "身形预设（SliderPresets）", "category": "03-body", "kind": "reference", "version": "1.0.0", "updated": "2026-09-22", "tags": ["身形", "预设", "BodySlide", "分享"], "aliases": ["bodyslide 预设", "sliderpreset", "身形预设", "预设 xml", "体型预设"], "source": "https://github.com/ousnius/BodySlide-and-Outfit-Studio/wiki/Creating-a-BodySlide-project", "summary": "身形预设的文件形态与存放位置、自带预设与社区生态、它如何被 OBody NG 与 RaceMenu BodyGen 二次引用。", "content": "<h2>形态与位置<\/h2>\n<p>预设就是 <code>SliderPresets/<\/code> 下的 <strong><code>.xml<\/code><\/strong> 文件，保存一组命名过的滑块值 （完整路径 <code>Data\\CalienteTools\\BodySlide\\SliderPresets\\<\/code>）； 另有 <code>SliderGroups/*.xml<\/code> 定义分组。<\/p>\n<p><strong>XML 的结构要点<\/strong>：每个滑块<strong>存两个值<\/strong> —— 体重 0 一个、体重 100 一个。 所以 BodySlide 预设天然描述「同一个体型在不同体重下的样子」； 游戏里一个体重 50 的 NPC，拿的就是这两个值<strong>线性插值<\/strong>的结果。<\/p>\n<blockquote>⚠️ <strong>BodySlide 预设（<code>.xml<\/code>）与 RaceMenu 预设（<code>.jslot<\/code>）是完全不同的两种文件<\/strong>： 刻度不同（0~100 vs 浮点）、生效方式不同（烘焙 vs 运行时），<strong>不能互相导入<\/strong>。 对照见 <a href=\"morph-runtime-vs-bake.md\" target=\"_blank\" rel=\"noopener\"><code>morph-runtime-vs-bake.md<\/code><\/a>。<\/blockquote>\n<p>制作方式：在 BodySlide 里调好滑块 → <strong>Save As<\/strong> → 存到 <code>SliderPresets/<\/code> → 立刻出现在预设下拉框里。<\/p>\n<h2>自带预设<\/h2>\n<table><thead><tr><th style=\"text-align:left\">来源<\/th><th style=\"text-align:left\">自带内容<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">CBBE<\/td><td style=\"text-align:left\">Slim / Curvy / Vanilla，及对应的 outfit 变体<\/td><\/tr><tr><td style=\"text-align:left\">CBBE 3BA / 3BBB<\/td><td style=\"text-align:left\">随包附带大量预设<\/td><\/tr><tr><td style=\"text-align:left\">BHUNP<\/td><td style=\"text-align:left\">随包附带，数量略少于 3BBB（社区共识）<\/td><\/tr><\/tbody><\/table>\n<h2>社区生态<\/h2>\n<ul><li>通过 Nexus 的 <em>BodySlide Preset<\/em> 分类或 LoversLab 分享；<\/li><li>可举证被引用的个人作者例子：<strong>Mousebell<\/strong>（3BA 玩家预设）；<\/li><li><strong>\"最流行的预设作者\"会随时期变化，不宜写死<\/strong>，引用时请附日期与来源链接。<\/li><\/ul>\n<h2>预设如何被\"再引用\"<\/h2>\n<p>这是本条目最实用的部分：<strong>预设名是上游配置的键<\/strong>。<\/p>\n<table><thead><tr><th style=\"text-align:left\">消费方<\/th><th style=\"text-align:left\">配置文件<\/th><th style=\"text-align:left\">引用方式<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>OBody NG<\/strong><\/td><td style=\"text-align:left\"><code>SKSE/Plugins/OBody_presetDistributionConfig.json<\/code><\/td><td style=\"text-align:left\">按 <code>raceFemale<\/code> / <code>raceMale<\/code> / 黑名单等规则指定可用预设<\/td><\/tr><tr><td style=\"text-align:left\"><strong>RaceMenu BodyGen<\/strong><\/td><td style=\"text-align:left\"><code>meshes/actors/character/BodyGenData/&lt;插件名&gt;/templates.ini<\/code><\/td><td style=\"text-align:left\">`模板名=morph@值 \\<\/td><\/tr><tr><td style=\"text-align:left\"><strong>AutoBody<\/strong><\/td><td style=\"text-align:left\"><code>morphs.ini<\/code><\/td><td style=\"text-align:left\">用 EditorID 匹配（如 `All\\<\/td><\/tr><\/tbody><\/table>\n<p>所以\"给 NPC 分配不同身材\"<strong>本质上就是引用你的 BodySlide 预设名<\/strong>。 预设命名杂乱会让 L4 分配层很难配置 —— 建议<strong>统一命名规范<\/strong>。<\/p>\n<p>详见 <a href=\"../05-distribution/obody-ng.md\" target=\"<em>blank\" rel=\"noopener\"><code>../05-distribution/obody-ng.md<\/code><\/a> 与 <a href=\"../05-distribution/racemenu-bodygen.md\" target=\"<\/em>blank\" rel=\"noopener\"><code>../05-distribution/racemenu-bodygen.md<\/code><\/a>。<\/p>\n<h2>一条实践纪律<\/h2>\n<blockquote><strong>裸身与服装必须用同一个预设构建。<\/strong> 裸身用 Curvy、服装用 Slim，结果是穿模 —— 这是穿模问题最常见的自伤原因。<\/blockquote>\n<p>排查详见 <a href=\"../06-troubleshooting/clipping.md\" target=\"_blank\" rel=\"noopener\"><code>../06-troubleshooting/clipping.md<\/code><\/a>。<\/p>\n<h2>来源<\/h2>\n<ul><li>预设文件位置与\"Save As 即出现\"：BodySlide 官方 wiki —— <strong>一手<\/strong><\/li><li>自带预设与社区生态、Mousebell：\"<strong>社区经验<\/strong>，随时期变化\"<\/li><li>预设被 OBody NG / BodyGen / AutoBody 引用：各工具官方配置说明 —— <strong>一手<\/strong><\/li><\/ul>", "_file": "03-body/bodyslide-presets.md", "_chars": 2174}, {"id": "morph-runtime-vs-bake", "title": "运行时 morph 与离线烘焙——为什么拖滑块衣服跟着变，换预设就穿模", "category": "03-body", "kind": "concept", "version": "1.0.0", "updated": "2026-09-22", "tags": ["身形", "morph", "烘焙", "Zeroed Sliders", "原理", "RaceMenu", "BodySlide"], "aliases": ["运行时变形", "离线烘焙", "换预设穿模", "拖滑块衣服跟着变", "归零构建", "两套预设不通用", "3ba 那一栏", "裸体调好了穿衣服又变样"], "source": "https://forums.nexusmods.com/topic/12433428-cant-use-my-own-character-preset/", "summary": "用\"运行时 morph vs 离线烘焙\"两条路径解释身形的全部行为：捏脸菜单里那一栏的三层来源、为什么拖滑块衣服会跟着变、为什么换 BodySlide 预设就穿模，以及 Zeroed Sliders + Build Morphs + Batch Build 这条正解工作流。", "content": "<p>这一页回答四个连在一起的问题，它们是同一个机制的不同侧面：<\/p>\n<ol><li>捏脸菜单里「CBBE 3BA」那一栏是谁给的？<\/li><li>为什么在菜单里拖滑块，身上衣服会<strong>一起跟着变<\/strong>？<\/li><li>为什么在 BodySlide 里换个预设，衣服就<strong>不匹配<\/strong>了？<\/li><li>有没有一劳永逸的装法？<\/li><\/ol>\n<p><strong>答案的关键是把\"变形\"拆成两条完全不同的路径<\/strong>：一条在运行时算，一条在构建时烘焙。<\/p>\n<hr>\n<h2>一、身型的第一性事实<\/h2>\n<blockquote><strong>Skyrim 里\"穿衣服\"不是给身体套一层布，而是用装备网格直接替换裸体网格。<\/strong><\/blockquote>\n<p>装备本身就是\"一具穿好衣服的身体\"。所以身型问题的本质<strong>只有一个<\/strong>：<\/p>\n<blockquote><strong>所有网格（裸体 + 每一件衣服护甲）的顶点形状必须一致。谁不一致，谁穿模。<\/strong><\/blockquote>\n<p>后面所有现象都是这一句的推论。<\/p>\n<hr>\n<h2>二、那一栏是谁给的：三层叠加<\/h2>\n<table><thead><tr><th style=\"text-align:left\">层<\/th><th style=\"text-align:left\">贡献<\/th><th style=\"text-align:left\">缺了会怎样<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>RaceMenu<\/strong><\/td><td style=\"text-align:left\">菜单框架 + NiOverride 的<strong>运行时施加 morph<\/strong> 能力<\/td><td style=\"text-align:left\">没有捏脸界面，也就没有那一栏<\/td><\/tr><tr><td style=\"text-align:left\"><strong>身形的 RaceMenu Morphs 组件<\/strong>（如 <code>RaceMenuMorphsCBBE.esp<\/code> / <code>RaceMenuMorphsUUNP.esp<\/code>）<\/td><td style=\"text-align:left\">决定这一栏<strong>有哪些滑块、叫什么名字<\/strong><\/td><td style=\"text-align:left\">滑块不出现<\/td><\/tr><tr><td style=\"text-align:left\"><strong>你自己用 BodySlide 勾 <code>Build Morphs<\/code> 构建出的 <code>.tri<\/code><\/strong><\/td><td style=\"text-align:left\">真正的<strong>变形数据<\/strong>（并在 NIF 里写入 <code>BODYTRI<\/code> 指向它）<\/td><td style=\"text-align:left\">那一栏是空的，或拖了没反应<\/td><\/tr><\/tbody><\/table>\n<blockquote>一句话：<strong>栏目的\"名字\"来自身形 mod，\"能变形的数据\"来自你自己的构建。<\/strong><\/blockquote>\n<p>3BA 另带的物理骨骼与顶点权重（负责抖动）<strong>与滑块变形是两回事<\/strong>，别混： 前者是物理模拟，后者是 morph 位移。<\/p>\n<p>对应到本资料库： <a href=\"cbbe-3ba.md\" target=\"<em>blank\" rel=\"noopener\"><code>cbbe-3ba.md<\/code><\/a>（谁定义滑块）、 <a href=\"../02-face/racemenu.md\" target=\"<\/em>blank\" rel=\"noopener\"><code>../02-face/racemenu.md<\/code><\/a>（谁提供能力）、 <a href=\"bodyslide-outfit-studio.md\" target=\"_blank\" rel=\"noopener\"><code>bodyslide-outfit-studio.md<\/code><\/a>（谁产生数据）。<\/p>\n<hr>\n<h2>三、两条变形路径（本页核心）<\/h2>\n<table><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:left\"><strong>运行时 morph<\/strong><\/th><th style=\"text-align:left\"><strong>离线烘焙（BodySlide Build）<\/strong><\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">何时算<\/td><td style=\"text-align:left\">游戏运行中，每一帧<\/td><td style=\"text-align:left\">你在 BodySlide 里点 Build 的那一刻<\/td><\/tr><tr><td style=\"text-align:left\">算在哪<\/td><td style=\"text-align:left\">内存里的网格顶点<\/td><td style=\"text-align:left\"><strong>写进 <code>.nif<\/code> 的顶点坐标<\/strong>（落盘，成静态模型）<\/td><\/tr><tr><td style=\"text-align:left\">输入<\/td><td style=\"text-align:left\">RaceMenu 界面的滑块值<\/td><td style=\"text-align:left\">BodySlide 预设（一组数值）<\/td><\/tr><tr><td style=\"text-align:left\">结果<\/td><td style=\"text-align:left\">临时形变，<strong>不改任何文件<\/strong><\/td><td style=\"text-align:left\">生成一个新网格文件<\/td><\/tr><tr><td style=\"text-align:left\">谁能享受<\/td><td style=\"text-align:left\"><strong>只影响玩家<\/strong>（以及被显式分配过的 NPC）<\/td><td style=\"text-align:left\"><strong>所有用这个网格的人<\/strong>（含全部 NPC）<\/td><\/tr><tr><td style=\"text-align:left\">作用对象<\/td><td style=\"text-align:left\">身上<strong>所有带同名 morph 的网格<\/strong><\/td><td style=\"text-align:left\">你构建的那一个项目<\/td><\/tr><\/tbody><\/table>\n<p><strong>这两条路径互不替代，而且是叠加的<\/strong>：先在构建时烘出一个\"起点形状\"， 再在运行时往它上面叠加 morph。<strong>起点不一致，叠加就必然错位 —— 这就是穿模的来源。<\/strong><\/p>\n<hr>\n<h2>四、conform：衣服为什么\"拥有同一套 morph 名字\"<\/h2>\n<p>3BA 的衣服在 <strong>Outfit Studio<\/strong> 里做过 <strong>conform<\/strong> —— 把身体的滑块形变数据<strong>复制到衣服的顶点上<\/strong>。 于是衣服和身体<strong>拥有同一套 morph 名字<\/strong>（<code>Breasts<\/code>、<code>AppleCheeks<\/code>…）。<\/p>\n<p>这就是\"拖滑块衣服跟着变\"的机制：<\/p>\n<pre class=\"code\"><code>你在菜单里拖 Breasts\n  → NiOverride 遍历身上所有含名为 Breasts 的 morph 的网格\n  → 对它们同时施加顶点位移（运行时实时，不改文件）\n  → 身体与衣服按同一规则一起变 ⇒ 始终贴合<\/code><\/pre>\n<p><strong>反之<\/strong>：某件衣服没被 3BA 化、不带这套 morph，它就<strong>纹丝不动<\/strong>。 这就是最常见的抱怨 —— <strong>\"裸体调好了，穿上衣服又变样\"<\/strong>。<\/p>\n<hr>\n<h2>五、于是两个现象都解释得通了<\/h2>\n<h3>为什么拖滑块是安全的<\/h3>\n<p>因为它是运行时叠加，<strong>不改变起点<\/strong>。身体和衣服的起点本来就一致，叠加规则也一致。<\/p>\n<h3>为什么换预设就穿模<\/h3>\n<p>因为 BodySlide 的 Build 是<strong>离线烘焙<\/strong>：预设是一组滑块数值，Build 把这些数值 <strong>永久写进 <code>.nif<\/code> 的顶点坐标<\/strong>，生成一个静态模型。<\/p>\n<blockquote>你换预设只重新烘焙了<strong>身体<\/strong>，衣服的 nif 还停在<strong>上一个预设的形状<\/strong> —— 顶点对不上 ⇒ 破皮、穿模、塌陷。<\/blockquote>\n<p>三个常见自伤原因（详见 <a href=\"../06-troubleshooting/clipping.md\" target=\"_blank\" rel=\"noopener\"><code>../06-troubleshooting/clipping.md<\/code><\/a>）：<\/p>\n<ol><li>只 Build 了身体，<strong>没 Batch Build 把同一预设刷给所有衣服<\/strong>；<\/li><li>衣服<strong>压根不支持 3BA<\/strong>（是给 CBBE 或 UNP 做的，滑块组和骨骼都对不上）；<\/li><li><strong>预设用错<\/strong>，例如把 CBBE 预设套在 3BA 项目上。<\/li><\/ol>\n<hr>\n<h2>六、正解工作流：Zeroed Sliders + Build Morphs + Batch Build<\/h2>\n<p>思路是<strong>把\"起点\"统一到零，把\"形状\"全部交给运行时<\/strong>。这样所有网格起点一致， 之后实时 morph 对谁都生效，随便调都不会穿模。<\/p>\n<h3>六个步骤<\/h3>\n<ol><li><strong>打开 <code>skee64<\/code> 配置<\/strong>（RaceMenu 安装目录下 <code>SKSE\\Plugins\\skee64<\/code>），确认：<ul><li><code>bEnableBodyMorph=1<\/code>（启用 BodySlide 辅助变形）<\/li><li><code>bEnableBodyGen=0<\/code>（按需；这是随机化，与本节无关）<\/li><\/ul><\/li><li><strong>BodySlide 的 Group Filter<\/strong> 里勾选你的身体与所有服装所在的组。<\/li><\/ol>\n<p>⚠️ <strong>很多服装在 <code>Unassigned<\/code> 组<\/strong>（下拉列表最后一个），<strong>别忘了勾它<\/strong>。<\/p>\n<ol><li><strong>Outfit/Body 选你的主身体<\/strong>：<ul><li>CBBE 3BA → <code>CBBE 3BBB Body Amazing<\/code><\/li><li>BHUNP → <code>BHUNP 3BBB Advanced Ver 3<\/code> 或 <code>Ver 4<\/code><\/li><\/ul><\/li><li><strong>Preset 选 <code>Zeroed Sliders<\/code><\/strong>（滑块归零），然后<strong>勾上 <code>Build Morphs<\/code><\/strong>，点 <strong>Batch Build<\/strong>。<\/li><li>在构建列表里<strong>确认每一件服装都在<\/strong>。缺了 → 回 Group Filter 找漏勾的组。<\/li><li>出现<strong>冲突解决列表<\/strong>时（装了多个身体版本时必然出现），<strong>统一选你第 3 步选的那个身体<\/strong>。<\/li><\/ol>\n<h3>两个容易踩的细节<\/h3>\n<ul><li>⚠️ <strong>Zeroed Sliders 里有滑块是 100% 是正常的，不要改。<\/strong><\/li><\/ul>\n<p>BHUNP 与 CBBE 3BA 的官方 Zeroed Sliders 预设都可能带 100% 的项，这是<strong>有意设计<\/strong>。 优先用你的身体 mod 自带的 Zeroed Sliders；确实没有才自己做一份。<\/p>\n<ul><li><strong>代价<\/strong>：带 morph 的 <code>.tri<\/code> 文件很大。社区实测过某大型身体包因此让网格体积<\/li><\/ul>\n<p>从 1GB 涨到 4GB。这是\"所有衣服都能实时调\"的价格。<\/p>\n<p>做完之后：进游戏，用 RaceMenu 那一栏调形状 —— 会即时作用到身体和所有衣服上。<\/p>\n<hr>\n<h2>七、两套预设体系不通用（重要）<\/h2>\n<p><strong>BodySlide 预设和 RaceMenu 预设不是同一种东西，也不能互相导入。<\/strong><\/p>\n<table><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:left\">BodySlide 预设<\/th><th style=\"text-align:left\">RaceMenu 预设<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">文件<\/td><td style=\"text-align:left\"><code>.xml<\/code><\/td><td style=\"text-align:left\"><code>.jslot<\/code><\/td><\/tr><tr><td style=\"text-align:left\">位置<\/td><td style=\"text-align:left\"><code>Data\\CalienteTools\\BodySlide\\SliderPresets\\<\/code><\/td><td style=\"text-align:left\"><code>Data\\SKSE\\Plugins\\CharGen\\Presets\\<\/code><\/td><\/tr><tr><td style=\"text-align:left\">存储内容<\/td><td style=\"text-align:left\"><strong>每个滑块在体重 0 与体重 100 各一个值<\/strong><\/td><td style=\"text-align:left\"><code>bodyMorphs<\/code> 段里的<strong>浮点数<\/strong><\/td><\/tr><tr><td style=\"text-align:left\">数值刻度<\/td><td style=\"text-align:left\"><strong>0 ~ 100<\/strong><\/td><td style=\"text-align:left\"><strong>浮点<\/strong>（实测样例是 <code>0.50000<\/code> 这种 0~1 量级）<\/td><\/tr><tr><td style=\"text-align:left\">生效方式<\/td><td style=\"text-align:left\">Build 时<strong>烘焙进 nif<\/strong><\/td><td style=\"text-align:left\">游戏内<strong>运行时施加<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>RaceMenu 预设里的条目长这样（注意 <code>keys[].key<\/code> 指向<strong>提供 morph 的那个 esp<\/strong>）：<\/p>\n<pre class=\"code\"><code>{ \"keys\": [ { \"key\": \"RaceMenuMorphsCBBE.esp\", \"value\": 0.50000 } ], \"name\": \"Breasts\" }<\/code><\/pre>\n<p>BodySlide 预设里的对应内容则是\"体重 0 一个值、体重 100 一个值\"， 所以它天然支持\"同一个体型在不同体重下呈现不同效果\"。<\/p>\n<blockquote><strong>推论<\/strong>：想\"把 BodySlide 预设搬进 RaceMenu\"，<strong>没有直接办法<\/strong>，只能逐滑块换算 （社区给出的做法：以体重 100 的 BodySlide 值为准换算到 RaceMenu 的浮点刻度， 手工改 <code>.jslot<\/code> 里对应条目的 <code>value<\/code>）。<strong>别指望两边的文件能互相导入。<\/strong><\/blockquote>\n<p>另外两个数值体系的细节：<\/p>\n<ul><li>BodySlide 的滑块可以<strong>手输负数或大于 100<\/strong>（官方说\"不推荐\"，但不是硬限制）。<\/li><li>RaceMenu 滑块的可拖范围由 <code>RaceMenuMorphs*.psc<\/code> 里 <code>OnSliderRequest<\/code> 的<\/li><\/ul>\n<p><code>Float factor<\/code> 决定（社区记录默认 <code>2.0<\/code>，改它需要把 <code>.psc<\/code> 重编译成 <code>.pex<\/code>）。 ⚠️ <strong>常见说法\"RaceMenu 滑块是 -1 到 +1\"并不准确<\/strong> —— 以你实际界面为准。<\/p>\n<hr>\n<h2>八、玩家 vs NPC<\/h2>\n<table><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:left\">手动拖 RaceMenu 滑块<\/th><th style=\"text-align:left\">BodySlide 烘焙<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">玩家<\/td><td style=\"text-align:left\">✅ 直接生效<\/td><td style=\"text-align:left\">✅ 生效<\/td><\/tr><tr><td style=\"text-align:left\">NPC<\/td><td style=\"text-align:left\">❌ <strong>不生效<\/strong><\/td><td style=\"text-align:left\">✅ 生效（按 NPC 自己的体重在 0/100 两值间线性插值）<\/td><\/tr><\/tbody><\/table>\n<p><strong>所以\"我调好了身材，NPC 却还是老样子\"是正常的<\/strong>，不是 bug。<\/p>\n<p>要让 NPC 有不同身材，有两条路：<\/p>\n<ol><li><strong>分配工具<\/strong>（推荐）：<a href=\"../05-distribution/racemenu-bodygen.md\" target=\"_blank\" rel=\"noopener\"><code>racemenu-bodygen.md<\/code><\/a> /<\/li><\/ol>\n<p><a href=\"../05-distribution/obody-ng.md\" target=\"<em>blank\" rel=\"noopener\"><code>obody-ng.md<\/code><\/a> / <a href=\"../05-distribution/autobody.md\" target=\"<\/em>blank\" rel=\"noopener\"><code>autobody.md<\/code><\/a>。 OBody NG 的做法正是<strong>读取你 <code>SliderPresets<\/code> 文件夹里的 <code>.xml<\/code> 预设<\/strong>， 把它分配给 NPC —— 这也解释了为什么它要求你先做第 6 节的 Zeroed Sliders 基础构建。<\/p>\n<ol><li><strong>给单个 NPC 专属身体<\/strong>（社区经验，工作量大但精确）：<\/li><\/ol>\n<p>以目标预设本地构建裸体/手/脚 → 把网格复制到该 NPC 的专属文件夹 → 在 CK 里建指向这些 nif 的 ArmorAddon → 建一个含这些 Addon 的 Armor → 把它设为该 NPC 的\"裸体皮肤\"。<\/p>\n<hr>\n<h2>来源<\/h2>\n<ul><li><strong>两条路径的机制与对比、conform 与\"同一套 morph 名字\"、Zeroed Sliders 优于固定预设<\/strong>：<\/li><\/ul>\n<p>LoversLab 关于\"RaceMenu BodySlide 插件该以什么基准构建网格\"的讨论 （Pauduan 的解答，指出\"按某预设构建后，游戏内 morph 会作用在那个形状上而非基准形状\"） —— <strong>社区经验（机制解释清楚，与官方机制一致）<\/strong> <code>https://www.loverslab.com/topic/83189-skyrim-special-edition-male-dick-mod<\/code><\/p>\n<ul><li>**Zeroed Sliders + Build Morphs + Batch Build 六步流程、<code>bEnableBodyMorph<\/code> / <code>bEnableBodyGen<\/code>、<\/li><\/ul>\n<p>\"Zeroed Sliders 里有 100% 是正常的不要改\"、冲突列表选同一身体、必勾 <code>Unassigned<\/code> 组<strong>： OBody NG 安装指南（第三方整理的步骤文档）—— <\/strong>社区文档**<\/p>\n<ul><li>**<code>.xml<\/code> 预设位于 <code>Data\\CalienteTools\\BodySlide\\SliderPresets<\/code>、每个滑块存体重 0/100 两个值、<\/li><\/ul>\n<p><code>.jslot<\/code> 的 <code>bodyMorphs<\/code> 存浮点、两套体系不通用的换算步骤、给单个 NPC 专属身体的 ArmorAddon 做法<strong>： Nexus 论坛 scorrp10 的详细解答（附实际文件片段）—— <\/strong>社区经验（引用了实际文件内容）** <code>https://forums.nexusmods.com/topic/12433428-cant-use-my-own-character-preset/<\/code><\/p>\n<ul><li><strong>RaceMenu 只作用于玩家；NPC 用 BodySlide 构建的网格并按体重线性插值<\/strong>：<\/li><\/ul>\n<p>LoversLab 帖（同一段解释里给出体重 0/100 线性外推的例子）—— <strong>社区经验<\/strong><\/p>\n<ul><li><strong>RaceMenu 滑块上限由 <code>OnSliderRequest<\/code> 的 <code>factor<\/code> 决定（默认 2.0）、改它需重编译 <code>.pex<\/code><\/strong>：<\/li><\/ul>\n<p>LoversLab 帖 —— <strong>社区经验（仅见于 UUNP 脚本的讨论，标注\"未完全确认\"）<\/strong><\/p>\n<ul><li><strong><code>.tri<\/code> 文件体积代价<\/strong>：LoversLab 帖（某身体包网格自 1GB 涨至 4GB）—— <strong>社区经验<\/strong><\/li><li><strong><code>Build Morphs<\/code> → <code>.tri<\/code> + <code>BODYTRI<\/code> → NiOverride 运行时施加<\/strong>：<\/li><\/ul>\n<p>BodySlide 官方仓库提交记录与 wiki、RaceMenu 发布页 —— <strong>一手（机制）<\/strong><\/p>\n<ul><li><strong>Outfit Studio 负责\"在身形之间转换服装、创建滑块\"（含 conform）<\/strong>：<\/li><\/ul>\n<p>BodySlide 官方 wiki —— <strong>一手<\/strong><\/p>\n<ul><li><strong>NiOverride / CharGen 属于 <code>skee64.dll<\/code><\/strong>：RaceMenu 发布页与源码仓库 —— <strong>一手<\/strong><\/li><\/ul>\n<p>\"\"\"<\/p>", "_file": "03-body/morph-runtime-vs-bake.md", "_chars": 6910}, {"id": "cbpc", "title": "CBPC（碰撞物理）", "category": "04-physics", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["物理", "CBPC", "碰撞", "胶囊体", "Shizof"], "aliases": ["cbp", "碰撞物理", "胶囊体物理", "身体物理"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/21224", "summary": "CBPC 的作者、基于球体/胶囊近似的原理、它与 SMP 的分工、依赖与配置方式，以及共存时的 dll 加载顺序技巧。", "content": "<ul><li>作者 <strong>Shizof<\/strong><\/li><li>Nexus：<code>https://www.nexusmods.com/skyrimspecialedition/mods/21224<\/code><\/li><li>全称：<strong>CBPC - CBP Physics with Collisions for SSE and VR<\/strong><\/li><li>基于 <strong>polygonhell 的 CBP Physics（MIT）<\/strong><\/li><\/ul>\n<h2>原理<\/h2>\n<p>用<strong>球体 / 胶囊体近似<\/strong>代替真实的网格顶点，做逐帧动态物理模拟。<\/p>\n<p>所以它是<strong>真实的物理模拟<\/strong>，不是\"预设动画\"或\"假物理\"。 碰撞球可以适配身形（官方提供 PDF 配置指南）。<\/p>\n<h2>与 SMP 的分工<\/h2>\n<table><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:left\">CBPC<\/th><th style=\"text-align:left\">HDT-SMP / FSMP<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">模拟对象<\/td><td style=\"text-align:left\">球 / 胶囊<\/td><td style=\"text-align:left\">网格顶点<\/td><\/tr><tr><td style=\"text-align:left\">精度<\/td><td style=\"text-align:left\">中<\/td><td style=\"text-align:left\">高<\/td><\/tr><tr><td style=\"text-align:left\">性能<\/td><td style=\"text-align:left\"><strong>对 CPU 友好<\/strong><\/td><td style=\"text-align:left\">重<\/td><\/tr><tr><td style=\"text-align:left\">适用<\/td><td style=\"text-align:left\"><strong>身体部位<\/strong>（胸/臀/腹/大腿）<\/td><td style=\"text-align:left\"><strong>头发、衣服、斗篷<\/strong><\/td><\/tr><tr><td style=\"text-align:left\">能否管头发/衣服<\/td><td style=\"text-align:left\"><strong>不能<\/strong><\/td><td style=\"text-align:left\">能<\/td><\/tr><\/tbody><\/table>\n<p>社区经验总结成一句话：<strong>\"身体用 CBPC，衣服头发用 SMP\"<\/strong>。<\/p>\n<h2>依赖<\/h2>\n<pre class=\"code\"><code>SKSE64（或 SKSEVR）\nXP32 Maximum Skeleton Special Extended\nFNIS<\/code><\/pre>\n<p><strong>不支持<\/strong>：Player Size Adjuster and First Person Camera Height Fix SSE。<\/p>\n<h2>版本<\/h2>\n<p>社区经验里提及约 <strong>1.6.x<\/strong>（如 1.6.4）； <strong>确切最新版本未确认<\/strong> —— 请以 Nexus Files 页为准。<\/p>\n<h2>配置<\/h2>\n<ul><li>主体是 <code>cbp.dll<\/code>；<\/li><li>可选/常见预设配置：Sinful CBP、Immersive CBP Config、CBP Physics Config 等。<\/li><\/ul>\n<h2>与 SMP 共存（必做步骤）<\/h2>\n<p>两者默认争同一批骨骼。共存前提：<\/p>\n<ol><li>编辑 <strong><code>defaultBBPs.xml<\/code><\/strong>，让 SMP <strong>忽略身体<\/strong>、只管头发/衣服；<\/li><li><strong>把 <code>cbp.dll<\/code> 重命名为 <code>zcbp.dll<\/code><\/strong>（利用 dll 加载顺序让 SMP 先加载），<\/li><\/ol>\n<p>或用 Engine Fixes 的 preload 机制。<\/p>\n<blockquote>这是<strong>社区经验<\/strong>，但多个 LoversLab 帖给出同一解法，值得采信。<\/blockquote>\n<h2>调参不生效时的检查项（社区经验）<\/h2>\n<ul><li>角色体重是否为 <strong>0 或 100<\/strong>；<\/li><li>是否被 SMP 覆盖（MCM 里的物理开关切错引擎）；<\/li><li>覆盖式文本配置（如 P2P 配置）在 MO2 左栏里是否位于 <strong>CBPC / 身形之下<\/strong>。<\/li><\/ul>\n<h2>来源<\/h2>\n<ul><li>作者、基于 polygonhell 的 CBP、球体近似、依赖：CBPC Nexus 页描述（经转述）—— <strong>一手（经转述）<\/strong><\/li><li>\"SMP better for outfits, CBPC better for body\"、\"CBPC 不能管头发或衣服\"：<\/li><\/ul>\n<p><strong>社区经验（LoversLab 多帖一致）<\/strong><\/p>\n<ul><li><code>cbp.dll → zcbp.dll<\/code> 与 <code>defaultBBPs.xml<\/code>：<strong>社区经验（多帖一致）<\/strong><\/li><li>不兼容 Player Size Adjuster…：Nexus 页 —— <strong>一手（经转述）<\/strong><\/li><li>CBPC 确切最新版本：<strong>未确认<\/strong><\/li><\/ul>", "_file": "04-physics/cbpc.md", "_chars": 1819}, {"id": "faster-hdt-smp", "title": "Faster HDT-SMP（FSMP）", "category": "04-physics", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["物理", "FSMP", "HDT-SMP", "多线程", "性能"], "aliases": ["faster hdt smp", "hdt smp 加速", "物理性能", "daymareon", "57339"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/57339", "summary": "FSMP 相对原版 SMP 的改动（多线程、ImGui 配置菜单、JSON 全局配置）、前置、1.6.1170 的档位选择，以及\"它已完全取代原版\"这条官方口径。", "content": "<p><strong>现代用户应该装的 SMP。<\/strong><\/p>\n<ul><li>Nexus：<code>https://www.nexusmods.com/skyrimspecialedition/mods/57339<\/code><\/li><li>GitHub：<code>https://github.com/DaymareOn/hdtSMP64<\/code><\/li><li>上传者 <strong>DaydreamingDay<\/strong>，代码维护 <strong>DaymareOn<\/strong><\/li><\/ul>\n<h2>Fork 链<\/h2>\n<pre class=\"code\"><code>hydrogensaysHDT（原版）\n  → aers 版\n    → Karonar1 的 hdtSMP64\n      → DaymareOn 的 hdtSMP64（FSMP，当前主线）<\/code><\/pre>\n<h2>相对原版的改动<\/h2>\n<table><thead><tr><th style=\"text-align:left\">项<\/th><th style=\"text-align:left\">改动<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>性能<\/strong><\/td><td style=\"text-align:left\">官方描述：<em>\"massively improves performance over the original HDT-SMP, and replaces it totally. Do not install [原版]\"<\/em><\/td><\/tr><tr><td style=\"text-align:left\"><strong>并行<\/strong><\/td><td style=\"text-align:left\">基于 Bullet 的<strong>多线程<\/strong>实现<\/td><\/tr><tr><td style=\"text-align:left\"><strong>配置界面<\/strong><\/td><td style=\"text-align:left\">用 <strong>SKSE Menu Framework（Dear ImGui）<\/strong> 的内置菜单取代旧 MCM（旧 MCM 依赖 SkyUI / JContainers / PapyrusUtil / ConsoleUtil，现已移除）<\/td><\/tr><tr><td style=\"text-align:left\"><strong>全局配置<\/strong><\/td><td style=\"text-align:left\">从 XML 迁到 <strong>JSON<\/strong>（<code>configs.json<\/code> / <code>userConfigs.json<\/code>）<\/td><\/tr><\/tbody><\/table>\n<h2>前置<\/h2>\n<ul><li><strong>SKSE64<\/strong><\/li><li><strong>Address Library for SKSE Plugins<\/strong>（它用 CommonLibSSE 构建，CommonLibSSE 已内置地址库支持）<\/li><li>内置配置菜单用 SKSE Menu Framework（随包 vendor；<strong>缺框架则菜单不显示，但物理照常工作<\/strong>）<\/li><\/ul>\n<blockquote>注意：FSMP 4.x <strong>本身不再强制<\/strong>需要 SkyUI / JContainers / PapyrusUtil / ConsoleUtil。 但<strong>你装的其他身形 mod 可能仍需要<\/strong>它们 —— 别因为这条就把它们全删了。<\/blockquote>\n<h2>游戏版本档位（FOMOD）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">游戏版本<\/th><th style=\"text-align:left\">对应 SKSE64<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>1.6.1170.0<\/strong><\/td><td style=\"text-align:left\">2.2.6<\/td><\/tr><tr><td style=\"text-align:left\">1.6.659（GOG）<\/td><td style=\"text-align:left\">2.2.2<\/td><\/tr><tr><td style=\"text-align:left\">1.6.640<\/td><td style=\"text-align:left\">2.2.2<\/td><\/tr><tr><td style=\"text-align:left\">1.6.353<\/td><td style=\"text-align:left\">2.1.5<\/td><\/tr><tr><td style=\"text-align:left\">1.5.97（SE）<\/td><td style=\"text-align:left\">2.0.20<\/td><\/tr><tr><td style=\"text-align:left\">VR<\/td><td style=\"text-align:left\">2.0.12<\/td><\/tr><\/tbody><\/table>\n<p><strong>安装时必须在 FOMOD 里选对游戏版本档<\/strong> —— 选错的典型表现是物理不生效或开局崩溃。<\/p>\n<p>当前版本 <strong>4.1.1<\/strong>（2026-08-27）。<\/p>\n<h2>实用功能：<code>smp<\/code> 控制台命令<\/h2>\n<pre class=\"code\"><code>smp report [warnings] [gear]    校验整个 load order 的物理 XML 与 .nif<\/code><\/pre>\n<p>这是<strong>排查物理问题的第一手工具<\/strong> —— 它会直接告诉你哪个 mod 的 XML 有警告。<\/p>\n<h2>与 XPMSE 的耦合<\/h2>\n<p>FSMP 继承原版设计：只把网格附加到 <strong>XPMSE 的 human skeleton<\/strong>。 所以 XPMSE 是硬前置。<\/p>\n<h2>来源<\/h2>\n<ul><li>FSMP 取代原版、多线程、ImGui 菜单替代 MCM、JSON 全局配置：官方仓库 README 与 commit 历史、<\/li><\/ul>\n<p>Nexus 页描述 —— <strong>一手<\/strong><\/p>\n<ul><li>前置（SKSE64 + Address Library、CommonLibSSE 内置地址库）：官方仓库 README —— <strong>一手<\/strong><\/li><li>FOMOD 各游戏版本档位与 SKSE 对应、版本 4.1.1：Nexus 文件页 —— <strong>一手<\/strong><\/li><li>\"4.x 不再强制 SkyUI/JContainers/PapyrusUtil/ConsoleUtil，但其他 mod 可能仍要\"：<\/li><\/ul>\n<p><strong>社区经验（与官方改动一致）<\/strong><\/p>\n<ul><li><code>smp report<\/code> 命令：官方仓库 README / wiki —— <strong>一手<\/strong><\/li><\/ul>", "_file": "04-physics/faster-hdt-smp.md", "_chars": 2216}, {"id": "hdt-smp", "title": "HDT-SMP（Skinned Mesh Physics）", "category": "04-physics", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["物理", "HDT-SMP", "SMP", "Bullet", "XML"], "aliases": ["hdt smp", "skinned mesh physics", "hdt", "物理引擎", "hdtSkinnedMeshConfigs"], "source": "https://github.com/HydrogensaysHDT/hdt-skyrimse-mods", "summary": "HDT-SMP 的原作者、技术原理、XML 配置方式、前置与许可，以及它与旧方案 HDT-PE 的本质区别。", "content": "<h2>是什么<\/h2>\n<p><strong>HDT = hydrogensaysHDT（氫姐）<\/strong>，作者，已退休。<\/p>\n<ul><li><strong>SMP = Skinned Mesh Physics<\/strong> —— 基于 <strong>Bullet<\/strong> 物理库的<strong>逐顶点蒙皮网格物理<\/strong>。<\/li><li>与旧的 <strong>HDT-PE<\/strong> 的差别：PE 是<strong>骨骼级<\/strong>碰撞（用游戏内建 Havok），<\/li><\/ul>\n<p>SMP 是<strong>网格顶点级<\/strong>（自己带物理引擎）。这是\"精度跃升\"的关键。<\/p>\n<ul><li>源码以 <strong>MIT<\/strong> 许可开源。<\/li><li><strong>原始仓库<\/strong>：<code>https://github.com/HydrogensaysHDT/hdt-skyrimse-mods<\/code><\/li><\/ul>\n<blockquote>⚠️ 常见的一个错误仓库名是 <code>hydrogensaysHDT/hdt-skyrim-smp<\/code>（实测 404）。 正确仓库名为 <strong><code>hdt-skyrimse-mods<\/code><\/strong>。<\/blockquote>\n<h2>配置方式：XML<\/h2>\n<p>配置文件目录：<strong><code>Data/SKSE/Plugins/hdtSkinnedMeshConfigs/<\/code><\/strong>，每个使用物理的 mod 放一个 XML。<\/p>\n<p>XML 的作用是<strong>把碰撞体（sphere / capsule / triangle）挂到骨骼上<\/strong>， 默认身体配置通常叫 <code>defaultBBPs.xml<\/code>（或 <code>configs.xml<\/code>）。<\/p>\n<p>因此\"某个衣服没物理\"往往不是引擎问题，而是<strong>它没带或没加载 XML<\/strong>。<\/p>\n<h2>前置<\/h2>\n<ul><li><strong>SKSE64<\/strong>（SE）。<\/li><li>早期需要 <strong>OpenCL 2.0<\/strong>（用 GPU 计算）；也可以改 CPU 模拟 ——<\/li><\/ul>\n<p>注意所谓\"关闭 OpenCL\"实际上是<strong>切到 CPU<\/strong>，不是完全关掉物理计算。<\/p>\n<h2>支持的游戏版本<\/h2>\n<p>原版主要支持 <strong>LE 与 SE 1.5.97<\/strong>。 <strong>AE（1.6.x）支持由社区 fork 承接<\/strong> —— 现代用户实际应该装 <strong>Faster HDT-SMP（FSMP）<\/strong>， 它已经<strong>完全取代<\/strong>原版（作者原话的意思是：不要同时安装原版）。<\/p>\n<p>见 <a href=\"faster-hdt-smp.md\" target=\"_blank\" rel=\"noopener\"><code>faster-hdt-smp.md<\/code><\/a>。<\/p>\n<h2>与骨骼的关系<\/h2>\n<p>SMP <strong>只把网格附加到 XPMSE 的 human skeleton<\/strong>。 这条设计的好处是修掉了\"Lurker 等非人骨架被物理破坏\"的老问题； 代价是<strong>你必须装 XPMSE<\/strong>。<\/p>\n<h2>与 CBPC 的关系<\/h2>\n<p>两者都想要 body 插槽。共存需要显式配置： 见 <a href=\"physics-overview.md\" target=\"_blank\" rel=\"noopener\"><code>physics-overview.md<\/code><\/a>。<\/p>\n<h2>来源<\/h2>\n<ul><li>作者、MIT、Bullet、逐顶点蒙皮网格与原版/PE 的区别、XML 目录与 <code>defaultBBPs.xml<\/code>、<\/li><\/ul>\n<p>只附加 XPMSE human skeleton：<strong>Nexus 页描述与 GitHub 仓库<\/strong> —— <strong>一手<\/strong> （HDT-SMP 落地页：<code>https://www.nexusmods.com/skyrimspecialedition/mods/30872<\/code>）<\/p>\n<ul><li>\"正确仓库名是 <code>hdt-skyrimse-mods<\/code>，<code>hdt-skyrim-smp<\/code> 返回 404\"：<strong>本工作区实测（2026-09-22）<\/strong><\/li><li>OpenCL 2.0 与\"关 OpenCL 实为切 CPU\"：Nexus 描述与社区指南 —— <strong>一手 + 社区经验<\/strong><\/li><li>支持 1.5.97、AE 靠 fork：<strong>社区经验（多源一致）<\/strong><\/li><\/ul>", "_file": "04-physics/hdt-smp.md", "_chars": 1891}, {"id": "xpmse-skeleton", "title": "XP32 Maximum Skeleton Extended（XPMSE / XPMSSE）", "category": "04-physics", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["物理", "骨骼", "XPMSE", "XPMSSE", "节点"], "aliases": ["xp32", "xpmss", "骨架", "skeleton", "骨骼节点", "武器挂点"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/1988", "summary": "XPMSE 解决什么问题、四类骨骼节点前缀（NPC / HDT / MOV / CME）的含义、它与 RaceMenu 的插件关系，以及\"绝不删 skeleton_female.hkx\"这条警告。", "content": "<p>全称 <strong>XP32 Maximum Skeleton Special Extended（XPMSSE）<\/strong>，前身 XPMSE。 原作者 <strong>XP32<\/strong>，现由 <strong>Team XPMSE<\/strong> 维护，主要维护者 <strong>Groovtma<\/strong>、<strong>Skulltyrant<\/strong>。<\/p>\n<p>Nexus：<code>https://www.nexusmods.com/skyrimspecialedition/mods/1988<\/code><\/p>\n<h2>它解决什么<\/h2>\n<p>为 <strong>HDT 物理（PE / SMP）<\/strong> 和游戏内骨架自定义提供<strong>扩展骨骼节点与行为文件<\/strong>。具体包括：<\/p>\n<ul><li>额外骨骼节点（物理需要挂点）；<\/li><li>武器位置风格（背挂/腰挂等）；<\/li><li>身形缩放；<\/li><li>内置 Realistic Ragdolls &amp; Force、Flimsy Ragdolls；<\/li><li>兽人尾巴/翅膀等支持。<\/li><\/ul>\n<h2>为什么它是\"必装\"<\/h2>\n<ol><li><strong>物理必须挂在 XPMSE 的节点上<\/strong>：HDT-SMP 明确只把网格附加到<\/li><\/ol>\n<p><strong>XPMSE 的 human skeleton<\/strong>（这条设计还顺带修掉了 Lurker 等非人骨架被物理破坏的问题）。<\/p>\n<ol><li><strong>身形与物理都假设这些节点存在<\/strong>：3BA、BHUNP 的物理骨骼都在这套命名下。<\/li><li><strong>无完整替代品<\/strong>：截至 2026 仍是事实标准前置。Pandora 行为引擎有 XPMSE 补丁，<\/li><\/ol>\n<p>但骨架本身仍依赖 XPMSE。<\/p>\n<h2>四类骨骼节点前缀（重要）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">前缀<\/th><th style=\"text-align:left\">含义<\/th><th style=\"text-align:left\">例子<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong><code>NPC<\/code><\/strong><\/td><td style=\"text-align:left\">标准网格骨骼<\/td><td style=\"text-align:left\"><code>NPC L Hand [LHnd]<\/code>、<code>NPC R Hand [RHnd]<\/code>、<code>NPC L/R Breast<\/code>、<code>NPC L/R Breast01<\/code>、<code>NPC Belly<\/code>、<code>NPC Pelvis [Pelv]<\/code>、<code>NPC Spine [Spn0]<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong><code>HDT<\/code><\/strong><\/td><td style=\"text-align:left\"><strong>HDT 专用运动骨<\/strong><\/td><td style=\"text-align:left\"><code>HDT Belly<\/code>、<code>HDT LBreasts<\/code> 等<\/td><\/tr><tr><td style=\"text-align:left\"><strong><code>MOV<\/code><\/strong><\/td><td style=\"text-align:left\">武器插槽节点<\/td><td style=\"text-align:left\"><code>Weapon Left<\/code> / <code>Weapon Right<\/code>、<code>NPC L/R Item01~03<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong><code>CME<\/code><\/strong><\/td><td style=\"text-align:left\">额外 CME / RaceMenu 骨<\/td><td style=\"text-align:left\">由 RaceMenu / ECE 自定义数据设置<\/td><\/tr><\/tbody><\/table>\n<p>两条由此推出的规则：<\/p>\n<ul><li><strong><code>HDT<\/code>/<code>MOV<\/code> 前缀的节点不要改名<\/strong>（可以改位置/旋转，但名字是接口）；<\/li><li><strong>旧版 XML 里用 <code>NPC PreBelly<\/code> 是错的<\/strong> —— XPMSE 2.0+ 起该骨已改名 <code>HDT Belly<\/code>，<\/li><\/ul>\n<p>用旧名会导致低 FPS 甚至 CTD。<\/p>\n<p><strong>历史变更<\/strong>：XPMSE 4.72 移除了 <code>Prebreast<\/code> 骨（CBPC 不再需要它）。<\/p>\n<h2>与 RaceMenu 的关系<\/h2>\n<p>XPMSE 附带一个 <strong>RaceMenu 插件（XPMSSE RaceMenu）<\/strong>，提供：<\/p>\n<ul><li>武器风格；<\/li><li>缩放 / 位置 / 旋转滑杆；<\/li><li>身形相关滑杆；<\/li><li>SOS / SAM 滑杆；<\/li><li>兽人种族滑杆；<\/li><li>第一 / 第三人称缩放。<\/li><\/ul>\n<p>要求 RaceMenu 0.4.2+（LE 旧版 3.4.5+）。<\/p>\n<h2>版本与前置<\/h2>\n<table><thead><tr><th style=\"text-align:left\">项<\/th><th style=\"text-align:left\">值<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">最新版本<\/td><td style=\"text-align:left\"><strong>5.06<\/strong>（2024-02-11，针对 SE/AE）；前有 5.05（2023-12-09）、5.04（2023-08-19）<\/td><\/tr><tr><td style=\"text-align:left\">SKSE64<\/td><td style=\"text-align:left\">需要<\/td><\/tr><tr><td style=\"text-align:left\">行为补丁<\/td><td style=\"text-align:left\">FNIS SE 7.2+ 或 Nemesis（跑一次以生成行为文件）<\/td><\/tr><tr><td style=\"text-align:left\">RaceMenu<\/td><td style=\"text-align:left\">用其 RaceMenu 插件时需要<\/td><\/tr><\/tbody><\/table>\n<blockquote>⚠️ <strong>版本号来源<\/strong>：Nexus 页本轮未能直读（描述页受限），5.06 来自镜像站转载的 changelog —— <strong>标注为\"经转述\"，请以 Nexus Files 页为准<\/strong>。<\/blockquote>\n<h2>⚠️ 一条硬警告<\/h2>\n<blockquote><strong>不要删除 <code>skeleton_female.hkx<\/code>。<\/strong><\/blockquote>\n<p>它被游戏与多个 mod 假定存在；删掉会引发难以定位的问题。<\/p>\n<h2>来源<\/h2>\n<ul><li>全称、维护团队、功能清单、前置、版本：Nexus 发布页（经镜像站转述 changelog）—— <strong>一手（经转述）<\/strong><\/li><li>\"SMP 只附加到 XPMSE human skeleton\"：HDT-SMP Nexus 页描述 —— <strong>一手<\/strong><\/li><li>四类节点前缀：XPMSE 官方 FOMOD 说明（经 3DM 与俄站转述）—— <strong>官方说明，经转述<\/strong><\/li><li><code>NPC PreBelly<\/code> → <code>HDT Belly<\/code>、4.72 移除 <code>Prebreast<\/code>：changelog 经转述 —— <strong>中（经转述）<\/strong><\/li><li>\"不要删除 <code>skeleton_female.hkx<\/code>\"：官方说明经转述 —— <strong>中（经转述）<\/strong><\/li><li>\"无完整替代\"：<strong>社区经验（多源一致）<\/strong><\/li><\/ul>\n<blockquote>⚠️ 本条目中\"经转述\"的版本号与 changelog 细节，<strong>建议在能访问 Nexus 时复核一次<\/strong>。<\/blockquote>", "_file": "04-physics/xpmse-skeleton.md", "_chars": 2626}, {"id": "physics-hair-and-cloth", "title": "物理头发与衣物", "category": "04-physics", "kind": "concept", "version": "1.0.0", "updated": "2026-09-22", "tags": ["物理", "头发", "衣服", "SMP", "斗篷"], "aliases": ["物理头发", "物理衣服", "hdt 头发", "假发", "cloth physics", "斗篷物理"], "source": "https://github.com/DaymareOn/hdtSMP64", "summary": "头发与衣物物理为什么\"只能靠 SMP\"、它们靠什么文件工作、以及常见的失败表现与排查手段。", "content": "<h2>核心事实<\/h2>\n<blockquote><strong>CBPC 不能管理头发和衣服的物理，必须用 HDT-SMP（实际是 FSMP）。<\/strong><\/blockquote>\n<p>原因是机制性的：CBPC 用\"骨骼上的球/胶囊\"近似，而头发与衣物的形变 本质是<strong>网格顶点级别的摆动<\/strong>，需要 SMP 的逐顶点蒙皮模拟。<\/p>\n<p>所以\"我装了 CBPC 但头发不动\"不是配置问题，是<strong>方案选错了<\/strong>。<\/p>\n<h2>它们靠什么文件工作<\/h2>\n<p>SMP 通过 <strong><code>Data/SKSE/Plugins/hdtSkinnedMeshConfigs/<\/code><\/strong> 下的 XML 为 hair / cloth 网格定义碰撞体并挂到骨骼上。<\/p>\n<p>典型情况：<\/p>\n<ul><li>每个物理发型/衣物 mod <strong>自带<\/strong> XML（如物理版 KS Hairdos 之类）；<\/li><li><strong>没有 XML 就没有物理<\/strong> —— 这是\"某件斗篷死活不飘\"的第一嫌疑；<\/li><li>遵循 SMP Modder Guide 的 XSD/Schematron schema。<\/li><\/ul>\n<h2>挂点<\/h2>\n<p>通常挂到头部骨骼（<code>Head<\/code>）及额外发骨；XPMSE 提供相关节点（见 <a href=\"xpmse-skeleton.md\" target=\"_blank\" rel=\"noopener\"><code>xpmse-skeleton.md<\/code><\/a>）。<\/p>\n<blockquote>已知限制：FaceGen 相关的 HDT 头骨有约束（NPC head parts 方向）， 所以\"给 NPC 换物理发型\"比给玩家换更容易出问题 —— <strong>社区经验<\/strong>。<\/blockquote>\n<h2>排查手段<\/h2>\n<p>FSMP 提供了一个直接的工具：<\/p>\n<pre class=\"code\"><code>smp report [warnings] [gear]<\/code><\/pre>\n<p>它会<strong>校验整个 load order 的物理 XML 与 <code>.nif<\/code><\/strong> 并给出警告。 出问题时先跑它，而不是逐个 mod 试。<\/p>\n<h2>常见失败表现<\/h2>\n<table><thead><tr><th style=\"text-align:left\">表现<\/th><th style=\"text-align:left\">可能原因<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">头发完全不动<\/td><td style=\"text-align:left\">只装了 CBPC；或该发型没有 XML；或 SMP/FSMP 未生效<\/td><\/tr><tr><td style=\"text-align:left\">头发穿过身体<\/td><td style=\"text-align:left\">碰撞体没定义或不匹配身形<\/td><\/tr><tr><td style=\"text-align:left\">头发抽搐/抖动异常<\/td><td style=\"text-align:left\">XML 参数问题（可用 <code>smp report<\/code> 找）<\/td><\/tr><tr><td style=\"text-align:left\">衣服飘但头发不飘<\/td><td style=\"text-align:left\">只有衣服带了 XML<\/td><\/tr><tr><td style=\"text-align:left\">开局 CTD<\/td><td style=\"text-align:left\">SMP/FSMP 版本档选错<\/td><\/tr><\/tbody><\/table>\n<h2>来源<\/h2>\n<ul><li>\"CBPC 不能管头发或衣服，必须有 SMP\"：LoversLab 帖 —— <strong>社区经验（多帖一致）<\/strong><\/li><li>XML 目录、schema、<code>smp report<\/code> 命令：FSMP 官方仓库 README / wiki —— <strong>一手<\/strong><\/li><\/ul>\n<p><code>https://github.com/DaymareOn/hdtSMP64<\/code><\/p>\n<ul><li>挂到 Head 及额外发骨、FaceGen HDT 头骨限制：Karonar1 的 hdtSMP64 README —— <strong>社区技术文档<\/strong><\/li><li>失败表现与成因：综合社区帖归纳 —— <strong>社区经验<\/strong><\/li><\/ul>", "_file": "04-physics/physics-hair-and-cloth.md", "_chars": 1529}, {"id": "physics-overview", "title": "物理方案总览与选型", "category": "04-physics", "kind": "concept", "version": "1.0.0", "updated": "2026-09-22", "tags": ["物理", "总览", "选型", "SMP", "CBPC", "HDT-PE"], "aliases": ["物理方案", "选哪个物理", "smp 还是 cbpc", "物理总览", "hdt", "抖动原理"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/57339", "summary": "三代物理方案（HDT-PE / HDT-SMP / CBPC）的原理差异与适用场景，以及\"SMP 与 CBPC 争同一插槽\"这个必踩的坑和它的解法。", "content": "<h2>三代方案<\/h2>\n<table><thead><tr><th style=\"text-align:left\">方案<\/th><th style=\"text-align:left\">原理层<\/th><th style=\"text-align:left\">精度<\/th><th style=\"text-align:left\">性能<\/th><th style=\"text-align:left\">状态<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>HDT-PE<\/strong>（Physics Extension）<\/td><td style=\"text-align:left\">用游戏内建 <strong>Havok<\/strong> 做<strong>骨骼级<\/strong>碰撞<\/td><td style=\"text-align:left\">粗<\/td><td style=\"text-align:left\">一般<\/td><td style=\"text-align:left\">已被 SMP 取代；旧身形仍可用<\/td><\/tr><tr><td style=\"text-align:left\"><strong>HDT-SMP<\/strong>（Skinned Mesh Physics）<\/td><td style=\"text-align:left\">用 <strong>Bullet<\/strong> 做<strong>逐顶点蒙皮网格<\/strong>物理<\/td><td style=\"text-align:left\">高<\/td><td style=\"text-align:left\">重<\/td><td style=\"text-align:left\">当代主选（实际用其 fork <strong>FSMP<\/strong>）<\/td><\/tr><tr><td style=\"text-align:left\"><strong>CBPC<\/strong>（CBP Physics with Collisions）<\/td><td style=\"text-align:left\"><strong>球体 / 胶囊近似<\/strong>的逐帧模拟<\/td><td style=\"text-align:left\">中<\/td><td style=\"text-align:left\">轻（对 CPU 友好）<\/td><td style=\"text-align:left\">当代主选（身体部位）<\/td><\/tr><\/tbody><\/table>\n<p><strong>一句话选型<\/strong>：<\/p>\n<blockquote><strong>身体用 CBPC，头发和衣服用 HDT-SMP。<\/strong><\/blockquote>\n<p>这条经验来自机制差异，不是玄学：<\/p>\n<ul><li>CBPC 用近似体，跑大量 NPC 时开销可控，适合\"每个 NPC 都有的身体\"；<\/li><li>SMP 逐顶点计算精确，适合网格不大但需要精细摆动的东西（头发、斗篷、裙子）；<\/li><li><strong>CBPC 完全无法处理头发和衣服物理<\/strong>（它没有对应网格的蒙皮信息）。<\/li><\/ul>\n<h2>SMP 与 CBPC 的关键区别再展开<\/h2>\n<table><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:left\">HDT-SMP / FSMP<\/th><th style=\"text-align:left\">CBPC<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">模拟对象<\/td><td style=\"text-align:left\">网格顶点（蒙皮）<\/td><td style=\"text-align:left\">骨骼挂的球/胶囊体<\/td><\/tr><tr><td style=\"text-align:left\">配置文件<\/td><td style=\"text-align:left\"><code>hdtSkinnedMeshConfigs/*.xml<\/code>（FSMP 4.x 起全局配置改用 JSON）<\/td><td style=\"text-align:left\">预设 XML / <code>cbp.dll<\/code> 配置<\/td><\/tr><tr><td style=\"text-align:left\">前置<\/td><td style=\"text-align:left\">SKSE64 + Address Library；早期需 <strong>OpenCL 2.0<\/strong>（可切 CPU 模拟）<\/td><td style=\"text-align:left\">SKSE64、XPMSE、FNIS<\/td><\/tr><tr><td style=\"text-align:left\">作用于<\/td><td style=\"text-align:left\">只附加到 <strong>XPMSE 的 human skeleton<\/strong><\/td><td style=\"text-align:left\">XPMSE 骨骼<\/td><\/tr><tr><td style=\"text-align:left\">能管头发/衣服<\/td><td style=\"text-align:left\"><strong>能<\/strong><\/td><td style=\"text-align:left\"><strong>不能<\/strong><\/td><\/tr><\/tbody><\/table>\n<h2>必踩的坑：两个 dll 争 body 插槽<\/h2>\n<p>SMP 与 CBPC <strong>想挂的是同一批骨骼<\/strong>，同时启用会互相覆盖。要\"身体用 CBPC、衣服头发用 SMP\"， 必须做下面两件事之一：<\/p>\n<ol><li><strong>编辑 <code>defaultBBPs.xml<\/code><\/strong>，让 SMP 忽略身体、只管头发/衣服；<\/li><li><strong>把 <code>cbp.dll<\/code> 改名为 <code>zcbp.dll<\/code><\/strong>，让 SMP 的 dll 先加载（利用加载顺序），<\/li><\/ol>\n<p>或用 Engine Fixes 的 preload 机制。<\/p>\n<blockquote>这条是社区经验，但在多个帖子里被反复给出同一解法，可信度较高。<\/blockquote>\n<h2>与身形的耦合<\/h2>\n<p>物理<strong>不是独立层<\/strong>，它依赖身形的两个条件：<\/p>\n<ol><li>身形必须选 <strong>physics 变体<\/strong>（如 3BA 的物理版本、BHUNP 的 3BBB）；<\/li><li>必须在 <strong>BodySlide 构建带物理的身形<\/strong>。<\/li><\/ol>\n<p>所以\"装了 FSMP 还是不抖\"的第一检查点不是物理 mod，而是<strong>身形装的是不是物理版<\/strong>。<\/p>\n<h2>与骨骼的耦合<\/h2>\n<p>所有现代身形与物理都<strong>依赖 XPMSE 提供的额外骨骼节点<\/strong> （如 <code>HDT LBreasts<\/code>、<code>HDT Belly<\/code>、<code>NPC L/R Breast<\/code> 等）。 没有 XPMSE 就没有\"可挂物理的骨\"。详见 <a href=\"xpmse-skeleton.md\" target=\"_blank\" rel=\"noopener\"><code>xpmse-skeleton.md<\/code><\/a>。<\/p>\n<h2>诊断入口<\/h2>\n<p>物理不生效的完整排查见 <a href=\"../06-troubleshooting/physics-not-working.md\" target=\"_blank\" rel=\"noopener\"><code>../06-troubleshooting/physics-not-working.md<\/code><\/a>。<\/p>\n<h2>来源<\/h2>\n<ul><li>HDT-SMP 原理（Bullet、蒙皮网格）与\"只附加 XPMSE human skeleton\"：<\/li><\/ul>\n<p>HDT-SMP Nexus 页描述 + 原始仓库 —— <strong>一手<\/strong> <code>https://www.nexusmods.com/skyrimspecialedition/mods/30872<\/code><\/p>\n<ul><li>CBPC 基于 polygonhell 的 CBP、球体近似、依赖：CBPC 页描述经转述 —— <strong>一手（经转述）<\/strong><\/li><li>\"SMP 适合衣服、CBPC 适合身体\"、\"CBPC 不能管头发和衣服\"：<strong>社区经验（LoversLab 多帖一致）<\/strong><\/li><li><code>cbp.dll → zcbp.dll<\/code> 改名 / <code>defaultBBPs.xml<\/code> 调整：<strong>社区经验（LoversLab 帖，多帖一致）<\/strong><\/li><li>HDT-PE 用游戏内建 Havok：HDT-PE 原作者描述 —— <strong>一手<\/strong><\/li><\/ul>", "_file": "04-physics/physics-overview.md", "_chars": 2390}, {"id": "autobody", "title": "AutoBody（AE 版身形分发）", "category": "05-distribution", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["分配", "AutoBody", "CBBE", "HIMBO", "NPC 身形", "ini"], "aliases": ["身形分发", "napmouse", "给 npc 分配身形"], "source": "https://github.com/napmouse/autoBodyAE", "summary": "AutoBody 的作者与机制、仿 BodyGen 的 morphs.ini 语法、它对 CBBE 与 HIMBO 预设的支持，以及游戏内调整菜单。", "content": "<ul><li>作者 <strong>napmouse<\/strong><\/li><li>仓库：<code>https://github.com/napmouse/autoBodyAE<\/code>（<strong>GPL-3.0<\/strong>）<\/li><li>Nexus：<code>mods/61321<\/code>（论坛引用处）<\/li><\/ul>\n<h2>它做什么<\/h2>\n<p>一个 SKSE 插件，把 <strong>CBBE 与 HIMBO 预设<\/strong>分发给 NPC。 它<strong>重新实现了 OBody 的 ORefit 算法<\/strong>。<\/p>\n<h2>配置：<code>morphs.ini<\/code><\/h2>\n<p><strong>语法有意仿照 RaceMenu BodyGen<\/strong>，但用 <strong>EditorID<\/strong> 匹配：<\/p>\n<pre class=\"code\"><code>All|Female|TownWhiterunFaction=...<\/code><\/pre>\n<p>能力：<\/p>\n<ul><li>按 <strong>faction / race<\/strong> 匹配；<\/li><li>支持<strong>男性<\/strong>（HIMBO 预设）；<\/li><li>支持<strong>权重随机<\/strong>。<\/li><\/ul>\n<h2>游戏内工具<\/h2>\n<table><thead><tr><th style=\"text-align:left\">功能<\/th><th style=\"text-align:left\">说明<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><code>;<\/code> 键<\/td><td style=\"text-align:left\">打开 actor 调整菜单<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Regenerate Actor 法术<\/strong><\/td><td style=\"text-align:left\">让某个 actor 重新生成身形<\/td><\/tr><\/tbody><\/table>\n<h2>依赖<\/h2>\n<p><strong>Address Library for SKSE Plugins。<\/strong><\/p>\n<p>（注意它比 OBody NG 的依赖<strong>更少<\/strong> —— 不需要 MCM Helper / UIExtensions。）<\/p>\n<h2>与 OBody NG 的对比<\/h2>\n<table><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:left\">AutoBody<\/th><th style=\"text-align:left\">OBody NG<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">配置<\/td><td style=\"text-align:left\"><code>.ini<\/code>（仿 BodyGen）<\/td><td style=\"text-align:left\"><code>.json<\/code><\/td><\/tr><tr><td style=\"text-align:left\">男性身形支持<\/td><td style=\"text-align:left\"><strong>HIMBO<\/strong><\/td><td style=\"text-align:left\">见其配置说明<\/td><\/tr><tr><td style=\"text-align:left\">界面<\/td><td style=\"text-align:left\">游戏内菜单 + 法术<\/td><td style=\"text-align:left\">MCM<\/td><\/tr><tr><td style=\"text-align:left\">依赖<\/td><td style=\"text-align:left\">仅 Address Library<\/td><td style=\"text-align:left\">RaceMenu + MCM Helper + UIExtensions<\/td><\/tr><tr><td style=\"text-align:left\">作者<\/td><td style=\"text-align:left\">napmouse<\/td><td style=\"text-align:left\">Aietos<\/td><\/tr><\/tbody><\/table>\n<blockquote>社区有\"OBody NG 是 AutoBody 的继任者\"的说法，但<strong>先后关系未确认<\/strong>。 择一使用即可。<\/blockquote>\n<h2>来源<\/h2>\n<ul><li>作者、GPL-3.0、ORefit 算法重实现、<code>morphs.ini<\/code> 语法与 EditorID 匹配、<\/li><\/ul>\n<p>faction/男性/权重随机、<code>;<\/code> 键与 Regenerate Actor 法术、依赖 Address Library： <strong>GitHub 官方 README<\/strong> —— <strong>一手<\/strong> <code>https://github.com/napmouse/autoBodyAE<\/code><\/p>\n<ul><li>Nexus mod id 61321：Nexus 论坛引用 —— <strong>社区经验<\/strong><\/li><li>与 OBody NG 的继任关系：<strong>未确认<\/strong><\/li><\/ul>", "_file": "05-distribution/autobody.md", "_chars": 1513}, {"id": "obody-ng", "title": "OBody NG（Next Generation）", "category": "05-distribution", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["分配", "OBody", "预设分发", "NPC 身形", "JSON"], "aliases": ["obody ng", "身形分发", "preset distribution", "随机分配身形", "aietos"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/77016", "summary": "OBody 与 OBody NG 的作者沿革、ORefit 算法与 JSON 配置、依赖清单（并澄清它不直接依赖 SPID/JContainers），以及它相对 BodyGen 的优势。", "content": "<h2>作者沿革<\/h2>\n<table><thead><tr><th style=\"text-align:left\">版本<\/th><th style=\"text-align:left\">作者<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>OBody<\/strong>（原始）<\/td><td style=\"text-align:left\"><strong>Sairion350<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>OBody NG<\/strong>（Next Generation）<\/td><td style=\"text-align:left\"><strong>Aietos<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>OBody Standalone NG<\/strong><\/td><td style=\"text-align:left\">脱离 OStim 依赖的版本<\/td><\/tr><\/tbody><\/table>\n<ul><li>Nexus：<code>https://www.nexusmods.com/skyrimspecialedition/mods/77016<\/code><\/li><li>GitHub（SKSE/C++ 侧）：<code>https://github.com/Aietos/OBody-NG<\/code><\/li><li>GitHub（Papyrus 侧）：<code>https://github.com/Aietos/OBody<\/code><\/li><\/ul>\n<h2>它做什么<\/h2>\n<p>把<strong>你已安装的所有 BodySlide 预设<\/strong>随机/按规则分发给玩家与 NPC。 核心是用 <strong>ORefit 算法<\/strong>把某套预设的滑块值\"拟合\"到目标 actor 上。<\/p>\n<p>它基于一个 <strong>Zeroed Sliders 参考体<\/strong>——这不是可选项，而是<strong>前提条件<\/strong>：<\/p>\n<blockquote><strong>必须先用 <code>Zeroed Sliders<\/code> 预设 + 勾 <code>Build Morphs<\/code>，把所有身体与服装 Batch Build 一遍。<\/strong> OBody NG 会<strong>读取你 <code>SliderPresets<\/code> 文件夹里的 <code>.xml<\/code> 预设<\/strong>，在此基础上分配给 NPC。<\/blockquote>\n<p>所以「OBody 装了没效果 / NPC 身材没变化」的第一检查点是： <strong>你有没有做过那次 Zeroed Sliders 的基础构建。<\/strong><\/p>\n<p>步骤见 <a href=\"../03-body/morph-runtime-vs-bake.md\" target=\"_blank\" rel=\"noopener\"><code>../03-body/morph-runtime-vs-bake.md<\/code><\/a>。<\/p>\n<h2>配置：JSON<\/h2>\n<pre class=\"code\"><code>SKSE/Plugins/OBody_presetDistributionConfig.json<\/code><\/pre>\n<p>支持按 <code>raceFemale<\/code> / <code>raceMale<\/code> / <code>blacklistedRaces<\/code> 等维度指定可用预设。 带 <strong>MCM<\/strong> 管理界面。<\/p>\n<h2>依赖<\/h2>\n<pre class=\"code\"><code>RaceMenu（提供 skee64 的 morph API）\nMCM Helper\nUIExtensions\nSKSE\nAddress Library for SKSE Plugins<\/code><\/pre>\n<blockquote><strong>澄清两点<\/strong>： 1. OBody NG 的配置是 <strong>JSON<\/strong>，因此<strong>不直接依赖 JContainers<\/strong>； 2. 它也<strong>不依赖 SPID<\/strong> —— SPID 的 Outfit Distribution 分的是\"服装\"，不是\"身形\"。<\/blockquote>\n<h2>与 RaceMenu BodyGen 的对比<\/h2>\n<table><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:left\">BodyGen<\/th><th style=\"text-align:left\">OBody NG<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">来源<\/td><td style=\"text-align:left\">RaceMenu 内置<\/td><td style=\"text-align:left\">独立 mod<\/td><\/tr><tr><td style=\"text-align:left\">配置<\/td><td style=\"text-align:left\"><code>.ini<\/code><\/td><td style=\"text-align:left\"><code>.json<\/code><\/td><\/tr><tr><td style=\"text-align:left\">界面<\/td><td style=\"text-align:left\">无<\/td><td style=\"text-align:left\"><strong>有 MCM<\/strong><\/td><\/tr><tr><td style=\"text-align:left\">配置粒度<\/td><td style=\"text-align:left\">模板 + 映射<\/td><td style=\"text-align:left\">按种族/黑名单，规则更直观<\/td><\/tr><tr><td style=\"text-align:left\">依赖<\/td><td style=\"text-align:left\">只需 RaceMenu<\/td><td style=\"text-align:left\">RaceMenu + MCM Helper + UIExtensions<\/td><\/tr><\/tbody><\/table>\n<p><strong>给新手的建议<\/strong>：如果你想\"少折腾、有界面\"，用 OBody NG；如果你已经在用 RaceMenu 且不想加 mod，BodyGen 够用。<\/p>\n<h2>与 AutoBody 的关系<\/h2>\n<p>两者都是\"把预设分发给 NPC\"，但：<\/p>\n<ul><li><strong>配置语言不同<\/strong>（OBody NG 用 <code>.json<\/code>，AutoBody 用 <code>.ini<\/code> 且语法仿 BodyGen）；<\/li><li>社区里有\"OBody NG 是 AutoBody 的继任者\"的说法 ——<\/li><\/ul>\n<p><strong>这个先后关系未确认<\/strong>，两者作者不同、也都在维护。<\/p>\n<p>选一个用即可，<strong>不要都装<\/strong>（会争同一批 actor 的 morph）。<\/p>\n<h2>来源<\/h2>\n<ul><li>作者沿革、ORefit 算法、Zeroed Sliders、JSON 配置路径、依赖、MCM：<\/li><\/ul>\n<p>Nexus 发布页（<code>mods/77016<\/code>、<code>mods/167286<\/code>）与 GitHub README —— <strong>一手<\/strong><\/p>\n<ul><li>\"不直接依赖 SPID/JContainers\"：<strong>本资料库对依赖链的辨析结论<\/strong><\/li><\/ul>\n<p>（依据：配置格式为 JSON 而非 JContainers 容器；SPID 的 outfit 分发是另一回事）<\/p>\n<ul><li>OBody NG 与 AutoBody 的先后关系：<strong>社区说法不一致，未确认<\/strong><\/li><\/ul>", "_file": "05-distribution/obody-ng.md", "_chars": 2383}, {"id": "racemenu-bodygen", "title": "RaceMenu BodyGen（内置身形随机化）", "category": "05-distribution", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["分配", "BodyGen", "RaceMenu", "morph", "NPC 身形"], "aliases": ["racemenu morphs", "随机身形", "npc 身形随机", "morphs.ini", "templates.ini"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/19080", "summary": "BodyGen 的配置目录与两份 ini 的语法（templates.ini 定义模板、morphs.ini 映射 Actor）、它的硬前提（BodySlide 必须勾 Build Morphs），以及状态存在 co-save 这件事的后果。", "content": "<p><strong>BodyGen 不是独立 mod<\/strong> —— 它是 RaceMenu 内置的身形随机化功能，作者就是 RaceMenu 的作者 <strong>expired6978<\/strong>。<\/p>\n<h2>它做什么<\/h2>\n<p>把 <strong>morph 组合<\/strong>随机/按规则分配给 NPC 与玩家，让每个 NPC 的身材不完全一样。<\/p>\n<h2>配置目录<\/h2>\n<pre class=\"code\"><code>meshes/actors/character/BodyGenData/&lt;插件名含扩展名&gt;/\n├── templates.ini     定义\"模板\"（一组 morph 取值）\n└── morphs.ini        把 ActorBase 映射到模板<\/code><\/pre>\n<p>注意目录名是 <strong><code>&lt;插件文件名含扩展名&gt;<\/code><\/strong>（例如 <code>MyMod.esp<\/code>）。<\/p>\n<h2>语法<\/h2>\n<h3><code>templates.ini<\/code><\/h3>\n<pre class=\"code\"><code>模板名=morph@值 | morph@区间<\/code><\/pre>\n<ul><li><strong>逗号 = AND<\/strong>（同时应用）；<\/li><li><strong><code>|<\/code> = OR<\/strong>（随机取一个）；<\/li><li><code>@<\/code> 后可以是固定值，也可以是 <code>a:b<\/code> 的随机区间。<\/li><\/ul>\n<p>例：<\/p>\n<pre class=\"code\"><code>Breasts=Breast@1.0 | BreastCleavage@0.1:1.0<\/code><\/pre>\n<h3><code>morphs.ini<\/code><\/h3>\n<pre class=\"code\"><code>Skyrim.esm|F62F0=模板名\nAll|Female=模板名<\/code><\/pre>\n<ul><li>左边是 <strong>插件名 | FormID<\/strong>，或 <strong><code>All|Female<\/code><\/strong> 这类批量写法；<\/li><li>多个模板可用逗号组合（如 <code>Sevenbase,Random<\/code> 之类的用法）。<\/li><\/ul>\n<blockquote><strong><code>ini<\/code> 末尾需留一个空行<\/strong>（社区经验）。<\/blockquote>\n<h2>硬前提<\/h2>\n<ol><li><strong>BodySlide 必须勾 <code>Build Morphs<\/code><\/strong> —— 否则没有 <code>.tri<\/code>，RaceMenu 无从应用 morph；<\/li><li>运行时由 RaceMenu 的 <strong>NiOverride（<code>skee64.dll<\/code>）<\/strong> 应用；<\/li><li><strong>morph 状态会写入 SKSE co-save<\/strong>。<\/li><\/ol>\n<h2>第 3 条的后果（重要）<\/h2>\n<p>因为 morph 状态存在 <strong>co-save<\/strong> 里：<\/p>\n<ul><li>中途增删身形/皮肤/预设类 mod，<strong>旧档可能对不上<\/strong>（脸/身材回到默认，或出现异常）；<\/li><li>调整 BodyGen 配置后，<strong>已有 NPC 的状态可能不会自动刷新<\/strong>（需要新档或让游戏重新生成）。<\/li><\/ul>\n<p>这与\"预设不生效\"类问题高度相关，见 <a href=\"../06-troubleshooting/preset-not-applied.md\" target=\"_blank\" rel=\"noopener\"><code>../06-troubleshooting/preset-not-applied.md<\/code><\/a>。<\/p>\n<h2>与其它分配工具的关系<\/h2>\n<table><thead><tr><th style=\"text-align:left\">工具<\/th><th style=\"text-align:left\">配置形态<\/th><th style=\"text-align:left\">说明<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>BodyGen<\/strong><\/td><td style=\"text-align:left\"><code>.ini<\/code>（含在 RaceMenu 里）<\/td><td style=\"text-align:left\">语法最原始，无 GUI<\/td><\/tr><tr><td style=\"text-align:left\"><strong>OBody NG<\/strong><\/td><td style=\"text-align:left\"><code>.json<\/code><\/td><td style=\"text-align:left\">有 MCM，支持预设分发<\/td><\/tr><tr><td style=\"text-align:left\"><strong>AutoBody<\/strong><\/td><td style=\"text-align:left\"><code>.ini<\/code>（<strong>仿 BodyGen 语法<\/strong>）<\/td><td style=\"text-align:left\">额外支持 faction / 男性 / 权重随机<\/td><\/tr><\/tbody><\/table>\n<p><strong>注意<\/strong>：AutoBody 的 <code>morphs.ini<\/code> 语法是<strong>有意仿照 BodyGen<\/strong> 的， 所以见过 BodyGen 写法的人能直接上手 —— 但两者是<strong>不同的 mod<\/strong>，不要混装。<\/p>\n<h2>来源<\/h2>\n<ul><li>BodyGen 配置目录、两份 ini、语法、co-save 存储：LoversLab 的非官方 BodyGen 文档<\/li><\/ul>\n<p>（基于 expired6978 原话整理）—— <strong>社区文档，引作者原话<\/strong> <code>https://www.loverslab.com/topic/53531-unofficial-bodygen-docs<\/code><\/p>\n<ul><li>硬前提需 BodySlide <code>Build Morphs<\/code> + NiOverride 应用：BodySlide 机制 + BodyGen 文档 —— <strong>一手（机制）+ 社区<\/strong><\/li><li>\"ini 末尾需空行\"：<strong>社区经验<\/strong><\/li><li>AutoBody 语法仿 BodyGen：AutoBody 官方仓库 README —— <strong>一手<\/strong><\/li><\/ul>", "_file": "05-distribution/racemenu-bodygen.md", "_chars": 2276}, {"id": "racemenu-sliders-missing", "title": "RaceMenu 里没有滑块 / 滑块不能动", "category": "06-troubleshooting", "kind": "tutorial", "version": "1.0.0", "updated": "2026-09-22", "tags": ["排错", "RaceMenu", "滑块", "morph", "SKSE"], "aliases": ["没有滑块", "滑块缺失", "滑块不能动", "sliders missing", "racemenu 没反应", "身形滑块没有"], "source": "https://www.loverslab.com/topic/202366-racemenu-problem-sliders-absent-or-not-working", "summary": "滑块缺失的六个原因（SKSE 版本、RaceMenu 版本、morph 未构建、esp 损坏、HPH 未选、需重开），按\"整体缺失\"与\"只有身形滑块缺失\"分流。", "content": "<h2>先分流<\/h2>\n<table><thead><tr><th style=\"text-align:left\">现象<\/th><th style=\"text-align:left\">主要嫌疑<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>所有滑块都没有<\/strong>，界面像原版<\/td><td style=\"text-align:left\">SKSE / RaceMenu 版本或安装问题<\/td><\/tr><tr><td style=\"text-align:left\"><strong>界面正常但没有身形滑块<\/strong><\/td><td style=\"text-align:left\">morph 未构建 / esp 未启用<\/td><\/tr><tr><td style=\"text-align:left\"><strong>界面正常但头部没变成高模<\/strong><\/td><td style=\"text-align:left\">HPH 未在 Head 页选择<\/td><\/tr><tr><td style=\"text-align:left\"><strong>滑块在但拖动无效果<\/strong><\/td><td style=\"text-align:left\">morph 数据缺失或被覆盖<\/td><\/tr><\/tbody><\/table>\n<h2>完整检查清单<\/h2>\n<h3>1. SKSE 版本与游戏版本是否匹配 ⭐<\/h3>\n<p><strong>这是最常见的原因。<\/strong> 1.5.97 误用 AE 版 SKSE（或反之） → 所有 SKSE 插件 DLL 失效 → 滑块缺失或不动。<\/p>\n<p>判断捷径：装 SkyUI，如果它弹 <strong>\"SKSE is not functioning properly\"<\/strong>，就是这一层的问题。<\/p>\n<h3>2. RaceMenu 版本是否匹配<\/h3>\n<p>AE 环境用旧版 RaceMenu → 没有（或只有部分）滑块。 对照 <a href=\"../00-overview/version-matrix.md\" target=\"_blank\" rel=\"noopener\"><code>../00-overview/version-matrix.md<\/code><\/a>。<\/p>\n<h3>3. morph 是否在 BodySlide 里构建了 ⭐（身形滑块）<\/h3>\n<p><strong>必须勾 <code>Build Morphs<\/code><\/strong>，否则不生成 <code>.tri<\/code> 与 NIF 里的 <code>BODYTRI<\/code>， RaceMenu 无从显示身形滑块。<\/p>\n<p>机制见 <a href=\"../00-overview/morph-and-nif-basics.md\" target=\"_blank\" rel=\"noopener\"><code>../00-overview/morph-and-nif-basics.md<\/code><\/a>。<\/p>\n<h3>4. morph 提供者 esp 是否启用<\/h3>\n<p><code>RaceMenuMorphs*.esp<\/code>（如 <code>RaceMenuMorphsCBBE.esp<\/code>）需要启用。 它损坏也会导致对应滑块消失。<\/p>\n<h3>5. 构建产物是否被覆盖<\/h3>\n<p>BodySlide 构建出的 NIF 若被别的 mod 覆盖，<code>BODYTRI<\/code> 一起丢失 → <strong>身形滑块突然消失<\/strong>。查 MO2 的 Conflicts。<\/p>\n<h3>6. High Poly Head 是否真的被选中（头部）<\/h3>\n<p><strong>HPH 不是自动生效的。<\/strong> 要到 RaceMenu 的 <strong>Head 页 / Face Part 滑杆<\/strong> 把头部部件切换为高模头。<\/p>\n<h3>7. 是否需要重开捏脸界面<\/h3>\n<p>有时需要先建好角色，再 <code>showracemenu<\/code> 重开一次才加载。 SKSE 输入故障（zoom / light 不响应）也常常重开即解。<\/p>\n<h2>来源<\/h2>\n<ul><li>SKSE 版本不匹配为最常见原因、RaceMenu 版本、<code>RaceMenuMorphs*.esp<\/code> 损坏、<\/li><\/ul>\n<p>morph 未构建、HPH 需手动选、重开 <code>showracemenu<\/code>： LoversLab 与 Nexus 论坛的 RaceMenu 滑块帖 —— <strong>社区经验（多帖一致）<\/strong><\/p>\n<ul><li><code>Build Morphs<\/code> → <code>.tri<\/code> + <code>BODYTRI<\/code> → RaceMenu 应用：<\/li><\/ul>\n<p>BodySlide 官方仓库提交记录 + wiki —— <strong>一手（机制）<\/strong><\/p>\n<ul><li>\"构建被覆盖导致滑块消失\"：<strong>机制推论 + 社区经验<\/strong><\/li><li>SkyUI 的 \"SKSE is not functioning properly\" 提示：SkyUI 行为 —— <strong>一手（软件行为）<\/strong><\/li><\/ul>", "_file": "06-troubleshooting/racemenu-sliders-missing.md", "_chars": 1930}, {"id": "physics-not-working", "title": "物理不生效（不抖 / 头发穿透）", "category": "06-troubleshooting", "kind": "tutorial", "version": "1.0.0", "updated": "2026-09-22", "tags": ["排错", "物理", "SMP", "CBPC", "骨骼"], "aliases": ["物理不生效", "不抖", "没物理", "头发穿透", "物理失效", "smp 不工作", "cbpc 没反应"], "source": "https://forums.nexusmods.com/topic/3800385-a-guide-to-hdt-smp-usersmodders/", "summary": "物理失效的十条检查项（按顺序排列，从版本到身形变体到 dll 顺序），以及\"先跑 smp report\"这条最高效的诊断路径。", "content": "<h2>症状分类<\/h2>\n<table><thead><tr><th style=\"text-align:left\">症状<\/th><th style=\"text-align:left\">指向<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">完全没有任何物理（身体也不抖）<\/td><td style=\"text-align:left\">引擎层问题（SMP/CBPC 未生效）<\/td><\/tr><tr><td style=\"text-align:left\">身体抖、头发不动<\/td><td style=\"text-align:left\">方案选错（只装了 CBPC）或头发缺 XML<\/td><\/tr><tr><td style=\"text-align:left\">某一件衣服不飘<\/td><td style=\"text-align:left\">那件衣服缺 XML 或被覆盖<\/td><\/tr><tr><td style=\"text-align:left\">头发穿过身体<\/td><td style=\"text-align:left\">碰撞体定义/不匹配<\/td><\/tr><\/tbody><\/table>\n<h2>检查清单（按顺序）<\/h2>\n<h3>1. 先跑 <code>smp report<\/code><\/h3>\n<pre class=\"code\"><code>smp report warnings<\/code><\/pre>\n<p>FSMP 内置的命令，会<strong>校验整个 load order 的物理 XML 与 <code>.nif<\/code><\/strong> 并报告警告。 <strong>这是效率最高的一步<\/strong> —— 别先逐个 mod 试。<\/p>\n<h3>2. SKSE 版本对不对<\/h3>\n<p>SKSE 与游戏版本不匹配 → 所有 SKSE 插件静默失效 → 物理自然不动。 见 <a href=\"../00-overview/version-matrix.md\" target=\"_blank\" rel=\"noopener\"><code>../00-overview/version-matrix.md<\/code><\/a>。<\/p>\n<h3>3. 装的是不是正确的物理 mod<\/h3>\n<ul><li>只装 <strong>CBPC<\/strong> → <strong>头发和衣服永远不会动<\/strong>（机制限制，不是配置问题）；<\/li><li>只装 <strong>SMP<\/strong> → 身体可能不如 CBPC 自然，但会动；<\/li><li>两者都装 → 需要显式配置，否则<strong>互相覆盖<\/strong>（见第 5 条）。<\/li><\/ul>\n<h3>4. XPMSE 是否装了<\/h3>\n<p>HDT-SMP / FSMP <strong>只把网格附加到 XPMSE 的 human skeleton<\/strong>。 装的是别的骨骼 → 物理没有挂点。需要 <strong>XPMSE ≥ 4.6<\/strong>（带物理骨骼）。<\/p>\n<h3>5. SMP 与 CBPC 是否在抢插槽<\/h3>\n<p>两者默认争同一批骨骼。共存必须：<\/p>\n<ul><li>编辑 <strong><code>defaultBBPs.xml<\/code><\/strong> 让 SMP 忽略身体；<\/li><li>且把 <strong><code>cbp.dll<\/code> 改名 <code>zcbp.dll<\/code><\/strong>（或 Engine Fixes preload），保证 SMP 先加载。<\/li><\/ul>\n<p>见 <a href=\"../04-physics/physics-overview.md\" target=\"_blank\" rel=\"noopener\"><code>../04-physics/physics-overview.md<\/code><\/a>。<\/p>\n<h3>6. 身形装的是不是 physics 变体<\/h3>\n<p><strong>这是\"装了 FSMP 还是不抖\"最常被忽略的一条。<\/strong><\/p>\n<p>身形（如 3BA、BHUNP）在 FOMOD 里通常有\"带物理\"和\"不带物理\"的选择。 装成不带物理的版本，物理引擎再对也没东西可动。<\/p>\n<h3>7. 是否在 BodySlide 构建了带物理的身形<\/h3>\n<p>选了 physics 变体还不够，还要<strong>构建<\/strong>。<\/p>\n<h3>8. 行为补丁跑了吗<\/h3>\n<p>FNIS / Nemesis / Pandora 需要跑一次以生成行为文件（CBPC 依赖 FNIS）。<\/p>\n<h3>9. 旧版 HDT-SMP 的 OpenCL<\/h3>\n<p>早期 SMP 需要 <strong>OpenCL 2.0<\/strong>。\"关闭 OpenCL\"实际是<strong>切到 CPU 模拟<\/strong>，不是关掉。<\/p>\n<h3>10. MCM 里的物理开关<\/h3>\n<p>如 3BBB 可以在 CBPC / SMP 之间切换 —— <strong>切错了引擎就会看起来\"没物理\"<\/strong>。<\/p>\n<h2>两条经验性细节（社区）<\/h2>\n<ul><li><strong>改 CBPC 配置不生效<\/strong>时，确认：角色体重是 <strong>0 或 100<\/strong>；<\/li><\/ul>\n<p>未被 SMP 覆盖；覆盖式文本配置在 MO2 左栏里位于 CBPC / 身形<strong>之下<\/strong>。<\/p>\n<ul><li><strong>不兼容项<\/strong>：CBPC 与 <em>Player Size Adjuster and First Person Camera Height Fix SSE<\/em> 不兼容。<\/li><\/ul>\n<h2>来源<\/h2>\n<ul><li><code>smp report<\/code> 命令：FSMP 官方仓库 README / wiki —— <strong>一手<\/strong><\/li><li>\"SMP 只附加 XPMSE human skeleton\"：HDT-SMP Nexus 页 —— <strong>一手<\/strong><\/li><li>\"CBPC 不能管头发和衣服\"：LoversLab 帖 —— <strong>社区经验（多帖一致）<\/strong><\/li><li>检查清单其余项（XPMSE ≥ 4.6、physics 变体、BodySlide 构建、FNIS、OpenCL、<\/li><\/ul>\n<p>MCM 开关、体重 0/100、左栏顺序、不兼容项）： 综合 HDT-SMP 用户/作者指南与 CBPC 专帖 —— <strong>社区经验（多帖一致）<\/strong><\/p>", "_file": "06-troubleshooting/physics-not-working.md", "_chars": 2238}, {"id": "clipping", "title": "穿模 / 破皮（身形与衣服不匹配）", "category": "06-troubleshooting", "kind": "tutorial", "version": "1.0.0", "updated": "2026-09-22", "tags": ["排错", "穿模", "破皮", "BodySlide", "预设"], "aliases": ["衣服穿模", "身形不符", "跟随从穿模", "3bav2 兼容"], "source": "https://forums.nexusmods.com/topic/13536754-body-clips-through-clothes-but-only-on-followers/", "summary": "穿模的四类成因（未构建、家族不匹配、预设不一致、3BAv2 版本断代）与修法，并解释\"为什么只有随从穿模\"。", "content": "<h2>症状<\/h2>\n<p>身体从衣服里穿出来，或衣服像纸片一样被撑破。<\/p>\n<h2>根因：构建是烘焙，滑块是运行时<\/h2>\n<p>先建立这个模型，下面的成因才有意义：<\/p>\n<table><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:left\">离线烘焙（BodySlide Build）<\/th><th style=\"text-align:left\">运行时 morph（RaceMenu）<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">何时算<\/td><td style=\"text-align:left\">点 Build 的那一刻<\/td><td style=\"text-align:left\">游戏运行中，每帧<\/td><\/tr><tr><td style=\"text-align:left\">改不改文件<\/td><td style=\"text-align:left\"><strong>改<\/strong>：数值写进 <code>.nif<\/code> 顶点坐标，成静态模型<\/td><td style=\"text-align:left\">不改，只是临时形变<\/td><\/tr><tr><td style=\"text-align:left\">影响谁<\/td><td style=\"text-align:left\">所有用这个网格的人（含全部 NPC）<\/td><td style=\"text-align:left\"><strong>只影响玩家<\/strong><\/td><\/tr><\/tbody><\/table>\n<blockquote><strong>换预设只重新烘焙了身体，衣服的 nif 还停在上一个预设的形状<\/strong> —— 顶点对不上，于是破皮、穿模、塌陷。<\/blockquote>\n<p>所以「穿模」本质上永远是同一句话：<strong>某些网格的起点形状与你的身体不一致<\/strong>。<\/p>\n<p>机制展开见 <a href=\"../03-body/morph-runtime-vs-bake.md\" target=\"_blank\" rel=\"noopener\"><code>../03-body/morph-runtime-vs-bake.md<\/code><\/a>。<\/p>\n<h2>成因<\/h2>\n<h3>① 服装没有在 BodySlide 里构建<\/h3>\n<p><strong>最常见。<\/strong> 装了服装 mod 但没跑 Batch Build → 服装还是那个服装的原始形状， 和你的身形对不上。<\/p>\n<p>→ <strong>修<\/strong>：在 BodySlide 里用<strong>与身形相同的预设<\/strong>对全部服装做 Batch Build。<\/p>\n<h3>② 身形家族不匹配<\/h3>\n<p>CBBE 身形穿 BHUNP 服装（或反之）。两族网格结构不同，必然穿模。<\/p>\n<p>→ <strong>修<\/strong>：确认服装写明 for CBBE 3BA 还是 for BHUNP，只装同族。<\/p>\n<h3>③ 预设不一致<\/h3>\n<p>裸身用 Curvy、衣服用 Slim → 穿模。<\/p>\n<p>→ <strong>修<\/strong>：裸身与服装用<strong>同一个预设<\/strong>构建。<\/p>\n<h3>④ 3BAv2 的版本断代（隐蔽但重要）<\/h3>\n<p><strong>3BAv2（2021 年底）之后<\/strong>为 3BAv2 制作的服装才与 3BAv2 兼容。 更老的 CBBE / 3BBB 服装需要转换。<\/p>\n<p>→ <strong>修<\/strong>：用 <strong>Outfit Studio<\/strong> 把老服装 Conform / 转换到你的身形。<\/p>\n<h3>⑤ 只有手/脚/内衣穿模<\/h3>\n<p>slot 32（身体）被替换了，但手（33）/ 脚（37）/ 内衣没有同步构建。<\/p>\n<p>→ <strong>修<\/strong>：Batch Build 时把全套部件都包含进去。<\/p>\n<h2>⭐ 为什么\"只有随从穿模\"<\/h2>\n<p>这是社区里反复出现的问题，成因有两类：<\/p>\n<ol><li><strong>随从用了不同的身形<\/strong>（见 <a href=\"../05-distribution/obody-ng.md\" target=\"_blank\" rel=\"noopener\"><code>../05-distribution/<\/code><\/a> 的分配设置）——<\/li><\/ol>\n<p>分配工具按预设分发身形，如果随从拿到的预设与你为服装构建的预设不同，就会穿模；<\/p>\n<ol><li><strong>3BAv2 兼容性问题<\/strong>：随从身上的服装来自更老的包。<\/li><\/ol>\n<p>所以遇到\"只有随从穿模\"，先查<strong>分配工具给它的预设<\/strong>，再查服装年代。<\/p>\n<h2>排查顺序<\/h2>\n<pre class=\"code\"><code>1. 这件服装构建过吗？（Batch Build）\n2. 服装的身形家族 == 身形的家族吗？\n3. 构建用的预设 == 裸身用的预设吗？\n4. 服装是 3BAv2 前还是后？\n5. 是随从专属问题吗？（→ 查分配工具的预设）\n6. 手/脚/内衣是否同步构建？<\/code><\/pre>\n<h2>正解：Zeroed Sliders + Build Morphs + Batch Build<\/h2>\n<p>与其「每换一次预设就把所有衣服重刷一遍」，更省心的做法是<strong>把起点统一到零<\/strong>：<\/p>\n<ol><li><strong>Outfit/Body<\/strong> 选你的主身体（CBBE 3BA → <code>CBBE 3BBB Body Amazing<\/code>）；<\/li><li><strong>Preset<\/strong> 选 <strong><code>Zeroed Sliders<\/code><\/strong>（用身体 mod 自带的那份；<\/li><\/ol>\n<p>里面有滑块是 100% 属正常设计，<strong>不要改<\/strong>）；<\/p>\n<ol><li>勾上 <strong><code>Build Morphs<\/code><\/strong>；<\/li><li><strong>Batch Build<\/strong> 所有服装（记得在 Group Filter 里勾上 <code>Unassigned<\/code> 组，很多服装在那儿）；<\/li><li>出现冲突列表时<strong>统一选第 1 步的那个身体<\/strong>。<\/li><\/ol>\n<p>这样所有网格起点一致，之后在游戏里用 RaceMenu 那一栏调什么都生效、不穿模。<\/p>\n<p>六步详细版见 <a href=\"../03-body/morph-runtime-vs-bake.md\" target=\"_blank\" rel=\"noopener\"><code>../03-body/morph-runtime-vs-bake.md<\/code><\/a>。<\/p>\n<h2>来源<\/h2>\n<ul><li>成因与修法（未构建 / 家族不匹配 / 预设不一致 / slot 未同步）：<\/li><\/ul>\n<p>LoversLab 与 Nexus 论坛穿模帖 —— <strong>社区经验（多帖一致）<\/strong><\/p>\n<ul><li>3BAv2 兼容断代：Nexus 论坛随从穿模帖 —— <strong>社区经验<\/strong><\/li><li>Conform / 用 Outfit Studio 转换：BodySlide 官方 wiki（Outfit Studio 职责）—— <strong>一手<\/strong><\/li><li>\"只有随从穿模\"与分配工具的关系：<strong>社区经验 + 机制推论<\/strong><\/li><\/ul>", "_file": "06-troubleshooting/clipping.md", "_chars": 2518}, {"id": "neck-seam", "title": "脖子接缝 / 手脚接缝", "category": "06-troubleshooting", "kind": "tutorial", "version": "1.0.0", "updated": "2026-09-22", "tags": ["排错", "接缝", "脖缝", "皮肤", "UV"], "aliases": ["脖子接缝", "neck seam", "手脚接缝", "皮肤接缝", "颈部色差"], "source": "https://forums.nexusmods.com/topic/13527930-i-cant-get-rid-of-the-neck-seams-in-bhunp-body/", "summary": "接缝的四个成因（头身皮肤不同源、UV 错配、自定义头网格未配套、tint 不一致）与按顺序的排查法，并指出脖缝修补 mod 只是创可贴。", "content": "<h2>症状<\/h2>\n<p>头像\"套\"在身体上，颈部（或手腕、脚踝）有一圈色差或纹理错位线。<\/p>\n<h2>成因（按发生频率排序）<\/h2>\n<h3>① 头 / 手 / 身体用了不同套或不同档的皮肤<\/h3>\n<p>皮肤 mod 的 FOMOD 里常有多个部件选项（例如 12 个文件）。 <strong>只要有一项选得不一样，就会出现接缝。<\/strong><\/p>\n<p>→ <strong>检查<\/strong>：同一套皮肤、同一档，全部部件一致。<\/p>\n<h3>② 皮肤与身形家族不匹配<\/h3>\n<p><strong>CBBE 与 UNP 用不同的 UV 映射<\/strong>，贴图不能互换。 给 CBBE 做的皮肤贴到 BHUNP 身上，接缝是必然的。<\/p>\n<p>→ <strong>检查<\/strong>：CBBE 皮肤配 CBBE 系身形；UNP 皮肤配 UNP / BHUNP。见 <a href=\"../03-body/body-textures.md\" target=\"_blank\" rel=\"noopener\"><code>../03-body/body-textures.md<\/code><\/a>。<\/p>\n<h3>③ 自定义头网格与身体皮肤不配套<\/h3>\n<p>装了 <strong>CITRUS<\/strong>、<strong>High Poly Head<\/strong> 之类的自定义头网格， 却没有把头部纹理/法线与身体对齐。<\/p>\n<p>→ <strong>检查<\/strong>：HPH 兼容\"基于原版头部的纹理\"，但如果你同时换了皮肤，要确认皮肤提供了 HPH 适配。<\/p>\n<h3>④ FaceGen 的 tint 与 NPC 记录不一致<\/h3>\n<p>改了肤色之
