          align-items:center;justify-content:center;width:26px;height:58px;padding:0;margin:0;

<script>
const ENTRIES = [{"id": "learning-path", "title": "学习路径与选型建议", "category": "00-overview", "kind": "tutorial", "version": "1.0.0", "updated": "2026-09-22", "tags": ["总览", "入门", "学习路径", "选型"], "aliases": ["learning path", "怎么开始", "新手", "该装哪个身形", "选 CBBE 还是 UNP"], "source": "https://stepmodifications.org/wiki/SkyrimSE:0.1.0", "summary": "按\"只想捏脸 / 想改身形 / 想上物理 / 想给 NPC 分配\"四种目标给出最小依赖集，并给出 CBBE 与 UNP 家族的选择判据。", "content": "<h2>一、先确定目标，再决定装多少<\/h2>\n<p>不同目标的最小依赖集差别很大，<strong>多装的部分就是将来排错的成本<\/strong>。<\/p>\n<h3>目标 A：只想捏出好看的脸<\/h3>\n<pre class=\"code\"><code>SKSE64 → Address Library → SkyUI\n→ RaceMenu\n→ 一张脸纹理（皮肤）→ 眼 / 眉 / 发 / 须 资源\n→ （可选）High Poly Head\n→ （可选）Facial Animation / Facelight<\/code><\/pre>\n<p><strong>不需要<\/strong>身形、骨骼、物理。捏脸是独立的一层。<\/p>\n<h3>目标 B：想改身形（体型）<\/h3>\n<pre class=\"code\"><code>A 的全部\n→ 骨骼：XPMSE\n→ 身形家族二选一：CBBE 系 或 UNP 系\n→ 皮肤贴图（必须与身形同族）\n→ BodySlide and Outfit Studio（构建身形与服装）<\/code><\/pre>\n<p><strong>关键动作<\/strong>：BodySlide 里勾 <strong>Build Morphs<\/strong>，否则 RaceMenu 里没有身形滑块。<\/p>\n<h3>目标 C：想有物理（抖动 / 碰撞 / 物理头发）<\/h3>\n<pre class=\"code\"><code>B 的全部\n→ 物理引擎：Faster HDT-SMP（推荐）和/或 CBPC\n→ 身形必须选 physics 变体，并在 BodySlide 构建带物理的身形\n→ 头发/衣物物理只有 HDT-SMP 能做<\/code><\/pre>\n<h3>目标 D：想让 NPC 也有不同身材<\/h3>\n<pre class=\"code\"><code>B（+C）的全部\n→ 分配工具三选一：RaceMenu BodyGen（内置）/ OBody NG / AutoBody<\/code><\/pre>\n<h2>二、CBBE 还是 UNP？<\/h2>\n<p>这是最常问的问题。<strong>没有客观优劣，只有生态与偏好<\/strong>，但有一条硬约束：<\/p>\n<blockquote><strong>两族互斥，且皮肤 UV 不通用。<\/strong> 选定之后，所有皮肤贴图、服装都要在同一族里找。<\/blockquote>\n<table><thead><tr><th style=\"text-align:left\">维度<\/th><th style=\"text-align:left\">CBBE / CBBE 3BA<\/th><th style=\"text-align:left\">UNP / BHUNP<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">生态规模<\/td><td style=\"text-align:left\">最大，服装与预设最多<\/td><td style=\"text-align:left\">较小但稳定<\/td><\/tr><tr><td style=\"text-align:left\">当代事实标准<\/td><td style=\"text-align:left\"><strong>3BA<\/strong>（CBBE 3BBB Advanced）<\/td><td style=\"text-align:left\"><strong>BHUNP<\/strong><\/td><\/tr><tr><td style=\"text-align:left\">皮肤 UV<\/td><td style=\"text-align:left\">CBBE 自有 UV<\/td><td style=\"text-align:left\">UNP 系 UV<\/td><\/tr><tr><td style=\"text-align:left\">常见搭配<\/td><td style=\"text-align:left\">CBBE → 3BA → 皮肤 → BodySlide<\/td><td style=\"text-align:left\">BHUNP → 皮肤 → BodySlide<\/td><\/tr><tr><td style=\"text-align:left\">物理依赖<\/td><td style=\"text-align:left\">XPMSE、CBPC、BodySlide；可选 FSMP<\/td><td style=\"text-align:left\">XPMSE 4.67+、CBPC、HDT-SMP、BodySlide<\/td><\/tr><\/tbody><\/table>\n<p><strong>给新手的判据<\/strong>：如果你要装的<strong>服装/预设包大多写明 for CBBE 3BA<\/strong>，就选 CBBE 系。 如果你已经在用 BHUNP 的皮肤或预设，就留在 UNP 系。<strong>不要为了\"试试\"两套都装。<\/strong><\/p>\n<h2>三、男性角色<\/h2>\n<p>上述讨论默认是女性身形。男性身形（如 <strong>HIMBO<\/strong>、Tempered Skins 面向的男性网格）是<strong>另一条独立的链<\/strong>， 与女性身形不冲突，可以同时启用一套。AutoBody 同时支持 <strong>CBBE 与 HIMBO<\/strong> 预设分发。<\/p>\n<h2>四、推荐的自学顺序<\/h2>\n<ol><li><a href=\"glossary.md\" target=\"_blank\" rel=\"noopener\"><code>glossary.md<\/code><\/a> —— 先看得懂术语，否则教程读不下去。<\/li><li><a href=\"version-matrix.md\" target=\"_blank\" rel=\"noopener\"><code>version-matrix.md<\/code><\/a> —— 明确自己的游戏版本对应哪几个 SKSE 版本。<\/li><li><a href=\"../01-prerequisites/skse64.md\" target=\"_blank\" rel=\"noopener\"><code>../01-prerequisites/skse64.md<\/code><\/a> —— 把前置装稳。<\/li><li>按目标 A→B→C→D 的顺序推进，不要跳级。<\/li><li><a href=\"../07-workflow/install-order.md\" target=\"_blank\" rel=\"noopener\"><code>../07-workflow/install-order.md<\/code><\/a> —— 具体的安装次序与 MO2 覆盖规则。<\/li><\/ol>\n<h2>五、可参考的教程（外部）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">教程<\/th><th style=\"text-align:left\">性质<\/th><th style=\"text-align:left\">链接<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">STEP Guide（Step Modifications 官方 wiki）<\/td><td style=\"text-align:left\"><strong>本领域最权威的\"从零到稳定\"指南<\/strong><\/td><td style=\"text-align:left\"><code>https://stepmodifications.org/wiki/SkyrimSE:0.1.0<\/code><\/td><\/tr><tr><td style=\"text-align:left\">Wabbajack 官方文档<\/td><td style=\"text-align:left\">用现成 modlist 跳过装配<\/td><td style=\"text-align:left\"><code>https://wiki.wabbajack.org/<\/code><\/td><\/tr><tr><td style=\"text-align:left\">GamerPoets<\/td><td style=\"text-align:left\">MO2 / BodySlide / RaceMenu 的实操演示<\/td><td style=\"text-align:left\"><code>https://www.gamerpoets.com/<\/code><\/td><\/tr><\/tbody><\/table>\n<blockquote>注意：<code>modding.wiki<\/code> 域名<strong>并不托管 STEP 的 Skyrim SE 指南<\/strong>（实测其相关页面 404）； STEP 的官方 wiki 是 <code>stepmodifications.org<\/code>。这是一个容易走错的路。<\/blockquote>\n<h2>来源<\/h2>\n<ul><li>STEP Guide：<code>https://stepmodifications.org/wiki/SkyrimSE:0.1.0<\/code> —— <strong>一手（官方策划指南）<\/strong><\/li><li>BHUNP 硬依赖清单：<code>https://www.loverslab.com/files/file/10630-bhunp-3bbb-body-for-le<\/code> —— <strong>一手（作者文件页）<\/strong><\/li><li>Wabbajack 文档：<code>https://wiki.wabbajack.org/<\/code> —— <strong>一手<\/strong><\/li><li>\"CBBE 与 UNP 互斥、UV 不通用\"：Nexus 发布页描述 + 社区一致确认 —— <strong>一手 + 社区经验（一致）<\/strong><\/li><li><code>modding.wiki<\/code> 不托管 STEP 指南：<strong>本工作区实测（2026-09-22，WebFetch 三页均 404）<\/strong><\/li><\/ul>", "_file": "00-overview/learning-path.md", "_chars": 2826}, {"id": "morph-and-nif-basics", "title": "底层机制：NIF、morph 与 .tri", "category": "00-overview", "kind": "concept", "version": "1.0.0", "updated": "2026-09-22", "tags": ["总览", "机制", "NIF", "morph", "tri", "原理"], "aliases": ["morph 原理", "tri 文件", "nif 格式", "bodytri", "滑块原理", "网格机制"], "source": "https://github.com/ousnius/BodySlide-and-Outfit-Studio", "summary": "讲清\"滑块为什么能改变体型\"：NIF 网格容器、BSTriShape、morph 顶点位移、.tri 与 BODYTRI 的配合，以及 RaceMenu 如何在运行时应用。", "content": "<p>不懂这一层，就只能\"照着教程点\"，出了偏差也不知道错在哪一步。<\/p>\n<h2>一、NIF 是网格容器<\/h2>\n<p><strong>NIF（NetImmerse Format）<\/strong> 是 Creation Engine 的 3D 资产格式， 可包含网格、着色器、骨骼、动画与物理信息。身体/头部/服装都是 NIF。<\/p>\n<p>关键差异：<\/p>\n<table><thead><tr><th style=\"text-align:left\">游戏<\/th><th style=\"text-align:left\">身体网格的形状节点<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Skyrim LE<\/td><td style=\"text-align:left\"><code>NiTriShape<\/code> + 挂一个 <code>NiTriShapeData<\/code>（几何数据分开）<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Skyrim SE / AE<\/strong><\/td><td style=\"text-align:left\"><strong><code>BSTriShape<\/code><\/strong>（把形状与几何数据合并成单块）<\/td><\/tr><\/tbody><\/table>\n<blockquote>这个差异有实际后果。RaceMenu 作者记录过：某个游戏版本更新后， <strong><code>NiTriShape<\/code> 不带 <code>NiTriShapeData<\/code> 会导致崩溃<\/strong>，因此新版 overlay NIF 被重新打包。 也就是说，\"网格格式的细节\"是会直接影响能否进游戏的。<\/blockquote>\n<h3>蒙皮网格还要一个东西<\/h3>\n<p>可被骨骼摆动的网格（身体、衣服）额外挂 <strong><code>BSDismemberSkinInstance<\/code><\/strong>， 它包含两件事：<\/p>\n<ol><li><strong>顶点权重<\/strong>（每个顶点受哪些骨骼影响、权重多少）—— 这就是\"<code>Bone Weight Fix<\/code>\"在修的东西；<\/li><li><strong>Partitions（身体部位分区）<\/strong>：裸体 = <code>SBP_32_Body<\/code>，手 = <code>33<\/code>，脚 = <code>37<\/code>。<\/li><\/ol>\n<p><strong>分区号必须与 ARMO / ARMA 记录里的 biped 槽一致，否则该部分不显示。<\/strong><\/p>\n<h2>二、morph：滑块的数学本质<\/h2>\n<p><strong>morph 就是一组顶点位移向量。<\/strong> 一个 morph 描述\"当这个滑块 = 100 时，每个顶点要移动多少\"。<\/p>\n<p>运行时实际显示的网格 = <strong>基础网格 + Σ(各 morph × 该滑块权重)<\/strong>。<\/p>\n<p>所以：<\/p>\n<ul><li>基础网格 + 滑块值 = 你最终看到的体型；<\/li><li>这也解释了为什么\"手动把滑块拉到 200 会破网格\"—— 位移是线性叠加的，超出设计范围就会自交。<\/li><\/ul>\n<h2>三、<code>.tri<\/code> 与 BODYTRI：morph 怎么被游戏找到<\/h2>\n<table><thead><tr><th style=\"text-align:left\">环节<\/th><th style=\"text-align:left\">谁产生<\/th><th style=\"text-align:left\">谁消费<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><code>.tri<\/code> 文件（morph 目标数据）<\/td><td style=\"text-align:left\"><strong>BodySlide<\/strong>（勾 <code>Build Morphs<\/code> 时生成）<\/td><td style=\"text-align:left\">RaceMenu 的 NiOverride / 游戏引擎<\/td><\/tr><tr><td style=\"text-align:left\">NIF 里的 <strong><code>BODYTRI<\/code> extra data<\/strong><\/td><td style=\"text-align:left\"><strong>BodySlide<\/strong>（同一次构建写入）<\/td><td style=\"text-align:left\">引擎（据此找到对应 <code>.tri<\/code>）<\/td><\/tr><\/tbody><\/table>\n<p><strong>因此<\/strong>：<\/p>\n<ul><li>不勾 <code>Build Morphs<\/code> → 没有 <code>.tri<\/code> → <strong>RaceMenu 里看不到身形滑块<\/strong>；<\/li><li>只生成了 <code>.tri<\/code> 但 NIF 没有 <code>BODYTRI<\/code> → 引擎找不到 → 同样无效；<\/li><li>构建被另一个 mod 的 NIF 覆盖 → 你的 <code>BODYTRI<\/code> 也没了（<strong>这是\"滑块突然消失\"的常见真因<\/strong>）。<\/li><\/ul>\n<p>BodySlide 仓库的提交记录里有一条 \"Write only a single BODYTRI extra data when building\"， 正是这条机制的佐证。<\/p>\n<h2>四、RaceMenu 在运行时做什么<\/h2>\n<p>RaceMenu 的核心是 <strong><code>skee64.dll<\/code><\/strong>，它内含 <strong>NiOverride<\/strong> 与 <strong>CharGen<\/strong> 两个模块：<\/p>\n<ul><li><strong>NiOverride<\/strong>：运行时往网格上叠加 morph / 纹理覆盖（overlay）/ 着色；<\/li><li><strong>CharGen<\/strong>：角色创建界面本身（也就是\"滑块界面\"）。<\/li><\/ul>\n<p>因为 NiOverride 能在<strong>运行时<\/strong>改网格，所以：<\/p>\n<ul><li>滑块能即时预览；<\/li><li>预设能在游戏内应用、能发给 NPC；<\/li><li><strong>但也意味着 morph 状态是存在存档（SKSE co-save）里的<\/strong> —— 换 mod 后旧档的 morph 可能对不上。<\/li><\/ul>\n<h2>五、FaceGen 是另一套机制（别混）<\/h2>\n<p>脸不是靠 morph 实时生成的：<\/p>\n<ul><li><strong>FaceGen<\/strong> 是引擎<strong>预生成<\/strong>的头部数据，来自 Creation Kit 的 <code>Ctrl+F4<\/code> 导出；<\/li><li>玩家角色在 RaceMenu 里可以临时用 morph 调整并导出成 FaceGen；<\/li><li><strong>NPC 的脸永远是预生成的<\/strong>（这也是 EFM 只影响玩家、不影响 NPC 的根本原因）。<\/li><\/ul>\n<p>详见 <a href=\"../02-face/facegen-pipeline.md\" target=\"_blank\" rel=\"noopener\"><code>../02-face/facegen-pipeline.md<\/code><\/a>。<\/p>\n<h2>六、装备网格替换裸体网格<\/h2>\n<p>一条容易被忽略、但决定了整个身型问题的机制：<\/p>\n<blockquote><strong>Skyrim 里「穿衣服」不是给身体套一层布，而是用装备网格直接替换裸体网格。<\/strong> 装备本身就是「一具穿好衣服的身体」。<\/blockquote>\n<p>推论只有一个：<strong>所有网格（裸体 + 每一件衣服）的顶点形状必须一致<\/strong>。谁不一致，谁穿模。<\/p>\n<p>而「形状」由两条互相独立的路径决定：<\/p>\n<table><thead><tr><th style=\"text-align:left\">路径<\/th><th style=\"text-align:left\">何时算<\/th><th style=\"text-align:left\">改不改文件<\/th><th style=\"text-align:left\">影响谁<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>离线烘焙<\/strong>（BodySlide Build）<\/td><td style=\"text-align:left\">你点 Build 的那一刻<\/td><td style=\"text-align:left\"><strong>改<\/strong>：数值写进 <code>.nif<\/code> 的顶点坐标，成静态模型<\/td><td style=\"text-align:left\">所有用这个网格的人（含全部 NPC）<\/td><\/tr><tr><td style=\"text-align:left\"><strong>运行时 morph<\/strong>（RaceMenu / NiOverride）<\/td><td style=\"text-align:left\">游戏运行中，每一帧<\/td><td style=\"text-align:left\">不改，只是临时形变<\/td><td style=\"text-align:left\"><strong>只影响玩家<\/strong><\/td><\/tr><\/tbody><\/table>\n<p><strong>两者是叠加的<\/strong>：先烘出一个「起点形状」，再在运行时往它上面叠 morph。 所以只要起点不一致，运行时怎么调都会错位 —— 这就是「换了预设衣服就穿模」的根源。<\/p>\n<p>展开见 <a href=\"../03-body/morph-runtime-vs-bake.md\" target=\"_blank\" rel=\"noopener\"><code>../03-body/morph-runtime-vs-bake.md<\/code><\/a>。<\/p>\n<h2>来源<\/h2>\n<ul><li>NIF / BSTriShape / <code>BSDismemberSkinInstance<\/code> / SBP 分区号：Beyond Skyrim「Arcane University」NIF 技术文档 —— <strong>社区权威技术文档<\/strong><\/li><\/ul>\n<p>（原文另见：<code>https://wiki.beyondskyrim.org/wiki/Arcane_University:NetImmerse_Format<\/code>）<\/p>\n<ul><li><code>.tri<\/code> + <code>BODYTRI<\/code> + Build Morphs：BodySlide 官方仓库提交记录与 wiki —— <strong>一手<\/strong><\/li><li>NiTriShape / NiTriShapeData 崩溃与 overlay NIF：RaceMenu 作者 Nexus 帖 —— <strong>一手（作者本人）<\/strong><\/li><li>morph = 顶点位移、基础网格 + Σ(morph × 权重)：由 BodySlide wiki 的滑块机制说明与 NiOverride 行为归纳 —— <strong>一手机制 + 合理归纳<\/strong><\/li><li>NPC 脸是预生成、EFM 只影响玩家：EFM Nexus 发布页描述 —— <strong>一手<\/strong><\/li><\/ul>", "_file": "00-overview/morph-and-nif-basics.md", "_chars": 3485}, {"id": "ecosystem-map", "title": "捏脸与身形生态地图", "category": "00-overview", "kind": "concept", "version": "1.0.0", "updated": "2026-09-22", "tags": ["总览", "生态", "路线图", "选型"], "aliases": ["ecosystem", "该装什么", "body mod 有哪些", "捏脸需要什么"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/19080", "summary": "把\"人物外貌\"拆成五层（前置框架 / 脸 / 身形 / 骨骼物理 / 分配），说明每层谁负责、谁依赖谁、装错会怎样。", "content": "<p>Skyrim 的\"人物外貌\"不是一个 mod，而是<strong>五层叠起来的一条链<\/strong>。每一层只解决自己的问题， 层与层之间靠\"文件覆盖\"和\"运行时 API\"连接。理解这条链，比记住任何一个 mod 名字都重要。<\/p>\n<h2>五层结构<\/h2>\n<table><thead><tr><th style=\"text-align:left\">层<\/th><th style=\"text-align:left\">解决的问题<\/th><th style=\"text-align:left\">代表 mod<\/th><th style=\"text-align:left\">装错的典型症状<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>L0 前置框架<\/strong><\/td><td style=\"text-align:left\">让 DLL 插件能跑<\/td><td style=\"text-align:left\">SKSE64、Address Library、SkyUI、草稿级的 PapyrusUtil / JContainers / MCM Helper<\/td><td style=\"text-align:left\">菜单打不开、滑块全空<\/td><\/tr><tr><td style=\"text-align:left\"><strong>L1 脸<\/strong><\/td><td style=\"text-align:left\">脸部几何与纹理、表情、捏脸界面<\/td><td style=\"text-align:left\">RaceMenu、High Poly Head、EFM / EFA、脸纹理<\/td><td style=\"text-align:left\">黑脸、没滑块、预设不生效<\/td><\/tr><tr><td style=\"text-align:left\"><strong>L2 身形<\/strong><\/td><td style=\"text-align:left\">身体网格与滑块<\/td><td style=\"text-align:left\">CBBE / UNP / BHUNP / CBBE 3BA + BodySlide<\/td><td style=\"text-align:left\">穿模、裸体不生效、滑块缺失<\/td><\/tr><tr><td style=\"text-align:left\"><strong>L3 骨骼与物理<\/strong><\/td><td style=\"text-align:left\">挂点、物理抖动与碰撞<\/td><td style=\"text-align:left\">XPMSE、HDT-SMP / Faster HDT-SMP、CBPC<\/td><td style=\"text-align:left\">不抖、头发穿透、CTD<\/td><\/tr><tr><td style=\"text-align:left\"><strong>L4 分配<\/strong><\/td><td style=\"text-align:left\">把身形/外观发给 NPC<\/td><td style=\"text-align:left\">RaceMenu BodyGen、OBody NG、AutoBody<\/td><td style=\"text-align:left\">NPC 全是同一个身材<\/td><\/tr><\/tbody><\/table>\n<h2>依赖方向（关键）<\/h2>\n<pre class=\"code\"><code>L0 前置  →  L1 / L2 / L3 / L4 全部依赖它\nL2 身形  →  依赖 L3 的骨骼节点（没有 XPMSE 就没有物理骨骼可挂）\nL3 物理  →  依赖 L2 的网格带物理变体（身形要选 physics 版本）\nL1 脸    →  与 L2 皮肤 UV 必须同族（CBBE 皮肤 ↔ CBBE 系身形）\nL4 分配  →  依赖 L1 的 RaceMenu 的 morph API + L2 的 .tri morph 文件<\/code><\/pre>\n<p><strong>几条反复踩的坑<\/strong>：<\/p>\n<ul><li><strong>L1 与 L2 的皮肤 UV 必须同族。<\/strong> CBBE 有自己的 UV 映射，UNP 系有另一套；<\/li><\/ul>\n<p>给 CBBE 做的皮肤贴图不能直接用在 UNP 系，反之亦然 —— 错配会在手、颈、脚出现接缝。<\/p>\n<ul><li><strong>L3 不给 L2 兜底。<\/strong> 只装 CBPC / HDT-SMP 不会自动让身形好看；<\/li><\/ul>\n<p>身形要在 BodySlide 里构建，且必须勾 <code>Build Morphs<\/code> 才会有 <code>.tri<\/code> 文件供 RaceMenu 调。<\/p>\n<ul><li><strong>L4 不是必需层。<\/strong> 不装分配工具，玩家角色照样能捏；它只决定 NPC 是否\"身材统一\"。<\/li><\/ul>\n<h2>两条互斥红线<\/h2>\n<ol><li><strong>同一时刻只能启用一个女性身形 + 一个男性身形<\/strong>。CBBE 与 UNP / BHUNP 不能共存。<\/li><li><strong>CBPC 与 HDT-SMP 争同一个 body 插槽<\/strong>。要\"身体用 CBPC、头发衣服用 SMP\"必须做额外处理<\/li><\/ol>\n<p>（把 <code>cbp.dll<\/code> 改名 <code>zcbp.dll<\/code> 或编辑 <code>defaultBBPs.xml<\/code>），详见 <a href=\"../04-physics/physics-overview.md\" target=\"_blank\" rel=\"noopener\"><code>04-physics/physics-overview.md<\/code><\/a>。<\/p>\n<h2>该往哪读<\/h2>\n<ul><li>我不确定从哪开始 → <a href=\"learning-path.md\" target=\"_blank\" rel=\"noopener\"><code>learning-path.md<\/code><\/a><\/li><li>名词看不懂 → <a href=\"glossary.md\" target=\"_blank\" rel=\"noopener\"><code>glossary.md<\/code><\/a><\/li><li>版本对不上 → <a href=\"version-matrix.md\" target=\"_blank\" rel=\"noopener\"><code>version-matrix.md<\/code><\/a><\/li><li>已经出故障了 → <a href=\"../06-troubleshooting/dark-face.md\" target=\"_blank\" rel=\"noopener\"><code>06-troubleshooting/<\/code><\/a><\/li><\/ul>\n<h2>来源<\/h2>\n<p>Nexus 各 mod 发布页描述（RaceMenu、CBBE、3BA、BHUNP）、 GitHub 官方仓库 README（BodySlide、FSMP、OBody NG）、UESP 与 Creation Kit wiki。 层与层之间的依赖关系为<strong>跨多个官方页交叉比对<\/strong>得出，非单一来源陈述。<\/p>", "_file": "00-overview/ecosystem-map.md", "_chars": 2125}, {"id": "glossary", "title": "术语表", "category": "00-overview", "kind": "reference", "version": "1.0.0", "updated": "2026-09-22", "tags": ["总览", "术语", "速查", "缩写"], "aliases": ["名词解释", "3BA 是什么", "SMP 是什么", "什么叫 morph"], "source": "https://www.loverslab.com/blogs/entry/16040-glossary", "summary": "捏脸与身形领域的缩写、俗称与易混词逐条对齐，每条给出\"它到底指什么\"以及易混对象。", "content": "<h2>身形（body）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">词<\/th><th style=\"text-align:left\">指什么<\/th><th style=\"text-align:left\">易混点<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>CBBE<\/strong><\/td><td style=\"text-align:left\">Caliente's Beautiful Bodies Enhancer，女性身形网格，有独立 UV<\/td><td style=\"text-align:left\">不是软件，是网格+贴图资源<\/td><\/tr><tr><td style=\"text-align:left\"><strong>UNP / UUNP<\/strong><\/td><td style=\"text-align:left\">Dimonized UNP 及其统一版；UUNP 在 SE 官方已不再支持，靠 <strong>Legacy UUNP<\/strong> 过渡<\/td><td style=\"text-align:left\">UNP 系与 CBBE 系<strong>互斥<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>UNPB<\/strong><\/td><td style=\"text-align:left\">UNP Blessed Body，UNP 的丰胸丰臀重制变体<\/td><td style=\"text-align:left\">属 UNP 家族，不是独立家族<\/td><\/tr><tr><td style=\"text-align:left\"><strong>BHUNP<\/strong><\/td><td style=\"text-align:left\">\"UUNP Next Generation\" 的 SE 版，作者 Bakafactory 与 Haeun<\/td><td style=\"text-align:left\">属 UNP 家族；<strong>与 CBBE 不兼容<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>3BBB<\/strong><\/td><td style=\"text-align:left\">3 Breast Bones Body，带 3 根乳房骨的身体<\/td><td style=\"text-align:left\">这是<strong>术语<\/strong>，不是文件名<\/td><\/tr><tr><td style=\"text-align:left\"><strong>3BA<\/strong><\/td><td style=\"text-align:left\">CBBE 3BBB Advanced，作者 Acro；CBBE 的扩展，基底网格同 CBBE<\/td><td style=\"text-align:left\">常被误当成\"CBBE 的替代\"，其实<strong>同基底<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>HIMBO<\/strong><\/td><td style=\"text-align:left\">男性身形（对应 CBBE 生态的男性版）<\/td><td style=\"text-align:left\">与女性身形分属不同家族<\/td><\/tr><\/tbody><\/table>\n<h2>物理（physics）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">词<\/th><th style=\"text-align:left\">指什么<\/th><th style=\"text-align:left\">易混点<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>HDT-PE<\/strong><\/td><td style=\"text-align:left\">旧方案，用游戏内建 Havok 做<strong>骨骼级<\/strong>碰撞<\/td><td style=\"text-align:left\">已被 SMP 取代<\/td><\/tr><tr><td style=\"text-align:left\"><strong>HDT-SMP<\/strong><\/td><td style=\"text-align:left\">Skinned Mesh Physics，用 Bullet 做<strong>逐顶点蒙皮网格<\/strong>物理<\/td><td style=\"text-align:left\">\"SMP\" 单说时多指它<\/td><\/tr><tr><td style=\"text-align:left\"><strong>FSMP<\/strong><\/td><td style=\"text-align:left\">Faster HDT-SMP，SMP 的现代 fork，性能大幅提升<\/td><td style=\"text-align:left\"><strong>取代<\/strong>原版 SMP，不要两个都装<\/td><\/tr><tr><td style=\"text-align:left\"><strong>CBPC<\/strong><\/td><td style=\"text-align:left\">CBP Physics with Collisions，用<strong>球体/胶囊近似<\/strong>做碰撞物理<\/td><td style=\"text-align:left\">轻量、对 CPU 友好；<strong>管不了头发和衣服<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>CBP<\/strong><\/td><td style=\"text-align:left\">旧的基础版物理（无碰撞），CBPC 的前身<\/td><td style=\"text-align:left\">名字像但不是同一个<\/td><\/tr><\/tbody><\/table>\n<h2>机制（mechanics）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">词<\/th><th style=\"text-align:left\">指什么<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>morph<\/strong><\/td><td style=\"text-align:left\">顶点位移数据。滑块的本质就是\"按权重把 morph 加到基础网格上\"<\/td><\/tr><tr><td style=\"text-align:left\"><strong><code>.tri<\/code><\/strong><\/td><td style=\"text-align:left\">morph 目标文件。BodySlide 勾 <code>Build Morphs<\/code> 后生成，RaceMenu 靠它出滑块<\/td><\/tr><tr><td style=\"text-align:left\"><strong>BODYTRI<\/strong><\/td><td style=\"text-align:left\">NIF 里的 extra data，指向对应的 <code>.tri<\/code> 文件<\/td><\/tr><tr><td style=\"text-align:left\"><strong>NiOverride<\/strong><\/td><td style=\"text-align:left\">RaceMenu 的运行时叠加机制（在 <code>skee64.dll<\/code> 内），负责在游戏内应用 morph / tint<\/td><\/tr><tr><td style=\"text-align:left\"><strong>CharGen<\/strong><\/td><td style=\"text-align:left\">RaceMenu 的角色创建模块（<code>skee64.dll<\/code>）。<strong>2.7+ 起 CharGen Extension 已完全并入本体<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>FaceGen<\/strong><\/td><td style=\"text-align:left\">引擎的\"头部预生成数据\"：头网格 <code>.nif<\/code> + 色调 <code>.dds<\/code>，由 CK 的 <code>Ctrl+F4<\/code> 导出<\/td><\/tr><tr><td style=\"text-align:left\"><strong>tint mask<\/strong><\/td><td style=\"text-align:left\">脸部的着色遮罩（唇色/腮红/眼线/肤色…），RACE 与 NPC 记录里逐层定义<\/td><\/tr><tr><td style=\"text-align:left\"><strong>head part / HDPT<\/strong><\/td><td style=\"text-align:left\">面部部件数据对象（头发、眼、胡须、疤痕…）<\/td><\/tr><tr><td style=\"text-align:left\"><strong><code>.jslot<\/code><\/strong><\/td><td style=\"text-align:left\">RaceMenu 的预设文件，<strong>JSON 文本<\/strong>格式；旧的二进制 <code>.slot<\/code> 仍可读但不再被写出<\/td><\/tr><tr><td style=\"text-align:left\"><strong><code>.osp<\/code> / <code>.osd<\/code><\/strong><\/td><td style=\"text-align:left\">Outfit Studio 的项目文件（<code>.osp<\/code> 是<strong>纯文本 XML<\/strong>）与滑块数据（<code>.osd<\/code> 是<strong>二进制<\/strong>）<\/td><\/tr><tr><td style=\"text-align:left\"><strong><code>.xml<\/code>（SliderPresets）<\/strong><\/td><td style=\"text-align:left\">BodySlide 的预设文件，存命名过的一组滑块值<\/td><\/tr><\/tbody><\/table>\n<h2>前置（frameworks）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">词<\/th><th style=\"text-align:left\">指什么<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>SKSE64<\/strong><\/td><td style=\"text-align:left\">Script Extender，版本必须与游戏版本精确对应<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Address Library<\/strong><\/td><td style=\"text-align:left\">让 SKSE DLL 插件跨 1.6.x 小版本通用；<strong>SE(1.5.x) 与 AE(1.6.x) 两套地址不通用<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>XPMSE / XPMSSE<\/strong><\/td><td style=\"text-align:left\">XP32 Maximum Skeleton (Special) Extended，骨骼扩展，物理与身形的事实标准前置<\/td><\/tr><tr><td style=\"text-align:left\"><strong>PAPYRUS 相关<\/strong><\/td><td style=\"text-align:left\">PapyrusUtil（StorageUtil/JsonUtil）、JContainers（JSON 容器）、MCM Helper（配置菜单）<\/td><\/tr><\/tbody><\/table>\n<h2>来源<\/h2>\n<ul><li>LoversLab 术语表（社区整理）：<code>https://www.loverslab.com/blogs/entry/16040-glossary<\/code> —— <strong>社区经验<\/strong><\/li><li>各词条的\"指什么\"以 Nexus 发布页描述与 GitHub README 为准 —— <strong>一手<\/strong><\/li><li><code>NiOverride<\/code> / <code>CharGen<\/code> / <code>.jslot<\/code> 的定义出自 RaceMenu 发布页与 changelog —— <strong>一手<\/strong><\/li><li><code>3BA<\/code> 为 CBBE 扩展、同基底网格：LoversLab 官方文件页 + 指南一致 —— <strong>社区经验（多源一致）<\/strong><\/li><\/ul>", "_file": "00-overview/glossary.md", "_chars": 2709}, {"id": "version-matrix", "title": "版本对照表（游戏 ↔ SKSE ↔ RaceMenu ↔ 物理）", "category": "00-overview", "kind": "reference", "version": "1.0.0", "updated": "2026-09-22", "tags": ["总览", "版本", "对照", "兼容性"], "aliases": ["version matrix", "版本对照", "哪个版本", "1170 对应", "skse 版本对应", "版本不匹配"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/30379", "summary": "以游戏版本为主键，列出 SKSE64 / RaceMenu / Faster HDT-SMP 的对应版本，并给出\"版本错配会有什么症状\"。", "content": "<p><strong>这是整个领域第一大坑<\/strong>：SKSE64、RaceMenu、FSMP 都是原生 DLL 插件， 它们的版本与<strong>游戏可执行文件版本<\/strong>强绑定。Steam 一次自动更新就能让整套失效。<\/p>\n<h2>以游戏版本为主键<\/h2>\n<table><thead><tr><th style=\"text-align:left\">游戏版本<\/th><th style=\"text-align:left\">SKSE64<\/th><th style=\"text-align:left\">RaceMenu<\/th><th style=\"text-align:left\">Faster HDT-SMP<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>1.6.1170 / 1179（当前 AE，Steam / GOG）<\/strong><\/td><td style=\"text-align:left\"><strong>2.2.6<\/strong><\/td><td style=\"text-align:left\"><strong>0.4.19.16 及以上<\/strong>（0.4.20.0 亦可）<\/td><td style=\"text-align:left\">最新 4.x，FOMOD 里选 <strong>1.6.1170.0<\/strong><\/td><\/tr><tr><td style=\"text-align:left\">1.6.1130<\/td><td style=\"text-align:left\">2.2.6<\/td><td style=\"text-align:left\">0.4.19.15+<\/td><td style=\"text-align:left\">—<\/td><\/tr><tr><td style=\"text-align:left\">1.6.640<\/td><td style=\"text-align:left\">2.2.2<\/td><td style=\"text-align:left\">0.4.19.13+<\/td><td style=\"text-align:left\">选 1.6.640 档<\/td><\/tr><tr><td style=\"text-align:left\">1.6.659（GOG）<\/td><td style=\"text-align:left\">2.2.2<\/td><td style=\"text-align:left\">0.4.19.14+<\/td><td style=\"text-align:left\">—<\/td><\/tr><tr><td style=\"text-align:left\">1.6.353<\/td><td style=\"text-align:left\">2.1.5<\/td><td style=\"text-align:left\">0.4.19.x 相应版本<\/td><td style=\"text-align:left\">选 1.6.353 档<\/td><\/tr><tr><td style=\"text-align:left\">1.5.97（pre-AE 长期版本）<\/td><td style=\"text-align:left\">2.0.20<\/td><td style=\"text-align:left\">0.4.19.12 及以下一支<\/td><td style=\"text-align:left\">选 1.5.97 档<\/td><\/tr><tr><td style=\"text-align:left\">VR<\/td><td style=\"text-align:left\">SKSEVR 2.0.12<\/td><td style=\"text-align:left\">—<\/td><td style=\"text-align:left\">选 VR 档<\/td><\/tr><\/tbody><\/table>\n<blockquote>RaceMenu 的 changelog 里，\"Support for Game Version 1.6.1170\" 出现在 <strong>0.4.19.16<\/strong>。 官方 Files 页的主文件标注 SKSE64 <strong>2.2.6<\/strong> 或更高。<\/blockquote>\n<h2>Community Shaders 的口径可作旁证<\/h2>\n<p>同一台机器上，其他原生插件对\"支持哪些游戏版本\"的态度更严格： <code>community-shaders-kb<\/code> 记录 CS 只支持 <strong>1.6.1170 / 1.6.1179 / 1.5.97<\/strong>， 明确<strong>不支持 1.6.640 / 1.7.99 / 1.7.104<\/strong>。这说明\"版本敏感\"不是个别 mod 的怪癖， 而是这套引擎生态的系统性特征 —— <strong>装任何原生插件前，先确认自己的游戏版本号<\/strong>。<\/p>\n<h2>怎么查自己的游戏版本<\/h2>\n<ul><li>Steam 版：右键游戏 → 属性 → 已安装文件，或看游戏目录里 <code>SkyrimSE.exe<\/code> 的详细信息；<\/li><li>更可靠的办法是看 <strong>SKSE 启动日志<\/strong>或 <code>Documents/My Games/Skyrim Special Edition/SKSE/<\/code> 下的插件日志，<\/li><\/ul>\n<p>它们会打印运行时版本。<\/p>\n<h2>版本错配的症状对照<\/h2>\n<table><thead><tr><th style=\"text-align:left\">错配<\/th><th style=\"text-align:left\">症状<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">SKSE 与游戏不匹配<\/td><td style=\"text-align:left\">游戏起不来，或<strong>所有 SKSE 插件静默失效<\/strong>（菜单没有、滑块没有）<\/td><\/tr><tr><td style=\"text-align:left\">RaceMenu 与 SKSE/游戏不匹配<\/td><td style=\"text-align:left\">进游戏后捏脸界面是原版的，RaceMenu 全套功能消失<\/td><\/tr><tr><td style=\"text-align:left\">FSMP 选错游戏版本档<\/td><td style=\"text-align:left\">物理不生效，或开局 CTD<\/td><\/tr><tr><td style=\"text-align:left\">Address Library 装了 SE 版给 AE 用<\/td><td style=\"text-align:left\">依赖它的 DLL 插件全部失效（地址不通用）<\/td><\/tr><\/tbody><\/table>\n<p><strong>推论<\/strong>：遇到\"某个功能整体不见\"，第一件事永远是核对版本，而不是去翻冲突。<\/p>\n<h2>来源<\/h2>\n<ul><li>SKSE64 版本与安装说明：<code>https://www.nexusmods.com/skyrimspecialedition/mods/30379<\/code> + Nexus 官方 wiki —— <strong>一手<\/strong><\/li><li>RaceMenu changelog（0.4.19.16 对应 1.6.1170）：<code>https://www.nexusmods.com/skyrimspecialedition/mods/19080?tab=files<\/code> —— <strong>一手<\/strong><\/li><li>Faster HDT-SMP FOMOD 档位与游戏版本对应：<code>https://www.nexusmods.com/skyrimspecialedition/mods/57339<\/code> 文件页 —— <strong>一手<\/strong><\/li><li>Address Library：<code>https://www.nexusmods.com/skyrimspecialedition/mods/32444<\/code> —— <strong>一手<\/strong><\/li><li>1.6.640 / 1.7.9x 不被 CS 支持：见本工作区 <a href=\"../../community-shaders-kb/01-installation/\" target=\"_blank\" rel=\"noopener\">安装<\/a> —— <strong>一手（CS 官方）<\/strong><\/li><\/ul>\n<blockquote>⚠️ <strong>时效提醒<\/strong>：本表随上游发版变化。表内 <code>updated<\/code> 距今较远时，请以各 mod 的 Files 页为准。<\/blockquote>", "_file": "00-overview/version-matrix.md", "_chars": 2360}, {"id": "skse-plugin-frameworks", "title": "SKSE 插件框架：PapyrusUtil / JContainers / MCM Helper / po3 Extender", "category": "01-prerequisites", "kind": "reference", "version": "1.0.0", "updated": "2026-09-22", "tags": ["前置", "框架", "PapyrusUtil", "JContainers", "MCM Helper", "po3"], "aliases": ["papyrus extender", "前置框架", "skyui"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/13048", "summary": "捏脸与身形类 mod 常要求的四个框架库各自做什么，以及一个被广泛误传的点：PapyrusUtil 并不是 RaceMenu 的前置。", "content": "<p>这些不是\"身形 mod\"，而是被身形/捏脸 mod <strong>当作前置引用<\/strong>的通用库。 它们自身不产生外观变化，但缺了会让宿主 mod 静默失效。<\/p>\n<table><thead><tr><th style=\"text-align:left\">框架<\/th><th style=\"text-align:left\">作者<\/th><th style=\"text-align:left\">作用<\/th><th style=\"text-align:left\">Nexus<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>PapyrusUtil SE<\/strong><\/td><td style=\"text-align:left\">exiledviper（维护）、meh321（原始）<\/td><td style=\"text-align:left\"><code>StorageUtil<\/code> 数据存储、<code>JsonUtil<\/code>、<code>MiscUtil<\/code> 等原生函数<\/td><td style=\"text-align:left\">13048<\/td><\/tr><tr><td style=\"text-align:left\"><strong>JContainers SE<\/strong><\/td><td style=\"text-align:left\">ryobg（SE 移植）<\/td><td style=\"text-align:left\">给 Papyrus 提供 JSON 数据结构与持久化<\/td><td style=\"text-align:left\">—<\/td><\/tr><tr><td style=\"text-align:left\"><strong>MCM Helper<\/strong><\/td><td style=\"text-align:left\">Parapets<\/td><td style=\"text-align:left\">简化 MCM 创建、持久化 INI 设置、热键注册<\/td><td style=\"text-align:left\">53000<\/td><\/tr><tr><td style=\"text-align:left\"><strong>powerofthree's Papyrus Extender<\/strong><\/td><td style=\"text-align:left\">powerofthree (po3)<\/td><td style=\"text-align:left\">扩展 Papyrus：官方口径 <strong>374+ 新函数、37 事件<\/strong><\/td><td style=\"text-align:left\">22854<\/td><\/tr><\/tbody><\/table>\n<ul><li><strong>PapyrusUtil 4.6 起已支持 1.6.1170<\/strong>；4.1+ 需要 Address Library。<\/li><li><strong>po3 Extender 的依赖链是<\/strong>：SKSE64 + Address Library + powerofthree's Tweaks（注意是三层）。<\/li><li><strong>MCM Helper 的依赖<\/strong>：SKSE64 + Address Library + SkyUI。<\/li><li><strong>SkyUI<\/strong> 本身是 MCM 与搜索界面的载体，几乎所有带配置菜单的 mod 都要求它。<\/li><\/ul>\n<h2>⚠️ 一条被广泛误传的前置关系<\/h2>\n<blockquote><strong>PapyrusUtil 不是 RaceMenu 的前置。<\/strong><\/blockquote>\n<p>RaceMenu 的 Nexus 发布页只列 <strong>SKSE64<\/strong>。RaceMenu 的 <code>skee64.dll<\/code> 自带 <strong>NiOverride<\/strong> 与 <strong>CharGen<\/strong> 两套实现（2.7+ 起 CharGen Extension 已完全并入本体， 若你曾单独装过 CharGen Extension，作者明确要求<strong>卸载它<\/strong>）。<\/p>\n<p>PapyrusUtil 会出现在\"依赖清单\"里，是因为<strong>别的<\/strong> mod（部分身形、高跟、动画类）需要它 —— 把它记在 RaceMenu 名下会导致排错时找错方向。<\/p>\n<h3>版本不匹配时该删的散装脚本<\/h3>\n<p>RaceMenu 自带的这些 <code>.pex<\/code> 若在别处残留旧版本，会引发版本冲突提示，应删除： <code>CharGen.pex<\/code> / <code>NiOverride.pex<\/code> / <code>RaceMenu.pex<\/code> / <code>RaceMenuBase.pex<\/code> / <code>RaceMenuLoad.pex<\/code> / <code>RaceMenuPlugin.pex<\/code>。<\/p>\n<h2>一个实用的判断法<\/h2>\n<p>看到一个 mod 报\"缺前置\"，别急着找同名 mod 装上。按这条链往上追：<\/p>\n<pre class=\"code\"><code>宿主 mod → 需要哪个框架 → 那个框架又需要什么 → 有没有 Address Library<\/code><\/pre>\n<p><strong>框架类问题的症状高度同质<\/strong>：菜单不出现、设置不保存、脚本静默不执行。 这类症状的排查顺序永远是\"版本与前置\"，而不是\"冲突\"。<\/p>\n<h2>来源<\/h2>\n<ul><li>PapyrusUtil SE：<code>https://www.nexusmods.com/skyrimspecialedition/mods/13048<\/code>（4.6 支持 1.6.1170、4.1+ 需 ADL）—— <strong>一手<\/strong><\/li><li>powerofthree's Papyrus Extender：<code>https://www.nexusmods.com/skyrimspecialedition/mods/22854<\/code>（函数/事件数量、依赖链）—— <strong>一手<\/strong><\/li><li>MCM Helper：<code>https://www.nexusmods.com/skyrimspecialedition/mods/53000<\/code> —— <strong>一手<\/strong><\/li><li>JContainers SE 版本信息：Wildlander 清单交叉印证 —— <strong>社区经验<\/strong><\/li><li><strong>PapyrusUtil 非 RaceMenu 前置、CharGen Extension 须卸载、应删除的散装 <code>.pex<\/code><\/strong>：<\/li><\/ul>\n<p>RaceMenu 发布页与作者 FAQ —— <strong>一手（本工作区在撰条目时对 RaceMenu 描述页做了逐句核对）<\/strong><\/p>", "_file": "01-prerequisites/skse-plugin-frameworks.md", "_chars": 2339}, {"id": "skse64", "title": "SKSE64 与 Address Library", "category": "01-prerequisites", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["前置", "SKSE", "Address Library", "版本"], "aliases": ["脚本扩展", "版本库", "地址库"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/30379", "summary": "SKSE64 的版本对应关系与安装方式，以及 Address Library（地址库）为什么能解耦 SKSE 插件的版本依赖，和两者错误配置的症状。", "content": "<h2>SKSE64<\/h2>\n<p><strong>Skyrim Script Extender<\/strong> —— 扩展脚本与原生能力的加载器，作者 <strong>ianpatt<\/strong>（Ian Patterson） 与 <strong>behippo<\/strong>（Stephen Abel）。捏脸/身形生态里几乎所有\"能动的功能\"都靠它。<\/p>\n<ul><li>Nexus 页：<code>https://www.nexusmods.com/skyrimspecialedition/mods/30379<\/code><\/li><li><strong>仅支持 Steam 与 GOG 版本<\/strong>，不支持 Epic / Game Pass<\/li><li>版本必须与游戏可执行文件版本<strong>精确对应<\/strong>（见 <a href=\"../00-overview/version-matrix.md\" target=\"_blank\" rel=\"noopener\"><code>../00-overview/version-matrix.md<\/code><\/a>）<\/li><li><strong>1.6.1170 → SKSE64 2.2.6<\/strong><\/li><\/ul>\n<h3>安装要点<\/h3>\n<ol><li>把 SKSE 的文件解压到<strong>游戏根目录<\/strong>（与 <code>SkyrimSE.exe<\/code> 同级），不是 Data 目录。<\/li><li>通过 <code>skse64_loader.exe<\/code> 启动游戏（MO2 里把它设为可执行项）。<\/li><li><code>Data/SKSE/Plugins/<\/code> 是各 DLL 插件与配置的落脚点 —— 排错时先看这里有没有对应文件。<\/li><\/ol>\n<h3>错误配置的症状<\/h3>\n<table><thead><tr><th style=\"text-align:left\">症状<\/th><th style=\"text-align:left\">含义<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">SkyUI 弹 \"SKSE is not functioning properly\"<\/td><td style=\"text-align:left\">SKSE 脚本没装好或版本不符<\/td><\/tr><tr><td style=\"text-align:left\">游戏能启动但所有插件功能消失<\/td><td style=\"text-align:left\">SKSE 版本与游戏不匹配（DLL 拒绝加载）<\/td><\/tr><tr><td style=\"text-align:left\">启动即崩<\/td><td style=\"text-align:left\">某个 DLL 插件的游戏版本档选错了<\/td><\/tr><\/tbody><\/table>\n<h2>Address Library for SKSE Plugins<\/h2>\n<p>作者 <strong>meh321<\/strong>。Nexus：<code>https://www.nexusmods.com/skyrimspecialedition/mods/32444<\/code>。<\/p>\n<p><strong>它解决的问题<\/strong>：原生插件需要知道\"引擎内部某个函数的地址\"。 游戏每更新一个小版本，地址就变，插件就得重编译 —— 这曾导致\"游戏一更新，全生态瘫痪\"。<\/p>\n<p>Address Library 提供一份<strong>地址映射数据库<\/strong>，插件通过\"库编号（ID）\"间接寻址， 于是<strong>跨 1.6.x 小版本通用<\/strong>。多数现代插件（FSMP、MCM Helper、PapyrusUtil 4.1+、Engine Fixes 等）都依赖它。<\/p>\n<h3>关键坑<\/h3>\n<blockquote><strong>SE 版（1.5.x）与 AE 版（1.6.x）是两套独立数据库，地址不通用。<\/strong><\/blockquote>\n<p>装错了的表现是：<strong>依赖 Address Library 的插件全部静默失效<\/strong>，而游戏本身照常运行。 排查时不要盯着某个 mod 找原因，先确认 ADL 装的是不是 AE 版。<\/p>\n<h2>最小前置链（1.6.1170）<\/h2>\n<pre class=\"code\"><code>SkyrimSE.exe 1.6.1170\n├─ SKSE64 2.2.6\n├─ Address Library for SKSE Plugins（AE 版）\n├─ SkyUI\n└─ 之后才是 RaceMenu / 物理 / 分配工具<\/code><\/pre>\n<h2>来源<\/h2>\n<ul><li>SKSE64 Nexus 页与官方文档：<code>https://www.nexusmods.com/skyrimspecialedition/mods/30379<\/code> —— <strong>一手<\/strong><\/li><li>Nexus wiki「Skyrim 1.6.117x Notes」：SKSE 2.2.6 对应 1.6.1170 —— <strong>一手（Nexus 官方文档）<\/strong><\/li><li>Address Library：<code>https://www.nexusmods.com/skyrimspecialedition/mods/32444<\/code> —— <strong>一手<\/strong><\/li><li>SE / AE 地址库不通用、依赖清单：Nexus 页说明与插件 README 一致 —— <strong>一手<\/strong><\/li><\/ul>", "_file": "01-prerequisites/skse64.md", "_chars": 2054}, {"id": "expressive-morphs", "title": "Expressive Facegen Morphs 与 Expressive Facial Animation", "category": "02-face", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["捏脸", "EFM", "EFA", "表情", "morph"], "aliases": ["expressive facegen morphs", "表情包", "面部表情", "niroku"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/35785", "summary": "作者 Niroku 的三个面部 morph / 表情 mod 的分工、目标种族、两个文件的区别，以及\"只影响玩家、不影响 NPC\"这一关键限制。", "content": "<p>作者 <strong>Niroku<\/strong>（Nexus 用户 35150865）。三个 mod 分工容易混：<\/p>\n<table><thead><tr><th style=\"text-align:left\">mod<\/th><th style=\"text-align:left\">Nexus<\/th><th style=\"text-align:left\">版本<\/th><th style=\"text-align:left\">作用<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Expressive Facegen Morphs SE（EFM）<\/strong><\/td><td style=\"text-align:left\">35785<\/td><td style=\"text-align:left\">1.0.0<\/td><td style=\"text-align:left\">替换人类/精灵的<strong>角色创建 morph<\/strong>，并为 RaceMenu 增加滑杆<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Expressive Facial Animation -Male-<\/strong>（EFA-M）<\/td><td style=\"text-align:left\">19532<\/td><td style=\"text-align:left\">1.21<\/td><td style=\"text-align:left\">替换男性<strong>表情 morph<\/strong>（嘴唇/眉毛/眼睛的运动）<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Expressive Facial Animation -Female-<\/strong>（EFA-F）<\/td><td style=\"text-align:left\">19181<\/td><td style=\"text-align:left\">1.7<\/td><td style=\"text-align:left\">女性版<\/td><\/tr><\/tbody><\/table>\n<p><strong>一句话区分<\/strong>：EFM 管\"你捏出来的静态脸长什么样\"，EFA 管\"这张脸动起来什么样\"。<\/p>\n<h2>EFM<\/h2>\n<ul><li>是 <strong>ESL 插件<\/strong>：<code>Expressive Facegen Morphs.esl<\/code>。<\/li><li><strong>目标种族<\/strong>：Nord、Imperial、Breton、Redguard、Elder、High Elf、Dark Elf、Wood Elf、Dremora。<\/li><li><strong>机制<\/strong>：morph（<code>.tri<\/code>）移动目标网格顶点，既用于角色创建也用于表情。<\/li><li>新增滑杆名带连字符（如 <code>Lip-Height<\/code>），在 RaceMenu 搜索框搜 <strong><code>EFM<\/code><\/strong> 可以筛出来。<\/li><li>设计目标是<strong>平滑变形<\/strong>，复杂组合也不破网格，并保证与 EFA 兼容。<\/li><\/ul>\n<h3>EFM 的两个文件（关键）<\/h3>\n<table><thead><tr><th style=\"text-align:left\">文件<\/th><th style=\"text-align:left\">用于<\/th><th style=\"text-align:left\">说明<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">主文件 <code>Expressive Facegen Morphs<\/code><\/td><td style=\"text-align:left\"><strong>新预设<\/strong><\/td><td style=\"text-align:left\">含 CharGen + Race morphs、额外滑杆、meshes。<strong>与现有预设不兼容，装前备份脸部数据<\/strong><\/td><\/tr><tr><td style=\"text-align:left\">可选 <code>EFM - Racemenu Plugin<\/code><\/td><td style=\"text-align:left\"><strong>现有预设<\/strong><\/td><td style=\"text-align:left\">只含额外 RaceMenu 滑杆，不动既有 morph<\/td><\/tr><\/tbody><\/table>\n<p>选错文件就会得到\"预设全乱\"或\"滑杆不出现\"两种相反的结果。<\/p>\n<h2>EFA 的注意事项<\/h2>\n<ul><li><strong>EFM 的 RaceMenu 表情滑杆不受 EFA 影响<\/strong>：EFA 不引用 EFA 自己的文件，<\/li><\/ul>\n<p>角色创建时想预览表情需用控制台命令设表情（通常配 opparco mfg Command / <strong>Mfg Fix<\/strong>）。<\/p>\n<ul><li>EFA <strong>不兼容 Female Facial Animation<\/strong>（改同一批文件）。<\/li><li>EFA 针对<strong>原版头部网格<\/strong>；顶点数或顺序不同的头（<strong>如 HPH<\/strong>）需要各自的补丁。<\/li><\/ul>\n<h2>⚠️ 最重要的限制：只影响玩家<\/h2>\n<blockquote><strong>EFM 与 EFA 只影响玩家角色，不影响 NPC。<\/strong><\/blockquote>\n<p>原因在机制层面：<strong>NPC 的脸是 FaceGen 预生成网格<\/strong>，不是运行时 morph 出来的。 所以\"装了 EFM 但 NPC 脸没变\"不是 bug，是设计。<\/p>\n<h2>与 HPH 的配合<\/h2>\n<ul><li>HPH 的 FOMOD 里有 <strong>Expressive Facegen Morphs<\/strong> 选项（第 07 项）；<\/li><li>加载顺序：<strong>HPH 在前，EFM 在后<\/strong>。<\/li><\/ul>\n<h2>来源<\/h2>\n<ul><li>三个 mod 的 ID / 版本 / ESL / 目标种族 / 搜索词 / 两个文件区分：<\/li><\/ul>\n<p>作者 Nexus 用户文件页与各发布页描述 —— <strong>一手<\/strong> （<code>https://www.nexusmods.com/skyrimspecialedition/users/35150865?tab=user+files<\/code>）<\/p>\n<ul><li>\"只影响玩家、NPC 用预生成网格\"：EFM 发布页描述 —— <strong>一手<\/strong><\/li><li>\"EFM 滑杆不受 EFA 影响\"、需 Mfg Fix 设表情、与 Female Facial Animation 冲突：<\/li><\/ul>\n<p>EFM / EFA 发布页描述 —— <strong>一手<\/strong><\/p>\n<ul><li>\"HPH 需在 EFM 之前加载\"：预设包作者说明 —— <strong>社区经验<\/strong><\/li><\/ul>", "_file": "02-face/expressive-morphs.md", "_chars": 2221}, {"id": "facegen-pipeline", "title": "FaceGen 管线与 head parts", "category": "02-face", "kind": "concept", "version": "1.0.0", "updated": "2026-09-22", "tags": ["捏脸", "FaceGen", "head part", "HDPT", "tint", "导出"], "aliases": ["facegen 数据", "面部预生成", "ctrl f4", "tint mask"], "source": "https://en.uesp.net/wiki/Skyrim_Mod:Mod_File_Format/RACE", "summary": "脸部的数据模型（HDPT / RACE / NPC 记录）、FaceGen 的运行时文件路径与 CK 导出流程，以及为什么\"NPC 的脸是预生成的\"决定了整条排错思路。", "content": "<p>理解这一层，才能理解黑脸、脖缝、\"EFM 对 NPC 无效\"这些现象。<\/p>\n<h2>一、脸部在插件里的数据模型<\/h2>\n<h3>HDPT：Head Part（面部部件）<\/h3>\n<p>一个 HDPT 记录代表一类面部特征（头发、眼、胡须、疤痕…），包含：<\/p>\n<ul><li>基础模型信息；<\/li><li>按用途（<strong>chargen<\/strong> / <strong>other<\/strong>）分组的字段，各自指向一个 <code>.tri<\/code> 文件；<\/li><li>一个 FormList 给出可选部件数据（<code>NAM0<\/code> / <code>NAM1<\/code> 成对重复）。<\/li><\/ul>\n<h3>RACE：种族的 chargen 数据<\/h3>\n<p>以 <code>NAM0<\/code> 开始，按性别分成 <code>MNAM<\/code>（男）/ <code>FNAM<\/code>（女）：<\/p>\n<table><thead><tr><th style=\"text-align:left\">字段<\/th><th style=\"text-align:left\">含义<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><code>HEAD<\/code><\/td><td style=\"text-align:left\">默认 headpart（引用 HDPT）<\/td><\/tr><tr><td style=\"text-align:left\"><code>MPAI<\/code> / <code>MPAV<\/code><\/td><td style=\"text-align:left\"><strong>Morph 索引与取值<\/strong>（出现 4 次，对应<strong>鼻 / 眉 / 眼 / 唇<\/strong>）<\/td><\/tr><tr><td style=\"text-align:left\"><code>RPRM<\/code> / <code>RPRF<\/code><\/td><td style=\"text-align:left\">Race Presets（男女）<\/td><\/tr><tr><td style=\"text-align:left\"><code>AHCM<\/code> / <code>AHCF<\/code><\/td><td style=\"text-align:left\">可用发色（→ CLFM）<\/td><\/tr><tr><td style=\"text-align:left\"><code>FTSM<\/code> / <code>DFTM<\/code><\/td><td style=\"text-align:left\">Face Details / Default Face Texture（→ TXST）<\/td><\/tr><\/tbody><\/table>\n<p>Morph 的类型标志为：<code>NoseType0-31<\/code>、<code>BrowType0-20<\/code>、<code>EyesType0-38<\/code>、<code>LipType0-31<\/code>。<\/p>\n<h3>染色（tint）字段组<\/h3>\n<table><thead><tr><th style=\"text-align:left\">字段<\/th><th style=\"text-align:left\">含义<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><code>TINL<\/code><\/td><td style=\"text-align:left\">Tint Index Number<\/td><\/tr><tr><td style=\"text-align:left\"><code>TINT<\/code><\/td><td style=\"text-align:left\">tint mask 纹理路径（<code>.dds<\/code>）<\/td><\/tr><tr><td style=\"text-align:left\"><code>TINP<\/code><\/td><td style=\"text-align:left\"><strong>Mask Type<\/strong>，见下表<\/td><\/tr><tr><td style=\"text-align:left\"><code>TINC<\/code> / <code>TIND<\/code><\/td><td style=\"text-align:left\">关联的颜色预设（→ CLFM）<\/td><\/tr><tr><td style=\"text-align:left\"><code>TINV<\/code><\/td><td style=\"text-align:left\">默认值（float）<\/td><\/tr><\/tbody><\/table>\n<p><code>TINP<\/code> 的取值表：<\/p>\n<pre class=\"code\"><code>1=Lip Color   2=Cheek Color   3=Eyeliner       4=EyeSocket Upper\n5=EyeSocket Lower  6=Skin Tone   7=Paint       8=Laugh Lines\n9=Cheek Color Lower  10=Nose    11=Chin        12=Neck\n13=Forehead   14=Dirt<\/code><\/pre>\n<h3>NPC：脸上的部件与色层<\/h3>\n<ul><li><code>PNAM<\/code> = Head Parts（头发、眼、疤痕…）<\/li><li><code>HCLF<\/code> = Hair Color<\/li><li>面部染色层子记录：<code>TINI<\/code> / <code>TINC<\/code> / <code>TINV<\/code> / <code>TIRS<\/code>，以及第二套 <code>TINT<\/code> / <code>TINP<\/code> / <code>TIND<\/code>（枚举 1–69）<\/li><\/ul>\n<h2>二、运行时文件路径<\/h2>\n<table><thead><tr><th style=\"text-align:left\">内容<\/th><th style=\"text-align:left\">路径<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">头网格<\/td><td style=\"text-align:left\"><code>Meshes\\Actors\\Character\\FaceGenData\\FaceGeom\\&lt;插件名&gt;\\&lt;FormID&gt;.nif<\/code><\/td><\/tr><tr><td style=\"text-align:left\">头色调<\/td><td style=\"text-align:left\"><code>Textures\\Actors\\Character\\FaceGenData\\FaceTint\\&lt;插件名&gt;\\&lt;FormID&gt;.dds<\/code>（另有一份 <code>.tga<\/code> 供 LOD 用）<\/td><\/tr><tr><td style=\"text-align:left\">原版 tint mask 源<\/td><td style=\"text-align:left\"><code>Textures\\Actors\\Character\\Character Assets\\tintmasks\\<\/code><\/td><\/tr><\/tbody><\/table>\n<p><strong>注意路径里的 <code>&lt;插件名&gt;<\/code><\/strong> —— 黑脸的本质就是\"这个目录里的数据\"与\"插件记录里的 head parts\"对不上。<\/p>\n<h2>三、CK 导出流程（<code>Ctrl+F4<\/code>）<\/h2>\n<ol><li>在 Creation Kit 里加载相关插件（需要 <code>CreationKit.ini<\/code> 允许加载多个 master）；<\/li><li><strong>不要用搜索框选 Actor<\/strong>，要在 Object Window 的 Actors 子树里<strong>直接点中<\/strong>目标 NPC；<\/li><li>按 <strong><code>Ctrl+F4<\/code><\/strong> 导出，生成上面两个目录下的 <code>.nif<\/code> 与 <code>.dds<\/code>。<\/li><\/ol>\n<blockquote><strong>导出前的一个技巧（社区经验）<\/strong>：如果你的 tintmask 曾经被改过，先临时把 <code>Textures\\Actors\\Character\\Character Assets\\tintmasks<\/code> 改名/移走， 否则会\"污染\"导出结果（表现为紫、红、额头条纹）。导完再改回。<\/blockquote>\n<h2>四、做自定义随从的脸<\/h2>\n<ol><li>在 RaceMenu 捏好脸 → Sculpt 页 <strong>F5 Export head<\/strong> →<\/li><\/ol>\n<p><code>Data\\SKSE\\Plugins\\CharGen\\&lt;name&gt;.nif<\/code> 与 <code>.dds<\/code>；<\/p>\n<ol><li>把 <code>.dds<\/code> 复制到 <code>FaceTint\\&lt;你的 esp&gt;\\<\/code> 并<strong>重命名为该 NPC 的 BaseID<\/strong><\/li><\/ol>\n<p>（前两位补 0，例如 <code>0001C197.dds<\/code>）；<\/p>\n<ol><li>若改过肤色，还要在 CK 的 Character Gen Parts → <strong>Face Tinting Color<\/strong> 填上对应 RGB。<\/li><\/ol>\n<h2>五、官方 Papyrus 接口<\/h2>\n<p>Creation Kit wiki 的 <strong>HeadPart Script<\/strong> 明确标注 <em>\"This type requires SKSE\"<\/em>，继承 <code>Form<\/code>：<\/p>\n<table><thead><tr><th style=\"text-align:left\">类型<\/th><th style=\"text-align:left\">函数<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">SKSE Global<\/td><td style=\"text-align:left\"><code>HeadPart GetHeadPart(String name)<\/code><\/td><\/tr><tr><td style=\"text-align:left\">SKSE Member<\/td><td style=\"text-align:left\"><code>Int GetType()<\/code>、<code>Int GetNumExtraParts()<\/code>、<code>HeadPart GetNthExtraPart(Int n)<\/code>、<code>Bool HasExtraPart(HeadPart part)<\/code>、<code>Int GetIndexOfExtraPart(HeadPart part)<\/code>（非 extra 返回 <code>-1<\/code>）、<code>FormList GetValidRaces()<\/code>、<code>SetValidRaces(FormList races)<\/code><\/td><\/tr><\/tbody><\/table>\n<p>CK wiki 示例里还出现 <code>Player.GetNthHeadPart(0).GetType()<\/code>， 说明 Actor 侧有 <code>GetNthHeadPart<\/code> / <code>SetNthHeadPart<\/code>（<strong>该函数页未单独确认，标注为\"示例引用\"<\/strong>）。<\/p>\n<blockquote><strong>澄清<\/strong>：<code>showracemenu<\/code> 与 <code>setnpcweight<\/code> 是<strong>引擎/控制台命令<\/strong>，不是 Papyrus 函数。 提到\"chargen 的脚本接口\"时，指的其实是上面这组 HeadPart Script。<\/blockquote>\n<h2>来源<\/h2>\n<ul><li>HDPT / RACE / NPC 的字段与 <code>TINP<\/code> 枚举：UESP「Skyrim Mod:Mod File Format」——<\/li><\/ul>\n<p><strong>一手（官方 wiki 原文，本节由 MediaWiki API 抓取）<\/strong> <code>https://en.uesp.net/wiki/Skyrim_Mod:Mod_File_Format/HDPT<\/code>、<code>/RACE<\/code>、<code>/NPC<\/code><\/p>\n<ul><li>HeadPart 对象字段与 HeadPart Script：Creation Kit wiki —— <strong>一手<\/strong><\/li><\/ul>\n<p><code>https://ck.uesp.net/wiki/HeadPart<\/code>、<code>https://ck.uesp.net/wiki/HeadPart_Script<\/code><\/p>\n<ul><li>FaceGen 路径与 <code>Ctrl+F4<\/code> 流程：Creation Kit wiki / UESP + Nexus 论坛被广泛引用的答复 —— <strong>一手路径 + 社区流程<\/strong><\/li><li>tintmask 改名技巧、F5 导出与 BaseID 命名：<strong>社区经验（Nexus 论坛 / LoversLab）<\/strong><\/li><li><code>GetNthHeadPart<\/code> / <code>SetNthHeadPart<\/code>：<strong>未单独确认函数页，仅见于 CK wiki 示例<\/strong><\/li><\/ul>", "_file": "02-face/facegen-pipeline.md", "_chars": 3842}, {"id": "high-poly-head", "title": "High Poly Head（高模头部）", "category": "02-face", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["捏脸", "高模头", "HPH", "脸部网格"], "aliases": ["high poly head", "高模头部", "klf", "头部网格"], "source": "https://vectorplexus.com/files/file/283-high-poly-head/", "summary": "高模头的作者、分发渠道、与 RaceMenu 的配合方式、以及 NPC 使用它必须重导 FaceGen 的流程与已知坑。", "content": "<p>作者 <strong>KouLeifoh<\/strong>（缩写 <strong>KLF<\/strong>），版本 <strong>1.4<\/strong>。<\/p>\n<blockquote><strong>别把它认成 KS Hairdos 的作者 Kalilies。<\/strong> KLF = KouLei<strong>f<\/strong>oh。这个名字在多个 mod 的 credits 里以 \"KLF's High Poly Head\" 形式出现，是同一人。<\/blockquote>\n<h2>分发渠道（重要）<\/h2>\n<p><strong>本体不在 Nexus。<\/strong> 官方源是 <strong>Vector Plexus<\/strong>：<code>https://vectorplexus.com/files/file/283-high-poly-head/<\/code> Nexus 上只有<strong>各类补丁与镜像<\/strong>，例如：<\/p>\n<table><thead><tr><th style=\"text-align:left\">mod<\/th><th style=\"text-align:left\">Nexus<\/th><th style=\"text-align:left\">性质<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">High Poly Head For Custom Races<\/td><td style=\"text-align:left\">43098<\/td><td style=\"text-align:left\">补丁<\/td><\/tr><tr><td style=\"text-align:left\">Brows by Hvergelmir for High Poly Head - COTR - UBE<\/td><td style=\"text-align:left\">63777<\/td><td style=\"text-align:left\">眉毛适配补丁<\/td><\/tr><tr><td style=\"text-align:left\">Alternate High Poly Head<\/td><td style=\"text-align:left\">148541<\/td><td style=\"text-align:left\">镜像，其 credits 明写 KouLeifoh 为原作者<\/td><\/tr><\/tbody><\/table>\n<blockquote>社区有\"Vector Plexus 原域名失效\"的说法 —— <strong>未确认<\/strong>。 稳妥的备用来源是 <strong>Wabbajack 白名单里作者备份的 Google Drive 链接<\/strong>。<\/blockquote>\n<h2>它是什么<\/h2>\n<p>基于<strong>原版头部网格<\/strong>的高模男女头部，并附带<strong>互补的高模 brows / beards / scars / hair<\/strong> 以适配新头型。 它提供 RaceMenu 扩展滑杆所需的 morph，并<strong>兼容基于原版头部的纹理<\/strong>。<\/p>\n<h2>与 RaceMenu 的关系<\/h2>\n<p><strong>硬前置是 RaceMenu。<\/strong> 使用方式是：<\/p>\n<blockquote>在 RaceMenu 里到 <strong>Face Part<\/strong> 滑杆 / Head 页，把头部部件<strong>切换为高模头<\/strong>。<\/blockquote>\n<p><strong>它不是自动生效的。<\/strong> 这是\"装了 HPH 但没效果\"的最常见原因。<\/p>\n<h2>NPC 要用 HPH：必须重导 FaceGen<\/h2>\n<p>NPC 的头是<strong>预生成<\/strong>的（见 <a href=\"facegen-pipeline.md\" target=\"_blank\" rel=\"noopener\"><code>facegen-pipeline.md<\/code><\/a>），所以要让 NPC 用 HPH：<\/p>\n<ol><li>让 HPH 成为该 NPC 所在插件的 <strong>master<\/strong>；<\/li><li>把 NPC 的原版 head parts 替换为 HPH 部件；<\/li><li>在 Creation Kit 里选中该 NPC → <strong><code>Ctrl+F4<\/code><\/strong> 重新导出 FaceGen。<\/li><\/ol>\n<blockquote><strong>限制<\/strong>：对 <strong>sculpted head mesh（带雕塑几何的头）无效<\/strong> —— 只能对已导出的静态头网格替换。<\/blockquote>\n<h2>与 ECE 的关系<\/h2>\n<p><strong>HPH 不兼容 ECE。<\/strong> 两者都改头部网格，方向冲突。 社区共识是\"装了 HPH 就不要装 ECE，ECE 自带的平滑功能用不上了\"。 另外 <strong>ECE、RaceMenu、EFM 三者用不同的种族 morph<\/strong>，基础脸型不同，<strong>预设不能简单互通<\/strong>。<\/p>\n<h2>安装选项与坑<\/h2>\n<p>FOMOD 里常见的可选项（节选，来自镜像站对 1.4 安装项的转述）：<\/p>\n<pre class=\"code\"><code>00 Base（必选）\n01 Loose files for FaceGen in CK        在 CK 里导 FaceGen 需要\n02 no Dawnguard DLC\n03 vampire head fix\n04 remove sunken vampire face morphs\n05 symmetrical eye sockets (female)\n06 Aesthetic Elves\n07 Expressive Facegen Morphs            与 EFM 配套\n08/09 EFA Male / EFA Female\n10 High Poly Vanilla Hair<\/code><\/pre>\n<p><strong>社区记录过的坑<\/strong>：<\/p>\n<table><thead><tr><th style=\"text-align:left\">现象<\/th><th style=\"text-align:left\">处理<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">头部变黑/变暗<\/td><td style=\"text-align:left\">改一下 player weight，强制刷新皮肤着色器<\/td><\/tr><tr><td style=\"text-align:left\">眼睛闪烁或渲染异常<\/td><td style=\"text-align:left\">关闭 RaceMenu 再重开<\/td><\/tr><tr><td style=\"text-align:left\">切到吸血鬼种族后头被重置<\/td><td style=\"text-align:left\">用 vampire head fix 选项<\/td><\/tr><tr><td style=\"text-align:left\">与原版部分头发轻微穿模<\/td><td style=\"text-align:left\">已知问题<\/td><\/tr><tr><td style=\"text-align:left\">SE 下眼睛/疤痕偏暗<\/td><td style=\"text-align:left\">同上，改 weight 通常可解<\/td><\/tr><\/tbody><\/table>\n<p>配套补丁常见：High Poly Head UV Stretch Fix（脖缝）、Bone Weight Fix、 Vanilla Presets Fix、Brows for HPH、LDD Better Eye Shape for HPH。<\/p>\n<h2>加载顺序<\/h2>\n<p><strong>HPH 要排在 Expressive Facegen Morphs 之前<\/strong> —— 这是预设包作者给出的经验顺序 （社区经验，但与常见排序实践一致）。<\/p>\n<h2>来源<\/h2>\n<ul><li>作者归属（KouLeifoh / KLF）：Alternate High Poly Head 的 credits 与 PC Gamer 署名 —— <strong>一手（credits）+ 二手（媒体）<\/strong><\/li><li>原站与版本 1.4：<code>https://vectorplexus.com/files/file/283-high-poly-head/<\/code> —— <strong>一手<\/strong><\/li><li>前置 RaceMenu、Face Part 切换、含互补高模部件、兼容原版纹理：<strong>一手（发布页描述）<\/strong><\/li><li>NPC 需 CK <code>Ctrl+F4<\/code> 重导、对 sculpted head 无效、FOMOD 选项：<strong>社区经验（Nexus 论坛 / 镜像站转述安装项）<\/strong><\/li><li>安装坑（变黑/闪烁/穿模/吸血鬼重置）：<strong>社区经验（Nexus 论坛、GameMale、tesgeneral）<\/strong><\/li><li>\"HPH 不兼容 ECE\"、\"ECE/RaceMenu/EFM 用不同种族 morph\"：<strong>社区经验（指南与搬运帖）<\/strong><\/li><li>加载顺序 HPH 先于 EFM：<strong>社区经验（预设包说明）<\/strong><\/li><\/ul>", "_file": "02-face/high-poly-head.md", "_chars": 2952}, {"id": "racemenu", "title": "RaceMenu（捏脸核心）", "category": "02-face", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["捏脸", "RaceMenu", "滑块", "CharGen", "NiOverride"], "aliases": ["rm", "捏脸工具", "捏脸界面", "showracemenu", "skee", "滑块界面"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/19080", "summary": "RaceMenu 的功能、前置、morph 与雕塑机制、控制台命令、内置补光与高分辨率战纹设置，并澄清它不依赖 PapyrusUtil。", "content": "<p>作者 <strong>expired6978<\/strong>。Nexus SE 版：<code>https://www.nexusmods.com/skyrimspecialedition/mods/19080<\/code> （LE 旧版：<code>mods/29624<\/code>，末版 3.4.5）。<\/p>\n<p>它把原版那个简陋的捏脸界面换成<strong>可搜索、可分类、有数值、能存预设、能编辑 NPC<\/strong> 的完整工具， 是整个捏脸生态的地基。<\/p>\n<h2>前置<\/h2>\n<p><strong>只要求 SKSE64。<\/strong> 主文件对应 SKSE64 <strong>2.2.6<\/strong>（AE 1.6.1170）。<\/p>\n<ul><li>RaceMenu <strong>不依赖 PapyrusUtil<\/strong>（常见误传，见<\/li><\/ul>\n<p><a href=\"../01-prerequisites/skse-plugin-frameworks.md\" target=\"_blank\" rel=\"noopener\"><code>../01-prerequisites/skse-plugin-frameworks.md<\/code><\/a>）。<\/p>\n<ul><li>从 <strong>2.7<\/strong> 起 <strong>CharGen Extension 已完全并入本体<\/strong>。作者 FAQ 原文意思：<\/li><\/ul>\n<p>如果你之前单独装过 CharGen Extension，<strong>应当卸载<\/strong>。<\/p>\n<ul><li>与本体内置模块重复的散装脚本应删除：<\/li><\/ul>\n<p><code>CharGen.pex<\/code> / <code>NiOverride.pex<\/code> / <code>RaceMenu.pex<\/code> / <code>RaceMenuBase.pex<\/code> / <code>RaceMenuLoad.pex<\/code> / <code>RaceMenuPlugin.pex<\/code>。<\/p>\n<h2>它内部是什么<\/h2>\n<p>RaceMenu 的主体是 SKSE 插件 <strong><code>skee64.dll<\/code><\/strong>，内含两个模块：<\/p>\n<table><thead><tr><th style=\"text-align:left\">模块<\/th><th style=\"text-align:left\">作用<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>CharGen<\/strong><\/td><td style=\"text-align:left\">角色创建界面本身（滑块、分类、搜索、雕塑）<\/td><\/tr><tr><td style=\"text-align:left\"><strong>NiOverride<\/strong><\/td><td style=\"text-align:left\">运行时叠加机制：应用 morph、纹理覆盖（overlay）、着色<\/td><\/tr><\/tbody><\/table>\n<p>源码在作者的合集仓库里：<code>https://github.com/expired6978/SKSE64Plugins<\/code>（子目录 <code>skee64<\/code>）。 提交记录中可见 \"Update to 1.6.1170\"、\"Update RM to 1.7.99\" 等 —— <strong>这是核版本对应关系的一手材料<\/strong>。<\/p>\n<h2>滑块是怎么来的<\/h2>\n<p>滑块本质是 morph 开关，而 morph 数据来自 <code>.tri<\/code> 文件（由 <strong>BodySlide 勾 <code>Build Morphs<\/code><\/strong> 生成）。 所以\"RaceMenu 里没有身形滑块\"通常不是 RaceMenu 的问题，而是<strong>没有构建 morph<\/strong>。 机制详见 <a href=\"../00-overview/morph-and-nif-basics.md\" target=\"_blank\" rel=\"noopener\"><code>../00-overview/morph-and-nif-basics.md<\/code><\/a>。<\/p>\n<p>界面上的改进包括：SkyUI 风格分类、<strong>搜索过滤<\/strong>、AARRGGBB 着色、数值显示、相机移动。<\/p>\n<h2>雕塑（Sculpt）<\/h2>\n<p>顶点级编辑，适合滑块的线性叠加做不出的细节：<\/p>\n<table><thead><tr><th style=\"text-align:left\">工具<\/th><th style=\"text-align:left\">用途<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Inflate / Deflate<\/td><td style=\"text-align:left\">沿法线鼓起或凹陷<\/td><\/tr><tr><td style=\"text-align:left\">Smooth<\/td><td style=\"text-align:left\">平滑<\/td><\/tr><tr><td style=\"text-align:left\">Move<\/td><td style=\"text-align:left\">拖拽顶点<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Mask<\/strong><\/td><td style=\"text-align:left\">限定编辑区域（<strong>不影响导出<\/strong>，仅作为编辑辅助）<\/td><\/tr><tr><td style=\"text-align:left\">History<\/td><td style=\"text-align:left\">撤销历史<\/td><\/tr><tr><td style=\"text-align:left\">Clear Sculpt<\/td><td style=\"text-align:left\">清空雕塑<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Import Geometry<\/strong><\/td><td style=\"text-align:left\">导入雕塑几何（配合预设的 <code>.nif<\/code>）<\/td><\/tr><\/tbody><\/table>\n<h2>内置补光（不是 facelight mod）<\/h2>\n<p>RaceMenu.esp 自带 <strong>Light On/Off<\/strong>：在角色正前方生成白色光源， 仅用于<strong>捏脸界面内看清脸部<\/strong>。它不是独立的脸部照明 mod，出了菜单就没有。 需要常驻补光看 <a href=\"facelight.md\" target=\"_blank\" rel=\"noopener\"><code>facelight.md<\/code><\/a>。<\/p>\n<h2>高分辨率战纹<\/h2>\n<p>面部纹身/战纹默认 256，可在 <code>Data/SKSE/SKSE.ini<\/code> 加：<\/p>\n<pre class=\"code\"><code>[Display]\niTintTextureResolution=2048<\/code><\/pre>\n<h2>控制台命令（<code>skee<\/code>，0.4.13+）<\/h2>\n<pre class=\"code\"><code>skee reload tints                      重新加载 tint 数据\nskee erase bodymorph|transforms|sculpt|overlays\nskee erase bodymorph-cache\nskee preset-save PATH                  导出到 Data/SKSE/Plugins/CharGen/Exported/PATH.jslot\nskee preset-load PATH\nskee dump bodymorph|transforms|itemdata<\/code><\/pre>\n<h2>其它值得知道的细节<\/h2>\n<ul><li><strong>预设改成了 JSON<\/strong>：<code>.jslot<\/code> 文件，旧二进制 <code>.slot<\/code> 仍可读但不再被写出。见<\/li><\/ul>\n<p><a href=\"racemenu-presets.md\" target=\"_blank\" rel=\"noopener\"><code>racemenu-presets.md<\/code><\/a>。<\/p>\n<ul><li><strong>与 ECE 的关系<\/strong>：基本可共存（先装 ECE 再装 RaceMenu），但<strong>预设不互通<\/strong>，且不建议两者同用。<\/li><\/ul>\n<p>作者提供 CharGen Export 作为 ECE → RaceMenu 的迁移途径。<\/p>\n<ul><li><strong>overlay NIF 的位置<\/strong>：某些游戏版本更新后，旧的 overlay NIF 会引发崩溃。<\/li><\/ul>\n<p>作者提示删除本地这些文件（由新版 BSA 提供）： <code>Data\\Meshes\\Actors\\Character\\Character Assets\\<\/code> 下的 <code>face_overlay.nif<\/code> / <code>body_overlay.nif<\/code> / <code>hands_overlay.nif<\/code> / <code>feet_overlay.nif<\/code> 以及对应的 <code>*_magicoverlay.nif<\/code>。<\/p>\n<ul><li><strong>部件标签（0.4.20.0 新增）<\/strong>：可为部件打标签供搜索，<\/li><\/ul>\n<p>路径 <code>Data/SKSE/Plugins/CharGen/Tags/&lt;MODNAME&gt;/parts.json<\/code> 与 <code>tags.json<\/code>； 类型映射为 <strong>Face=1, Eyes=2, Hair=3, Beard=4, Scar=5, Brow=6<\/strong>。<\/p>\n<h2>来源<\/h2>\n<ul><li>RaceMenu Nexus 发布页（前置、ChGen 并入、JSON 预设、skee 命令、Sculpt、补光、tint 分辨率）—— <strong>一手<\/strong><\/li><li>RaceMenu Files 页与 changelog（0.4.19.16 = 1.6.1170；0.4.20.0）—— <strong>一手<\/strong><\/li><li>GitHub <code>expired6978/SKSE64Plugins<\/code>（<code>skee64<\/code> 源码与提交记录）—— <strong>一手<\/strong><\/li><li>作者 Nexus 帖（overlay NIF 警告、CommonLibSSE-NG 迁移计划）—— <strong>一手（但计划部分属\"未发布\"，标为未确认）<\/strong><\/li><\/ul>", "_file": "02-face/racemenu.md", "_chars": 3375}, {"id": "face-headparts-resources", "title": "眼、眉、发、须资源现状", "category": "02-face", "kind": "reference", "version": "1.0.0", "updated": "2026-09-22", "tags": ["捏脸", "眼睛", "眉毛", "头发", "胡须", "资源"], "aliases": ["eyes of beauty", "brows", "ks hairdos", "apachii", "beards", "发型包", "眼睛 mod"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/16185", "summary": "捏脸最常用的四类外观资源（眼/眉/发/须）的代表 mod、Nexus ID、版本口径与 HPH 兼容补丁，并澄清 SE 版与 LE 版的版本号体系差异。", "content": "<p>这些是\"脸的配件\"：不装也能捏脸，但装了才好看。它们的共同坑是 <strong>与 High Poly Head 的适配<\/strong>——HPH 换了头型，眉毛和胡须要专门的补丁。<\/p>\n<h2>眼睛<\/h2>\n<table><thead><tr><th style=\"text-align:left\">mod<\/th><th style=\"text-align:left\">Nexus<\/th><th style=\"text-align:left\">作者<\/th><th style=\"text-align:left\">说明<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>The Eyes of Beauty SSE<\/strong><\/td><td style=\"text-align:left\">16185<\/td><td style=\"text-align:left\">LogRaam（Gabriel Mailhot），docteure 上传<\/td><td style=\"text-align:left\">官方授权 SE 移植，<strong>版本 1.2<\/strong>（2020-08）<\/td><\/tr><tr><td style=\"text-align:left\">Mikan Eyes<\/td><td style=\"text-align:left\">18780<\/td><td style=\"text-align:left\">nerune<\/td><td style=\"text-align:left\">常见预设软依赖<\/td><\/tr><tr><td style=\"text-align:left\">The Witcher 3 Eyes<\/td><td style=\"text-align:left\">—<\/td><td style=\"text-align:left\">Oaristys<\/td><td style=\"text-align:left\">—<\/td><\/tr><tr><td style=\"text-align:left\">Improved Eyes Skyrim<\/td><td style=\"text-align:left\">—<\/td><td style=\"text-align:left\">—<\/td><td style=\"text-align:left\">—<\/td><\/tr><\/tbody><\/table>\n<p><strong>The Eyes of Beauty 的版本号陷阱<\/strong>：<\/p>\n<blockquote>中文镜像站上看到的 <strong>\"version 10.0.1\" 是 LE 原版的版本号体系<\/strong>。 <strong>SE 官方移植是 1.2。<\/strong> 这两个数字不是一回事，别混。<\/blockquote>\n<p>它按 Player 包 / NPC 包 / Dawnguard（吸血鬼眼）包分开，可单装可组合， 含人类、亚龙人、精灵、虎人、兽人的异色瞳。<\/p>\n<h2>眉毛<\/h2>\n<p><strong>Hvergelmir's Aesthetic 系列<\/strong>（作者 Hvergelmir，上传 lthot）：<\/p>\n<ul><li>Nexus SE <strong>1062<\/strong>；LE 版 30411。<\/li><li>版本口径有 <strong>4.0.1 / 4.1.0<\/strong> 两种记录（<strong>未确认唯一最新值<\/strong>）。<\/li><li>提供 Ultra(2048×1024) / High(1024×512) / Low(512×256) 三档。<\/li><li>可选 <code>.esp<\/code> 增加更多手绘眉型（含深浅色匹配发色）。<\/li><\/ul>\n<p><strong>HPH 兼容<\/strong>：Brows 与 HPH 属\"半兼容\"——不崩溃但眉形略歪，需要补丁：<\/p>\n<table><thead><tr><th style=\"text-align:left\">补丁<\/th><th style=\"text-align:left\">Nexus<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Brows by Hvergelmir for High Poly Head<\/td><td style=\"text-align:left\">38493<\/td><\/tr><tr><td style=\"text-align:left\">同款 - COTR - UBE 版（v2.1.0，含 Headpart Whitelist 与隐藏原版眉的 <code>Brows - Non-playable.esp<\/code>）<\/td><td style=\"text-align:left\">63777<\/td><\/tr><\/tbody><\/table>\n<p>其它：Maevan2's Eyebrows（SE 26881，Shiva182 移植）、Kalilies Brows。<\/p>\n<h2>头发<\/h2>\n<table><thead><tr><th style=\"text-align:left\">mod<\/th><th style=\"text-align:left\">Nexus<\/th><th style=\"text-align:left\">作者<\/th><th style=\"text-align:left\">说明<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>KS Hairdos SSE<\/strong><\/td><td style=\"text-align:left\">6817<\/td><td style=\"text-align:left\">Kalilies &amp; Stealthic<\/td><td style=\"text-align:left\">老牌大型发型包，<strong>约 980+ 款<\/strong>（约 876 女 / 107 男）<\/td><\/tr><tr><td style=\"text-align:left\"><strong>ApachiiSkyHair SSE<\/strong><\/td><td style=\"text-align:left\">2014<\/td><td style=\"text-align:left\">apachii<\/td><td style=\"text-align:left\">量最大，含 Males / Females 分文件；纹理偏旧，常有重纹理补丁<\/td><\/tr><tr><td style=\"text-align:left\">Vanilla Hair Replacer (VHR)<\/td><td style=\"text-align:left\">—<\/td><td style=\"text-align:left\">preeum<\/td><td style=\"text-align:left\">替换原版发型；与 Face Discoloration Fix 有协同<\/td><\/tr><\/tbody><\/table>\n<p>KS Hairdos 生态衍生：<strong>KS Hairdos - HDT SMP<\/strong>（物理版，SE 31300）、 KS Hairdos 1.7 Salt and Wind（重纹理）、SC - KS Hairdos Retextured、 KS Hairdos Male Scalp Fix、LDD - KS Male Hairstyle Tweaks。<\/p>\n<blockquote><strong>KS 发型数量的口径差异<\/strong>：983（876F/107M）与 883（792F/91M）两种说法都存在， 取决于版本。写入笔记时统一说\"<strong>约 980+<\/strong>\"更稳。<\/blockquote>\n<h2>胡须<\/h2>\n<table><thead><tr><th style=\"text-align:left\">mod<\/th><th style=\"text-align:left\">Nexus<\/th><th style=\"text-align:left\">作者<\/th><th style=\"text-align:left\">说明<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Beards（Aesthetic 系列）<\/strong><\/td><td style=\"text-align:left\">1067<\/td><td style=\"text-align:left\">Hvergelmir（上传 lthot）<\/td><td style=\"text-align:left\">版本 <strong>5.0.1<\/strong>；5.0 用 BC7 <code>.dds<\/code> 重做全部纹理与法线，5.0.1 修 FOMOD 路径错误<\/td><\/tr><tr><td style=\"text-align:left\">Beards of Power<\/td><td style=\"text-align:left\">42635<\/td><td style=\"text-align:left\">Mharlek1<\/td><td style=\"text-align:left\">另一套胡须美化<\/td><\/tr><\/tbody><\/table>\n<p>APACHII 与 Beards 系列的取向不同：前者补量，后者补质（并复原了 Bethesda 砍掉的辫/串珠款）。<\/p>\n<h2>使用建议<\/h2>\n<ol><li><strong>先确定身形家族<\/strong>（见 <a href=\"../03-body/cbbe.md\" target=\"_blank\" rel=\"noopener\"><code>../03-body/<\/code><\/a>），再统一挑选配套皮肤；<\/li><li>装了 HPH 就<strong>同时装对应的眉毛/胡须补丁<\/strong>，否则会出现\"眉歪\"\"须悬空\"；<\/li><li>资源装得越多，<strong>FaceGen 缓存与头部件索引的负担越重<\/strong> —— 装到上百个发型时，<\/li><\/ol>\n<p>留意是否有专门的 FaceGen 缓存处理需求。<\/p>\n<h2>来源<\/h2>\n<ul><li>The Eyes of Beauty SSE：<code>https://www.nexusmods.com/skyrimspecialedition/mods/16185<\/code>，版本 1.2 为 SE 移植 —— <strong>一手<\/strong><\/li><li>Brows：<code>https://www.nexusmods.com/skyrimspecialedition/mods/1062<\/code>；<\/li><\/ul>\n<p>补丁 38493 / 63777 —— <strong>一手（Nexus 页面）<\/strong><\/p>\n<ul><li>KS Hairdos SSE：<code>https://www.nexusmods.com/skyrimspecialedition/mods/6817<\/code> —— <strong>一手<\/strong><\/li><li>ApachiiSkyHair SSE：<code>https://www.nexusmods.com/skyrimspecialedition/mods/2014<\/code> —— <strong>一手<\/strong><\/li><li>Beards：<code>https://www.nexusmods.com/skyrimspecialedition/mods/1067<\/code> —— <strong>一手<\/strong><\/li><li>版本号的多口径（Brows 4.0.1/4.1.0、KS 983/883）：<strong>多来源口径不一致，已标注\"未确认唯一最新值\"<\/strong><\/li><li>\"SE 1.2 vs LE 10.x 版本体系不同\"：<strong>本工作区在撰条目时交叉核对得出，属辨析结论<\/strong><\/li><\/ul>", "_file": "02-face/face-headparts-resources.md", "_chars": 3122}, {"id": "face-textures", "title": "脸部皮肤与纹理", "category": "02-face", "kind": "reference", "version": "1.0.0", "updated": "2026-09-22", "tags": ["捏脸", "皮肤", "纹理", "贴图", "UV"], "aliases": ["脸皮", "skin texture", "fair skin", "皮肤贴图", "脖子接缝原因"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/798", "summary": "脸部/身体皮肤贴图的选择原则，以及\"皮肤必须与身形同族\"这条硬约束——它是脖缝与手脚接缝的第一大成因。", "content": "<h2>一条硬约束：皮肤 UV 必须与身形同族<\/h2>\n<p><strong>这是本领域最容易被忽略、又最容易造成视觉缺陷的一条规则。<\/strong><\/p>\n<ul><li><strong>CBBE 有自己的 UV 映射<\/strong>，UNP 系有另一套；<\/li><li>为 CBBE 制作的皮肤贴图<strong>不能<\/strong>直接用在 UNP / BHUNP 上，反之亦然；<\/li><li>错配的表现是<strong>手、颈、脚出现接缝<\/strong>，或者纹理错位。<\/li><\/ul>\n<p>所以\"选皮肤\"这件事，在\"选身形\"之后就已经被限定了一半。<\/p>\n<h2>头部与身体要用同一套<\/h2>\n<p>不只是身形家族内部要一致，<strong>头、手、身体必须来自同一套皮肤的同一种选项<\/strong>：<\/p>\n<ul><li>一个皮肤 mod 的 FOMOD 里如果分了 12 个部件选项，就要<strong>全部选同一档<\/strong>；<\/li><li>混搭不同档位（比如头用 High、身体用 Low，或头用 A 皮肤的 complexion、身体用 B 皮肤的）<\/li><\/ul>\n<p>是脖缝的第二大成因。<\/p>\n<p>脖子接缝的完整排查见 <a href=\"../06-troubleshooting/neck-seam.md\" target=\"_blank\" rel=\"noopener\"><code>../06-troubleshooting/neck-seam.md<\/code><\/a>。<\/p>\n<h2>常见皮肤 mod<\/h2>\n<table><thead><tr><th style=\"text-align:left\">mod<\/th><th style=\"text-align:left\">Nexus<\/th><th style=\"text-align:left\">备注<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Fair Skin Complexion<\/strong><\/td><td style=\"text-align:left\">798<\/td><td style=\"text-align:left\">女性脸/身贴图，提供 <strong>CBBE 与 UNP 两种选项<\/strong>；CBBE 装完后的常见推荐<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Tempered Skins for Males<\/strong><\/td><td style=\"text-align:left\">—<\/td><td style=\"text-align:left\">男性皮肤的代表，配男性身形<\/td><\/tr><tr><td style=\"text-align:left\">其它常被点名的<\/td><td style=\"text-align:left\">—<\/td><td style=\"text-align:left\">Mature、Leyenda、Diamond、The Pure、BnP (Female/Male Skin)、Demoniac 等<\/td><\/tr><\/tbody><\/table>\n<blockquote>⚠️ \"最主流的皮肤清单\"会随时期变化，<strong>不宜写死<\/strong>。 上面除 Fair Skin 外的一批名字来自 Nexus 论坛的皮肤讨论帖 —— <strong>社区经验<\/strong>。<\/blockquote>\n<h2>与其它层的交叉<\/h2>\n<table><thead><tr><th style=\"text-align:left\">交叉点<\/th><th style=\"text-align:left\">说明<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">与身形<\/td><td style=\"text-align:left\">必须同族（见上）<\/td><\/tr><tr><td style=\"text-align:left\">与 High Poly Head<\/td><td style=\"text-align:left\">HPH <strong>兼容基于原版头部的纹理<\/strong>，不需要专门为 HPH 找皮肤<\/td><\/tr><tr><td style=\"text-align:left\">与 tint mask<\/td><td style=\"text-align:left\">皮肤是\"底\"，tint mask 是\"上层着色\"。改肤色后要在 CK 里同步 Face Tinting Color<\/td><\/tr><tr><td style=\"text-align:left\">与 RaceMenu 预设<\/td><td style=\"text-align:left\">预设里的 <code>skinOverrides<\/code> 与皮肤相关，缺失会导致油光类 bug<\/td><\/tr><\/tbody><\/table>\n<h2>选择建议<\/h2>\n<ol><li>先定身形家族（CBBE 或 UNP 系）；<\/li><li>在该家族里挑皮肤，<strong>CBBE 皮肤配 CBBE 身形，UNP 皮肤配 UNP 身形<\/strong>；<\/li><li>头/手/身体选项保持同档；<\/li><li>换皮肤后如果出现脖缝，先怀疑是不是头身不同源，而不是去做\"脖缝修补 mod\"。<\/li><\/ol>\n<blockquote><strong>提醒<\/strong>：脖缝修补类 mod 是<strong>创可贴<\/strong>，不解决根因。真正的解法是让头颈贴图同源。<\/blockquote>\n<h2>来源<\/h2>\n<ul><li>Fair Skin Complexion：<code>https://www.nexusmods.com/skyrimspecialedition/mods/798<\/code> —— <strong>一手<\/strong><\/li><li>\"CBBE 与 UNP 的 UV 不通用\"：Nexus 发布页描述 + 社区一致确认 —— <strong>一手 + 社区经验（一致）<\/strong><\/li><li>头/手/身体需同一套同一档：脖子接缝排查帖（Nexus 论坛 / LoversLab）—— <strong>社区经验<\/strong><\/li><li>皮肤清单中的非 Fair Skin 项：Nexus 论坛 BHUNP 皮肤讨论 —— <strong>社区经验，随时期变化<\/strong><\/li><li>HPH 兼容原版头部纹理：HPH 发布页描述 —— <strong>一手<\/strong><\/li><\/ul>", "_file": "02-face/face-textures.md", "_chars": 1905}, {"id": "facelight", "title": "脸部补光（Facelight）", "category": "02-face", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["捏脸", "补光", "照明", "Facelight"], "aliases": ["面部补光", "脸光", "打光", "脸黑看不见"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/5965", "summary": "脸部补光类 mod 的作用与两个主要版本（tktk 原版 Facelight 与 Facelight Plus），以及它与 RaceMenu 内置补光的区别。", "content": "<p><strong>要解决的问题<\/strong>：捏得再好的脸，在暗处或逆光下也看不清。补光类 mod 在角色（或 NPC） 脸前挂一个光源，让脸在室内/夜晚也保持可读。<\/p>\n<h2>与 RaceMenu 内置补光的区别<\/h2>\n<table><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:left\">RaceMenu 的 Light On/Off<\/th><th style=\"text-align:left\">Facelight 类 mod<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">生效范围<\/td><td style=\"text-align:left\"><strong>只在捏脸菜单内<\/strong><\/td><td style=\"text-align:left\">常驻游戏世界<\/td><\/tr><tr><td style=\"text-align:left\">能否用于 NPC<\/td><td style=\"text-align:left\">不能<\/td><td style=\"text-align:left\">可以（原版上限 20 个）<\/td><\/tr><tr><td style=\"text-align:left\">是否需要额外 mod<\/td><td style=\"text-align:left\">不需要（RaceMenu.esp 自带）<\/td><td style=\"text-align:left\">需要单独安装<\/td><\/tr><\/tbody><\/table>\n<p><strong>如果你只是想捏脸时看清脸，不用装 Facelight<\/strong> —— RaceMenu 自带的就够了。<\/p>\n<h2>Face Light（原版，作者 tktk）<\/h2>\n<ul><li>Nexus SE <strong>5965<\/strong>（v2.0，2018-01）；LE <strong>13457<\/strong>（v2.0）。<\/li><li>新增照明法术 <strong>Facelight<\/strong>：在脸前打光，改善暗处与逆光下的观感，但<strong>不影响实际可见度<\/strong>。<\/li><li>法术常驻，用同名法术开关。<\/li><li>变体：<strong>Facelight Target<\/strong>（可挂到 NPC，<strong>上限 20 个<\/strong>）、<\/li><\/ul>\n<p><strong>FaceLightDark<\/strong> / <strong>FacelightDark Target<\/strong>（正常亮度的一半）。<\/p>\n<ul><li>MCM 提供目标列表管理；<strong>切换区域时光源会被禁用<\/strong>，需要在 MCM 里重新管理。<\/li><li>首次读档自动获得法术；若没有，用 AddItem Menu 之类工具取。<\/li><\/ul>\n<h2>Facelight Plus（社区增强）<\/h2>\n<p>来源为社区指南站 <code>https://www.skyrimodding.com/facelight-plus/<\/code>（<strong>非 Nexus<\/strong>）。 宣称相较原版的改进：<\/p>\n<ul><li>NPC 上限从 10 提到 <strong>15<\/strong>；<\/li><li>Edit Mode：对 NPC 按激活键循环切换补光；<\/li><li>潜行时自动关闭；<\/li><li>对话时自动给 NPC 开补光；<\/li><li>提供快捷键。<\/li><\/ul>\n<p>其作者也建议：<strong>原版 Facelight 更稳定<\/strong>。<\/p>\n<blockquote>⚠️ <strong>可信层级<\/strong>：Facelight Plus 只有社区指南站描述， <strong>未能确认其 Nexus 发布状态与作者归属<\/strong> —— 引用时请标注\"来源为社区站，未确认\"。<\/blockquote>\n<h2>相关但未确认的项<\/h2>\n<ul><li><strong>Better Lighting for Face Light / Facelight Plus<\/strong>：常被作为配套光照 mod 提及，<\/li><\/ul>\n<p><strong>本轮未确认其 Nexus ID<\/strong>。<\/p>\n<h2>来源<\/h2>\n<ul><li>Face Light (tktk) SE：<code>https://www.nexusmods.com/skyrimspecialedition/mods/5965<\/code>；LE：<code>https://www.nexusmods.com/skyrim/mods/13457<\/code><\/li><\/ul>\n<p>—— <strong>一手（Nexus 发布页）<\/strong><\/p>\n<ul><li>Facelight Plus：<code>https://www.skyrimodding.com/facelight-plus/<\/code> —— <strong>社区经验（非官方站，未确认 Nexus 发布状态）<\/strong><\/li><li>RaceMenu 内置补光：RaceMenu 发布页 —— <strong>一手<\/strong><\/li><\/ul>", "_file": "02-face/facelight.md", "_chars": 1739}, {"id": "racemenu-presets", "title": "预设（.jslot）与分享生态", "category": "02-face", "kind": "reference", "version": "1.0.0", "updated": "2026-09-22", "tags": ["捏脸", "预设", "jslot", "存档", "分享"], "aliases": ["preset", "捏脸预设", "导入预设", "slot 文件", "脸型文件"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/19080", "summary": ".jslot 的结构与存放路径、带雕塑预设的额外 .nif、导出与导入流程，以及\"预设应用后脸不对\"的常见原因。", "content": "<h2>格式：JSON 文本<\/h2>\n<p>RaceMenu 发布页明确：<strong>预设改为 JSON 格式，扩展名 <code>.jslot<\/code><\/strong>。 旧的二进制 <code>.slot<\/code> 仍能加载，但 CharGen 不再写出这种格式。<\/p>\n<p>结构上每条滑块是一组\"滑杆名 + 提供该 morph 的插件 + 数值\"：<\/p>\n<pre class=\"code\"><code>{\n  \"name\": \"ShoulderWidth\",\n  \"keys\": [ { \"key\": \"RaceMenuMorphsCBBE.esp\", \"value\": 50 } ]\n}<\/code><\/pre>\n<blockquote><strong>实用推论<\/strong>：<code>keys[].key<\/code> 指向<strong>提供 morph 的那个 esp<\/strong>。 所以同一份预设，在 CBBE 身形与 UNP 身形下的可应用程度不同 —— 预设是<strong>绑定身形家族<\/strong>的，跨家族套用只会得到一半生效的结果。<\/blockquote>\n<p>文件里还包含 <code>weight<\/code> 以及 headparts / skinOverrides 等块。 其中 <strong><code>skinOverrides<\/code> 缺失或条目错误会导致\"皮肤油光\"类 bug<\/strong>（社区经验）。<\/p>\n<h2>存放路径<\/h2>\n<table><thead><tr><th style=\"text-align:left\">内容<\/th><th style=\"text-align:left\">路径<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">预设文件<\/td><td style=\"text-align:left\"><code>Data\\SKSE\\Plugins\\CharGen\\Presets\\<\/code><\/td><\/tr><tr><td style=\"text-align:left\">带雕塑的预设<\/td><td style=\"text-align:left\">同名 <code>.nif<\/code>（有时带 <code>.dds<\/code>）放在 <code>Data\\SKSE\\Plugins\\CharGen\\<\/code>，导入时到 <strong>Sculpt → Import Head<\/strong> 加载<\/td><\/tr><tr><td style=\"text-align:left\">控制台导出位置<\/td><td style=\"text-align:left\"><code>Data\\SKSE\\Plugins\\CharGen\\Exported\\&lt;PATH&gt;.jslot<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>导出与导入<\/h2>\n<p><strong>导出（做自己的预设或随从）<\/strong><\/p>\n<ol><li>在 RaceMenu 里捏好脸 → Sculpt 页 <strong>F5 Export head<\/strong> →<\/li><\/ol>\n<p>得到 <code>Data\\SKSE\\Plugins\\CharGen\\&lt;name&gt;.nif<\/code> 与 <code>.dds<\/code>；<\/p>\n<ol><li>存预设：<code>skee preset-save &lt;名字&gt;<\/code>。<\/li><\/ol>\n<p><strong>导入<\/strong><\/p>\n<ol><li><code>.jslot<\/code> 丢进 <code>CharGen\\Presets\\<\/code>；<\/li><li>游戏内打开捏脸界面，在预设下拉里选；<\/li><li>若预设自带雕塑几何，去 Sculpt 页 <strong>Import Head<\/strong>。<\/li><\/ol>\n<p><strong>应用到 NPC / 随从<\/strong>：<code>skee preset-load &lt;名字&gt;<\/code> 可加载到 NPC， 但预设负责\"滑块值\"，<strong>脸部件（head parts）需要单独设置<\/strong>。<\/p>\n<h2>导入后\"脸不对\"的常见原因<\/h2>\n<table><thead><tr><th style=\"text-align:left\">现象<\/th><th style=\"text-align:left\">原因<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">脸是尖的 / 不像截图<\/td><td style=\"text-align:left\"><strong>High Poly Head 未在 Head 页把 Face part 切到 HPH<\/strong><\/td><\/tr><tr><td style=\"text-align:left\">部分特征丢失、纹理紫红<\/td><td style=\"text-align:left\">预设依赖的<strong>头发/眼/眉/皮肤资源没装<\/strong><\/td><\/tr><tr><td style=\"text-align:left\">脸型大体对但眉歪<\/td><td style=\"text-align:left\">眉毛资源与 HPH 不匹配，缺对应补丁<\/td><\/tr><tr><td style=\"text-align:left\">皮肤油光<\/td><td style=\"text-align:left\"><code>skinOverrides<\/code> 条目缺失或错误（社区经验）<\/td><\/tr><tr><td style=\"text-align:left\">完全没反应<\/td><td style=\"text-align:left\">SKSE / RaceMenu 版本不符，或 <code>.jslot<\/code> 放错目录<\/td><\/tr><\/tbody><\/table>\n<h2>分享生态<\/h2>\n<ul><li><strong>Nexus 是主阵地<\/strong>：搜 \"Racemenu preset\" 有 <strong>2000+<\/strong> 结果，多在 Body/Face/Hair 或 Presets 分类。<\/li><li>预设作者通常会在要求里列出<strong>所用资源 mod 清单<\/strong>（皮肤、眼睛、头发、HPH 等）—— <strong>照单装齐是唯一解<\/strong>。<\/li><li><strong>种族匹配的经验规则<\/strong>（社区经验）：<ul><li>人类之间（帝国/诺德/布雷顿/红卫）可互用；<\/li><li>精灵之间（高/木/暗）可互用；<\/li><li>兽人、虎人、亚龙人<strong>最好只在同族内用<\/strong>；<\/li><li>COTR 预设需 Charmers of the Reach，UBE 预设需 UBE。<\/li><\/ul><\/li><li>其它聚集地：LoversLab（成人向预设多）、Vector Plexus（HPH 相关）、各 Wabbajack modlist 自带预设包。<\/li><\/ul>\n<h2>来源<\/h2>\n<ul><li><code>.jslot<\/code> = JSON、路径、<code>skee preset-save/load<\/code>：RaceMenu 发布页与 changelog —— <strong>一手<\/strong><\/li><li>jslot 结构示例与 \"改 json 格式\" 的说明：Nexus 论坛 scorrp10 引用 RaceMenu 文案 —— <strong>社区经验（转述一手文案）<\/strong><\/li><li><code>skinOverrides<\/code> 相关 bug：LoversLab 帖 —— <strong>社区经验<\/strong><\/li><li>预设数量（2000+）、种族匹配规则、分享习惯：Nexus 论坛 2025 帖 + LoversLab —— <strong>社区经验<\/strong><\/li><li>HPH 预设\"脸是尖的\"需切 Face part：Nexus 预设页与 HPH 说明 —— <strong>社区经验（多源一致）<\/strong><\/li><\/ul>", "_file": "02-face/racemenu-presets.md", "_chars": 2427}, {"id": "bodyslide-outfit-studio", "title": "BodySlide and Outfit Studio", "category": "03-body", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["身形", "BodySlide", "Outfit Studio", "构建", "滑块", "命令行"], "aliases": ["bs", "os", "构建身形", "批量构建", "batch build", "命令行参数"], "source": "https://github.com/ousnius/BodySlide-and-Outfit-Studio", "summary": "BodySlide 与 Outfit Studio 的分工、文件格式（.osp/.osd/SliderPresets.xml）、Build Morphs 的含义、以及官方命令行参数（并纠正几个不存在的参数）。", "content": "<p>作者 <strong>Ousnius 与 Caliente<\/strong>。<strong>官方仓库<\/strong>：<code>https://github.com/ousnius/BodySlide-and-Outfit-Studio<\/code>（GPLv3+）。<\/p>\n<p>这是身形生态的\"构建工具\"。<strong>不跑它，身形 mod 就只是素材。<\/strong><\/p>\n<h2>两者分工<\/h2>\n<table><thead><tr><th style=\"text-align:left\">工具<\/th><th style=\"text-align:left\">做什么<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>BodySlide<\/strong><\/td><td style=\"text-align:left\">用滑块自定义身形/服装，并<strong>批量构建<\/strong>进游戏的 Data 目录<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Outfit Studio<\/strong><\/td><td style=\"text-align:left\">在身形之间转换服装、创建滑块、修正动画权重、用画笔/变换工具编辑网格、导入导出 FBX/OBJ/NIF<\/td><\/tr><\/tbody><\/table>\n<p>日常用的 90% 是 BodySlide；要做\"把某件老服装适配到我的身形\"才需要 Outfit Studio。<\/p>\n<h2>版本<\/h2>\n<ul><li>该工具是<strong>跨游戏同一套<\/strong>（Skyrim LE/SE、Fallout 4、Fallout 76 共用代码库）。<\/li><li>母页版本 <strong>5.8.2<\/strong>（FO4 Nexus，2026-06-25）。<\/li><li>SE 专用发布页：<code>https://www.nexusmods.com/skyrimspecialedition/mods/201<\/code>。<\/li><\/ul>\n<h2>文件格式<\/h2>\n<table><thead><tr><th style=\"text-align:left\">扩展名 / 名称<\/th><th style=\"text-align:left\">是什么<\/th><th style=\"text-align:left\">放在哪<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong><code>.osp<\/code><\/strong><\/td><td style=\"text-align:left\">Outfit Studio Project / SliderSet。<strong>纯文本 XML<\/strong>，记录源文件与目标文件路径、哪些滑块影响哪些网格。<strong>一个 <code>.osp<\/code> 可含多个项目<\/strong><\/td><td style=\"text-align:left\"><code>SliderSets/<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong><code>.osd<\/code><\/strong><\/td><td style=\"text-align:left\">Outfit Studio Data。<strong>二进制<\/strong>，存放某项目所有网格的 morph 顶点数据（v3.0 引入，取代了此前成千上万的 BSD 小文件）<\/td><td style=\"text-align:left\"><code>ShapeData/&lt;Project&gt;/<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong><code>.nif<\/code><\/strong><\/td><td style=\"text-align:left\">所有滑块归零时的<strong>基础形状<\/strong>网格<\/td><td style=\"text-align:left\"><code>ShapeData/&lt;Project&gt;/<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong><code>.xml<\/code>（SliderPresets）<\/strong><\/td><td style=\"text-align:left\">预设：一组命名过的滑块值<\/td><td style=\"text-align:left\"><code>SliderPresets/<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong><code>.xml<\/code>（SliderGroups）<\/strong><\/td><td style=\"text-align:left\">预设的分组定义<\/td><td style=\"text-align:left\"><code>SliderGroups/<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>滑块的含义<\/h2>\n<ul><li><strong>滑块 0 = 游戏内体重 0，滑块 100 = 游戏内体重 100<\/strong>；<\/li><\/ul>\n<p>预览窗口顶部那条对应游戏内体重滑条的中点。<\/p>\n<ul><li>可以手输负数或 &gt;100，但<strong>不推荐<\/strong>（易扭曲、穿模）。<\/li><\/ul>\n<h2>Batch Build（批量构建）<\/h2>\n<p>构建所选分组内的全部 outfit。CLI 里对应 <code>--groupbuild<\/code>。<\/p>\n<p><strong>输出文件冲突的处理<\/strong>：BodySlide 通过 <code>BuildSelection.xml<\/code> 解决冲突，<strong>输者被跳过<\/strong> —— 所以\"我构建了但没生效\"有时是这里被静默跳过了。<\/p>\n<h2><code>Build Morphs<\/code> 复选框（最重要的一项）<\/h2>\n<blockquote>勾选后，BodySlide 会生成 <strong><code>.tri<\/code> morph 文件<\/strong>，并在 NIF 里写入 <strong><code>BODYTRI<\/code> extra data<\/strong>， 使 RaceMenu / NiOverride 能在游戏内应用 morph。 <strong>无副作用，推荐始终勾选。<\/strong><\/blockquote>\n<p>不勾的后果：<strong>RaceMenu 里没有对应的身形滑块<\/strong>。 还要注意<strong>构建产物不能被别的 mod 的 NIF 覆盖<\/strong>，否则 <code>BODYTRI<\/code> 一起丢掉。<\/p>\n<p>机制细节见 <a href=\"../00-overview/morph-and-nif-basics.md\" target=\"_blank\" rel=\"noopener\"><code>../00-overview/morph-and-nif-basics.md<\/code><\/a>。<\/p>\n<h2>与 RaceMenu 的联动<\/h2>\n<p>RaceMenu（<code>skee64.dll<\/code> 内含 NiOverride）读取 <code>.tri<\/code> 在捏脸界面/MCM 中应用身形 morph。前提三条：<\/p>\n<ol><li>勾了 <code>Build Morphs<\/code>；<\/li><li>构建的是 <strong>3BA / 3BBB 变体<\/strong>（如 \"CBBE 3BBB Body Amazing\"），而不是被普通 CBBE 覆盖；<\/li><li>构建产物在最终的覆盖关系中胜出。<\/li><\/ol>\n<h2>官方命令行参数<\/h2>\n<blockquote>⚠️ <strong>纠错<\/strong>：流传较广的 <code>-o<\/code>、<code>-m<\/code> 参数<strong>并不存在于当前官方 CLI<\/strong>。 以下是官方 wiki 的现行参数。<\/blockquote>\n<h3>BodySlide<\/h3>\n<table><thead><tr><th style=\"text-align:left\">长参数<\/th><th style=\"text-align:left\">短参数<\/th><th style=\"text-align:left\">作用<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><code>--groupbuild &lt;groups&gt;<\/code><\/td><td style=\"text-align:left\"><code>-gbuild<\/code><\/td><td style=\"text-align:left\">按分组批量构建并退出<\/td><\/tr><tr><td style=\"text-align:left\"><code>--build &lt;outfits&gt;<\/code><\/td><td style=\"text-align:left\"><code>-b<\/code><\/td><td style=\"text-align:left\">按名称构建指定 outfit（逗号/分号/空格分隔）<\/td><\/tr><tr><td style=\"text-align:left\"><code>--filter &lt;filter&gt;<\/code><\/td><td style=\"text-align:left\"><code>-f<\/code><\/td><td style=\"text-align:left\">构建名称匹配的 outfit（默认大小写不敏感子串匹配）<\/td><\/tr><tr><td style=\"text-align:left\"><code>--regexfilter<\/code><\/td><td style=\"text-align:left\"><code>-regex<\/code><\/td><td style=\"text-align:left\">把 <code>
