后没有同步：<\/p>\n<ul><li>RaceMenu 里记下肤色 <strong>RGB<\/strong>；<\/li><li>导出头后把 tint mask 放到正确位置、让头网格指过去；<\/li><li>在 CK 的 NPC 记录里把 <strong>Face Tinting Color<\/strong> 设为<strong>相同 RGB<\/strong>，<strong>Interpolation = 1<\/strong>；<\/li><li>然后 <code>Ctrl+F4<\/code> 重导该 NPC 的 FaceGen。<\/li><\/ul>\n<h3>⑤ 旧 mod 残留的 loose 文件覆盖<\/h3>\n<p>装了新皮肤，但旧皮肤的松散文件还在覆盖。<\/p>\n<p>→ <strong>检查<\/strong>：MO2 的 Conflicts 面板。<\/p>\n<h2>排查顺序（照着走）<\/h2>\n<pre class=\"code\"><code>1. 头/手/身体是否同一套皮肤同一档？\n2. 皮肤与身形是否同族？\n3. 是否装了自定义头网格而没做配套？\n4. FaceGen tint 与 CK 的 Face Tinting Color 是否一致？\n5. 是否有旧 mod 的 loose 文件覆盖？<\/code><\/pre>\n<h2>⚠️ 一条重要认知<\/h2>\n<blockquote><strong>\"脖子接缝修补 mod\"是创可贴，不解决根因。<\/strong><\/blockquote>\n<p>有一种常见做法是用 <strong>Caliente's Texture Blender<\/strong> 混合头颈纹理， 或用\"接缝修补\"类 mod 遮盖。这些在\"实在找不到根因\"时可以应急， 但只要根因（不同源 / UV 错配）还在，换一套资源接缝就会重新出现。<\/p>\n<h2>来源<\/h2>\n<ul><li>\"头/手/身体必须同源同档\"、\"必须同族\"、\"<code>Ctrl+F4<\/code> 重导\"：<\/li><\/ul>\n<p>Nexus 论坛脖子接缝帖（BHUNP）与 LoversLab 帖 —— <strong>社区经验（多帖一致）<\/strong><\/p>\n<ul><li>CBBE / UNP UV 不通用：Nexus 发布页描述 + 社区一致确认 —— <strong>一手 + 社区经验<\/strong><\/li><li>CITRUS 头网格导致接缝：LoversLab 帖 —— <strong>社区经验<\/strong><\/li><li>CK 的 Face Tinting Color / Interpolation：Creation Kit wiki（NPC 记录）—— <strong>一手<\/strong><\/li><li>\"脖缝修补是创可贴\"：<strong>机制推论 + 社区共识<\/strong><\/li><\/ul>", "_file": "06-troubleshooting/neck-seam.md", "_chars": 1823}, {"id": "preset-not-applied", "title": "预设不生效 / 脸变回默认", "category": "06-troubleshooting", "kind": "tutorial", "version": "1.0.0", "updated": "2026-09-22", "tags": ["排错", "预设", "jslot", "存档", "依赖"], "aliases": ["预设不生效", "脸变回默认", "预设没用", "preset 不加载", "导入预设无效", "存档脸变了"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/19080", "summary": "预设不生效的六类原因（依赖资源缺失、放错目录、HPH 未选、未保存应用、morph 未构建、存档 co-save 不一致）与逐项核对表。", "content": "<h2>检查清单<\/h2>\n<h3>1. 预设依赖的资源是否装齐 ⭐<\/h3>\n<p>这是<strong>第一位<\/strong>的原因。预设只存\"滑块值与 head parts 引用\"， 它引用的<strong>头发 / 眼睛 / 眉毛 / 皮肤 / HPH<\/strong> 必须已经安装并启用。<\/p>\n<ul><li>缺头发 → 发型回退默认或变光头；<\/li><li>缺眼睛/眉毛 → 对应部件丢失或变紫红；<\/li><li>缺皮肤 → 脸色不对。<\/li><\/ul>\n<p><strong>预设作者的要求清单就是必装清单。<\/strong><\/p>\n<h3>2. <code>.jslot<\/code> 是否放对目录<\/h3>\n<pre class=\"code\"><code>Data\\SKSE\\Plugins\\CharGen\\Presets\\<\/code><\/pre>\n<p>放错目录 → 预设下拉里根本看不到它。<\/p>\n<h3>3. High Poly Head 是否被选中<\/h3>\n<p>HPH 预设的常见现象是\"<strong>脸是尖的 / 不像截图<\/strong>\" —— 解决：到 Head 页把 <strong>Face part 从 1 切到 3（HPH）<\/strong>。<\/p>\n<h3>4. 是否真的保存并应用了<\/h3>\n<p>在 RaceMenu 里调完滑块后<strong>没有 Save / 应用<\/strong> → 当然不生效。<\/p>\n<h3>5. 身形 morph 是否已构建<\/h3>\n<p>预设里的身形部分依赖 <code>.tri<\/code>。 BodySlide 没勾 <code>Build Morphs<\/code> → 身形部分无效（但脸的部分可能正常）。<\/p>\n<h3>6. 存档与当前 mod 是否一致 ⭐<\/h3>\n<p><strong>morph 与 tint 状态存在 SKSE co-save 里。<\/strong> 中途增删身形 / 皮肤 / 预设类 mod，旧档可能与新配置对不上。<\/p>\n<p>表现：新角色用预设正常，<strong>读旧档就变回默认<\/strong>。<\/p>\n<h3>7. 带雕塑的预设是否导入了几何<\/h3>\n<p>若预设附带 <code>.nif<\/code>（雕塑几何），需要去 <strong>Sculpt → Import Head<\/strong> 手动导入。<\/p>\n<h2>一张核对表<\/h2>\n<pre class=\"code\"><code>[ ] 依赖资源（发/眼/眉/皮/HPH）已装且启用\n[ ] .jslot 在 CharGen\\Presets\\\n[ ] HPH 已在 Head 页选中\n[ ] 已在界面里 Save / 应用\n[ ] BodySlide 勾了 Build Morphs 并重建\n[ ] 是新档，或确认存档与当前配置一致\n[ ] 有 .nif 的话已 Import Head<\/code><\/pre>\n<h2>一个常被搞混的点<\/h2>\n<blockquote><strong>\"预设不生效\"和\"预设效果和截图不一样\"是两回事。<\/strong><\/blockquote>\n<ul><li>完全不生效 → 查上面的清单；<\/li><li>生效了但不一样 → 通常是<strong>资源版本不同<\/strong>（作者的眉毛是 v2.1、你装的是 v4.0）<\/li><\/ul>\n<p>或 <strong>资源缺失导致部分回退<\/strong>。仔细比对作者的要求清单。<\/p>\n<h2>来源<\/h2>\n<ul><li>依赖资源缺失、放错目录、HPH 未选、需重开 <code>showracemenu<\/code>：<\/li><\/ul>\n<p>LoversLab 与 Nexus 论坛预设帖 —— <strong>社区经验（多帖一致）<\/strong><\/p>\n<ul><li><code>.jslot<\/code> 路径与 <code>skee preset-save/load<\/code>：RaceMenu 发布页与 changelog —— <strong>一手<\/strong><\/li><li>需要 Import Head：RaceMenu 发布页（Sculpt 的 Import Geometry 功能）—— <strong>一手<\/strong><\/li><li>co-save 存储 morph 状态：BodyGen 文档与 NiOverride 机制 —— <strong>社区文档（引作者原话）+ 一手机制<\/strong><\/li><li>\"预设效果不同\"与\"预设不生效\"要分开：\"<strong>机制推论<\/strong>\"<\/li><\/ul>", "_file": "06-troubleshooting/preset-not-applied.md", "_chars": 1809}, {"id": "dark-face", "title": "黑脸 / 黑头（Dark Face Bug）", "category": "06-troubleshooting", "kind": "tutorial", "version": "1.0.0", "updated": "2026-09-22", "tags": ["排错", "黑脸", "黑头", "FaceGen", "冲突"], "aliases": ["dark face", "脸变黑", "npc 黑脸", "头像变黑", "face discoloration"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/42441", "summary": "黑脸的根本成因（FaceGen 数据与 head parts 不匹配导致 tint 被丢弃）、四种修法（运行时修复 / CK 重导 / 隐藏冲突文件 / 调序），以及为什么\"左栏右栏不一致\"是最常见的真因。", "content": "<h2>症状<\/h2>\n<p>NPC（有时是玩家）的<strong>头部变成黑/灰色<\/strong>，身体正常。通常出现在装了多个 NPC 美化 mod 之后。<\/p>\n<h2>成因<\/h2>\n<p>引擎依赖 NPC 头部的<strong>预处理 FaceGen 数据<\/strong>：<\/p>\n<pre class=\"code\"><code>Meshes\\Actors\\Character\\FaceGenData\\FaceGeom\\&lt;插件名&gt;\\&lt;FormID&gt;.nif\nTextures\\Actors\\Character\\FaceGenData\\FaceTint\\&lt;插件名&gt;\\&lt;FormID&gt;.dds<\/code><\/pre>\n<p>当<strong>这些 FaceGen 数据与插件里记录的 head parts 不匹配<\/strong>时， 游戏会<strong>重新生成脸，但丢弃 tint 数据 → 脸变黑<\/strong>。<\/p>\n<p>引发不匹配的三种典型情形：<\/p>\n<ol><li><strong>FaceGen 缺失或未导出<\/strong>（改了 NPC 的脸却没 <code>Ctrl+F4<\/code>）；<\/li><li><strong>多个 mod 改同一 NPC 的脸且互相覆盖<\/strong>；<\/li><li>⭐ <strong>MO2 左栏（资产优先级）与右栏（插件顺序）不一致<\/strong> ——<\/li><\/ol>\n<p>某 mod 赢了 NPC 记录（右栏），但 FaceGen 文件被别的 mod 覆盖（左栏），于是头部件与头网格对不上。<\/p>\n<blockquote><strong>第 3 条是最容易被误判的一条。<\/strong> 很多人会去怀疑\"某个美化 mod 坏了\"， 实际是自己排完 LOOT 后右栏变了、左栏没跟着对齐。<\/blockquote>\n<h2>修法<\/h2>\n<h3>① 运行时修复（最快，治标）<\/h3>\n<p>装 <strong>Face Discoloration Fix<\/strong>（作者 <strong>Parapets<\/strong>，仓库所有者 <strong>Exit-9B<\/strong>）：<\/p>\n<ul><li>Nexus：<code>https://www.nexusmods.com/skyrimspecialedition/mods/42441<\/code><\/li><li>仓库：<code>https://github.com/Exit-9B/Face-Discoloration-Fix<\/code>（<strong>MIT<\/strong>）<\/li><li>版本 <strong>1.0.4<\/strong>（更新到 Address Library 12，静态链接 VC++ Runtime）；<\/li><\/ul>\n<p>历史：1.0.3 支持 1.6.629+，1.0.2 支持 1.6.318+， 1.0.1 修了坏 race（RNAM）数据导致的启动崩溃并加 VR 支持。<\/p>\n<p><strong>它的做法<\/strong>：阻止游戏在重新生成脸时丢弃 tint 数据，让重生成的颜色正确。 等价于 <strong>CK 的 <code>Ctrl+F4<\/code> 的运行时版本<\/strong>。<\/p>\n<p><strong>代价<\/strong>：实时生成 FaceGen 比加载预处理慢 —— 作者测得预处理约 <strong>0.2 ms/NPC<\/strong>，实时生成约 <strong>30–70 ms/NPC<\/strong>。<\/p>\n<p><strong>限制<\/strong>：它<strong>只修变色<\/strong>。如果 load order 冲突破坏了 NPC 美化 mod， 它无法恢复原貌 —— <strong>根因还在<\/strong>。<\/p>\n<h3>② Creation Kit 正本清源（治本）<\/h3>\n<ol><li>加载相关插件（<code>CreationKit.ini<\/code> 需允许加载多个 master）；<\/li><li>Objects → Actors → Actor，<strong>在子树里直接选中<\/strong>目标 NPC（不要用搜索选 <code>*All*<\/code>）；<\/li><li><strong><code>Ctrl+F4<\/code><\/strong> 导出 FaceGen。<\/li><\/ol>\n<h3>③ MO2 隐藏冲突 FaceGen<\/h3>\n<ul><li>在 MO2 的 <strong>Conflicts<\/strong> 里找覆盖者；<\/li><li>按 FormID 搜冲突的 <code>.nif<\/code> / <code>.dds<\/code>，把它们 <strong>hide<\/strong> 掉，<\/li><\/ul>\n<p>确保 FaceGen 来自正确的美化 mod；<\/p>\n<ul><li>同时检查插件顺序，让该美化 mod 的 NPC 记录优先。<\/li><\/ul>\n<h3>④ 调序 / 打补丁<\/h3>\n<ul><li>让 NPC 美化 mod 位于\"修改该 NPC 数据\"的 mod <strong>之后<\/strong>；<\/li><li>多个 NPC 美化共存时，用 SSEEdit 逐个做 patch（合并外观记录 + 对齐 FaceGen）。<\/li><\/ul>\n<p>社区另有一份专门的 <strong>Black-Face Patching Guide<\/strong>（Nexus <code>mods/17004<\/code> 的 PDF 附件）。<\/p>\n<h2>一个重要的认知<\/h2>\n<blockquote><strong>CK 的 <code>Ctrl+F4<\/code> 会把脸重置回\"当前插件数据所描述的脸\"。<\/strong> 如果你先装了美化 mod 再导出，得到的是美化后的脸； 但如果导出时冲突资源没理顺，你可能把脸<strong>导成了原版样<\/strong>。 所以 <code>Ctrl+F4<\/code> 不是\"万能修复键\"，它是\"按当前数据重新生成\"。<\/blockquote>\n<h2>来源<\/h2>\n<ul><li>成因（FaceGen 与 head parts 不匹配 → 丢 tint）与运行时代价：<\/li><\/ul>\n<p>Face Discoloration Fix Nexus 页描述 + GitHub README —— <strong>一手<\/strong><\/p>\n<ul><li>FaceGen 路径与 <code>Ctrl+F4<\/code> 流程：CK wiki / UESP —— <strong>一手<\/strong><\/li><li>\"左栏右栏不一致\"这一成因：Nexus 论坛帖 —— <strong>社区经验（多帖一致）<\/strong><\/li><li>MO2 隐藏冲突 FaceGen：Black-Face Fix Guide（Nexus <code>mods/77338<\/code>、<code>mods/17004<\/code>）—— <strong>社区经验<\/strong><\/li><li>\"<code>Ctrl+F4<\/code> 会重置为当前数据描述的脸\"：<strong>机制推论 + 社区一致经验<\/strong><\/li><\/ul>", "_file": "06-troubleshooting/dark-face.md", "_chars": 2627}, {"id": "mo2-override-rules", "title": "MO2 覆盖规则（左栏 vs 右栏）", "category": "07-workflow", "kind": "concept", "version": "1.0.0", "updated": "2026-09-22", "tags": ["安装", "MO2", "覆盖", "优先级", "冲突", "VFS"], "aliases": ["左栏 右栏", "覆盖顺序", "mod organizer", "虚拟文件系统"], "source": "https://forums.nexusmods.com/topic/5755942-the-dark-faces-bug-how-to-fix-it/", "summary": "MO2 的左栏（资产优先级）与右栏（插件顺序）是两件独立的事，以及\"两者不一致\"为什么会造成黑脸这类\"找不到原因\"的故障。", "content": "<blockquote>本工作区另有专门讲 MO2 与 USVFS 机制的资料库（<code>mo2-usvfs-kb<\/code>）。 本条目只讲<strong>与捏脸/身形直接相关<\/strong>的那部分。<\/blockquote>\n<h2>两个面板是两件事<\/h2>\n<table><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:left\">左栏（Mods）<\/th><th style=\"text-align:left\">右栏（Plugins）<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">控制什么<\/td><td style=\"text-align:left\"><strong>资产覆盖<\/strong>：<code>.nif<\/code> / <code>.dds<\/code> / <code>.hkx<\/code> 等文件谁覆盖谁<\/td><td style=\"text-align:left\"><strong>插件加载顺序<\/strong>：<code>.esp<\/code> / <code>.esm<\/code> / <code>.esl<\/code> 的记录谁赢<\/td><\/tr><tr><td style=\"text-align:left\">机制<\/td><td style=\"text-align:left\">虚拟文件系统（VFS）把文件投影进游戏<\/td><td style=\"text-align:left\">记录级的\"后加载者胜\"<\/td><\/tr><tr><td style=\"text-align:left\">由谁决定<\/td><td style=\"text-align:left\">你手动拖<\/td><td style=\"text-align:left\">常由 LOOT 决定<\/td><\/tr><\/tbody><\/table>\n<p><strong>它们互不影响。<\/strong> 左栏放得很好的 mod，右栏仍可能在记录层面输掉。<\/p>\n<h2>为什么这条值得单独写一条<\/h2>\n<p>因为<strong>黑脸、脖缝、穿模这三类\"查不出原因\"的故障，根源常常就在这条不一致上<\/strong>。<\/p>\n<p>以黑脸为例：<\/p>\n<ol><li>修改 NPC 记录的 mod（假设是 A）在<strong>右栏赢了<\/strong> → 引擎按 A 的 head parts 去找 FaceGen；<\/li><li>但 A 的 FaceGen 文件在<strong>左栏输了<\/strong>，被另一个 mod B 的同 FormID 文件覆盖；<\/li><li>于是 head parts 与头网格对不上 → <strong>脸变黑<\/strong>。<\/li><\/ol>\n<p><strong>只看一个面板永远查不出来。<\/strong><\/p>\n<h2>实用的排查动作<\/h2>\n<ol><li>打开 MO2 的 <strong>Conflicts<\/strong> 面板：<ul><li><strong>红色 = 这个 mod 覆盖了别人<\/strong>；<\/li><li><strong>绿色 = 这个 mod 被别人覆盖<\/strong>；<\/li><\/ul><\/li><li>定位到相关 FormID 的 <code>.nif<\/code> / <code>.dds<\/code>，看是谁覆盖了谁；<\/li><li><strong>必要时用 <code>hide<\/code> 隐藏冲突文件<\/strong>（保留 mod，只排除那一个文件）；<\/li><li>用 <strong>SSEEdit<\/strong> 看记录层面谁赢了，与资产层面是否一致。<\/li><\/ol>\n<h2>与身形/皮肤的覆盖关系<\/h2>\n<table><thead><tr><th style=\"text-align:left\">资源<\/th><th style=\"text-align:left\">谁应该覆盖谁<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">身形网格<\/td><td style=\"text-align:left\">你的身形 mod 应<strong>覆盖<\/strong>原版与其他身形（但只能启用一个身形 mod）<\/td><\/tr><tr><td style=\"text-align:left\">皮肤贴图<\/td><td style=\"text-align:left\">皮肤 mod 应在身形<strong>之后<\/strong>（覆盖）<\/td><\/tr><tr><td style=\"text-align:left\">BodySlide 输出<\/td><td style=\"text-align:left\">应在最终 Data 中<strong>胜出<\/strong>，否则 <code>BODYTRI<\/code> 丢失<\/td><\/tr><tr><td style=\"text-align:left\">FaceGen<\/td><td style=\"text-align:left\">NPC 美化 mod 的 FaceGen 应在其他 FaceGen 之前（覆盖）<\/td><\/tr><\/tbody><\/table>\n<p><strong>BodySlide 输出要放进 MO2 的 Overwrite 或一个专门的 mod 文件夹<\/strong>， 不要直接写进游戏目录 —— 否则它会绕开 VFS 的覆盖关系。<\/p>\n<h2>Wabbajack 列表的特殊纪律<\/h2>\n<p>Wabbajack 装出来的列表是一个<strong>封闭的 MO2 实例<\/strong>： <strong>不要把自己的 mod 叠上去<\/strong> —— 列表更新会清掉额外添加的 mod。 详见 <a href=\"wabbajack.md\" target=\"_blank\" rel=\"noopener\"><code>wabbajack.md<\/code><\/a>。<\/p>\n<h2>来源<\/h2>\n<ul><li>左栏 = 资产优先级、右栏 = 加载顺序，二者独立：MO2 机制说明与社区 cheatbook —— <strong>一手（工具机制）+ 社区经验<\/strong><\/li><li>\"左栏右栏不一致 → 黑脸\"：Nexus 论坛 Black-Face 讨论 —— <strong>社区经验（多帖一致）<\/strong><\/li><li>Conflicts 面板红/绿含义、用 hide 排除单文件：<\/li><\/ul>\n<p>Nexus Black-Face Fix Guide（<code>mods/77338<\/code>）—— <strong>社区经验<\/strong><\/p>\n<ul><li>Wabbajack 列表隔离、更新会清掉额外 mod：Wabbajack 官方文档 —— <strong>一手<\/strong><\/li><\/ul>\n<p><code>https://wiki.wabbajack.org/user_documentation/Installing%20a%20Modlist.html<\/code><\/p>", "_file": "07-workflow/mo2-override-rules.md", "_chars": 1999}, {"id": "wabbajack", "title": "Wabbajack（自动安装整合）", "category": "07-workflow", "kind": "tool", "version": "1.0.0", "updated": "2026-09-22", "tags": ["安装", "Wabbajack", "整合包", "modlist"], "aliases": ["自动安装整合", "一键整合", "安装列表"], "source": "https://wiki.wabbajack.org/", "summary": "Wabbajack 是什么、它对捏脸/身形这套复杂前置链的独特价值、四条限制（版本敏感、封闭实例、限速、更新清 mod），以及官方安装要点。", "content": "<h2>是什么<\/h2>\n<p>一个<strong>开源的 modlist 自动安装器<\/strong>：读取 <code>.wabbajack<\/code> 文件， 自动从 Nexus 等来源下载并按作者设定排序/配置，最终产出一个<strong>自带 MO2 实例<\/strong>的完整可玩环境。<\/p>\n<p>本质是\"<strong>把别人的 MO2 配置克隆到你的机器<\/strong>\"，不分发版权文件。<\/p>\n<ul><li>官方站：<code>https://www.wabbajack.org/<\/code><\/li><li>官方文档：<code>https://wiki.wabbajack.org/<\/code><\/li><li>GitHub：<code>https://github.com/halgari/wabbajack<\/code><\/li><\/ul>\n<h2>对捏脸/身形的独特价值<\/h2>\n<p>这正是新手最容易翻车的地方 —— 而 Wabbajack 列表<strong>通常已经把这些做完了<\/strong>：<\/p>\n<table><thead><tr><th style=\"text-align:left\">新手最容易错的<\/th><th style=\"text-align:left\">Wabbajack 列表通常已处理<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">BodySlide 身形与服装没构建<\/td><td style=\"text-align:left\"><strong>已构建<\/strong><\/td><\/tr><tr><td style=\"text-align:left\">骨骼 / SKSE 版本不对<\/td><td style=\"text-align:left\"><strong>已锁定<\/strong><\/td><\/tr><tr><td style=\"text-align:left\">NPC 美化的 FaceGen 没对齐<\/td><td style=\"text-align:left\"><strong>已对齐<\/strong><\/td><\/tr><tr><td style=\"text-align:left\">物理 XML 冲突<\/td><td style=\"text-align:left\"><strong>已配好<\/strong><\/td><\/tr><tr><td style=\"text-align:left\">身形与皮肤不同族<\/td><td style=\"text-align:left\"><strong>已匹配<\/strong><\/td><\/tr><\/tbody><\/table>\n<p>所以\"我只想好好地玩一个有捏脸有身形的游戏\"，Wabbajack 是<strong>最省事的路径<\/strong>。<\/p>\n<h2>四条限制（与捏脸相关）<\/h2>\n<ol><li><strong>版本极度敏感<\/strong> —— 很多列表要求特定游戏版本（1.5.97 或 1.6.640 等），<\/li><\/ol>\n<p>Steam 自动更新会破坏它；<\/p>\n<ol><li><strong>封闭实例<\/strong> —— 装完是\"成品\"，个性化魔改需要 MO2 知识；<\/li><\/ol>\n<p>叠加自己的身形/服装<strong>极易冲突<\/strong>；<\/p>\n<ol><li><strong>无 Nexus Premium 时下载极慢<\/strong>（被限速）；<\/li><li><strong>列表更新会删除列表外自行添加的 mod<\/strong>。<\/li><\/ol>\n<h2>官方安装要点<\/h2>\n<ul><li>安装位置 <strong>不能在<\/strong> Windows 受保护目录（Program Files / Desktop / Documents /<\/li><\/ul>\n<p>Downloads / OneDrive 等）；<\/p>\n<ul><li>安装位置<strong>不能与游戏目录或另一个列表合并<\/strong>；<\/li><li>失败<strong>先重跑<\/strong>（支持断点续传）；<\/li><li>缺文件可<strong>手动下载放进 <code>downloads<\/code> 文件夹<\/strong>；<\/li><li>需要拥有对应商店的 AE DLC。<\/li><\/ul>\n<h2>决策建议<\/h2>\n<table><thead><tr><th style=\"text-align:left\">你的目标<\/th><th style=\"text-align:left\">建议<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">想尽快玩到\"好看的捏脸 + 身形\"<\/td><td style=\"text-align:left\">用 Wabbajack<\/td><\/tr><tr><td style=\"text-align:left\">想自己决定每一个 mod<\/td><td style=\"text-align:left\">手动装（从 <a href=\"install-order.md\" target=\"_blank\" rel=\"noopener\"><code>install-order.md<\/code><\/a> 开始）<\/td><\/tr><tr><td style=\"text-align:left\">想用别人的底子再自己加<\/td><td style=\"text-align:left\">可以，但<strong>先学会 MO2 覆盖规则<\/strong>，见 <a href=\"mo2-override-rules.md\" target=\"_blank\" rel=\"noopener\"><code>mo2-override-rules.md<\/code><\/a><\/td><\/tr><\/tbody><\/table>\n<h2>来源<\/h2>\n<ul><li>定义、开源性质、GitHub：官方站与仓库 README —— <strong>一手<\/strong><\/li><li>安装位置限制、断点续传、手动下载、AE DLC：Wabbajack 官方文档 —— <strong>一手<\/strong><\/li><\/ul>\n<p><code>https://wiki.wabbajack.org/user_documentation/Installing%20a%20Modlist.html<\/code><\/p>\n<ul><li>排错 FAQ：<code>https://wiki.wabbajack.org/user_documentation/Troubleshooting%20FAQ.html<\/code> —— <strong>一手<\/strong><\/li><li>\"列表已构建好 BodySlide/FaceGen/物理\"与四条限制：官方限制说明 + <strong>社区经验<\/strong>（限制类）<\/li><\/ul>", "_file": "07-workflow/wabbajack.md", "_chars": 1856}, {"id": "chinese-modpacks", "title": "中文社区整合包现状", "category": "07-workflow", "kind": "reference", "version": "1.0.0", "updated": "2026-09-22", "tags": ["安装", "整合包", "中文社区", "轮回", "阳光"], "aliases": ["中文整合", "轮回整合", "阳光整合", "污神", "无心", "国产整合", "一键整合"], "source": "https://gamesstarfield.com/threads/51/page-145", "summary": "中文社区整合包的真实情况：LE 时代三大包（阳光/污神/无心）与 1.6.1170 不兼容、当代仍在维护的包，以及三个被广泛流传但查无实据的名字。", "content": "<blockquote>⚠️ <strong>本条目整体可信层级偏低。<\/strong> 整合包多发布在论坛帖与网盘， 缺少可长期引用的官方页面。<strong>引用前请自行核对发布帖的最新版本。<\/strong> 另：本条目的<strong>主要价值反而是\"证伪\"<\/strong> —— 见最后一节。<\/blockquote>\n<h2>一、确实存在且已核实的<\/h2>\n<h3>阳光整合包（臭皮匠组）—— LE 时代<\/h3>\n<ul><li>2014 年发布「《上古卷轴5》阳光环境、人物美化整合包 v1.3.3」，<\/li><\/ul>\n<p>作者组「臭皮匠组」（一路阳光319、lwl612、ken890 等）。<\/p>\n<ul><li><strong>针对老滚5传奇版 LE 1.9.32.0.8<\/strong>，<strong>不是 SE/AE<\/strong>。<\/li><li>一个值得注意的设计思路：安装程序<strong>彻底隔离 CBBE 与 UNP<\/strong>，<\/li><\/ul>\n<p>从安装层面杜绝\"身形/皮肤选错\" —— 这正对应 <a href=\"../00-overview/ecosystem-map.md\" target=\"_blank\" rel=\"noopener\"><code>../00-overview/ecosystem-map.md<\/code><\/a> 里的互斥红线。<\/p>\n<ul><li>来源：3DM 发布帖 <code>https://bbs.3dmgame.com/thread-4500881-1-1.html<\/code> —— <strong>社区经验（发布帖为真实一手，但版本为 LE）<\/strong><\/li><\/ul>\n<h3>污神整合包 / 无心整合包 —— LE 时代<\/h3>\n<ul><li>与阳光并列被称为经典三大整合包；无心更全（含武器/坐骑/衣服），但更复杂、需自行排序。<\/li><li><strong>原始可靠来源缺失<\/strong>（仅见于低质转载文），且同为 <strong>LE 时代<\/strong>。<\/li><li>⚠️ 即便存在，<strong>与 1.6.1170 也不兼容<\/strong>。<\/li><\/ul>\n<h3>轮回整合包 —— SE/AE 时代，仍在维护<\/h3>\n<p>本次检索中<strong>唯一明确使用 3BA 且仍在维护、对应 AE 时代<\/strong>的国产整合包：<\/p>\n<ul><li>面向 <strong>SE/AE 次世代<\/strong>，迭代到 <strong>V6.5（2026-08 更新）<\/strong>；<\/li><li>自述\"解压即玩\"，内置前置、环境/人物/NPC 美化、装备、随从；<\/li><li>明确写「将整合的 <strong>3BA 身形以及前置更新到最新<\/strong>」「更新 <strong>FSMP<\/strong> 物理系统」「含 <strong>OAR<\/strong> 动作系统」；<\/li><li>提供「绅士版 / 正常版」切换。<\/li><li>来源：论坛发布帖 —— <strong>社区经验（非官方站，路径/版本以发布帖为准）<\/strong><\/li><\/ul>\n<h3>现代 SE 打底包<\/h3>\n<p>NGA 玩家推荐过的现代打底框架：<strong>绝伦（B站「绝伦少年」）<\/strong>、<strong>烽火神话 / 神话<\/strong>。 玩家评述是\"适合做基础框架再填自己想要的 mod\"、\"神话完全不需要动手能力，照教程走\"。 —— <strong>社区经验（NGA 论坛）<\/strong><\/p>\n<h2>二、⭐ 三个查无实据的名字（不要把当真实整合包写进文档）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">名字<\/th><th style=\"text-align:left\">核实结果<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>九大猫<\/strong><\/td><td style=\"text-align:left\"><strong>未确认<\/strong>。检索只返回 3DM 上的「<strong>盒子猫服装整合<\/strong>」（2017 服装/护甲 MOD，非整合包）。另：「9DM / 9大猫」是<strong>站点名<\/strong>，常被误当成整合包名<\/td><\/tr><tr><td style=\"text-align:left\"><strong>醉梦<\/strong><\/td><td style=\"text-align:left\"><strong>未确认<\/strong>。只命中内容农场站上一篇疑似 AI 生成的「梦里 / Dreamlike 整合包」文（宣称\"全光追/16K 视差\"等夸张内容），<strong>无任何可靠来源<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>陶德<\/strong><\/td><td style=\"text-align:left\"><strong>未确认<\/strong>。只命中 3DM 上一个「托德·霍华德是我们的主人和救世主」的<strong>玩笑 MOD<\/strong>（音频/字体替换），非整合包<\/td><\/tr><\/tbody><\/table>\n<p><strong>这一节的意义<\/strong>：这类名字往往来自内容农场互相抄写的\"十大整合包\"式文章。 在把它写进文档、或照着名字去下载之前，<strong>先怀疑它是否存在<\/strong>。<\/p>\n<h2>三、给中文用户的实用结论<\/h2>\n<ol><li><strong>LE 时代的整合包（阳光/污神/无心）与你无关<\/strong> —— 版本不兼容，最多作历史参考；<\/li><li><strong>要找当代整合包，优先看是否明确写了 3BA / BHUNP + FSMP / CBPC 的版本号<\/strong> ——<\/li><\/ol>\n<p>一个连身形和物理方案都说不清的\"整合包\"，通常只是资源合集；<\/p>\n<ol><li><strong>Wabbajack 类自动安装列表的可验证性远高于论坛网盘整合包<\/strong><\/li><\/ol>\n<p>—— 见 <a href=\"wabbajack.md\" target=\"_blank\" rel=\"noopener\"><code>wabbajack.md<\/code><\/a>；<\/p>\n<ol><li>无论用哪个整合包，<strong>本资料库的排错条目都适用<\/strong>（黑脸/脖缝/穿模/物理不生效）。<\/li><\/ol>\n<h2>来源<\/h2>\n<ul><li>阳光整合包：3DM 发布帖 —— <strong>社区经验（一手帖，但为 LE 版本）<\/strong><\/li><li>轮回整合包：论坛发布帖 —— <strong>社区经验（非官方站）<\/strong><\/li><li>绝伦 / 神话：NGA 论坛帖 —— <strong>社区经验<\/strong><\/li><li>污神 / 无心：<strong>仅见低质转载，原始可靠来源缺失<\/strong><\/li><li>九大猫 / 醉梦 / 陶德：<strong>检索后判为未确认/不存在<\/strong><\/li><li>本条目的\"证伪\"结论：<strong>本工作区检索所得，非转述<\/strong><\/li><\/ul>", "_file": "07-workflow/chinese-modpacks.md", "_chars": 2311}, {"id": "install-order", "title": "安装次序", "category": "07-workflow", "kind": "tutorial", "version": "1.0.0", "updated": "2026-09-22", "tags": ["安装", "次序", "流程", "检查清单"], "aliases": ["安装顺序", "装 mod 顺序", "install order", "先装什么", "步骤"], "source": "https://stepmodifications.org/wiki/SkyrimSE:0.1.0", "summary": "从 SKSE 到物理的推荐安装次序，每一步\"装完该验证什么\"，以及三条\"先做再说\"的纪律（只装一个身形、统一预设、先跑一次行为补丁）。", "content": "<p>次序错了的代价是<strong>症状深远且难查<\/strong> —— 覆盖关系一旦定型，后面所有东西都建立其上。<\/p>\n<h2>推荐次序<\/h2>\n<pre class=\"code\"><code>1. SKSE64（版本必须匹配游戏）\n2. Address Library（SE / AE 两套，别装错）\n3. SkyUI\n4. 其它 SKSE 插件框架（PapyrusUtil / JContainers / MCM Helper / po3 Extender）\n5. 骨骼：XPMSE（≥ 4.6）\n6. 行为补丁跑一次（FNIS / Nemesis / Pandora）\n7. 身形家族（女性：CBBE 系 或 UNP 系，只能选一个；男性身形独立）\n8. 皮肤贴图（必须与身形同族）\n9. BodySlide and Outfit Studio → 构建身形 + 服装（勾 Build Morphs）\n10. RaceMenu（+ High Poly Head，+ EFM/EFA）\n11. 脸部件资源（眼 / 眉 / 发 / 须）+ 对应 HPH 补丁\n12. 物理：Faster HDT-SMP（和/或 CBPC）→ 按需配置\n13. （可选）NPC 身形分配：BodyGen / OBody NG / AutoBody\n14. NPC 美化 mod（如装了，注意 FaceGen 对齐）<\/code><\/pre>\n<h2>每一步\"装完该验证什么\"<\/h2>\n<table><thead><tr><th style=\"text-align:left\">步<\/th><th style=\"text-align:left\">验证<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">1<\/td><td style=\"text-align:left\">用 <code>skse64_loader.exe<\/code> 能启动；<code>Data/SKSE/Plugins/<\/code> 有对应文件<\/td><\/tr><tr><td style=\"text-align:left\">3<\/td><td style=\"text-align:left\">SkyUI 不报 \"SKSE is not functioning properly\"<\/td><\/tr><tr><td style=\"text-align:left\">5<\/td><td style=\"text-align:left\">骨骼文件在 <code>meshes/actors/character/character assets/<\/code><\/td><\/tr><tr><td style=\"text-align:left\">6<\/td><td style=\"text-align:left\">行为补丁工具输出无错<\/td><\/tr><tr><td style=\"text-align:left\">7<\/td><td style=\"text-align:left\"><strong>只有一套<\/strong>女性身形生效<\/td><\/tr><tr><td style=\"text-align:left\">9<\/td><td style=\"text-align:left\"><strong>勾了 <code>Build Morphs<\/code><\/strong>；构建日志无错误<\/td><\/tr><tr><td style=\"text-align:left\">10<\/td><td style=\"text-align:left\">进游戏能打开 RaceMenu 界面，<strong>且能看到身形滑块<\/strong><\/td><\/tr><tr><td style=\"text-align:left\">12<\/td><td style=\"text-align:left\">身体/头发有物理反应<\/td><\/tr><tr><td style=\"text-align:left\">13<\/td><td style=\"text-align:left\">NPC 身材不再千人一面<\/td><\/tr><\/tbody><\/table>\n<h2>三条纪律<\/h2>\n<h3>① 女性身形只能启用一个<\/h3>\n<p>CBBE 与 UNP / BHUNP 互斥。同时启用 = 覆盖关系取决于排序，结果不可预期。<\/p>\n<h3>② 裸身与服装用同一个预设构建<\/h3>\n<p>否则穿模。见 <a href=\"../06-troubleshooting/clipping.md\" target=\"_blank\" rel=\"noopener\"><code>../06-troubleshooting/clipping.md<\/code><\/a>。<\/p>\n<h3>③ 装完身形/骨骼先跑一次行为补丁<\/h3>\n<p>FNIS / Nemesis / Pandora 生成行为文件，物理与动画都依赖它。 <strong>顺序上它要早于物理 mod 真正生效。<\/strong><\/p>\n<h2>一个反直觉但重要的建议<\/h2>\n<blockquote><strong>不要一次装完再一起测。<\/strong> 每完成一个\"层\"就进游戏看一眼。  五层一起装然后出错，你有几十种组合要排除； 每层装完就测，出错时嫌疑人只有一个。<\/blockquote>\n<h2>来源<\/h2>\n<ul><li>整体次序骨架（SKSE → ADL → SkyUI → 骨骼 → 身形 → 皮肤 → BodySlide → RaceMenu → 物理 → 行为补丁）：<\/li><\/ul>\n<p><strong>社区共识<\/strong>，与 Nexus 论坛的 CBBE 3BA 安装问答、STEP 指南一致 —— <strong>社区经验（多源一致）<\/strong><\/p>\n<ul><li>排序原则（master/DLC → 修复 → 框架 → 身形皮肤骨骼 → 服装 → NPC 美化 → 补丁）：<\/li><\/ul>\n<p>STEP 官方策划指南 —— <strong>一手（指南）<\/strong> <code>https://stepmodifications.org/wiki/SkyrimSE:0.1.0<\/code><\/p>\n<ul><li>\"XPMSE ≥ 4.6\"、\"身形 physics 变体\"、\"<code>Build Morphs<\/code>\"：各 mod 官方说明 —— <strong>一手<\/strong><\/li><\/ul>", "_file": "07-workflow/install-order.md", "_chars": 2000}, {"id": "tutorials-and-guides", "title": "教程与指南资源评估", "category": "07-workflow", "kind": "reference", "version": "1.0.0", "updated": "2026-09-22", "tags": ["安装", "教程", "指南", "来源评估"], "aliases": ["看哪个教程", "学习资源", "guide", "视频教程"], "source": "https://stepmodifications.org/wiki/SkyrimSE:0.1.0", "summary": "外部教程的分级与两个常见的走错路（modding.wiki 不托管 STEP、内容农场的\"2026 完整指南\"），以及每条资源的适用场景。", "content": "<h2>推荐（按可信度）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">资源<\/th><th style=\"text-align:left\">性质<\/th><th style=\"text-align:left\">适用<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>STEP Guide<\/strong>（<code>stepmodifications.org/wiki/SkyrimSE:0.1.0<\/code>）<\/td><td style=\"text-align:left\">社区标杆级\"从零到稳定\"指南<\/td><td style=\"text-align:left\">想系统建一套稳定环境<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Wabbajack 官方文档<\/strong>（<code>wiki.wabbajack.org<\/code>）<\/td><td style=\"text-align:left\">自动安装与排错<\/td><td style=\"text-align:left\">想跳过装配<\/td><\/tr><tr><td style=\"text-align:left\"><strong>GamerPoets<\/strong>（<code>gamerpoets.com<\/code>）<\/td><td style=\"text-align:left\">MO2 / BodySlide / RaceMenu 的实操演示<\/td><td style=\"text-align:left\">需要\"看别人点一遍\"<\/td><\/tr><tr><td style=\"text-align:left\">各 mod 的 Nexus 描述页<\/td><td style=\"text-align:left\"><strong>最权威的一手材料<\/strong><\/td><td style=\"text-align:left\">任何具体问题<\/td><\/tr><\/tbody><\/table>\n<h2>两个常见的走错路<\/h2>\n<h3>① <code>modding.wiki<\/code> 不托管 STEP 的 Skyrim SE 指南<\/h3>\n<p>实测该域名下的 <code>Skyrim_Special_Edition<\/code>、<code>Guide:Mod_Organizer<\/code>、<code>SkyrimSE:0.1.0<\/code> 三个页面<strong>都返回 Page Not Found<\/strong>。<\/p>\n<p><strong>STEP 的官方 wiki 是 <code>stepmodifications.org<\/code>。<\/strong> 这是一个容易走错的路 —— <code>modding.wiki<\/code> 这个名字听起来太像\"modding 的官方 wiki\"了。<\/p>\n<p>（本工作区另有基于 <code>modding.wiki<\/code> 的资料库，说明该域名确实有内容， 但<strong>它不承载 STEP 的 SE 指南<\/strong>。）<\/p>\n<h3>② 内容农场的\"完整指南\"<\/h3>\n<p>搜索\"Skyrim 2026 完整指南\"之类时，会大量命中一类页面： 域名陌生、标题夸张（\"16K 视差\"\"全光追\"\"终极方案\"）、 正文结构工整但<strong>没有任何具体版本号与文件路径<\/strong>。<\/p>\n<p>这类站点包括但不限于：<code>tsight.io<\/code>、<code>gifpow.com<\/code>、<code>2023game.com<\/code>、 <code>maoxu.com<\/code>、<code>bajiujiu.com<\/code>、<code>233leyuan.com<\/code>，以及部分门户的转载号。<\/p>\n<p><strong>判据<\/strong>：真正的 mod 文档<strong>一定会有版本号、文件路径、Nexus 链接<\/strong>。 一个说不清\"你该装哪个版本的 BodySlide\"的教程，不是教程。<\/p>\n<p>见 <a href=\"../08-sources/unreliable-and-unconfirmed.md\" target=\"_blank\" rel=\"noopener\"><code>../08-sources/unreliable-and-unconfirmed.md<\/code><\/a>。<\/p>\n<h2>一条实用建议<\/h2>\n<blockquote><strong>遇到冲突的说法时，去读 Nexus 描述正文或 GitHub README。<\/strong>  教程会过期、会转述失真、会夹杂作者个人偏好； mod 发布页与仓库 README 是<strong>发版者本人在维护<\/strong>的，且随版本更新。 本资料库所有条目的\"一手\"标记，指向的都是后者。<\/blockquote>\n<h2>来源<\/h2>\n<ul><li>STEP 官方 wiki 与页面可达性：<strong>本工作区实测（2026-09-22）<\/strong><\/li><\/ul>\n<p><code>https://stepmodifications.org/wiki/SkyrimSE:0.1.0<\/code><\/p>\n<ul><li>Wabbajack 文档：<code>https://wiki.wabbajack.org/<\/code> —— <strong>一手<\/strong><\/li><li>GamerPoets：<code>https://www.gamerpoets.com/<\/code> —— <strong>社区资源<\/strong><\/li><li>内容农场域名清单：<strong>本工作区检索过程中识别并排除的域名<\/strong><\/li><\/ul>", "_file": "07-workflow/tutorials-and-guides.md", "_chars": 1803}, {"id": "primary-sources", "title": "一手来源清单", "category": "08-sources", "kind": "reference", "version": "1.0.0", "updated": "2026-09-22", "tags": ["来源", "一手", "清单", "出典"], "aliases": ["来源清单", "一手来源", "sources", "出处", "官方来源"], "source": "https://github.com/ousnius/BodySlide-and-Outfit-Studio", "summary": "本资料库所有条目的出处汇总，按\"Nexus 发布页 / GitHub 仓库 / 官方 wiki / 作者说明 / 社区\"五类列出，便于复核与更新。", "content": "<p>本资料库的<strong>可信层级标记<\/strong>含义：<\/p>\n<table><thead><tr><th style=\"text-align:left\">标记<\/th><th style=\"text-align:left\">含义<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>一手<\/strong><\/td><td style=\"text-align:left\">发版者本人维护的材料：Nexus 发布页描述正文、GitHub 仓库 README/源码、官方 wiki、作者帖<\/td><\/tr><tr><td style=\"text-align:left\"><strong>社区经验<\/strong><\/td><td style=\"text-align:left\">论坛帖、reddit、指南站、他人整理 —— 多帖一致时会注明<\/td><\/tr><tr><td style=\"text-align:left\"><strong>未确认<\/strong><\/td><td style=\"text-align:left\">检索未取得可靠来源，<strong>不要把这类内容当现状陈述<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>本工作区实测<\/strong><\/td><td style=\"text-align:left\">在撰写时实际访问/比对得出的结论<\/td><\/tr><\/tbody><\/table>\n<h2>A. Nexus 发布页（描述正文与 Files 页）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">主题<\/th><th style=\"text-align:left\">URL<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">RaceMenu（SE）<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/19080<\/code><\/td><\/tr><tr><td style=\"text-align:left\">CBBE（SE）<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/198<\/code><\/td><\/tr><tr><td style=\"text-align:left\">CBBE 3BA<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/30174<\/code><\/td><\/tr><tr><td style=\"text-align:left\">BHUNP（SE）<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/31126<\/code><\/td><\/tr><tr><td style=\"text-align:left\">BodySlide and Outfit Studio（SE）<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/201<\/code><\/td><\/tr><tr><td style=\"text-align:left\">XP32 Maximum Skeleton Special Extended<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/1988<\/code><\/td><\/tr><tr><td style=\"text-align:left\">HDT-SMP<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/30872<\/code><\/td><\/tr><tr><td style=\"text-align:left\">Faster HDT-SMP<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/57339<\/code><\/td><\/tr><tr><td style=\"text-align:left\">CBPC<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/21224<\/code><\/td><\/tr><tr><td style=\"text-align:left\">Face Discoloration Fix<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/42441<\/code><\/td><\/tr><tr><td style=\"text-align:left\">EFM / EFA-M / EFA-F<\/td><td style=\"text-align:left\"><code>mods/35785<\/code> / <code>mods/19532<\/code> / <code>mods/19181<\/code><\/td><\/tr><tr><td style=\"text-align:left\">The Eyes of Beauty SSE<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/16185<\/code><\/td><\/tr><tr><td style=\"text-align:left\">Brows / Beards<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/1062<\/code> / <code>mods/1067<\/code><\/td><\/tr><tr><td style=\"text-align:left\">KS Hairdos SSE<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/6817<\/code><\/td><\/tr><tr><td style=\"text-align:left\">ApachiiSkyHair SSE<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/2014<\/code><\/td><\/tr><tr><td style=\"text-align:left\">Face Light<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/5965<\/code><\/td><\/tr><tr><td style=\"text-align:left\">OBody NG<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/77016<\/code><\/td><\/tr><tr><td style=\"text-align:left\">SKSE64<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/30379<\/code><\/td><\/tr><tr><td style=\"text-align:left\">Address Library<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/32444<\/code><\/td><\/tr><tr><td style=\"text-align:left\">PapyrusUtil SE<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/13048<\/code><\/td><\/tr><tr><td style=\"text-align:left\">MCM Helper<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/53000<\/code><\/td><\/tr><tr><td style=\"text-align:left\">po3's Papyrus Extender<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/22854<\/code><\/td><\/tr><tr><td style=\"text-align:left\">Fair Skin Complexion<\/td><td style=\"text-align:left\"><code>https://www.nexusmods.com/skyrimspecialedition/mods/798<\/code><\/td><\/tr><\/tbody><\/table>\n<blockquote>⚠️ 部分 Nexus 页（尤其 CBBE 与 BHUNP）在<strong>成人内容墙<\/strong>后，抓取受限。 本资料库对这些条目标注了\"经转述\"。<\/blockquote>\n<h2>B. GitHub 仓库（源码与 README）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">项目<\/th><th style=\"text-align:left\">仓库<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">RaceMenu / skee64<\/td><td style=\"text-align:left\"><code>https://github.com/expired6978/SKSE64Plugins<\/code><\/td><\/tr><tr><td style=\"text-align:left\">BodySlide and Outfit Studio<\/td><td style=\"text-align:left\"><code>https://github.com/ousnius/BodySlide-and-Outfit-Studio<\/code><\/td><\/tr><tr><td style=\"text-align:left\">HDT-SMP（原始）<\/td><td style=\"text-align:left\"><code>https://github.com/HydrogensaysHDT/hdt-skyrimse-mods<\/code><\/td><\/tr><tr><td style=\"text-align:left\">Faster HDT-SMP<\/td><td style=\"text-align:left\"><code>https://github.com/DaymareOn/hdtSMP64<\/code><\/td><\/tr><tr><td style=\"text-align:left\">Face Discoloration Fix<\/td><td style=\"text-align:left\"><code>https://github.com/Exit-9B/Face-Discoloration-Fix<\/code><\/td><\/tr><tr><td style=\"text-align:left\">OBody NG<\/td><td style=\"text-align:left\"><code>https://github.com/Aietos/OBody-NG<\/code>、<code>https://github.com/Aietos/OBody<\/code><\/td><\/tr><tr><td style=\"text-align:left\">AutoBody<\/td><td style=\"text-align:left\"><code>https://github.com/napmouse/autoBodyAE<\/code><\/td><\/tr><tr><td style=\"text-align:left\">Wabbajack<\/td><td style=\"text-align:left\"><code>https://github.com/halgari/wabbajack<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>C. 官方 wiki<\/h2>\n<table><thead><tr><th style=\"text-align:left\">wiki<\/th><th style=\"text-align:left\">用途<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>UESP<\/strong>（<code>en.uesp.net/wiki/Skyrim_Mod:Mod_File_Format/...<\/code>）<\/td><td style=\"text-align:left\"><code>RACE<\/code> / <code>NPC<\/code> / <code>HDPT<\/code> 记录格式、<code>TINP<\/code> 枚举<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Creation Kit wiki<\/strong>（<code>ck.uesp.net<\/code>）<\/td><td style=\"text-align:left\"><code>HeadPart<\/code>、<code>HeadPart Script<\/code>、<code>Dark Face Bug<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong>Wabbajack wiki<\/strong>（<code>wiki.wabbajack.org<\/code>）<\/td><td style=\"text-align:left\">安装与排错<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Beyond Skyrim Arcane University<\/strong>（<code>wiki.beyondskyrim.org<\/code>）<\/td><td style=\"text-align:left\">NIF 技术细节（社区权威技术文档）<\/td><\/tr><\/tbody><\/table>\n<blockquote>⚠️ <code>creationkit.com<\/code>（CK 官方站）在本轮检索时处于<strong>后端维护停机<\/strong>； <code>ck.uesp.net<\/code> 是它的镜像。<code>Skeleton<\/code> / <code>Havok<\/code> 专页在镜像上缺页 —— 因此本资料库的\"骨骼系统\"条目只能靠<strong>原作者描述 + 引擎常识<\/strong>支撑， 已在相应条目标注。<strong>CK wiki 恢复后建议回头补一手引文。<\/strong><\/blockquote>\n<h2>D. 作者本人说明<\/h2>\n<table><thead><tr><th style=\"text-align:left\">内容<\/th><th style=\"text-align:left\">位置<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">RaceMenu 作者关于 overlay NIF 与 1.7.99 的帖<\/td><td style=\"text-align:left\">Nexus RaceMenu Posts 区<\/td><\/tr><tr><td style=\"text-align:left\">BodySlide 作者解释 <code>.osp<\/code> / <code>.osd<\/code><\/td><td style=\"text-align:left\">LoversLab 帖<\/td><\/tr><tr><td style=\"text-align:left\">FSMP 作者的取代声明与 <code>smp report<\/code><\/td><td style=\"text-align:left\">GitHub README<\/td><\/tr><tr><td style=\"text-align:left\">HPH 作者归属<\/td><td style=\"text-align:left\">Alternate High Poly Head 的 credits<\/td><\/tr><\/tbody><\/table>\n<h2>E. 社区（标注为\"社区经验\"）<\/h2>\n<ul><li><strong>LoversLab<\/strong>：体型术语表、BodyGen 非官方文档（引作者原话）、CBPC 配置与 SMP 共存、<\/li><\/ul>\n<p>穿模与脖缝排查<\/p>\n<ul><li><strong>Nexus 论坛<\/strong>：黑脸成因与修法、RaceMenu 滑块缺失、预设问题、3BA 安装问答<\/li><li><strong>巴哈姆特（home.gamer.com.tw）<\/strong>：中文身材/物理教程<\/li><li><strong>NGA<\/strong>：中文现代打底包推荐<\/li><li><strong>3DM<\/strong>：LE 时代整合包发布帖<\/li><\/ul>\n<h2>来源<\/h2>\n<p>本条目的绝大部分内容<strong>本身就是来源清单<\/strong>，无需再引用。 \"哪些 Nexus 页在成人内容墙后\"与\"CK 官方站停机、镜像缺页\"两条为 <strong>本工作区实测（2026-09-22）<\/strong>。<\/p>", "_file": "08-sources/primary-sources.md", "_chars": 4326}, {"id": "unreliable-and-unconfirmed", "title": "不可信来源与未确认事项", "category": "08-sources", "kind": "reference", "version": "1.0.0", "updated": "2026-09-22", "tags": ["来源", "辨析", "不可信", "未确认", "内容农场"], "aliases": ["不可信来源", "csdn", "假信息", "别信", "ai 生成"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/19080", "summary": "本领域的内容农场/AI 聚合站黑名单与判据，以及撰写时确认过的\"未确认事项\"清单——避免把转述或臆测当成现状。", "content": "<h2>一、不做事实来源的站点类型<\/h2>\n<p>本工作区有一条硬纪律：<strong>不用 CSDN、toolify、AI 聚合站、内容农场<\/strong>。<\/p>\n<h3>已识别并排除的域名（部分）<\/h3>\n<pre class=\"code\"><code>tsight.io        \"深度解析\"类文章，结构工整但无可核验的版本号/路径\ngifpow.com       \"2026 完整指南\"，含夸张断言（\"全光追\"式表述）\n2023game.com     \"梦里 / Dreamlike 整合包\" 等无实证内容\nmaoxu.com / bajiujiu.com / 233leyuan.com\njingyan.baidu.com\n部分门户的转载号（搜狐等，常见\"整合包十大排行\"式文章）<\/code><\/pre>\n<h3>判据（三条，很好用）<\/h3>\n<ol><li><strong>有没有版本号？<\/strong> 真文档会说\"BodySlide 5.8.2\"\"SKSE 2.2.6\"。<\/li><li><strong>有没有文件路径？<\/strong> 真文档会说 <code>Data\\SKSE\\Plugins\\CharGen\\Presets\\<\/code>。<\/li><li><strong>有没有指向发版者的链接？<\/strong> 真文档会链到 Nexus mod ID 或 GitHub 仓库。<\/li><\/ol>\n<p>三条都答不上来的，<strong>无论写得多漂亮都不用<\/strong>。<\/p>\n<h2>二、本领域已知的\"错误知识\"清单<\/h2>\n<p>以下说法在本轮调研中被判定为<strong>错误或被误传<\/strong>，请勿采信：<\/p>\n<table><thead><tr><th style=\"text-align:left\">说法<\/th><th style=\"text-align:left\">实际情况<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>RaceMenu 需要 PapyrusUtil<\/strong><\/td><td style=\"text-align:left\"><strong>不需要<\/strong>。RaceMenu 只要求 SKSE64，<code>skee64.dll<\/code> 自带 NiOverride 与 CharGen<\/td><\/tr><tr><td style=\"text-align:left\"><strong>RaceMenu 的 morph 滑块范围是 -1 到 +1<\/strong><\/td><td style=\"text-align:left\"><strong>不准确<\/strong>。<code>.jslot<\/code> 里存的是浮点（实测样例 <code>0.50000<\/code>）；滑块上限由 <code>RaceMenuMorphs*.psc<\/code> 的 <code>OnSliderRequest<\/code> 中 <code>Float factor<\/code> 决定（社区记录默认 <code>2.0<\/code>）。<strong>以实际界面为准<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>BodySlide 预设可以直接当 RaceMenu 预设用<\/strong><\/td><td style=\"text-align:left\"><strong>不能<\/strong>。<code>.xml<\/code>（0~100，每个滑块存体重 0 与 100 两个值）与 <code>.jslot<\/code>（浮点 <code>bodyMorphs<\/code>）格式、刻度、生效方式都不同，只能逐滑块手工换算<\/td><\/tr><tr><td style=\"text-align:left\"><strong>手动拖 RaceMenu 滑块能改变 NPC 身材<\/strong><\/td><td style=\"text-align:left\"><strong>不能<\/strong>。运行时 morph 只作用于玩家。NPC 要靠 BodyGen / OBody NG / AutoBody 分配，或给单个 NPC 做专属裸体网格<\/td><\/tr><tr><td style=\"text-align:left\"><strong>BodySlide CLI 有 <code>-o<\/code> / <code>-m<\/code> 参数<\/strong><\/td><td style=\"text-align:left\"><strong>不存在<\/strong>。现行参数是 <code>--groupbuild<\/code> / <code>--build<\/code> / <code>--filter<\/code> / <code>--targetdir<\/code> / <code>--preset<\/code> / <code>--trimorphs<\/code> 等<\/td><\/tr><tr><td style=\"text-align:left\"><strong>HPH 的作者是 Kalilies<\/strong><\/td><td style=\"text-align:left\"><strong>不是<\/strong>。是 <strong>KouLeifoh（KLF）<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong><code>modding.wiki<\/code> 是 STEP 的 Skyrim SE 指南<\/strong><\/td><td style=\"text-align:left\"><strong>不是<\/strong>，该域名相关页面 404；STEP 官方 wiki 是 <code>stepmodifications.org<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong>HDT-SMP 的仓库是 <code>hydrogensaysHDT/hdt-skyrim-smp<\/code><\/strong><\/td><td style=\"text-align:left\"><strong>错<\/strong>，实测 404；正确是 <strong><code>hdt-skyrimse-mods<\/code><\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>Skyrim Outfit System 是\"给 NPC 分配身形\"的工具<\/strong><\/td><td style=\"text-align:left\"><strong>不是<\/strong>。它是外观/换装系统。分配身形的是 <strong>BodyGen / OBody NG / AutoBody<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>SPID 的 Outfit Distribution 能分配身形<\/strong><\/td><td style=\"text-align:left\"><strong>不能<\/strong>，它分配的是<strong>服装<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>The Eyes of Beauty SE 的版本是 10.x<\/strong><\/td><td style=\"text-align:left\"><strong>10.x 是 LE 的版本号体系<\/strong>；SE 官方移植是 <strong>1.2<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>CBPC 可以做头发/衣服物理<\/strong><\/td><td style=\"text-align:left\"><strong>不能<\/strong>。头发与衣物必须用 HDT-SMP / FSMP<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\"九大猫 / 醉梦 / 陶德\"是整合包<\/strong><\/td><td style=\"text-align:left\">检索后<strong>均未确认存在<\/strong>（详见 <a href=\"../07-workflow/chinese-modpacks.md\" target=\"_blank\" rel=\"noopener\"><code>../07-workflow/chinese-modpacks.md<\/code><\/a>）<\/td><\/tr><\/tbody><\/table>\n<h2>三、⭐ 未确认事项清单（明确标注，勿当现状）<\/h2>\n<p>以下各项在本轮调研中<strong>未能取得可靠来源<\/strong>，条目中已相应标注：<\/p>\n<table><thead><tr><th style=\"text-align:left\">事项<\/th><th style=\"text-align:left\">状态<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>CBBE SE 当前最新版本<\/strong><\/td><td style=\"text-align:left\">二手来源给出 1.6.1 与 1.6.2，<strong>不一致<\/strong>；Nexus 页在内容墙后<\/td><\/tr><tr><td style=\"text-align:left\"><strong>BHUNP SE 当前最新版本 / 维护状态<\/strong><\/td><td style=\"text-align:left\"><strong>未确认<\/strong>（LE 官方文件可见 1.41V）<\/td><\/tr><tr><td style=\"text-align:left\"><strong>CBBE 3BA 当前最新版本<\/strong><\/td><td style=\"text-align:left\">仅确认到 2.45 左右；存在 3BAv2 迭代<\/td><\/tr><tr><td style=\"text-align:left\"><strong>CBPC 确切最新版本<\/strong><\/td><td style=\"text-align:left\">社区提及约 1.6.x，<strong>未确认<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>XP32 / XPMSSE 5.06 的 changelog 细节<\/strong><\/td><td style=\"text-align:left\">来自镜像站转述，<strong>非 Nexus 原文<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>Brows（Aesthetic）版本<\/strong><\/td><td style=\"text-align:left\">4.0.1 与 4.1.0 两种记录，<strong>未确认唯一最新值<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>KS Hairdos 发型数量<\/strong><\/td><td style=\"text-align:left\">983 与 883 两种口径，统一表述为\"约 980+\"<\/td><\/tr><tr><td style=\"text-align:left\"><strong>\"BHUNP\" 的正式展开式<\/strong><\/td><td style=\"text-align:left\">社区读作 \"UNP Bearer\" 等，<strong>官方未给<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>Facelight Plus 的 Nexus 发布状态与作者<\/strong><\/td><td style=\"text-align:left\">仅见社区指南站，<strong>未确认<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>Better Lighting for Face Light / Facelight Plus 的 Nexus ID<\/strong><\/td><td style=\"text-align:left\"><strong>未确认<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>AutoBody 与 OBody NG 的先后/取代关系<\/strong><\/td><td style=\"text-align:left\">社区说法不一致，<strong>未确认<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>\"Vector Plexus 原域名失效\"<\/strong><\/td><td style=\"text-align:left\">社区传言，<strong>未确认<\/strong>；稳妥来源是 Wabbajack 白名单 GD<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Actor 的 <code>GetNthHeadPart<\/code> / <code>SetNthHeadPart<\/code> 函数页<\/strong><\/td><td style=\"text-align:left\">仅见于 CK wiki <strong>示例<\/strong>，未单独确认<\/td><\/tr><tr><td style=\"text-align:left\"><strong>RaceMenu 的 1.7.99 / CommonLibSSE-NG 版本是否已发布<\/strong><\/td><td style=\"text-align:left\">作者帖中的<strong>计划<\/strong>，未确认已发布<\/td><\/tr><tr><td style=\"text-align:left\"><strong>RaceMenu morph 滑块的精确上下限<\/strong><\/td><td style=\"text-align:left\">社区记录由 <code>OnSliderRequest<\/code> 的 <code>factor<\/code> 决定（默认 2.0），但该讨论针对 <code>RaceMenuMorphsUUNP.psc<\/code>，<strong>未在 CBBE 版脚本上确认<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>「拖 morph 只对玩家与 EFF 随从直接生效」<\/strong><\/td><td style=\"text-align:left\"><strong>未找到来源支持<\/strong>。可确认的只有「只影响玩家」；给单个 NPC 固定身材的途径是「构建专属裸体网格 + ArmorAddon + 设为裸体皮肤」（社区经验）<\/td><\/tr><tr><td style=\"text-align:left\"><strong>CK 官方站在本轮检索时停机<\/strong><\/td><td style=\"text-align:left\">骨骼系统条目因此缺少一手官方引文，<strong>待补<\/strong><\/td><\/tr><\/tbody><\/table>\n<h2>四、为什么要把这一条写进资料库<\/h2>\n<p>因为<strong>转述失真<\/strong>在这个领域特别严重：<\/p>\n<ul><li>版本号在搬运过程中会被\"顺手改新\"；<\/li><li>一个 mod 的依赖清单会被加上它其实不需要的前置；<\/li><li>作者名会被就近联想成另一个知名作者（如 KouLeifoh → Kalilies）。<\/li><\/ul>\n<p><strong>踩过的坑不要踩第二遍。<\/strong> 新增条目时如果发现本清单里的某一项可以确认了， 请<strong>直接更新本条目<\/strong>（提升 <code>version<\/code>），而不是在别处悄悄写一个不同的说法。<\/p>\n<h2>来源<\/h2>\n<ul><li>上表中\"实际情况\"列的各项，其依据均已写在各对应条目的\"来源\"小节中 ——<\/li><\/ul>\n<p>请沿条目内的引用逐条复核<\/p>\n<ul><li>排除域名清单：<strong>本工作区检索过程中识别（2026-09-22）<\/strong><\/li><li>\"三条判据\"：<strong>本工作区总结的方法论<\/strong><\/li><\/ul>", "_file": "08-sources/unreliable-and-unconfirmed.md", "_chars": 3893}];
const CATS = {"00-overview": 5, "01-prerequisites": 2, "02-face": 8, "03-body": 7, "04-physics": 6, "05-distribution": 3, "06-troubleshooting": 6, "07-workflow": 5, "08-sources": 2};
const CAT_LABELS = {"00-overview": "总览", "01-prerequisites": "前置与框架", "02-face": "捏脸（脸部）", "03-body": "身形（体模）", "04-physics": "骨骼与物理", "05-distribution": "NPC 身形分配", "06-troubleshooting": "排错", "07-workflow": "安装实务", "08-sources": "来源与辨析"};
let curCat='all', curQ='', sortBy='cat';

function label(cat){ return CAT_LABELS[cat] || cat; }
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function filtered(){
  const q=curQ.toLowerCase();
  return ENTRIES.filter(e=>{
    if(curCat!=='all' && e.category!==curCat) return false;
    if(q){
      const hay=(e.title+' '+(e.summary||'')+' '+(e.tags||[]).join(' ')+' '+
        (e.aliases||[]).join(' ')+' '+(e.category||'')+' '+label(e.category)).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
// 记录每条命中的原因：优先展示比标题更具体的匹配证据（别名 / 标签 / 正文）
function showWhy(e){
  const q=curQ.toLowerCase(); if(!q) return '';
  if((e.aliases||[]).some(a=>a.toLowerCase().includes(q))) return '别名命中';
  if((e.tags||[]).some(t=>t.toLowerCase().includes(q))) return '标签命中';
  const t=(e.title||'').toLowerCase();
  if(t.includes(q)) return '标题命中';
  if((e.summary||'').toLowerCase().includes(q)) return '摘要命中';
  return '正文提及';
}
function sortEntries(list){
  if(sortBy==='title') return list.sort((a,b)=>(a.title||'').localeCompare(b.title||'','zh'));
  if(sortBy==='updated') return list.sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
  return list; // cat：本已按 category 预排序
}
function renderGrid(){
  const list=sortEntries(filtered());
  const view=document.getElementById('view');
  if(!list.length){view.innerHTML='<div class="empty">没有匹配的条目</div>';return;}
  let html='<div class="grid">';
  for(const e of list){
    const why=showWhy(e);
    html+='<div class="card" data-id="'+esc(e.id)+'"><h3>'+esc(e.title)+'</h3>'+
      (why?'<div><span class="why">'+esc(why)+'</span></div>':'')+
      '<div class="chips" style="margin-bottom:6px">'+
      '<span class="chip">'+esc(label(e.category))+'</span>'+
      (e.kind?'<span class="chip muted">'+esc(e.kind)+'</span>':'')+'</div>'+
      '<p class="sum">'+esc(e.summary||'')+'</p>'+
      '<div class="chips">'+((e.tags||[]).slice(0,4).map(t=>'<span class="chip">'+esc(t)+'</span>').join(''))+'</div></div>';
  }
  html+='</div>';
  view.innerHTML=html;
  view.querySelectorAll('.card').forEach(c=>c.onclick=()=>showDetail(c.dataset.id));
}
function showDetail(id){
  const e=ENTRIES.find(x=>x.id===id); if(!e) return;
  const view=document.getElementById('view');
  const src=e.source?'<a class="btn btn-ghost" href="'+esc(e.source)+'" target="_blank" rel="noopener">官方来源 ↗</a>':'';
  const file=e._file?'<a class="btn btn-primary" href="'+esc(e._file)+'" target="_blank" rel="noopener">打开本地 .md →</a>':'';
  const tags=((e.tags||[]).map(t=>'<span class="chip">'+esc(t)+'</span>').join(''));
  const als=((e.aliases||[]).length?
    '<div class="chips" style="margin:6px 0 0">'+
    (e.aliases||[]).map(a=>'<span class="chip muted">'+esc(a)+'</span>').join('')+'</div>':'');
  view.innerHTML='<button class="back" onclick="renderGrid()">← 返回列表</button>'+
    '<div class="detail"><h2>'+esc(e.title)+'</h2>'+
    '<div class="chips" style="margin-bottom:4px">'+
    '<span class="chip">'+esc(label(e.category))+'</span>'+
    (e.kind?'<span class="chip muted">'+esc(e.kind)+'</span>':'')+
    (e.version?'<span class="chip muted">v'+esc(e.version)+'</span>':'')+
    (e.updated?'<span class="chip muted">'+esc(e.updated)+'</span>':'')+'</div>'+
    '<div class="chips" style="margin:6px 0 10px">'+tags+'</div>'+
    '<div class="article">'+(e.content||'<p>(暂无正文)</p>')+'</div>'+
    '<div class="actions">'+file+src+'</div>'+
    als+
    '<p class="tip">源文件：'+esc(e._file||'')+'</p></div>';
  document.querySelector('main').scrollTop=0;
}
function selectCat(cat,btn){
  curCat=cat;
  document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('active'));
  const target=btn||document.querySelector('#navbox .navbtn[data-cat="'+cat+'"]');
  if(target) target.classList.add('active');
  renderGrid();
}
function setNavCollapsed(collapsed){
  const box=document.getElementById('navbox'), btn=document.getElementById('navtoggle'),
        fab=document.getElementById('navfab'), side=document.querySelector('aside');
  box.classList.toggle('hidden',collapsed);
  if(side) side.classList.toggle('collapsed',collapsed);
  // 侧栏内的按钮只在侧栏可见时有意义：文案恒为「‹ 收起」，收起态的唤出入口交给 #navfab
  if(btn) btn.setAttribute('aria-expanded',String(!collapsed));
  if(fab){ fab.classList.toggle('show',collapsed); fab.setAttribute('aria-expanded',String(!collapsed)); }
  try{localStorage.setItem('kb-nav-collapsed',collapsed?'1':'0');}catch(e){}
}
function toggleNav(){
  setNavCollapsed(document.getElementById('navbox').classList.contains('hidden')===false);
}
function renderNav(){
  const nav=document.getElementById('catnav');
  nav.innerHTML=Object.keys(CATS).map(c=>'<button class="navbtn" data-cat="'+c+'">'+esc(label(c))+' <span class="cnt">'+CATS[c]+'</span></button>').join('');
  // 注意：侧栏「全部」按钮和分类按钮必须在这里统一绑定。
  // 只选 [data-cat]（即分类按钮），避开同处 #navbox 内的状态过滤按钮，
  // 否则「全部」按钮会漏绑 → 选中某分类后切不回全部（历史 bug）。
  document.querySelectorAll('#navbox .navbtn[data-cat]').forEach(b=>b.onclick=()=>selectCat(b.dataset.cat,b));
}
function renderStats(){
  const s=document.getElementById('stats');
  const total=ENTRIES.length;
  document.getElementById('allcnt').textContent=total;
  let h='<span class="stat">共 '+total+' 条</span>';
  for(const c in CATS) h+='<span class="stat">'+esc(label(c))+': '+CATS[c]+'</span>';
  s.innerHTML=h;
}
document.getElementById('q').oninput=e=>{curQ=e.target.value;renderGrid();};
document.getElementById('sort').onchange=e=>{sortBy=e.target.value;renderGrid();};
document.getElementById('navtoggle').onclick=toggleNav;
// 用 IIFE 包一层：TESTS 里也有同名变量，顶层重名会 SyntaxError（check_index_ui 会把两段拼在一起跑）
(function(){ const f=document.getElementById('navfab'); if(f) f.onclick=()=>setNavCollapsed(false); })();
renderStats();renderNav();renderGrid();
// 恢复上次的收起/展开状态
(function(){
  let collapsed=false;
  try{collapsed=localStorage.getItem('kb-nav-collapsed')==='1';}catch(e){}
  if(collapsed) setNavCollapsed(true);
})();
</script>
</body>
</html>
