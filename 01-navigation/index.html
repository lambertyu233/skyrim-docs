<script>
const ENTRIES = [{"id": "troubleshooting-index", "title": "排错索引：从症状找答案", "category": "01-navigation", "kind": "reference", "version": "1.0.0", "updated": "2026-09-21", "tags": ["排错", "索引", "症状", "导航", "入口"], "aliases": ["排错索引", "症状索引", "症状对照", "问题排查", "从症状找", "故障对照", "troubleshooting", "error", "issue"], "source": "本工作区七库汇总（条目路径见下）", "summary": "全工作区的排错入口——按\"你看到的现象\"组织，每条症状直接给出该读哪个库的哪一条，并标出最容易误判的分叉点。", "content": "<p>本工作区七个资料库按<strong>主题<\/strong>组织（捏脸与身形 / OAR / 动作引擎 / Community Shaders / Creation Kit / MO2，外加一个入口索引）。 但你出问题时手里拿的是<strong>症状<\/strong>，不是主题。这页就是那座桥。<\/p>\n<blockquote>用法：直接搜你的现象（如\"T-Pose\"\"贴图糊\"\"改了没反应\"）。 每条给出<strong>该读的条目路径<\/strong>，以及<strong>最容易被误判的分叉点<\/strong>——后者比前者更值钱。 路径均为相对工作区根目录的形式，例如 <code>oar-kb/05-editor/troubleshooting.md<\/code>。<\/blockquote>\n<hr>\n<h2>一、动画、动作、姿势<\/h2>\n<table><thead><tr><th style=\"text-align:left\">你看到的<\/th><th style=\"text-align:left\">该读<\/th><th style=\"text-align:left\">关键分叉（别搞错方向）<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>角色摆大字（T-Pose / A-Pose）<\/strong><\/td><td style=\"text-align:left\"><code>oar-kb/05-editor/troubleshooting.md<\/code>（T-Pose 专项诊断）&lt;br&gt;<code>behaviour-engine-kb/06-practices/troubleshooting-common.md<\/code><\/td><td style=\"text-align:left\"><strong>先分类再动手<\/strong>：开局几秒 = 正常预加载；一直摆且 OAR 的 Replacement Animations 面板为空 = OAR 侧问题；一直摆且行为文件坏了 = 补丁器侧问题。<strong>OAR 的锅不会靠刷 Pandora 解决，反之亦然<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>换了动画完全没反应<\/strong><\/td><td style=\"text-align:left\"><code>oar-kb/05-editor/troubleshooting.md<\/code>&lt;br&gt;<code>oar-kb/08-practices/animation-key-model.md<\/code><\/td><td style=\"text-align:left\">顺序：①文件名是不是游戏请求的那个（换错文件名是头号原因）②旧 DAR 结构是否还在 <code>meshes\\<\/code> 下③有没有重启游戏<\/td><\/tr><tr><td style=\"text-align:left\"><strong>动画换了，但某个状态掉回原版<\/strong><\/td><td style=\"text-align:left\"><code>oar-kb/08-practices/animation-key-model.md<\/code><\/td><td style=\"text-align:left\">那个状态请求的是<strong>另一个文件名<\/strong>。最常见的就是\"一移动就掉回原版\"——移动是独立的一套事件名<\/td><\/tr><tr><td style=\"text-align:left\"><strong>不该换的状态也被换了<\/strong><\/td><td style=\"text-align:left\"><code>oar-kb/03-conditions/conditions-list.md<\/code>（<code>AttackState<\/code>）&lt;br&gt;<code>oar-kb/05-editor/troubleshooting.md<\/code><\/td><td style=\"text-align:left\">条件太宽。典型修法：用 <code>AttackState<\/code> 而不是 <code>IsAttacking<\/code>（后者在整个攻击过程都为真，不区分阶段）<\/td><\/tr><tr><td style=\"text-align:left\"><strong>拉弓拉一半移动就跳成满弓姿势<\/strong><\/td><td style=\"text-align:left\"><code>oar-kb/03-conditions/conditions-list.md<\/code>&lt;br&gt;<code>oar-kb/08-practices/authoring-workflow.md<\/code>（进阶技巧）<\/td><td style=\"text-align:left\">需按 <code>AttackState<\/code> 阶段拆成多个 submod 并开 <code>interruptible: true<\/code>，靠阶段交接<\/td><\/tr><tr><td style=\"text-align:left\"><strong>有个随机动画在跟我的抢<\/strong><\/td><td style=\"text-align:left\"><code>oar-kb/02-structure/config-and-priority.md<\/code>&lt;br&gt;<code>oar-kb/05-editor/troubleshooting.md<\/code><\/td><td style=\"text-align:left\">比优先级；<strong>同优先级<\/strong>会让编辑器报警告<\/td><\/tr><tr><td style=\"text-align:left\"><strong>改了配置但编辑器里没变<\/strong><\/td><td style=\"text-align:left\"><code>oar-kb/05-editor/in-game-editor.md<\/code><\/td><td style=\"text-align:left\">忘了保存（User 模式看左上角有没有橙色 <code>*<\/code>）<\/td><\/tr><tr><td style=\"text-align:left\"><strong>FNIS/Nemesis 报 hkx 不兼容<\/strong><\/td><td style=\"text-align:left\"><code>behaviour-engine-kb/06-practices/troubleshooting-common.md<\/code>&lt;br&gt;<code>oar-kb/08-practices/animation-key-model.md<\/code><\/td><td style=\"text-align:left\">LE 的 32 位 hkx 丢进了 SE。<strong>判定不能看 hkx 标签头<\/strong>（LE/SE 共用），只能与已知可用的 SSE 文件逐字节比对<\/td><\/tr><\/tbody><\/table>\n<h2>二、MO2 与文件覆盖<\/h2>\n<table><thead><tr><th style=\"text-align:left\">你看到的<\/th><th style=\"text-align:left\">该读<\/th><th style=\"text-align:left\">关键分叉<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>文件里有两份，不知道游戏用了哪个<\/strong><\/td><td style=\"text-align:left\"><code>mo2-usvfs-kb/05-usage/conflict-resolution.md<\/code><\/td><td style=\"text-align:left\">mod 列表<strong>越靠下优先级越高<\/strong>。想确认到底读的哪份，开 <code>mo2-usvfs-kb/04-debugging/debugging-usvfs.md<\/code> 的调试日志看 <code>reroute.fileName()<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong>游戏目录里找不到我装的 mod 文件<\/strong><\/td><td style=\"text-align:left\"><code>mo2-usvfs-kb/05-usage/usage-faq.md<\/code>&lt;br&gt;<code>mo2-usvfs-kb/01-mechanism/process-local-links.md<\/code><\/td><td style=\"text-align:left\"><strong>这是正常的<\/strong>，不是故障。mod 物理在 <code>mods\\<\/code>，只在被注入的进程内可见<\/td><\/tr><tr><td style=\"text-align:left\"><strong>工具（LOOT/xEdit/BSA Browser）看不到 mod<\/strong><\/td><td style=\"text-align:left\"><code>mo2-usvfs-kb/06-reference/faq.md<\/code><\/td><td style=\"text-align:left\">必须<strong>从 MO2 内启动<\/strong>该工具，直接双击 exe 看不到虚拟视图<\/td><\/tr><tr><td style=\"text-align:left\"><strong>装完 mod 没生效<\/strong><\/td><td style=\"text-align:left\"><code>mo2-usvfs-kb/05-usage/enable-and-activate.md<\/code><\/td><td style=\"text-align:left\">两步：先勾选启用 mod，<strong>再<\/strong>去 Plugins 页激活其 esp/esm。<strong>插件放在子文件夹里不会被识别<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>MO2 怪问题/注入似乎没生效<\/strong><\/td><td style=\"text-align:left\"><code>mo2-usvfs-kb/06-reference/troubleshooting-vfs.md<\/code><\/td><td style=\"text-align:left\">按顺序查：杀软拦截（常无提示）→ HVCI/Core Isolation → Windows Event Log 服务 → 系统日志被清后需<strong>\"重启\"而非关机<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>profile 切换时 MO2 崩溃<\/strong><\/td><td style=\"text-align:left\"><code>mo2-usvfs-kb/05-usage/profile-switching.md<\/code>&lt;br&gt;<code>mo2-usvfs-kb/06-reference/troubleshooting-vfs.md<\/code><\/td><td style=\"text-align:left\">先排杀软与 Event Log 服务，别急着重建 profile<\/td><\/tr><tr><td style=\"text-align:left\"><strong>警告图标说 mod 顺序有问题<\/strong><\/td><td style=\"text-align:left\"><code>mo2-usvfs-kb/05-usage/warnings-and-order-problems.md<\/code><\/td><td style=\"text-align:left\"><strong>它管的是资源（贴图/网格）覆盖顺序，不是 esp 加载顺序<\/strong>——后者归 LOOT/Plugins 页的 Sort<\/td><\/tr><\/tbody><\/table>\n<h2>三、画质与着色器<\/h2>\n<table><thead><tr><th style=\"text-align:left\">你看到的<\/th><th style=\"text-align:left\">该读<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>装完 CS 后游戏变亮/变暗、光照不对<\/strong><\/td><td style=\"text-align:left\"><code>community-shaders-kb/01-installation/installation-guide.md<\/code>、<code>community-shaders-kb/03-reference/faq.md<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong>从 ENB 迁到 CS 或想两者共存<\/strong><\/td><td style=\"text-align:left\"><code>community-shaders-kb/01-installation/enb-migration.md<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong>某个效果与已有 mod 冲突<\/strong><\/td><td style=\"text-align:left\"><code>community-shaders-kb/03-reference/incompatible-mods.md<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong>不知道某功能该不该开、吃多少性能<\/strong><\/td><td style=\"text-align:left\"><code>community-shaders-kb/00-overview/feature-matrix.md<\/code>、<code>community-shaders-kb/03-reference/faq.md<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong>闪烁 / 阴影异常 / 贴图噪点<\/strong><\/td><td style=\"text-align:left\"><code>community-shaders-kb/06-community/common-pitfalls.md<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>四、Creation Kit 与脚本<\/h2>\n<table><thead><tr><th style=\"text-align:left\">你看到的<\/th><th style=\"text-align:left\">该读<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Papyrus 脚本不编译 / 报编译错<\/strong><\/td><td style=\"text-align:left\"><code>creation-kit-kb/04-scripting/compiling-scripts.md<\/code>、<code>creation-kit-kb/04-scripting/papyrus-language.md<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong>某个事件/函数不知道怎么写<\/strong><\/td><td style=\"text-align:left\"><code>creation-kit-kb/04-scripting/events-reference.md<\/code>、<code>creation-kit-kb/04-scripting/function-reference.md<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong>CK 启动异常 / 找不到 ini<\/strong><\/td><td style=\"text-align:left\"><code>creation-kit-kb/01-installation/ini-files.md<\/code>、<code>creation-kit-kb/01-installation/install-and-launch.md<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>五、动作引擎侧（重刷与补丁）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">你看到的<\/th><th style=\"text-align:left\">该读<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>到底该不该重刷 Nemesis/Pandora？<\/strong><\/td><td style=\"text-align:left\"><code>behaviour-engine-kb/01-principles/patcher-vs-replacer.md<\/code>——<strong>OAR 是 Replacer，改动画不需要重刷<\/strong>；新增动画命令才需要 Patcher<\/td><\/tr><tr><td style=\"text-align:left\"><strong>引擎跑出 0 animations added / 无输出<\/strong><\/td><td style=\"text-align:left\"><code>behaviour-engine-kb/06-practices/troubleshooting-common.md<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong>Nemesis 报 2006 / 1210 / 6001<\/strong><\/td><td style=\"text-align:left\"><code>behaviour-engine-kb/06-practices/troubleshooting-common.md<\/code>（含三个编号的对策）<\/td><\/tr><tr><td style=\"text-align:left\"><strong>读档 CTD<\/strong><\/td><td style=\"text-align:left\"><code>behaviour-engine-kb/06-practices/troubleshooting-common.md<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong>FNIS / Nemesis / Pandora 该选哪个<\/strong><\/td><td style=\"text-align:left\"><code>behaviour-engine-kb/06-practices/choosing-engine.md<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><strong>Pandora 输出只有 txt<\/strong><\/td><td style=\"text-align:left\"><code>behaviour-engine-kb/04-pandora/pandora-troubleshooting.md<\/code>（查 .NET 7 Desktop Runtime 与 <code>Engine.log<\/code>）<\/td><\/tr><\/tbody><\/table>\n<hr>\n<h2>六、捏脸与身形<\/h2>\n<table><thead><tr><th style=\"text-align:left\">你看到的<\/th><th style=\"text-align:left\">该读<\/th><th style=\"text-align:left\">关键分叉<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>捏的脸进游戏是黑的<\/strong><\/td><td style=\"text-align:left\"><code>character-appearance-kb/06-troubleshooting/dark-face.md<\/code><\/td><td style=\"text-align:left\">真因常是<strong>左栏资产优先级与右栏插件顺序不一致<\/strong>，不是某个美化 mod 坏了。先用 Face Discoloration Fix 应急，再用 CK 的 <code>Ctrl+F4<\/code> 正本清源<\/td><\/tr><tr><td style=\"text-align:left\"><strong>脖子/手腕一圈接缝<\/strong><\/td><td style=\"text-align:left\"><code>character-appearance-kb/06-troubleshooting/neck-seam.md<\/code><\/td><td style=\"text-align:left\">先查<strong>头/手/身体是不是同一套皮肤同一档<\/strong>，再查皮肤与身形是否同族（CBBE 与 UNP 的 UV 不通用）。<strong>脖缝修补 mod 是创可贴，不是解法<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>裸体调好了，穿上衣服又变样<\/strong><\/td><td style=\"text-align:left\"><code>character-appearance-kb/03-body/morph-runtime-vs-bake.md<\/code><\/td><td style=\"text-align:left\">那件衣服<strong>没被 3BA 化、不带同名 morph<\/strong>，所以运行时它不动。不是你的操作错了，是那件衣服不支持<\/td><\/tr><tr><td style=\"text-align:left\"><strong>换了 BodySlide 预设后衣服穿模<\/strong><\/td><td style=\"text-align:left\"><code>character-appearance-kb/06-troubleshooting/clipping.md<\/code>&lt;br&gt;<code>character-appearance-kb/03-body/morph-runtime-vs-bake.md<\/code><\/td><td style=\"text-align:left\"><strong>根因是「构建是烘焙、滑块是运行时」<\/strong>：换预设只重烘了身体。正解是 Zeroed Sliders + Build Morphs + Batch Build 全部服装<\/td><\/tr><tr><td style=\"text-align:left\"><strong>RaceMenu 里没有身形滑块<\/strong><\/td><td style=\"text-align:left\"><code>character-appearance-kb/06-troubleshooting/racemenu-sliders-missing.md<\/code><\/td><td style=\"text-align:left\">顺序：① SKSE 版本是否匹配 ② BodySlide 有没有勾 <code>Build Morphs<\/code> ③ <code>RaceMenuMorphs*.esp<\/code> 是否启用 ④ 构建产物是否被别的 mod 覆盖<\/td><\/tr><tr><td style=\"text-align:left\"><strong>身形装了但完全没物理<\/strong><\/td><td style=\"text-align:left\"><code>character-appearance-kb/06-troubleshooting/physics-not-working.md<\/code><\/td><td style=\"text-align:left\">先跑 <code>smp report<\/code>；再查<strong>身形装的是不是 physics 变体<\/strong>（最易忽略）；再查 SMP 与 CBPC 是否在抢同一批骨骼<\/td><\/tr><tr><td style=\"text-align:left\"><strong>NPC 身材全都一样<\/strong><\/td><td style=\"text-align:left\"><code>character-appearance-kb/05-distribution/obody-ng.md<\/code><\/td><td style=\"text-align:left\">运行时 morph <strong>只作用于玩家<\/strong>。NPC 需要分配工具，且它要求你先做过 Zeroed Sliders 的基础构建<\/td><\/tr><tr><td style=\"text-align:left\"><strong>黑脸 / 穿模 / 脖缝同时出现<\/strong><\/td><td style=\"text-align:left\"><code>mo2-usvfs-kb/05-usage/conflict-resolution.md<\/code>&lt;br&gt;<code>character-appearance-kb/07-workflow/mo2-override-rules.md<\/code><\/td><td style=\"text-align:left\"><strong>跨库问题<\/strong>：这些症状共同的<strong>上游<\/strong>是 MO2 的覆盖关系。先理顺左右栏，再回各专项条目<\/td><\/tr><\/tbody><\/table>\n<hr>\n<h2>通用排查纪律（跨库都适用）<\/h2>\n<ol><li><strong>先读日志，再猜原因<\/strong>。每个子系统都有唯一的权威日志：<ul><li>OAR → <code>Documents\\My Games\\Skyrim Special Edition\\SKSE\\OpenAnimationReplacer.log<\/code><\/li><li>Pandora → <code>Engine.log<\/code><\/li><li>MO2 / usvfs → 开调试日志看 <code>hook_*<\/code> 与 <code>reroute.fileName()<\/code><\/li><li>Community Shaders → 见 <code>community-shaders-kb/04-development/testing-and-debugging.md<\/code><\/li><\/ul><\/li><\/ol>\n<p><strong>没有日志证据的结论只是猜测。<\/strong><\/p>\n<ol><li><strong>区分\"没加载\"和\"加载了但没生效\"<\/strong>。这两类的修法完全不同：前者查文件/路径/冲突，后者查条件/优先级。日志是唯一能区分的手段。<\/li><li><strong>别跨层归因<\/strong>。OAR 的问题不会靠重刷补丁器解决，补丁器的问题也不会靠改 OAR 条件解决；MO2 的覆盖问题更不归 LOOT 管。<\/li><li><strong>一次只改一个变量<\/strong>，改完重启游戏。<\/li><\/ol>\n<blockquote>本页是索引，不是正文。条目内容的权威版本始终在各库原文件；改动请改原条目，不要在此处复制正文。<\/blockquote>", "_file": "troubleshooting-index.md", "_chars": 6870}];
const CATS = {"01-navigation": 1};
const CAT_LABELS = {"01-navigation": "跨库导航与排错"};
let curCat='all', curQ='', sortBy='cat';

function label(cat){ return CAT_LABELS[cat] || cat; }
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function filtered(){
  const q=curQ.toLowerCase();
  return ENTRIES.filter(e=>{
    if(curCat!=='all' && e.category!==curCat) return false;
    if(q){
      const hay=(e.title+' '+(e.summary||'')+' '+(e.tags||[]).join(' ')+' '+
        (e.aliases||[]).join(' ')+' '+(e.category||'')+' '+label(e.category)).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
// 记录每条命中的原因：优先展示比标题更具体的匹配证据（别名 / 标签 / 正文）
function showWhy(e){
  const q=curQ.toLowerCase(); if(!q) return '';
  if((e.aliases||[]).some(a=>a.toLowerCase().includes(q))) return '别名命中';
  if((e.tags||[]).some(t=>t.toLowerCase().includes(q))) return '标签命中';
  const t=(e.title||'').toLowerCase();
  if(t.includes(q)) return '标题命中';
  if((e.summary||'').toLowerCase().includes(q)) return '摘要命中';
  return '正文提及';
}
function sortEntries(list){
  if(sortBy==='title') return list.sort((a,b)=>(a.title||'').localeCompare(b.title||'','zh'));
  if(sortBy==='updated') return list.sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
  return list; // cat：本已按 category 预排序
}
function renderGrid(){
  const list=sortEntries(filtered());
  const view=document.getElementById('view');
  if(!list.length){view.innerHTML='<div class="empty">没有匹配的条目</div>';return;}
  let html='<div class="grid">';
  for(const e of list){
    const why=showWhy(e);
    html+='<div class="card" data-id="'+esc(e.id)+'"><h3>'+esc(e.title)+'</h3>'+
      (why?'<div><span class="why">'+esc(why)+'</span></div>':'')+
      '<div class="chips" style="margin-bottom:6px">'+
      '<span class="chip">'+esc(label(e.category))+'</span>'+
      (e.kind?'<span class="chip muted">'+esc(e.kind)+'</span>':'')+'</div>'+
      '<p class="sum">'+esc(e.summary||'')+'</p>'+
      '<div class="chips">'+((e.tags||[]).slice(0,4).map(t=>'<span class="chip">'+esc(t)+'</span>').join(''))+'</div></div>';
  }
  html+='</div>';
  view.innerHTML=html;
  view.querySelectorAll('.card').forEach(c=>c.onclick=()=>showDetail(c.dataset.id));
}
function showDetail(id){
  const e=ENTRIES.find(x=>x.id===id); if(!e) return;
  const view=document.getElementById('view');
  const src=e.source?'<a class="btn btn-ghost" href="'+esc(e.source)+'" target="_blank" rel="noopener">官方来源 ↗</a>':'';
  const file=e._file?'<a class="btn btn-primary" href="'+esc(e._file)+'" target="_blank" rel="noopener">打开本地 .md →</a>':'';
  const tags=((e.tags||[]).map(t=>'<span class="chip">'+esc(t)+'</span>').join(''));
  const als=((e.aliases||[]).length?
    '<div class="chips" style="margin:6px 0 0">'+
    (e.aliases||[]).map(a=>'<span class="chip muted">'+esc(a)+'</span>').join('')+'</div>':'');
  view.innerHTML='<button class="back" onclick="renderGrid()">← 返回列表</button>'+
    '<div class="detail"><h2>'+esc(e.title)+'</h2>'+
    '<div class="chips" style="margin-bottom:4px">'+
    '<span class="chip">'+esc(label(e.category))+'</span>'+
    (e.kind?'<span class="chip muted">'+esc(e.kind)+'</span>':'')+
    (e.version?'<span class="chip muted">v'+esc(e.version)+'</span>':'')+
    (e.updated?'<span class="chip muted">'+esc(e.updated)+'</span>':'')+'</div>'+
    '<div class="chips" style="margin:6px 0 10px">'+tags+'</div>'+
    '<div class="article">'+(e.content||'<p>(暂无正文)</p>')+'</div>'+
    '<div class="actions">'+file+src+'</div>'+
    als+
    '<p class="tip">源文件：'+esc(e._file||'')+'</p></div>';
  document.querySelector('main').scrollTop=0;
}
function selectCat(cat,btn){
  curCat=cat;
  document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('active'));
  const target=btn||document.querySelector('#navbox .navbtn[data-cat="'+cat+'"]');
  if(target) target.classList.add('active');
  renderGrid();
}
function setNavCollapsed(collapsed){
  const box=document.getElementById('navbox'), btn=document.getElementById('navtoggle'), side=document.querySelector('aside');
  box.classList.toggle('hidden',collapsed);
  if(side) side.classList.toggle('collapsed',collapsed);
  btn.textContent=collapsed?'展开 ›':'‹ 收起';
  btn.setAttribute('aria-expanded',String(!collapsed));
  try{localStorage.setItem('kb-nav-collapsed',collapsed?'1':'0');}catch(e){}
}
function toggleNav(){
  setNavCollapsed(document.getElementById('navbox').classList.contains('hidden')===false);
}
function renderNav(){
  const nav=document.getElementById('catnav');
  nav.innerHTML=Object.keys(CATS).map(c=>'<button class="navbtn" data-cat="'+c+'">'+esc(label(c))+' <span class="cnt">'+CATS[c]+'</span></button>').join('');
  // 注意：侧栏「全部」按钮和分类按钮必须在这里统一绑定。
  // 只选 [data-cat]（即分类按钮），避开同处 #navbox 内的状态过滤按钮，
  // 否则「全部」按钮会漏绑 → 选中某分类后切不回全部（历史 bug）。
  document.querySelectorAll('#navbox .navbtn[data-cat]').forEach(b=>b.onclick=()=>selectCat(b.dataset.cat,b));
}
function renderStats(){
  const s=document.getElementById('stats');
  const total=ENTRIES.length;
  document.getElementById('allcnt').textContent=total;
  let h='<span class="stat">共 '+total+' 条</span>';
  for(const c in CATS) h+='<span class="stat">'+esc(label(c))+': '+CATS[c]+'</span>';
  s.innerHTML=h;
}
document.getElementById('q').oninput=e=>{curQ=e.target.value;renderGrid();};
document.getElementById('sort').onchange=e=>{sortBy=e.target.value;renderGrid();};
document.getElementById('navtoggle').onclick=toggleNav;
renderStats();renderNav();renderGrid();
// 恢复上次的收起/展开状态
(function(){
  let collapsed=false;
  try{collapsed=localStorage.getItem('kb-nav-collapsed')==='1';}catch(e){}
  if(collapsed) setNavCollapsed(true);
})();
</script>
</body>
</html>
