闭）。依赖 NRD 降噪。替代 ENB 的 SSAO/IL。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：附加特性<\/li><li>状态：已发布<\/li><li>标签：全局光照, 屏幕空间, 性能<\/li><li>官方来源：https://www.nexusmods.com/skyrimspecialedition/mods/130375<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/additional/ssgi.md", "_chars": 634}, {"id": "scene-manager", "title": "Scene Manager 场景管理器", "category": "02-features", "kind": "core", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["配置", "场景"], "aliases": ["场景管理器", "scene manager", "场景控制"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home", "summary": "按室内/室外、昼夜、天气、地点套用选定 CS 设置。", "content": "<blockquote>分类：核心特性 · 状态：已发布<\/blockquote>\n<p>按室内/室外、昼夜、天气、地点套用选定 CS 设置。<\/p>\n<h2>说明<\/h2>\n<p>可根据不同场景（室内外、时间、天气、位置）自动套用不同的 CS 设置组合。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：核心特性<\/li><li>状态：已发布<\/li><li>标签：配置, 场景<\/li><li>官方来源：https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/core/scene-manager.md", "_chars": 605}, {"id": "screen-space-reflections", "title": "Screen Space Reflections 屏幕空间反射", "category": "02-features", "kind": "additional", "status": "TBA", "version": "1.0.0", "updated": "2026-09-20", "tags": ["反射", "屏幕空间"], "aliases": ["SSR", "屏幕空间反射", "screen space reflections"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home", "summary": "层级化屏幕空间镜面反射。[TBA]", "content": "<blockquote>分类：附加特性 · 状态：开发中 (TBA)<\/blockquote>\n<p>层级化屏幕空间镜面反射。[TBA]<\/p>\n<h2>说明<\/h2>\n<p>开发中（TBA）。层级化（hierarchical）屏幕空间镜面反射。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：附加特性<\/li><li>状态：开发中 (TBA)<\/li><li>标签：反射, 屏幕空间<\/li><li>官方来源：https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/additional/screen-space-reflections.md", "_chars": 648}, {"id": "screen-space-shadows", "title": "Screen Space Shadows 屏幕空间阴影", "category": "02-features", "kind": "core", "status": "released", "version": "1.1.0", "updated": "2026-09-21", "tags": ["阴影", "屏幕空间", "草", "性能"], "aliases": ["SSS", "屏幕空间阴影", "screen space shadows"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home/screen-space-shadows", "summary": "用屏幕空间阴影补齐草、地图、远景与自阴影；是 Bend Studio 方案的定制实现，相对更吃性能。", "content": "<blockquote>分类：核心特性（1.5.0+ 并入） · 状态：已发布<\/blockquote>\n<p>补齐了原版阴影体系缺的那一档：<strong>草阴影、世界地图阴影、远景阴影、自阴影<\/strong>。<\/p>\n<h2>实现来源<\/h2>\n<p>这是 <strong>Bend Studio「Inside Bend: Screen Space Shadows」方案的定制实现<\/strong>，针对 Skyrim 的世界做了视觉改进。<\/p>\n<blockquote>⚠️ 官方明确提示：<strong>相对其它功能，这一项可能比较吃性能。<\/strong> 低端机优先考虑它的取舍。<\/blockquote>\n<h2>与 ENB 的关系<\/h2>\n<p>替代 ENB 的 Shadow / Detailed Shadow 一类方案。这也是<a href=\"../../00-overview/feature-matrix.md\" target=\"_blank\" rel=\"noopener\">官方功能对照矩阵<\/a>里少数 <strong>CS / ENB / CS VR / ENB VR 四方齐备<\/strong>的功能。<\/p>\n<h2>性能取舍<\/h2>\n<p>官方给出的高开销功能候选就包括它所在的阴影体系。请配合 <a href=\"../../04-development/testing-and-debugging.md\" target=\"_blank\" rel=\"noopener\">Performance Overlay 的 Profiling<\/a> 实测，而不是凭猜测关闭。<\/p>\n<h2>贡献者<\/h2>\n<p>doodlum、alandtse、FlayaN。<\/p>\n<hr>\n<p><em>本条目依据官方功能页精修整理；如与官方页面不一致，以官方为准。<\/em><\/p>", "_file": "02-features/core/screen-space-shadows.md", "_chars": 981}, {"id": "screenshot", "title": "Screenshot 截图", "category": "02-features", "kind": "core", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["截图", "HDR"], "aliases": ["游戏内截图", "怎么截图", "CS 截图功能", "拍照"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home", "summary": "不卡顿地捕获带 HDR 能力的截图。", "content": "<blockquote>分类：核心特性 · 状态：已发布<\/blockquote>\n<p>不卡顿地捕获带 HDR 能力的截图。<\/p>\n<h2>说明<\/h2>\n<p>支持 HDR 截图捕获，且不会造成游戏停顿。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：核心特性<\/li><li>状态：已发布<\/li><li>标签：截图, HDR<\/li><li>官方来源：https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/core/screenshot.md", "_chars": 559}, {"id": "sky-sync", "title": "Sky Sync 天空同步", "category": "02-features", "kind": "core", "status": "released", "version": "1.1.0", "updated": "2026-09-21", "tags": ["天空", "天体", "太阳", "月亮", "DynDOLOD"], "aliases": ["天空同步", "sky sync", "天空盒与光照同步"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home/sky-sync", "summary": "把光照、阴影与体积光同步到太阳与月亮的真实位置，并提供更真实的南天弧线日照路径；需生成地形底面网格。", "content": "<blockquote>分类：核心特性（1.7.0+ 并入） · 状态：已发布<\/blockquote>\n<h2>它修的是什么<\/h2>\n<p>原版 Skyrim 的天空有几处根本性错位：<\/p>\n<ul><li><strong>太阳已经越过地平线很久，才慢慢淡入视野<\/strong>；<\/li><li>来自太阳的<strong>光照、阴影、体积光并不发自太阳的真实位置<\/strong>，导致画面不匹配；<\/li><li><strong>月光的行为最糟<\/strong>：它根本不是从月亮发出的，而是来自天上一颗<strong>隐形物体<\/strong>，且该物体在夜间<strong>朝太阳的反方向<\/strong>移动。<\/li><\/ul>\n<p>Sky Sync 通过把太阳与月亮的光照和体积光<strong>同步到它们在天空中的真实位置<\/strong>来解决这些。<\/p>\n<h2>特性<\/h2>\n<ul><li><strong>光照、阴影、体积光与日月同步<\/strong>。<\/li><li><strong>可选的更真实日照路径<\/strong>：太阳沿<strong>南天弧线<\/strong>横穿，室内外光照都更戏剧化，同时<strong>保持原版的白昼长度<\/strong>——「Skyrim 不再位于赤道上」。<\/li><li><strong>太阳在穿越地平线时可见<\/strong>，且位置会<strong>依玩家海拔修正<\/strong>，确保无论玩家在哪，日出日落时间一致。<\/li><li>白天太阳是主光源；<strong>夜间可单独指定哪个月亮作为光源<\/strong>，也可设为在 <strong>Masser 与 Secunda<\/strong> 之间<strong>依亮度平滑切换<\/strong>。<\/li><li>依「是否在地平线之上」与<strong>月相<\/strong>自动调整光照与体积光强度。<\/li><li><strong>室内天空会自动旋转以对齐正北方<\/strong>，为后续的 <em>Interior Sun Shadows<\/em> 铺路——室内日月位置现在能与室外正确对应。<\/li><li>与 CS 的体积光改进和优化搭配良好。<\/li><li><strong>内建对 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/73336\" target=\"_blank\" rel=\"noopener\">Moon and Stars<\/a> 的支持<\/strong>（可选）。<\/li><\/ul>\n<h2>用法：必须生成地形底面（Terrain Underside）<\/h2>\n<blockquote>⚠️ <strong>Sky Sync 需要你的负载顺序里已生成并启用「地形底面网格（Terrain Underside Mesh）」<\/strong>，否则日出日落前后光与体积光会<strong>从地形下方漏出来<\/strong>。<\/blockquote>\n<ul><li>用 <strong>DynDOLOD<\/strong> 生成 LOD 时<strong>勾选 <code>Terrain underside<\/code><\/strong> 即可。只为了生成底面网格而单跑一次 DynDOLOD 也是可以的。<\/li><li>参见 <a href=\"https://dyndolod.info/Help/Terrain-Underside\" target=\"_blank\" rel=\"noopener\">DynDOLOD Terrain Underside 说明<\/a>。<\/li><\/ul>\n<p>默认使用<strong>新的日照路径<\/strong>；想用原版路径，去 Sky Sync 设置菜单里取消勾选。同一个菜单里也能设月光源的行为。<\/p>\n<h2>兼容性<\/h2>\n<ul><li><strong>与实现同类效果的其他 MOD 不兼容，例如 EVLaS。<\/strong> Sky Sync 检测到它们会<strong>自动禁用自己<\/strong>以防出问题。<ul><li>因此官方 Vanilla 设置指南直接写明：<strong>不要用 EVLaS，Sky Sync 已完全取代它。<\/strong><\/li><\/ul><\/li><li>与<strong>所有光照与天气 MOD 兼容<\/strong>。<\/li><li>与 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/73336\" target=\"_blank\" rel=\"noopener\">Moon and Stars<\/a> 兼容（可选）。<\/li><\/ul>\n<h2>相关条目<\/h2>\n<ul><li><a href=\"terrain-shadows.md\" target=\"_blank\" rel=\"noopener\">地形阴影<\/a>（同样受益于地形底面网格）<\/li><li><a href=\"../../03-reference/incompatible-mods.md\" target=\"_blank\" rel=\"noopener\">不兼容 MOD 清单<\/a>（EVLaS / AELaS）<\/li><li><a href=\"../../00-overview/feature-matrix.md\" target=\"_blank\" rel=\"noopener\">官方功能对照矩阵<\/a><\/li><\/ul>\n<h2>贡献者<\/h2>\n<p>sicsix、doodlum、SkrubbySkrubInAShrub。<\/p>\n<hr>\n<p><em>本条目依据官方功能页精修整理；如与官方页面不一致，以官方为准。<\/em><\/p>", "_file": "02-features/core/sky-sync.md", "_chars": 1934}, {"id": "skylighting", "title": "Skylighting 天光遮蔽", "category": "02-features", "kind": "additional", "status": "released", "version": "1.1.0", "updated": "2026-09-21", "tags": ["环境光遮蔽", "户外", "全局光照", "湿润", "性能"], "aliases": ["天光", "天空光照", "天光遮蔽", "skylight", "天空光"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/139352", "summary": "自研的「大规模环境光遮蔽」——烘焙可见性探针并用球谐存储，从各个方向做遮蔽；与 ENB 的同名方案实现方式完全不同。", "content": "<blockquote>分类：附加特性 · 状态：已发布（Nexus 版本 1.2.3，支持 SE / AE / VR）<\/blockquote>\n<p>模拟<strong>大规模的世界空间环境光遮蔽<\/strong>。它属于<strong>全局光照（GI）<\/strong>这个极难的领域。<\/p>\n<p>效果是：<strong>建筑下方、密林之中<\/strong>出现柔和的<strong>环境阴影<\/strong>，在没有直射光的地方增强对比与真实感。官方称它是「我们做过的所有功能里<strong>最具变革性的一个<\/strong>」，且<strong>并非沿用现成技术，而是从零自研<\/strong>。<\/p>\n<h2>与 ENB 的同名功能完全不同<\/h2>\n<table><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:left\">ENB Skylighting<\/th><th style=\"text-align:left\">CS Skylighting<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">实现基础<\/td><td style=\"text-align:left\">用 <strong>shadow map<\/strong><\/td><td style=\"text-align:left\">自研，不依赖阴影贴图<\/td><\/tr><tr><td style=\"text-align:left\">有效性<\/td><td style=\"text-align:left\"><strong>只在正午与午夜前后才正常工作<\/strong>。其它时间会坏掉——会在斜角把一切遮蔽，导致 ENB 预设不得不在日出日落时<strong>关掉 skylighting<\/strong>（否则整张地图变黑）<\/td><td style=\"text-align:left\">全天有效<\/td><\/tr><tr><td style=\"text-align:left\">方向<\/td><td style=\"text-align:left\"><strong>只从一个方向<\/strong>做<\/td><td style=\"text-align:left\"><strong>从各个方向<\/strong>做<\/td><\/tr><tr><td style=\"text-align:left\">开销<\/td><td style=\"text-align:left\">每帧都要算，很贵<\/td><td style=\"text-align:left\">把计算量<strong>分摊到多帧<\/strong>，代价是可能出现偶发的帧时间波动（官方说未来可能分摊得更好）<\/td><\/tr><\/tbody><\/table>\n<h2>连带影响（重要）<\/h2>\n<p>Skylighting 深度接入了 CS 的其它部分：<\/p>\n<ul><li><strong>Wetness 湿润<\/strong>：<strong>有遮蔽的地方会保持干燥<\/strong>——所以<strong>屋檐下不会有积水<\/strong>。未来可能用于积雪/结霜效果。<\/li><li><strong>Dynamic Cubemaps<\/strong>：Skylighting 判定物体何时被天空遮挡，从而<strong>阻止动态立方体贴图在不应出现天空反射的地方渲染天空反射<\/strong>。<\/li><li><strong>水<\/strong>：反射同样改善，并且<strong>额外获得体积环境光照明<\/strong>。<\/li><li><strong>特效<\/strong>：雾与烟也会吃到 skylighting，因此<strong>不会在黑暗里发亮<\/strong>。<\/li><\/ul>\n<h2>算法（官方说明）<\/h2>\n<p><strong>一句话<\/strong>：以快照方式<strong>实时渐进烘焙可见性探针<\/strong>，用光栅化的单向射线。<\/p>\n<p><strong>展开<\/strong>：大约以 <strong>30 帧/秒<\/strong>的速率，渐进地对来自不同光照方向的阴影取平均，近似出「环境光被周围物体遮挡了多少」，并把信息以<strong>球谐（spherical harmonics）<\/strong>的形式存进一个大致以相机为中心的网格里。这些遮蔽信息随后可（随机地）插值，用于<strong>大规模环境光遮蔽<\/strong>以及<strong>去掉屋顶下的湿润<\/strong>。<\/p>\n<blockquote>不需要降噪。但如果开了 TAA / FSR / DLSS，时空蓝噪声（spatio-temporal blue noise）会抖动 skylighting，让它<strong>免费地被模糊掉<\/strong>。<\/blockquote>\n<h2>常见问题（官方 FAQ）<\/h2>\n<p><strong>和 SSGI 有什么不同？<\/strong><\/p>\n<ul><li>SSGI 里的 AO 是<strong>更小尺度、屏幕空间、动态<\/strong>的。<\/li><li>Skylighting 的 AO <strong>尺度更大<\/strong>，<strong>不依赖屏幕内信息<\/strong>，<strong>不随相机移动而变化<\/strong>。只有<strong>静态<\/strong>物体（房屋、树木、地形等）能遮挡；<strong>动态物体只能接收遮蔽<\/strong>。<\/li><li>另外 skylighting 能影响<strong>透明物体和水<\/strong>，并且<strong>在室内会被禁用<\/strong>（室内没有天空）。<\/li><li><strong>官方建议两者一起用<\/strong>，再加上 SSGI 提供的间接光（IL），才是完整效果。<\/li><\/ul>\n<h2>安装与需求<\/h2>\n<ol><li>安装 Community Shaders 及其全部前置。<\/li><li><strong>把本 MOD 装在它下面。<\/strong><\/li><li>（可选）安装 <a href=\"ssgi.md\" target=\"_blank\" rel=\"noopener\">SSGI<\/a>。本 MOD 是为配合 SSGI 设计的，但<strong>并不强制<\/strong>。<\/li><\/ol>\n<h2>兼容性<\/h2>\n<ul><li><strong>与一切兼容。<\/strong><\/li><li>移动或开关物体可能引发问题。官方说<strong>目前没有已知问题<\/strong>，但这是可能性之一；Skylighting 会<strong>尽量不为动态物体渲染遮蔽<\/strong>并持续更新来缓解。<\/li><\/ul>\n<h2>性能提示<\/h2>\n<p>低端机可考虑移除（官方 FAQ 把它列为「低端可移除」的候选之一）。请用 <a href=\"../../04-development/testing-and-debugging.md\" target=\"_blank\" rel=\"noopener\">Profiling<\/a> 实测，而不是凭印象。<\/p>\n<h2>相关条目<\/h2>\n<ul><li><a href=\"ssgi.md\" target=\"<em>blank\" rel=\"noopener\">SSGI<\/a> · <a href=\"wetness-effects.md\" target=\"<\/em>blank\" rel=\"noopener\">Wetness Effects<\/a> · <a href=\"../core/dynamic-cubemaps.md\" target=\"_blank\" rel=\"noopener\">Dynamic Cubemaps<\/a><\/li><li><a href=\"../../00-overview/feature-matrix.md\" target=\"_blank\" rel=\"noopener\">官方功能对照矩阵<\/a><\/li><\/ul>\n<h2>贡献者<\/h2>\n<p>ProfJack（核心算法）、doodlum（逆向、模糊、修复与各种想法）、jonahex（逆向）、FlayaN（VR 支持）。<\/p>\n<hr>\n<p><em>本条目依据官方 Nexus 发布页精修整理；如与官方页面不一致，以官方为准。<\/em><\/p>", "_file": "02-features/additional/skylighting.md", "_chars": 2354}, {"id": "snow-deformation", "title": "Snow Deformation 积雪形变", "category": "02-features", "kind": "additional", "status": "TBA", "version": "1.0.0", "updated": "2026-09-20", "tags": ["雪", "物理"], "aliases": ["积雪形变", "踩雪", "snow deformation", "雪地脚印"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home", "summary": "角色踩过积雪可被压陷并留下持久痕迹。[TBA]", "content": "<blockquote>分类：附加特性 · 状态：开发中 (T  JSON 参数<\/td><\/tr><\/tbody><\/table>\n<p>两者都叫 Subsurface Scattering，但一个是角色后处理、一个是 PBR 材质技法。<\/p>\n<h2>相关条目<\/h2>\n<ul><li><a href=\"../../04-development/pbr-for-artists.md\" target=\"_blank\" rel=\"noopener\">True PBR 美术师指南<\/a>（材质级 SSS、与双层材质互斥）<\/li><li><a href=\"../additional/advanced-skin.md\" target=\"_blank\" rel=\"noopener\">Advanced Skin<\/a>（开发中的进阶皮肤方案，TBA）<\/li><li><a href=\"../additional/hair-specular.md\" target=\"_blank\" rel=\"noopener\">Hair Specular<\/a><\/li><\/ul>\n<h2>贡献者<\/h2>\n<p>doodlum、jiaye、alandtse。<\/p>\n<hr>\n<p><em>本条目依据官方功能页精修整理；如与官方页面不一致，以官方为准。<\/em><\/p>", "_file": "02-features/core/subsurface-scattering.md", "_chars": 1261}, {"id": "terrain-blending", "title": "Terrain Blending 地形混合", "category": "02-features", "kind": "additional", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["地形", "混合"], "aliases": ["地形混合", "terrain blending", "地形接缝"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/157076", "summary": "将地形混合进地形网格，消除接缝。", "content": "<blockquote>分类：附加特性 · 状态：已发布<\/blockquote>\n<p>将地形混合进地形网格，消除接缝。<\/p>\n<h2>说明<\/h2>\n<p>把地形混合到地形网格中，减少地形衔接处的硬边/接缝。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：附加特性<\/li><li>状态：已发布<\/li><li>标签：地形, 混合<\/li><li>官方来源：https://www.nexusmods.com/skyrimspecialedition/mods/157076<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/additional/terrain-blending.md", "_chars": 559}, {"id": "terrain-helper", "title": "Terrain Helper 地形辅助", "category": "02-features", "kind": "additional", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["地形", "纹理"], "aliases": ["地形辅助", "terrain helper", "地形工具"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/143149", "summary": "为非 PBR 地形 MOD 增加额外纹理层以优化贴图。", "content": "<blockquote>分类：附加特性 · 状态：已发布<\/blockquote>\n<p>为非 PBR 地形 MOD 增加额外纹理层以优化贴图。<\/p>\n<h2>说明<\/h2>\n<p>为非 PBR 的景观 MOD 提供额外的纹理层，从而生成更优化的地图。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：附加特性<\/li><li>状态：已发布<\/li><li>标签：地形, 纹理<\/li><li>官方来源：https://www.nexusmods.com/skyrimspecialedition/mods/143149<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/additional/terrain-helper.md", "_chars": 582}, {"id": "terrain-shadows", "title": "Terrain Shadows 地形阴影", "category": "02-features", "kind": "core", "status": "released", "version": "1.1.0", "updated": "2026-09-21", "tags": ["地形", "阴影", "高度图", "xLODGen", "世界地图"], "aliases": ["地形阴影", "terrain shadows", "山体阴影"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home/terrain-shadows", "summary": "无限距离的粗糙地形阴影，游戏内与世界地图都生效；依赖高度图，原版三大世界空间自带，其它需自行生成或用 xLODGen 输出。", "content": "<blockquote>分类：核心特性（1.4.7+ 并入） · 状态：已发布<\/blockquote>\n<p>为地形提供<strong>无限距离的粗糙阴影<\/strong>，在游戏内与世界地图上都生效。<\/p>\n<h2>Height Maps 高度图（关键前提）<\/h2>\n<blockquote>⚠️ <strong>这项功能只有在找到了该世界空间对应的高度图时才会生效。<\/strong><\/blockquote>\n<ul><li><strong>原版高度图已随 CS 提供<\/strong>，覆盖 <strong>Skyrim 本体、Solstheim、Forgotten Vale<\/strong>。<\/li><li>其它世界空间需<strong>自己生成<\/strong>高度图，放到：<\/li><\/ul>\n<pre class=\"code\"><code>(Game Folder)/data/textures/HeightMaps/<\/code><\/pre>\n<ul><li>命名规则：<\/li><\/ul>\n<pre class=\"code\"><code>[worldspace editorID].HeightMap.[West cell].[South cell].[East cell].[North cell].[z black].[z white].[z min].[z max].dds<\/code><\/pre>\n<ul><li>更详细的说明写在 CS 安装目录内：<code>(Game Folder)/Data/textures/HeightMaps/readme.txt<\/code>。<\/li><li><strong>可以直接用 xLODGen 的输出<\/strong>：Terrain Shadows 会自动使用在 xLODGen 产物里找到的任何高度图，<strong>无需额外操作<\/strong>。但 <code>Data/textures/HeightMaps/<\/code> 里的高度图<strong>会覆盖<\/strong> xLODGen 的。<\/li><li>💡 <strong>不需要每次更新 LOD 都重新生成高度图<\/strong>。高度数据通常不变（除世界空间 MOD 外），所以：① 原版文件可用于大多数负载；② 需要生成时，<strong>生成一次基本可以永久使用<\/strong>。<\/li><\/ul>\n<h2>常见问题（官方 FAQ）<\/h2>\n<p><strong>怎么知道当前世界空间有没有找到高度图？<\/strong> → 看 CS 配置界面里 Terrain Shadows 下的<strong>调试菜单<\/strong>。<\/p>\n<p><strong>在哪里能看到效果？<\/strong> → <strong>黎明/黄昏的高山、世界地图上、以及远处<\/strong>。（相机周围的阴影被原版阴影贴图覆盖了。） → 注意<strong>原版太阳角度即使在破晓也相当高<\/strong>。可以搭配 EVLaS 或 <strong>NAT3<\/strong> 这类会大幅压低日出日落太阳角的天气 MOD——但注意：<strong>同时用 Sky Sync 时不要再装 EVLaS<\/strong>（两者互斥）。<\/p>\n<p><strong>兼容世界地图 MOD 吗？<\/strong> → 兼容。<\/p>\n<p><strong>还需要地形底面网格吗？<\/strong> → <strong>对本 MOD 不是必需的<\/strong>；但推荐为 <a href=\"sky-sync.md\" target=\"_blank\" rel=\"noopener\">Sky Sync<\/a> 生成。<\/p>\n<p><strong>为什么允许 <code>HeightMaps<\/code> 目录覆盖 xLODGen 输出？<\/strong> → 官方解释：高度图应当<strong>独立于 xLODGen<\/strong>。两者目的不同：有人可能想要比 xLODGen 更高精度的图，或为了性能用裁剪过的版本。<\/p>\n<h2>相关条目<\/h2>\n<ul><li><a href=\"sky-sync.md\" target=\"_blank\" rel=\"noopener\">Sky Sync<\/a>（推荐配地形底面网格）<\/li><li><a href=\"../../04-development/pbr-for-artists.md\" target=\"_blank\" rel=\"noopener\">True PBR 美术师指南<\/a>（地形 PBR）<\/li><\/ul>\n<h2>贡献者<\/h2>\n<p>ProfJack（编码）、doodlum（CS 框架与重构）、alandtse / FlayaN（框架与重构）、sheson（xLODGen）。<\/p>\n<hr>\n<p><em>本条目依据官方功能页精修整理；如与官方页面不一致，以官方为准。<\/em><\/p>", "_file": "02-features/core/terrain-shadows.md", "_chars": 1823}, {"id": "terrain-variation", "title": "Terrain Variation 地形变化", "category": "02-features", "kind": "additional", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["地形", "平铺"], "aliases": ["地形变化", "terrain variation", "地形细节"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/148123", "summary": "在不损失质量的前提下打破原版地形平铺问题。", "content": "<blockquote>分类：附加特性 · 状态：已发布<\/blockquote>\n<p>在不损失质量的前提下打破原版地形平铺问题。<\/p>\n<h2>说明<\/h2>\n<p>打破原版地形的重复平铺感，且不带来画质下降。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：附加特性<\/li><li>状态：已发布<\/li><li>标签：地形, 平铺<\/li><li>官方来源：https://www.nexusmods.com/skyrimspecialedition/mods/148123<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/additional/terrain-variation.md", "_chars": 569}, {"id": "true-pbr", "title": "True PBR 物理渲染", "category": "02-features", "kind": "core", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["PBR", "材质", "纹理"], "aliases": ["物理渲染", "true pbr", p>原生集成进游戏的完整超分套件，大幅提升性能同时改善画面保真度。<\/p>\n<h2>支持范围（重要更正）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">技术<\/th><th style=\"text-align:left\">支持情况<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>NVIDIA DLSS<\/strong> 超分<\/td><td style=\"text-align:left\">✅ 支持（官方 Nexus 页写 <strong>DLSS 4<\/strong>，用户 wiki 写 <strong>DLSS 4.5<\/strong>，以你下载时的文件说明为准）<\/td><\/tr><tr><td style=\"text-align:left\"><strong>AMD FSR 3.1<\/strong> 超分<\/td><td style=\"text-align:left\">✅ 支持<\/td><\/tr><tr><td style=\"text-align:left\"><strong>AMD FSR Frame Generation<\/strong> 帧生成<\/td><td style=\"text-align:left\">✅ 支持<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Intel XeSS<\/strong><\/td><td style=\"text-align:left\">❌ <strong>不支持<\/strong><\/td><\/tr><\/tbody><\/table>\n<blockquote>⚠️ <strong>XeSS 不受支持。<\/strong> 作者原话大意：Intel 的文档质量极差，尝试联系 Intel 游戏开发者计划时被多次误导、拒绝提供帮助、几乎没有任何支持，因此不做。  网上仍能找到把 XeSS 列为支持方案的二手文章——<strong>那是错的<\/strong>。<\/blockquote>\n<h2>相比 Skyrim Upscaler（DLSS / FSR2 / XeSS）的改进<\/h2>\n<p>官方列的对比清单：<\/p>\n<ul><li>DLSS 下的<strong>闪烁显著减少<\/strong><\/li><li>使用最新的超分更新<\/li><li><strong>可在 HDR 下运行<\/strong><\/li><li><strong>绝大多数菜单里保留 TAA<\/strong><\/li><li><strong>支持帧生成<\/strong><\/li><li><strong>屏幕边缘不再被拉伸<\/strong><\/li><li><strong>全分辨率后处理<\/strong><\/li><li><strong>为纹理锐度优化了 mip bias<\/strong><\/li><li><strong>修正了天空运动矢量<\/strong><\/li><li><strong>改进了反应性（reactive）与透明遮罩<\/strong><\/li><li><strong>完整支持原生 AA（Native AA）<\/strong><\/li><li>修正了 facegen、截图、阴影、视频<\/li><li>修正了雨遮挡与 skylighting<\/li><\/ul>\n<h2>默认行为<\/h2>\n<ul><li>默认设为 <strong>Quality<\/strong>，具体走 <strong>DLSS 还是 FSR 取决于 GPU<\/strong>；<\/li><li><strong>帧生成默认开启<\/strong>。<\/li><\/ul>\n<h2>帧生成<\/h2>\n<ul><li>可<strong>最多把帧率翻倍<\/strong>，且<strong>帧间隔（frame pacing）显著改善<\/strong>，体感更顺滑可靠。<\/li><li>官方称<strong>输入延迟应该没有可感知的增加<\/strong>：帧生成使用 <strong>UI 遮罩<\/strong>，并在菜单中<strong>自动禁用自己<\/strong>以减少鼠标光标延迟；配合 DLSS 时，进入菜单会<strong>降低超分分辨率<\/strong>来补偿帧生成的缺席。<\/li><li><strong>对 Skyrim 极其重要<\/strong>：Skyrim 通常是 <strong>CPU 瓶颈<\/strong>，帧生成能在<strong>不受 draw call 上限影响<\/strong>的情况下提高帧率。<\/li><\/ul>\n<h3>硬性条件<\/h3>\n<blockquote>⚠️ <strong>帧生成仅对 120 Hz 及以上的刷新率生效。<\/strong>  ⚠️ 想用帧生成<strong>必须使用 Windowed 或 Borderless Windowed 模式<\/strong>。<\/blockquote>\n<h2>安装与需求<\/h2>\n<ol><li>安装 Community Shaders 及其全部前置。<\/li><li><strong>安装 SSE Display Tweaks<\/strong>——用它来跑更高帧率并控制垂直同步。<\/li><li>想用帧生成就用 <strong>Windowed / Borderless Windowed<\/strong>。<\/li><li><strong>把本 MOD 装在 CS 下面。<\/strong><\/li><\/ol>\n<h2>相关条目<\/h2>\n<ul><li><a href=\"../../03-reference/incompatible-mods.md\" target=\"_blank\" rel=\"noopener\">不兼容 MOD 清单<\/a>（Skyrim Upscaler、Display Tweaks 的 BorderlessUpscale）<\/li><li><a href=\"../../06-community/common-pitfalls.md\" target=\"_blank\" rel=\"noopener\">实战常见坑<\/a>（帧生成不生效的排查）<\/li><\/ul>\n<h2>贡献者<\/h2>\n<p>doodlum（主要贡献者）。<\/p>\n<hr>\n<p><em>本条目依据官方 Nexus 发布页精修整理；如与官方页面不一致，以官方为准。<\/em><\/p>", "_file": "02-features/additional/upscaling.md", "_chars": 1951}, {"id": "vanilla-fresnel", "title": "Vanilla Fresnel 原版菲涅尔", "category": "02-features", "kind": "core", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["反射", "材质"], "aliases": ["菲涅尔", "fresnel", "vanilla fresnel", "边缘反光"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home", "summary": "为非 PBR 材质添加真实环境反射。", "content": "<blockquote>分类：核心特性 · 状态：已发布<\/blockquote>\n<p>为非 PBR 材质添加真实环境反射。<\/p>\n<h2>说明<\/h2>\n<p>为未启用 PBR 的原版材质补充基于菲涅尔的环境反射，提升反射真实感。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：核心特性<\/li><li>状态：已发布<\/li><li>标签：反射, 材质<\/li><li>官方来源：https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/core/vanilla-fresnel.md", "_chars": 602}, {"id": "volumetric-lighting", "title": "Volumetric Lighting 体积光照", "category": "02-features", "kind": "core", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["体积光", "光照"], "aliases": ["god rays", "volumetric lighting", "丁达尔"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home", "summary": "动态体积光照效果。", "content": "<blockquote>分类：核心特性 · 状态：已发布<\/blockquote>\n<p>动态体积光照效果。<\/p>\n<h2>说明<\/h2>\n<p>提供动态体积光（如光束、雾中光照）效果。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：核心特性<\/li><li>状态：已发布<\/li><li>标签：体积光, 光照<\/li><li>官方来源：https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/core/volumetric-lighting.md", "_chars": 580}, {"id": "volumetric-shadows", "title": "Volumetric Shadows 体积阴影", "category": "02-features", "kind": "core", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["阴影", "粒子"], "aliases": ["体积阴影", "volumetric shadows", "体积光阴影"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home", "summary": "降采样 VSM 阴影贴图，供粒子、贴花等使用。", "content": "<blockquote>分类：核心特性 · 状态：已发布<\/blockquote>\n<p>降采样 VSM 阴影贴图，供粒子、贴花等使用。<\/p>\n<h2>说明<\/h2>\n<p>使用降采样的方差阴影贴图（VSM），为粒子、贴花等效果提供阴影。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：核心特性<\/li><li>状态：已发布<\/li><li>标签：阴影, 粒子<\/li><li>官方来源：https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/core/volumetric-shadows.md", "_chars": 612}, {"id": "water-effects", "title": "Water Effects 水特效", "category": "02-features", "kind": "core", "status": "released", "version": "1.1.0", "updated": "2026-09-21", "tags": ["水", "焦散", "视差", "纹理"], "aliases": ["水特效", "water effects", "水面效果", "水波"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home/water-effects", "summary": "模拟水下焦散并为水面加入为水专门设计的简化视差；视差需支持位移图的水 MOD。", "content": "<blockquote>分类：核心特性（1.4.7+ 并入） · 状态：已发布<\/blockquote>\n<p>模拟水下<strong>焦散<\/strong>，并为水面加入<strong>优化过的视差<\/strong>支持。<\/p>\n<h2>Caustics 焦散<\/h2>\n<p>水下（<strong>仅限大面积水域与河流<\/strong>）可以看到<strong>焦散<\/strong>，并且：<strong>越往深处走，焦散越大、并逐渐淡出<\/strong>。<\/p>\n<ul><li>焦散的<strong>形状随水面曲率变化<\/strong>；<\/li><li><strong>在物体底部会被禁用<\/strong>。<\/li><\/ul>\n<p>实现方式是把一张纹理<strong>滚动、叠加<\/strong>。它是一份<strong>松散文件（loose file）<\/strong>，可以被 MOD 替换。<\/p>\n<blockquote>💡 如果你要替换这张纹理，<strong>请存成 BC4<\/strong> 以获得最佳性能。<\/blockquote>\n<h2>Parallax 视差<\/h2>\n<p>视差为水面补出<strong>深度<\/strong>，模拟更多细节。<\/p>\n<ul><li>每张滚动纹理的<strong>高度会被加总并混合<\/strong>——这是一套<strong>更简单的、专为水设计<\/strong>的视差算法。<\/li><\/ul>\n<h2>需求<\/h2>\n<ol><li>安装 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/86492\" target=\"_blank\" rel=\"noopener\">Community Shaders<\/a> 及其全部前置（该特性已在核心安装里）。<\/li><li><strong>要让视差可见，需要一个提供位移图（displacement map）的兼容水 MOD<\/strong>，例如 <strong>Water for ENB<\/strong> 或 <strong>Simplicity of Seas<\/strong>。<\/li><\/ol>\n<blockquote>另见 <a href=\"unified-water.md\" target=\"<em>blank\" rel=\"noopener\">Unified Water<\/a>（把真实水体瓦片延伸到 LOD，消除远处接缝）与 <a href=\"dynamic-cubemaps.md\" target=\"<\/em>blank\" rel=\"noopener\">Dynamic Cubemaps<\/a>（水反射可横跨整个屏幕）。<\/blockquote>\n<h2>贡献者<\/h2>\n<p>doodlum、davo、jiaye。<\/p>\n<hr>\n<p><em>本条目依据官方功能页精修整理；如与官方页面不一致，以官方为准。<\/em><\/p>", "_file": "02-features/core/water-effects.md", "_chars": 1115}, {"id": "wetness-effects", "title": "Wetness Effects 湿润特效", "category": "02-features", "kind": "additional", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["湿润", "雨", "天气"], "aliases": ["湿润效果", "湿身", "wetness", "下雨潮湿"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/112739", "summary": "动态表面湿润与降雨交互、自定义雨涟漪。", "content": "<blockquote>分类：附加特性 · 状态：已发布<\/blockquote>\n<p>动态表面湿润与降雨交互、自定义雨涟漪。<\/p>\n<h2>说明<\/h2>\n<p>提供动态表面湿润、降雨交互与自定义雨滴涟漪。注意：需在 Skyrim.ini [Display] 关闭 bEnableAutoDynamicResolution=0；N 卡控制面板将 Antialiasing-Transparency 设为关，否则会出现边缘/错误。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：附加特性<\/li><li>状态：已发布<\/li><li>标签：湿润, 雨, 天气<\/li><li>官方来源：https://www.nexusmods.com/skyrimspecialedition/mods/112739<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/additional/wetness-effects.md", "_chars": 670}, {"id": "incompatible-mods", "title": "不兼容 MOD 清单", "category": "03-reference", "version": "1.1.0", "updated": "2026-09-21", "tags": ["兼容", "ENB", "排错", "警告", "照明", "天气"], "aliases": ["不兼容 mod", "CS 冲突", "哪些 mod 不能用", "incompatible"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/faq#what-mods-are-not-compatible-with-cs", "summary": "与 CS 冲突或需调整的 MOD 汇总，分为完全不兼容与需微调两类。", "content": "<blockquote>⚠️ <strong>切勿绕过 CS 的兼容保护<\/strong>——否则失去官方支持且极易 CTD。<\/blockquote>\n<h2>完全不兼容（会导致无法初始化或崩溃）<\/h2>\n<ul><li><strong>ENBSeries<\/strong>：经 <a href=\"https://mod.pub/skyrim-se/415-effects-11\" target=\"<em>blank\" rel=\"noopener\">Effects 11<\/a> 支持未加密预设；详见 <a href=\"../01-installation/enb-migration.md\" target=\"<\/em>blank\" rel=\"noopener\">ENB 迁移指南<\/a>。<\/li><li><strong>Particle lights / ENB lights<\/strong>：1.4–1.7 不支持，1.8 有限支持；建议改用 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/127557\" target=\"_blank\" rel=\"noopener\">Light Placer<\/a>。<\/li><li><strong>Skyrim Upscaler<\/strong>（DLSS / FSR2 / XeSS）：与 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/156952\" target=\"<em>blank\" rel=\"noopener\">Upscaling - CS<\/a> 冲突。注意 CS 的 Upscaling <strong>本身不支持 XeSS<\/strong>（详见 <a href=\"../02-features/additional/upscaling.md\" target=\"<\/em>blank\" rel=\"noopener\">Upscaling 条目<\/a>）。<\/li><li><strong>EVLaS / AELaS<\/strong>：与 <a href=\"../02-features/core/sky-sync.md\" target=\"_blank\" rel=\"noopener\">Sky Sync - CS<\/a> 冲突。Sky Sync <strong>检测到它们会自动禁用自己<\/strong>；官方 Vanilla 设置指南明确要求「不要装 EVLaS」。<\/li><li><strong>ReShade Helper<\/strong><\/li><li><strong>NVIDIA Reflex Support<\/strong><\/li><li><strong>TAA Sharpen<\/strong><\/li><li><strong>SSE Parallax Shader Fix<\/strong>：CS 已取代；删除 <code>d3dcompiler_47.dll<\/code>（Linux 除外）。<\/li><li><strong>Native Mesh Light Flicker Fix<\/strong><\/li><li><strong>Dynamic Wetness<\/strong>：与 PBR 冲突导致发白。<\/li><\/ul>\n<h2>需调整 / 轻微不兼容<\/h2>\n<ul><li><strong>Lux<\/strong>：重装时<strong>不勾选<\/strong> “optimized/particle” 网格；可选 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/153919\" target=\"_blank\" rel=\"noopener\">Lux CS patch<\/a>。<\/li><li><strong>Skyrim Souls<\/strong>：菜单透明，禁用帧生成。<\/li><li><strong>Skyrim Together Reborn<\/strong>：与 Upscaling 同用易崩，玩 STR 时移除此功能。<\/li><li><strong>Alternative Conversation Camera<\/strong>：黑边不兼容，禁用此功能。<\/li><li><strong>Display Tweaks<\/strong>：Borderless upscale 不兼容，用 CS Upscaling；需无边框窗口。<\/li><li><strong>Improved Camera<\/strong>：月球变暗，测试版已修复。<\/li><li><strong>ReShade<\/strong>：深度缓冲特效与帧生成不兼容；1.4 起不支持 UI 屏蔽 ReShade。<\/li><li><strong>Auto Parallax<\/strong>：与 True PBR（experimental）不兼容，用 PGPatcher。<\/li><li><strong>PrivateProfileRedirector<\/strong>：使用 ≥0.6.x。<\/li><li><strong>Simplicity of Snow / Ash<\/strong>：PBR 下多 pass 错误，改用单 pass（如 BDS3）。<\/li><li><strong>Skyrim Platform<\/strong>：多问题。<\/li><li><strong>MARA<\/strong>：致崩且误指 CS。<\/li><\/ul>\n<h2>不再需要（不致崩，功能已集成）<\/h2>\n<ul><li><strong>Capture Warmer<\/strong>、<strong>Sky Reflection Fix<\/strong>：已集成入 CS。<\/li><li><strong>Rim Lighting Removed<\/strong>：CS 自有调整。<\/li><li><strong>Splashes of Storms<\/strong>：CS 湿润特效覆盖（主观可选；Splashes of Skyrim 不同）。<\/li><\/ul>\n<h2>版本演进：被并入核心的特性<\/h2>\n<p>CS 升级后，以下特性被并入核心或他处，<strong>达到对应版本须移除<\/strong>：<\/p>\n<table><thead><tr><th style=\"text-align:left\">特性<\/th><th style=\"text-align:left\">并入核心版本<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Dynamic Cubemaps<\/td><td style=\"text-align:left\">1.0+<\/td><\/tr><tr><td style=\"text-align:left\">Complex Parallax Materials<\/td><td style=\"text-align:left\">1.0+<\/td><\/tr><tr><td style=\"text-align:left\">Water Parallax<\/td><td style=\"text-align:left\">1.0+<\/td><\/tr><tr><td style=\"text-align:left\">Tree LOD Lighting<\/td><td style=\"text-align:left\">1.0+<\/td><\/tr><tr><td style=\"text-align:left\">Light Limit Fix<\/td><td style=\"text-align:left\">1.4+<\/td><\/tr><tr><td style=\"text-align:left\">Frame Generation<\/td><td style=\"text-align:left\">1.4+<\/td><\/tr><tr><td style=\"text-align:left\">Extended Translucency<\/td><td style=\"text-align:left\">1.4.7+<\/td><\/tr><tr><td style=\"text-align:left\">Inverse Square Lighting<\/td><td style=\"text-align:left\">1.4.7+<\/td><\/tr><tr><td style=\"text-align:left\">Terrain Shadows<\/td><td style=\"text-align:left\">1.4.7+<\/td><\/tr><tr><td style=\"text-align:left\">Water Effects<\/td><td style=\"text-align:left\">1.4.7+<\/td><\/tr><tr><td style=\"text-align:left\">Grass Collision<\/td><td style=\"text-align:left\">1.5+<\/td><\/tr><tr><td style=\"text-align:left\">Grass Lighting<\/td><td style=\"text-align:left\">1.5+<\/td><\/tr><tr><td style=\"text-align:left\">Screen-Space Shadows<\/td><td style=\"text-align:left\">1.5+<\/td><\/tr><tr><td style=\"text-align:left\">Subsurface Scattering<\/td><td style=\"text-align:left\">1.5+<\/td><\/tr><tr><td style=\"text-align:left\">Sky Sync<\/td><td style=\"text-align:left\">1.7+<\/td><\/tr><tr><td style=\"text-align:left\">Cloud Shadows<\/td><td style=\"text-align:left\">1.8+<\/td><\/tr><\/tbody><\/table>\n<p>低于指定版本则仍兼容。<\/p>\n<blockquote>各功能的准确纳入版本另见 <a href=\"../00-overview/version-and-support.md\" target=\"_blank\" rel=\"noopener\">版本与支持策略<\/a>。<\/blockquote>\n<h2>照明 MOD 之间的互斥规则<\/h2>\n<p>CS 本身与几乎所有照明 MOD 兼容，但<strong>照明 MOD 彼此之间<\/strong>有一套硬规则（出自官方 Vanilla 设置指南）：<\/p>\n<ul><li>⚠️ <strong>同一时间只用一款室内 + 一款室外照明 MOD。<\/strong><\/li><li>⚠️ <strong>同一时间只用一款天气 MOD<\/strong>（天气 MOD 会改写室外光照）。<\/li><li>⚠️ <strong>不要用 EVLaS<\/strong> —— Sky Sync 已完全取代它。<\/li><li>⚠️ <strong>Modern Lighting Overhaul 2 高于 1.3.6 的版本与 CS 不兼容。<\/strong><\/li><li>⚠️ <strong>Window Shadows Ultimate<\/strong> 与以下互斥：Window Shadows RT、<strong>Lux<\/strong>、ELFX Shadows、Enhanced Lights and FX、Relighting Skyrim (Interiors)、Skyrim is Luminous。<\/li><li>⚠️ <strong>Lux CS<\/strong> 与 <strong>Ambient Templates for Lighting Mods<\/strong>、<strong>Windows Shadows Ultimate<\/strong> 互斥。<\/li><li>⚠️ 任何使用 <strong>ENB Light / ENB Particle Lights<\/strong> 的 MOD 与 CS 不兼容——用了也不会发光，改用 <strong>CS Light / Light Placer<\/strong> 补丁。<\/li><\/ul>\n<blockquote>官方推荐的照明与天气 MOD 清单见 <a href=\"../01-installation/vanilla-setup.md\" target=\"_blank\" rel=\"noopener\">Vanilla 设置指南<\/a>。<\/blockquote>", "_file": "03-reference/incompatible-mods.md", "_chars": 3396}, {"id": "faq", "title": "常见问题解答 (FAQ)", "category": "03-reference", "version": "1.1.0", "updated": "2026-09-21", "tags": ["FAQ", "排错", "兼容", "配置", "错误", "性能", "版本"], "aliases": ["CS 常见问题", "CS FAQ", "community shaders faq", "CS 答疑"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/faq", "summary": "覆盖已知问题、安装、兼容性、配置、开发、错误、性能与通用排查的全部 Q&A。", "content": "<blockquote>内容整理自官方 FAQ。基线：稳定版 <strong>1.8.x<\/strong>（最新补丁 1.8.4，2026-08-26）+ 开发中的 <strong>1.9.0<\/strong>（2026-09）。新增/修订请同步官方并在 CHANGELOG 记录。<\/blockquote>\n<h2>已知问题（截至 2026-09）<\/h2>\n<ul><li><strong>Effects 11<\/strong> 当前在 Nexus Mods 不可用，可在 <a href=\"https://mod.pub/skyrim-se/415-effects-11\" target=\"_blank\" rel=\"noopener\">mod.pub<\/a> 获取。<\/li><li><strong>Skyrim SE 1.7.99 / 1.7.104.0<\/strong> 与 CS 1.8.4 不兼容，计划在 <strong>1.9.0<\/strong> 支持（测试构建可用）。<\/li><li>稳定版与开发版的渠道差异、以及「哪些版本受支持」，见 <a href=\"../00-overview/version-and-support.md\" target=\"_blank\" rel=\"noopener\">版本与支持策略<\/a>。<\/li><li>高频实战问题（黑屏、帧生成不生效、显存、Lux 网格等）另见 <a href=\"../06-community/common-pitfalls.md\" target=\"_blank\" rel=\"noopener\">实战常见坑<\/a>。<\/li><\/ul>\n<h2>安装<\/h2>\n<p><strong>Q：最新 CS 在哪？<\/strong> A：始终在 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/86492\" target=\"_blank\" rel=\"noopener\">Nexus Mods<\/a>。仅官方构建受支持；第三方构建/分支不受支持。开发构建仅在 Discord 相关线程受支持。Discord 上的 Jiaye/后处理构建非官方、未经审核、非为性能设计。<\/p>\n<p><strong>Q：为何某些 MOD 标记为 CS Official？<\/strong> A：CS 开源（GPL-3.0），任何人可发布自己的版本；仅“CS Official”由官方团队发布、符合质量标准并获官方测试/支持。<\/p>\n<p><strong>Q：如何安装 CS？<\/strong> A：见 <a href=\"../01-installation/installation-guide.md\" target=\"<em>blank\" rel=\"noopener\">安装指南<\/a>；从 ENB 迁移见 <a href=\"../01-installation/enb-migration.md\" target=\"<\/em>blank\" rel=\"noopener\">ENB 迁移指南<\/a>。<\/p>\n<p><strong>Q：如何让游戏更好看？<\/strong> A：遵循 <a href=\"../01-installation/vanilla-setup.md\" target=\"_blank\" rel=\"noopener\">Vanilla 设置指南<\/a>。<\/p>\n<p><strong>Q：CS MOD 的顺序？<\/strong> A：CS 功能应无冲突文件，顺序无关。若有冲突，要么操作有误，要么 MOD 页另有说明。<\/p>\n<h2>兼容性<\/h2>\n<p><strong>Q：CS 支持 VR 吗？<\/strong> A：主版本不再支持 VR。VR 或继续 VR 开发请看 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/180419\" target=\"_blank\" rel=\"noopener\">Open Shaders<\/a>。<\/p>\n<p><strong>Q：CS 支持 Linux 吗？<\/strong> A：团队不官方支持，但 Discord 有活跃 Linux 社区可协助。<\/p>\n<p><strong>Q：Skyrim 刚更新，CS 需更新！<\/strong> A：团队已知并在处理，可暂用 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/169962\" target=\"_blank\" rel=\"noopener\">downgrader<\/a> 降级。Steam 降级后设 <code>appmanifest_489830.acf<\/code> 只读；恢复则取消只读并验证文件。CommonLibSSE、Address Library、Engine Fixes 需先更新。<\/p>\n<p><strong>Q：哪些功能与新版 CS 不兼容？<\/strong> A：见 <a href=\"../03-reference/incompatible-mods.md\" target=\"_blank\" rel=\"noopener\">不兼容 MOD-版本演进<\/a> 表格——达到对应版本须移除该功能。<\/p>\n<p><strong>Q：哪些 MOD 与 CS 不兼容？<\/strong> A：见 <a href=\"../03-reference/incompatible-mods.md\" target=\"_blank\" rel=\"noopener\">不兼容 MOD清单<\/a>。切勿绕过 CS 兼容保护。<\/p>\n<p><strong>Q：用 CS 后哪些 MOD 不再需要？<\/strong> A：Capture Warmer、Sky Reflection Fix、Rim Lighting Removed、Splashes of Storms（主观）等已被 CS 集成或覆盖。<\/p>\n<p><strong>Q：还需要 Lux 分流/优化网格吗？<\/strong> A：不需要，安装时取消勾选，否则性能下降。Light Limit Fix 使此类网格无意义。<\/p>\n<p><strong>Q：会有 DLSS 帧生成 / DLSS 5 / FSR 4 / XeSS 吗？<\/strong> A：FSR 4 因需 Vulkan/DX11 不支持（可 OptiScaler 硬改）；DLSSG/XeSS 随 Vulkan 转移研究中；DLSS 5 待 SDK；RTX 40 及更旧不支持 DLSS MFG/5。无路线图。<\/p>\n<p><strong>Q：CS 会支持某旧 Skyrim 版本吗？<\/strong> A：仅计划支持 Steam 最新版与 1.5.97。<\/p>\n<p><strong>Q：哪些 ENB 预设与 Effects 11 不兼容？<\/strong> A：依赖天空散射或 <strong>ENB Worldspace Weatherlists<\/strong> 的预设不兼容；加密预设须先解密（CS 不帮解密）。例如依赖 Silent Horizons 2 / Universal Core（经 ENB Extender 加密）者：Cabbage、Dawnfire、Kauz、Picta；以及 Picta - Weathers of Anubis - Repainted。<\/p>\n<p><strong>Q：Effects 11 不支持 DoF / 预通行？<\/strong> A：刻意未实现（质量低）。用 ReShade 或原版 DoF。CS 后处理将支持 DoF。<\/p>\n<h2>配置<\/h2>\n<p><strong>Q：不用 CS 菜单能改设置吗？<\/strong> A：能。首次改设置后生成 <code>SKSE/Plugins/CommunityShaders/SettingsUser.json<\/code>（MO2 overwrite 或 Data 夹），可直接编辑。<\/p>\n<p><strong>Q：按 End 没反应！<\/strong> A：若已装 CS，暂停菜单应有 <code>Settings &gt; Graphics &gt; Open Community Shaders Menu<\/code>，从中改键 <code>General &gt; Keybindings<\/code> 并保存。若无此项，确认 CS 1.9.0+ 且装好。仍不开则禁用 overlays（RTSS/Fraps）；删 Fraps，禁 RTSS for <code>SkyrimSE.exe<\/code>。<\/p>\n<p><strong>Q：菜单全屏，怎么移动？<\/strong> A：窗体顶部似浏览器标签可拖拽；若隐藏，点左上高亮处显示标签栏。都不行则删 <code>CommunityShaders_ImGui.ini<\/code>（SKSE/Plugins）。<\/p>\n<h2>开发<\/h2>\n<p><strong>Q：我有功能请求？<\/strong> A：发 <code>#cs-feature-request<\/code> 频道；勿发 GitHub Issues 除非开发者要。<\/p>\n<p><strong>Q：能加入开发吗？<\/strong> A：能。经 <a href=\"https://github.com/community-shaders/skyrim-community-shaders\" target=\"<em>blank\" rel=\"noopener\">GitHub<\/a>，读 <a href=\"https://github.com/community-shaders/skyrim-community-shaders/blob/dev/CONTRIBUTING.md\" target=\"<\/em>blank\" rel=\"noopener\">贡献指南<\/a>。可加 Discord <code>#cs-development-discussion<\/code>。AI 辅助可行，未经验证的 vibe coding 不行。<\/p>\n<p><strong>Q：在哪测开发中功能？<\/strong> A：测试构建<strong>不提供常规支持<\/strong>。新功能在 Discord <code>#cs-testing<\/code> 测试，勿在 <code>#support<\/code> 报问题。常是 AIO，须卸旧 CS/功能且无冲突。反馈回原线程。<\/p>\n<h2>错误<\/h2>\n<p><strong>Q：<code>REL/ID.h(223): Failed to open address library file<\/code><\/strong> A：SSE 版本不受支持；若过时须更新，否则<a href=\"../01-installation/installation-guide.md\" target=\"<em>blank\" rel=\"noopener\">降级<\/a>。CS 只支持<a href=\"../01-installation/installation-guide.md\" target=\"<\/em>blank\" rel=\"noopener\">安装指南<\/a>指定版本。<\/p>\n<p><strong>Q：启动报 “Required DLL &lt;...&gt; was missing, will disable all hooks and features”<\/strong> A：检查 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/86492\" target=\"<em>blank\" rel=\"noopener\">Nexus 页<\/a> 需求与<a href=\"../01-installation/installation-guide.md\" target=\"<\/em>blank\" rel=\"noopener\">安装指南<\/a>。常见缺 <code>EngineFixes.dll<\/code>。<\/p>\n<p><strong>Q：功能缺失？“not installed” / “file is missing”？<\/strong> A：从 Nexus 下载<a href=\"../02-features/additional\" target=\"<em>blank\" rel=\"noopener\">附加特性<\/a>；不在 Nexus 即未发布。高级用户可<a href=\"#开发\" target=\"<\/em>blank\" rel=\"noopener\">测开发版<\/a>。<\/p>\n<p><strong>Q：Shaders failed to compile！红色错误！<\/strong> A：多为 CS 与附加特性版本混用，或缓存未重生。<strong>只用最新 Nexus 或单一测试构建，勿混<\/strong>。Effects 11 红错若 ENB 相关，确认预设<a href=\"#兼容性\" target=\"<em>blank\" rel=\"noopener\">受支持<\/a>；加密者不能载。查看游戏内 <code>Feature Issues<\/code> 标签；检查 MOD 管理器冲突；确认无<a href=\"#兼容性\" target=\"<\/em>blank\" rel=\"noopener\">废弃特性<\/a>且皆新；确认无 ENB/Shader Tools（<code>d3d11.dll<\/code>、<code>d3dcompiler_46e.dll<\/code>、Win 下 <code>d3dcompiler_47.dll<\/code>）。Linux 用 <a href=\"https://github.com/SulfurNitride/Fluorine-Manager\" target=\"_blank\" rel=\"noopener\">Fluorine<\/a>。<\/p>\n<p><strong>Q：CS 效果奇怪/坏掉！<\/strong> A：① 禁 CS 看问题是否消失；② 清 overwrite 生成文件（不含 Shaders 夹），重启重编译；③ 建<a href=\"#通用排查建议\" target=\"<em>blank\" rel=\"noopener\">最小设置<\/a>用二分法定位；④ 检查过期功能；⑤ 读本 FAQ。无解则发 Discord 附截图/硬件/日志；若确认 bug 可建 <a href=\"https://github.com/community-shaders/skyrim-community-shaders/issues\" target=\"<\/em>blank\" rel=\"noopener\">GitHub Issue<\/a>。<\/p>\n<p><strong>Q：启动黑屏但有声？<\/strong> A：1.2.0 起独占全屏或渲染/监视器分辨率不符致问题。用<strong>无边框窗口<\/strong>且分辨率匹配监视器。Display Tweaks 无边框放大不支持，用 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/156952\" target=\"_blank\" rel=\"noopener\">Upscaling<\/a>。仍疑 overlay（RTSS/Fraps）致问题；删 Fraps，禁 RTSS for <code>SkyrimSE.exe<\/code>。<\/p>\n<p><strong>Q：着色器编译卡数小时或 CTD<\/strong> A：先装/更 <a href=\"https://learn.microsoft.com/en-us/cpp/windows/latest-supported-vc-redist\" target=\"_blank\" rel=\"noopener\">VC Redist X64<\/a>。弱 CPU 可减 <code>Background Compiler Threads<\/code>/<code>Compiler Threads<\/code>（改 <code>SettingsUser.json<\/code> 或首跑改 <code>SettingsDefault.json<\/code>）。确认受支持 SSE 版、用无边框窗口。仍者发 Discord 崩溃日志。<\/p>\n<p><strong>Q：眼睛为什么亮？<\/strong> A：用 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/154829\" target=\"_blank\" rel=\"noopener\">Improved Eye<\/a>；NPC 需自补或换不此问题 replacer（如 COTR）。<\/p>\n<p><strong>Q：地形无视差/刺状！<\/strong> A：① 用带视差地形纹（如 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/89542\" target=\"<em>blank\" rel=\"noopener\">Atlantean Landscapes<\/a>、<a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/88261\" target=\"<\/em>blank\" rel=\"noopener\">Terrain Blending Fix<\/a>），须全覆否则刺状；② CS 菜单 <code>Extended Materials<\/code> 勾 <code>Enable Legacy Terrain<\/code>（PBR 地形纹不需）。<\/p>\n<p><strong>Q：湿润效果坏、有边、全错<\/strong> A：禁 Skyrim.ini [Display] 中动态分辨率：<code>bEnableAutoDynamicResolution=0<\/code>；N 卡控制面板‘Antialiasing - Transparency’设关。<\/p>\n<p><strong>Q：ENB 预设用 Effects 11 不载！<\/strong> A：① 预设<a href=\"#兼容性\" target=\"<em>blank\" rel=\"noopener\">受支持<\/a>？② 依 <a href=\"https://mod.pub/skyrim-se/415-effects-11\" target=\"<\/em>blank\" rel=\"noopener\">mod.pub 页<\/a> 装：<code>enbseries<\/code> 夹及 <code>enbseries.ini<\/code> 入根目录（或 Data 经管理器，但推荐手动入根）。<\/p>\n<h2>性能<\/h2>\n<p><strong>Q：最耗 CS 功能？<\/strong> A：Screen Space GI（IL 贵，可禁或调 Low）、Effects 11（依预设）、Upscaling（旧系统）、Skylighting（低端可移）。各异，见 <code>Profiling<\/code> 标签。<\/p>\n<p><strong>Q：性能浮层 “Utility”/“Other” 高！<\/strong> A：<code>Utility<\/code> 系阴影等 Bethesda 类型，清 clutter、调阴影设。通用排：调 ini、避高 draw call MOD、查 CPU（单核）/GPU/VRAM 瓶颈、查 FPS 限、减/移 CS 功能、更低 upscaling。用<a href=\"#通用排查建议\" target=\"_blank\" rel=\"noopener\">最小设置<\/a>判断 CS 是否主因。<\/p>\n<p><strong>Q：Load Time Profiler 说 CS 启动慢！<\/strong> A：编译/水生缓存时会误报，缓存后另测。<\/p>\n<h2>通用排查建议<\/h2>\n<p><strong>Q：最小设置（Minimal setup）<\/strong> A：若 FAQ 未解，隔离 CS 排冲。仅启：Community Shaders、页上 “Additional Features” 所列者、Nexus “requirements/off-site requirements” 及彼等所需者。MO2 新档 <code>ctrl+a<\/code> 禁再启列者；Vortex 新档启列者。确认 VC Redist X64 最新。<\/p>\n<p><strong>Q：RenderDoc<\/strong> A：报 bug 时开发者或要捕获（1.4.6+ 内建）。须用官方最新或指定测试构建。步骤：① CS 菜单 <code>RenderDoc<\/code> 选 <code>Enable RenderDoc Capture<\/code>；② <code>Save Settings<\/code> 重开游戏；③ 见左上 WARNING（性能降正常）；④ 复现 bug 留屏内；⑤ 菜单 <code>RenderDoc &gt; Create Capture<\/code> 后 <code>Open Capture Directory<\/code>；⑥ 传第三方托管（Discord 不支大文件）回链开发者。毕后取消勾选并保存禁捕获。<\/p>", "_file": "03-reference/faq.md", "_chars": 6692}, {"id": "pbr-for-artists", "title": "True PBR 美术师与开发者指南", "category": "04-development", "version": "1.0.0", "updated": "2026-09-20", "tags": ["PBR", "纹理", "网格", "开发", "美术"], "aliases": ["PBR 美术指南", "pbr artist", "美术师指南", "做 PBR 材质"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/true-pbr-home", "summary": "面向纹理作者与开发者的 True PBR 完整指南：网格标记、纹理槽位、特殊渲染技法与 MATO。", "content": "<p>PBR（物理基础渲染）近似真实材质对光的反应，被多数现代游戏采用。<strong>True PBR<\/strong> 是 CS 的一部分，优势：<\/p>\n<ul><li>比原版/复杂材质更真实的光照，且可组合视差、次表面散射、自发光、双层材质等；<\/li><li>可使用广泛可得（含免费）的 PBR 材质；<\/li><li>可在 Blender 等标准工具中轻松使用并简单导出；<\/li><li>因 PBR 是行业标准，纹理软件皆为之设计，纹理在工具中与在启用 CS 的 Skyrim 中外观一致，无需按 Skyrim 独特亮度/高光盲目修改。<\/li><\/ul>\n<blockquote>使用 PBR 需要 Community Shaders（基础 CS 已含）与 True PBR 纹理包；纹理包无 CS 无法正确渲染（Creation Kit / Outfit Studio / Bodyslide 中也不会正确）。非纹理作者可忽略下文。<\/blockquote>\n<h2>生成一套 True PBR 纹理（两步）<\/h2>\n<ol><li><strong>更新使用这些纹理的网格以启用 PBR<\/strong>：True PBR 只关心被特定 flag 标记的网格，其余照常渲染。True PBR MOD 因此包含「一组 PBR 纹理 + 标记为 PBR 的网格」，<strong>或<\/strong>包含告诉 PGPatcher 替换哪些纹理路径、对网格应用哪些值的 JSON（后者更推荐，便于重纹理原版模型或盔甲并允许用户套用到 bodyslide 输出）。<\/li><li><strong>创建 True PBR 纹理<\/strong>：基础纹理为 albedo（基础色）、normal（DX 格式）、roughness、metallic、ambient occlusion、specular。部分附加特性还需额外纹理（emissive、parallax 等）。<\/li><\/ol>\n<p>可用 <strong>TruePBR Manager<\/strong> 将一组 PBR 纹理导出为可用 Skyrim MOD（自动处理通道打包、压缩格式、纹理槽、JSON 与文件夹结构）。<\/p>\n<hr>\n<h2>网格修改（.nif）<\/h2>\n<h3>基础<\/h3>\n<p>网格要在 <code>BSLightingShaderProperty<\/code> 中被识别为 PBR，须满足：<\/p>\n<ul><li>默认 shader 类型（除非另有说明）；<\/li><li><code>Shader Flags 2<\/code> 中设置 <code>Unused01<\/code>（或 PBR）flag；<\/li><li>依所用附加特性可能需额外 flag（在各特性小节说明）。<\/li><\/ul>\n<hr>\n<h2>纹理修改<\/h2>\n<h3>通用纹理（槽位从 1 起）<\/h3>\n<ol><li><strong>Base color<\/strong>：RGB 基础色，A 为不透明度。（sRGB 色彩空间 + DDS flag）<\/li><li><strong>Normal<\/strong>：RGB 三通道（DX 格式），A 未用。（线性空间 + DDS flag）<\/li><li><strong>Emissive（可选）<\/strong>：RGB 自发光色，A 未用。（sRGB + DDS flag）<\/li><li><strong>Displacement（可选）<\/strong>：R 为位移，GBA 未用。（BC4 灰度）<\/li><li>未用。<\/li><li><strong>RMAOS<\/strong>：R=roughness，G=metallic，B=AO，A=specular。注意 AO：烘焙 AO 纹理所见即所得——黑/0=满 AO，白/255=无 AO。（线性空间 + DDS flag）<\/li><li><strong>Multilayer normal（可选）<\/strong>：RGB 多层法线，A=roughness（线性）。<strong>Fuzz（可选）<\/strong>：RGB fuzz 色，A fuzz 权重（sRGB）。<\/li><li><strong>Subsurface（可选）<\/strong>：RGB 次表面色，A 次表面不透明度（sRGB）。<strong>Multilayer coat（可选）<\/strong>：RGB 涂层色，A 强度（sRGB）。<\/li><\/ol>\n<p><strong>色彩空间规则<\/strong>：<\/p>\n<ul><li>代表游戏中颜色（base color、emissive、fuzz、coat、subsurface 色）→ <strong>sRGB<\/strong>（部分软件称 gamma 2.2）+ sRGB DDS flag；<\/li><li>也可导出线性并保存线性 DDS，但会在人眼最敏感的光谱段损失精度；<\/li><li>不代表颜色（normal、displacement、rmaos）→ 始终线性 + 线性 DDS。<\/li><\/ul>\n<h3>地形纹理<\/h3>\n<p>四叉片（quad）中任一纹理为 PBR，则整个 quad 按 PBR 渲染；若混有原版风格纹理，内部会做转换使其不太违和，但经验法则是<strong>只发布完整地形 MOD<\/strong>——务必覆盖 DLC（DLC 大量复用基础游戏纹理）。地形 LOD <strong>不会<\/strong>渲染为 PBR（远景混合）；Dyndolod / xlodgen 会在用户侧由你的 PBR 纹理生成原版风格 LOD 纹理。<\/p>\n<hr>\n<h2>特殊渲染技法<\/h2>\n<h3>次表面散射（Subsurface Scattering）<\/h3>\n<p>模拟光在物体内部散射，类似原版 soft lighting 与 back lighting。最适用于树叶、部分织物（旗帜）、蜡烛蜡、龙翼（原版用 back lighting）。注意它始终带 backlighting 效果——玻璃盔甲若开 SSS 会像光穿透角色，务必只在合理处使用。可用烘焙 thickness / transmission 纹理。<\/p>\n<p>参数：<\/p>\n<ul><li><strong>Subsurface Color<\/strong>（替换 Specular Color）：若提供 subsurface 贴图，作为线性乘子。<\/li><li><strong>Subsurface Opacity<\/strong>（替换 Lighting Effect 1）：<strong>越高越弱，越低透光越多<\/strong>。<\/li><li>纹理：槽 8（sRGB）。<\/li><\/ul>\n<p>与双层材质不兼容；与 glint、fuzz、视差、自发光兼容。<\/p>\n<h3>Fuzz（绒毛）<\/h3>\n<p>模拟柔软纤维材质外观（天鹅绒、某些皮毛、桃绒、某些布料）。需：启用 soft lighting flag + multilayer parallax shader 类型；fuzz 纹理入槽 7（fuzz 色 RGB + fuzz 遮罩 A，sRGB）；fuzz color 参数作 fuzz 高光色（无纹理时单独控制，有纹理时作乘子，存前三个 multilayer parallax 参数，建议 [0.08,0.08,0.08] 或 [0.04,0.04,0.04]）；fuzz weight 作遮罩（存第四个参数）。<\/p>\n<p>与双层材质或 glint 不兼容；与 subsurface、视差、自发光兼容。<\/p>\n<p>示例 JSON：<\/p>\n<pre class=\"code\"><code>{\n    \"texture\": \"clothes\\\\example\", \"emissive\": false, \"parallax\": false, \"subsurface\": false, \"specular_level\" : 0.04, \"subsurface_color\": [1,1,1], \"roughness_scale\" : 1, \"subsurface_opacity\" : 1, \"displacement_scale\" : 0,\n    \"fuzz\": { \"texture\": true, \"color\": [1.25,1.25,1.25], \"weight\": 1.0 }\n}<\/code><\/pre>\n<h3>毛发模型（Hair model）<\/h3>\n<p>使用 Marschner 毛发模型（模拟 3D 毛发的漫反射、镜面与散射）。CS PBR 毛发着色仍处实验状态。启用：back lighting flag；无需特殊纹理/参数。它是完全不同的着色模型，与任何其它都不兼容；仅对真实 3D 毛发/皮毛有用（原版盔甲上画出来的皮毛不合适）。角色头发请用 CS 的 <strong>Hair Specular<\/strong> 特性（同技术但更完善）。<\/p>\n<h3>双层材质（Dual Layer Material）<\/h3>\n<p>True PBR 对 Multilayer Parallax 的等价物，用来在常规 PBR 材质上渲染半透明涂层：简单清漆、彩色涂层、涂层法线、层间视差。可用于普通网格（水晶、冰洞壁、stalhrim 盔甲），但<strong>不能用于地形<\/strong>。与 glint、fuzz、SSS 不兼容；与视差、自发光兼容（辉光来自下层）。<\/p>\n<p>参数（由 MultilayerParallax flag + shader 类型启用）：<\/p>\n<ul><li>Coat strength（替换 Lighting Effect 1）：涂层贡献 0–1，作涂层强度纹理（槽 8 alpha）乘子；<\/li><li>Coat roughness（替换 parallax inner layer thickness）：涂层粗糙度，作槽 7 alpha 乘子；<\/li><li>Coat specular level（替换 parallax refraction scale）：涂层反射率，多数材质 0.04，冰用 0.02；<\/li><li>EffectLighting flag：启用漫反射贡献（涂层色）；<\/li><li>SoftLighting：启用层间视差；<\/li><li>BackLighting：启用涂层自有法线（取槽 7 RGB）。<\/li><\/ul>\n<p>额外纹理：槽 4 displacement（同常规视差）；槽 7 涂层法线 RGB + 涂层粗糙度 A；槽 8 涂层色 RGB + 涂层强度 A（sRGB）。<\/p>\n<p>（JSON 中 “coat parallax” 即指层间视差。）<\/p>\n<h3>材质对象（Material Objects / MATO，投影雪、灰等）<\/h3>\n<p>MATO 是 ESP/ESM 中的记录。仅带 <strong>single pass<\/strong> flag 的 MATO 可渲染为 PBR（效果渲染在底层材质之上，贴合其法线与视差）。single pass MATO 与原版 multilayer parallax 及 parallax shader 类型不兼容，但兼容复杂材质。MATO 仅当应用于 PBR 启用表面时才渲染为 PBR。<\/p>\n<p>启用：在插件中设为 single pass，并将同名 editor ID 的 JSON 放入 <code>data/PBRMaterialObjects<\/code>。JSON 中可乘算颜色、高光强度、roughness 缩放，并可选启用 glint 或 fuzz（无纹理时）。<\/p>\n<p>示例 JSON：<\/p>\n<pre class=\"code\"><code>{\n    \"baseColorScale\": [0.98, 0.98, 1.0],\n    \"glintParameters\": {\n        \"densityRandomization\": 5.0, \"enabled\": true,\n        \"logMicrofacetDensity\": 13.0, \"microfacetRoughness\": 1.0, \"screenSpaceScale\": 1.0\n    },\n    \"roughness\": 0.7, \"specularLevel\": 0.02\n}<\/code><\/pre>\n<hr>\n<h2>纹理创建工作流<\/h2>\n<ul><li>使用带 PBR 命名 flag 的 <a href=\"https://github.com/Jonahex\" target=\"_blank\" rel=\"noopener\">Nifskope（Jonahex 版）<\/a> 便于手动改 flag。<\/li><li>测试时搭建测试文件夹并配置 <strong>PGtools<\/strong>（PGPatcher 的 MOD 作者工具，详见 PGPatcher GitHub wiki）以快速批量改动。<\/li><li>选正确 specular 强度：多数材质 0.04；雪/冰/水 0.02；钻石 0.16（按 Reflectance F0 列）。<\/li><\/ul>", "_file": "04-development/pbr-for-artists.md", "_chars": 5086}, {"id": "contributing", "title": "参与贡献", "category": "04-development", "version": "1.0.0", "updated": "2026-09-20", "tags": ["贡献", "开发", "社区", "GitHub", "Discord"], "aliases": ["贡献代码", "怎么参与开发", "提 PR"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders#contributing", "summary": "如何参与 Community Shaders 的代码、文档、测试与着色器贡献。", "content": "<p>Community Shaders 是社区驱动项目，欢迎对<strong>代码、文档、测试、着色器<\/strong>的贡献。<\/p>\n<h2>入口<\/h2>\n<ul><li><strong>GitHub 仓库<\/strong>：<a href=\"https://github.com/community-shaders/skyrim-community-shaders\" target=\"_blank\" rel=\"noopener\">community-shaders/skyrim-community-shaders<\/a><\/li><li><strong>Discord<\/strong>：<a href=\"https://discord.gg/nkrQybAsyy\" target=\"_blank\" rel=\"noopener\">discord.gg/nkrQybAsyy<\/a><\/li><li><strong>贡献指南<\/strong>：<code>CONTRIBUTING.md<\/code>（dev 分支）<\/li><\/ul>\n<h2>方式<\/h2>\n<ul><li><strong>功能请求<\/strong>：Discord <code>#cs-feature-request<\/code> 频道（勿直接发 GitHub Issues，除非开发者要求）。<\/li><li><strong>加入开发<\/strong>：Fork / PR，阅读官方 CONTRIBUTING；可加入 <code>#cs-development-discussion<\/code>。AI 辅助可行，未经验证的 vibe coding 不行。<\/li><li><strong>测试开发中功能<\/strong>：Discord <code>#cs-testing<\/code>（测试构建不提供常规支持，常为 AIO，须卸旧 CS/功能且无冲突；反馈回原线程）。<\/li><li><strong>文档<\/strong>：本资料库即社区文档成果之一——见根目录 <a href=\"../CONTRIBUTING.md\" target=\"_blank\" rel=\"noopener\">CONTRIBUTING.md<\/a> 了解如何协同维护。<\/li><\/ul>\n<h2>本资料库的贡献约定<\/h2>\n<ul><li>每个条目独立成 <code>.md<\/code> 文件，带统一 <code>frontmatter<\/code>（见 <a href=\"../manifest.json\" target=\"_blank\" rel=\"noopener\">manifest.json<\/a> 的 schema）。<\/li><li>新增/删除条目后运行 <code>scripts/build_index.py<\/code> 刷新 <code>index.json<\/code> 与 <code>index.html<\/code>。<\/li><li>功能类条目统一由 <code>scripts/gen_features.py<\/code> 的 <code>FEATURES<\/code> 列表生成，编辑该列表后重跑。<\/li><li>任何内容变更须在 <a href=\"../CHANGELOG.md\" target=\"_blank\" rel=\"noopener\">CHANGELOG.md<\/a> 记录版本与摘要，并递增版本号。<\/li><\/ul>", "_file": "04-development/contributing.md", "_chars": 1221}, {"id": "testing-and-debugging", "title": "测试与调试手法", "category": "04-development", "version": "1.0.0", "updated": "2026-09-21", "tags": ["开发", "调试", "测试", "ShaderDefines", "性能", "官方"], "aliases": ["CS 调试", "测试手法", "shader 调试", "debug cs"], "source": "https://github.com/community-shaders/skyrim-community-shaders/wiki", "summary": "官方 Developer Wiki 的调试手法：A/B 对比测试、TESTCUBEMAP、Shader Defines（含 LLFDEBUG）、灯光编辑器、性能分析与抓帧。", "content": "<p>这些手法全部来自<strong>官方 GitHub Developer Wiki<\/strong>，官方用户 wiki 上没有。调画质参数时尤其有用——靠肉眼在两次启动之间「记忆对比」几乎必然出错，用 A/B 测试才能看见真实差异。<\/p>\n<h2>A/B 对比测试（Test Interval）<\/h2>\n<p>官方内置了一个「按固定间隔在两套设置之间自动切换」的模式，用来客观对比两种视觉效果：<\/p>\n<ol><li>调好第一套设置 → 点 <strong>Save Settings<\/strong>。这套会写入 <code>CommunityShadersUSER.json<\/code>，界面上显示为 <code>User Mode<\/code>。<\/li><li>改成第二套设置。这套显示为 <code>Test Mode<\/code>。<\/li><li>在 <strong>Advanced<\/strong> 菜单里找到 <code>Test Interval<\/code> 滑块。<\/li><li>设成任意<strong>非零<\/strong>值（单位：秒，即每套设置停留多久后切换）。此时会生成新的配置文件 <code>CommunityShadersTEST.json<\/code>；屏幕左上角会出现倒计时，你也可以盯着第 2 步改动的参数，确认它们确实在来回切。<\/li><li>退出：把 <code>Test Interval<\/code> 设回 <strong>0<\/strong>。第 2 步的设置会保留。<\/li><li>想恢复默认：点 <strong>Load Settings<\/strong>。<\/li><\/ol>\n<blockquote>实操建议：一次只改<strong>一个<\/strong>变量（例如只动 Skylighting 强度或 SSGI 的 GI 强度），让 Test Interval 在 3–5 秒间切换，看几轮就能判断差异是否真实存在。<\/blockquote>\n<h2>Dynamic Cubemaps 反射测试模式<\/h2>\n<p>想知道某个物体到底有没有吃到动态立方体贴图反射，可以让<strong>几乎任何表面变成满反射面<\/strong>（瓶子、药水最能看出来）：<\/p>\n<ol><li><strong>Advanced → Shader Defines<\/strong> 里填入 <code>TESTCUBEMAP<\/code>。<\/li><li>如果开了 Disk Cache，先 <strong>Clear Disk Cache<\/strong>。<\/li><li>再 <strong>Clear Shader Cache<\/strong>。<\/li><li>对着物体看，环境会映在物品上。<\/li><\/ol>\n<h2>Shader Defines：通用调试开关<\/h2>\n<p><strong>Advanced → Shader Defines<\/strong> 是官方的调试入口，填入预定义字符串即可开启对应调试可视化。已知的两个：<\/p>\n<table><thead><tr><th style=\"text-align:left\">定义<\/th><th style=\"text-align:left\">作用<\/th><th style=\"text-align:left\">出处<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><code>TESTCUBEMAP<\/code><\/td><td style=\"text-align:left\">把表面变成满反射，检验动态立方体贴图<\/td><td style=\"text-align:left\">Developer Wiki<\/td><\/tr><tr><td style=\"text-align:left\"><code>LLFDEBUG<\/code><\/td><td style=\"text-align:left\">开启光照可视化<\/td><td style=\"text-align:left\">Light Limit Fix 功能页<\/td><\/tr><\/tbody><\/table>\n<h3>LLFDEBUG：看灯光上限<\/h3>\n<p>在 <strong>Advanced → Shader Defines<\/strong> 加上 <code>LLFDEBUG<\/code> 后，Light Limit Fix 提供 3 种可视化：<\/p>\n<ul><li>可视化「灯限是否已达」：达到<strong>严格灯限<\/strong>（portal-strict lights）时显示<strong>红色<\/strong>；<\/li><li>可视化严格灯数；<\/li><li>可视化聚簇（clustered）灯数。<\/li><\/ul>\n<blockquote>官方注明这是<strong>开发者调试功能，不面向正常游戏<\/strong>。配合它排查「进屋就变暗/闪烁」这类问题很有效。<\/blockquote>\n<h2>Light Editor：实时改灯<\/h2>\n<p><strong>Inverse Square Lighting<\/strong> 自带一个灯光编辑器（CS 菜单 → Inverse Square Lighting 设置里）。可以实时看改灯的效果，包括开关平方反比、调光色与强度。<\/p>\n<p>两条官方警告：<\/p>\n<ul><li><strong>编辑器不面向游戏玩法<\/strong>。使用期间<strong>不建议存档<\/strong>，可能引发问题。<\/li><li><strong>改动不能直接保存<\/strong>，只能把数值抄进 xEdit 或 Light Placer 的 JSON 配置。<\/li><\/ul>\n<h2>性能分析<\/h2>\n<ul><li><strong>Performance Overlay<\/strong>：实时帧率、draw call、各功能耗时。菜单里有 <code>Profiling<\/code> 标签（排查性能先看这里）。概念上要区分 <code>Utility<\/code> / <code>Other<\/code> 这类 Bethesda 自身的开销（阴影等）与 CS 功能自身的开销。<\/li><li><strong>Load Time Profiler 会误报<\/strong>：编译着色器 / 生成水体缓存的那几次启动，它会说 CS 拖慢启动。等缓存生成完再测才是真实值。<\/li><li>官方给出的高开销功能候选：<strong>Screen Space GI<\/strong>（间接光贵，可关或降 Low）、<strong>Effects 11<\/strong>（取决于预设）、<strong>Upscaling<\/strong>（在老系统上）、<strong>Skylighting<\/strong>（低端机可考虑关闭）。但官方强调<strong>因机而异<\/strong>，务必自己看 Profiling。<\/li><\/ul>\n<h2>抓帧（RenderDoc）<\/h2>\n<p>CS 1.4.6+ 内建 RenderDoc 支持。报 bug 时开发者常会索要一份捕获：<\/p>\n<ol><li>CS 菜单 → <code>RenderDoc<\/code> → 勾选 <code>Enable RenderDoc Capture<\/code>；<\/li><li><code>Save Settings<\/code>，重启游戏；<\/li><li>左上会显示 WARNING（性能下降是正常的）；<\/li><li>复现 bug，把画面留在屏幕上；<\/li><li>菜单 <code>RenderDoc &gt; Create Capture<\/code>，再 <code>Open Capture Directory<\/code>；<\/li><li>传到第三方托管（Discord 传不了大文件），把链接回给开发者；<\/li><li>完成后<strong>取消勾选并保存<\/strong>，关闭捕获。<\/li><\/ol>\n<h2>其他开发者向开关<\/h2>\n<ul><li><strong>Remote Control<\/strong>：把开发者工具暴露给外部 <code>devbench<\/code>，用于 <strong>AI 辅助开发<\/strong>（属核心特性）。<\/li><li><strong>CS Editor<\/strong>：实时天气与 imagespace 编辑器，服务 MOD 制作。<\/li><li><strong>pbr 详细日志<\/strong>：1.8.4 起 PBR 提供一个 verbose log 选项，用来压掉刷屏日志。<\/li><li><strong>Feature Issues 标签<\/strong>：游戏内菜单里有该标签，直接列出功能层面的问题（排「着色器编译失败」时先看它）。<\/li><\/ul>\n<h2>缓存操作速查<\/h2>\n<table><thead><tr><th style=\"text-align:left\">操作<\/th><th style=\"text-align:left\">什么时候用<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Clear Shaders<\/strong>（UI 右上角）<\/td><td style=\"text-align:left\">改 Shader Defines、做着色器开发与热加载<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Clear Disk Cache<\/strong><\/td><td style=\"text-align:left\">改了 Shader Defines、换了 CS 版本、想强制重编译<\/td><\/tr><tr><td style=\"text-align:left\">手动删 <code>Data/ShaderCache<\/code>（MO2 为 <code>Overwrite/ShaderCache<\/code>）<\/td><td style=\"text-align:left\">更新 CS 后没弹「Compiling Shaders」<\/td><\/tr><tr><td style=\"text-align:left\">顺手删 <code>UnifiedWaterCache<\/code><\/td><td style=\"text-align:left\">同上（官方建议「顺手一起删更保险」）<\/td><\/tr><\/tbody><\/table>\n<blockquote>铁律：<strong>只删 <code>ShaderCache<\/code>，绝不删 <code>Shaders<\/code><\/strong>。<code>ShaderCache<\/code> 里应当能找到逐层嵌套的 <code>.pso<\/code> / <code>.vso<\/code> 文件，用这个来确认自己没删错目录。详见 <a href=\"../00-overview/architecture.md\" target=\"_blank\" rel=\"noopener\">架构与缓存系统<\/a>。<\/blockquote>\n<h2>相关条目<\/h2>\n<ul><li><a href=\"../00-overview/architecture.md\" target=\"_blank\" rel=\"noopener\">架构与缓存系统<\/a><\/li><li><a href=\"../03-reference/faq.md\" target=\"_blank\" rel=\"noopener\">FAQ - 通用排查建议<\/a><\/li><li><a href=\"contributing.md\" target=\"_blank\" rel=\"noopener\">贡献指南<\/a><\/li><\/ul>", "_file": "04-development/testing-and-debugging.md", "_chars": 3464}, {"id": "light-placer", "title": "Light Placer（光照放置器）", "category": "05-tools", "version": "1.0.0", "updated": "2026-09-20", "tags": ["工具", "光照", "JSON", "ENB替代"], "aliases": ["Light Placer", "光照放置器", "摆光源", "放灯"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/light-placer-home", "summary": "通过 JSON 将可配置的真实光源附加到物体与角色，是 ENB Light 的社区替代。", "content": "<p><strong>Light Placer<\/strong> 是一个框架型工具，允许 MOD 作者通过 <code>.json<\/code> 文件把<strong>真实灯泡<\/strong>附加到各种网格与引用（reference）上。因为灯泡是真实的，它们也影响潜行（stealth）。<\/p>\n<h2>为什么需要它<\/h2>\n<ul><li>ENB Light 在 CS 中<strong>仅有限支持<\/strong>（且不再承诺广泛支持）。<\/li><li>社区公认的 ENB Light 替代是 <strong>Light Placer<\/strong>。<\/li><\/ul>\n<h2>工作机制<\/h2>\n<ul><li>它是一个<strong>框架<\/strong>，自身不做任何事；需要各 MOD 提供 JSON 配置来“附加灯泡”。<\/li><li>最流行的附加组件是 <strong>CS Light<\/strong>：把灯泡附加到许多原本靠 ENB Light 照亮的原版网格，并为一些流行 ENB Light MOD 提供补丁。<\/li><li>相比 ENB Light，Light Placer 的补丁<strong>更容易创建<\/strong>。<\/li><\/ul>\n<h2>使用建议<\/h2>\n<ul><li>安装 Light Placer 时请遵循其说明与前置要求。<\/li><li>从 ENB 迁移时：在 MOD 列表中搜索含 “ENB Light” 的项并禁用（注意 MLO2 等未在名称中明示的依赖）。移除后用 Light Placer + CS Light 替代以维持发光。<\/li><li>安装任何照明 MOD 前，<strong>先装 Light Placer 与 CS Light<\/strong>（见 <a href=\"../01-installation/vanilla-setup.md\" target=\"_blank\" rel=\"noopener\">Vanilla 设置指南<\/a>）。<\/li><\/ul>\n<blockquote>更多细节与 JSON 格式请参考官方 Light Placer 页面与 Discord。<\/blockquote>", "_file": "05-tools/light-placer.md", "_chars": 1013}, {"id": "pgpatcher", "title": "PGPatcher（Parallax / PBR 修补器）", "category": "05-tools", "version": "1.0.0", "updated": "2026-09-20", "tags": ["工具", "PBR", "视差", "网格修补", "纹理"], "aliases": ["Parallax 修补", "PBR 修补", "PGPatcher 怎么用", "视差贴图修补", "pgpatcher 报错"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/pgpatcher-home", "summary": "独立工具，修补纹理 MOD 的加载顺序（视差 / 复杂材质 / PBR），是 True PBR 工作流核心。", "content": "<p><strong>PGPatcher<\/strong> 是一个独立工具，用于修补纹理 MOD 的加载顺序，覆盖 <strong>视差（parallax）/ 复杂材质（CM）/ PBR<\/strong> 三类需求。它是 True PBR 工作流的核心组件。<\/p>\n<h2>在 True PBR 中的角色<\/h2>\n<p>True PBR 依赖被标记 PBR 的网格。PGPatcher 让 MOD 作者不必随包发布“已标记网格”，而是发布 <strong>JSON<\/strong>，在用户侧告诉工具：<\/p>\n<ul><li>替换哪些纹理路径；<\/li><li>对网格应用哪些 PBR 值。<\/li><\/ul>\n<p>这对重纹理原版模型或盔甲尤其推荐——可让用户把你的 PBR 纹理套用到其 bodyslide 输出。<\/p>\n<h2>关键组成<\/h2>\n<ul><li><strong>PGtools<\/strong>：PGPatcher 的 MOD 作者工具，便于测试时快速批量改动（详见 PGPatcher GitHub wiki）。<\/li><li>运行 PGPatcher 需要配置 <code>Instance Location<\/code>（MO2 实例路径）与 <code>Output<\/code> 路径——各环境不同（MO2 实例路径可在 MO2 文件夹图标→“Open Instance folder” 找到）。<\/li><\/ul>\n<h2>相关<\/h2>\n<ul><li>美术师完整流程见 <a href=\"../04-development/pbr-for-artists.md\" target=\"_blank\" rel=\"noopener\">True PBR 美术师指南<\/a>。<\/li><li>Auto Parallax 与 True PBR（experimental）不兼容，应改用 PGPatcher（见 <a href=\"../03-reference/incompatible-mods.md\" target=\"_blank\" rel=\"noopener\">不兼容 MOD<\/a>）。<\/li><\/ul>\n<blockquote>具体下载、JSON 字段与运行步骤请以官方 PGPatcher 页面与 GitHub wiki 为准。<\/blockquote>", "_file": "05-tools/pgpatcher.md", "_chars": 1117}, {"id": "community-resources", "title": "可信信息源与支持渠道", "category": "06-community", "version": "1.0.0", "updated": "2026-09-21", "tags": ["社区", "信息源", "支持", "求助", "甄别"], "aliases": ["CS 社区", "支持渠道", "哪里问 CS", "community resources"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders", "summary": "整理 CS 的官方渠道与可信社区来源，并给出识别内容农场 / AI 聚合站的判断方法，避免被二手错误信息误导。", "content": "<p>CS 更新很快，二手信息烂得也快。这一页把「该信谁」写清楚。<\/p>\n<h2>一级来源（权威，优先看这些）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">渠道<\/th><th style=\"text-align:left\">用途<\/th><th style=\"text-align:left\">链接<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Nexus 发布页<\/strong><\/td><td style=\"text-align:left\">版本号、需求、功能清单、文件下载、官方公告<\/td><td style=\"text-align:left\"><a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/86492\" target=\"_blank\" rel=\"noopener\">mods/86492<\/a><\/td><\/tr><tr><td style=\"text-align:left\"><strong>官方用户 wiki（modding.wiki）<\/strong><\/td><td style=\"text-align:left\">安装 / 设置 / 功能说明 / FAQ，面向玩家<\/td><td style=\"text-align:left\"><a href=\"https://modding.wiki/en/skyrim/developers/community-shaders\" target=\"_blank\" rel=\"noopener\">community-shaders<\/a><\/td><\/tr><tr><td style=\"text-align:left\"><strong>GitHub 仓库<\/strong><\/td><td style=\"text-align:left\">源码、Issue、PR、Releases（含 PR 构建）<\/td><td style=\"text-align:left\"><a href=\"https://github.com/community-shaders/skyrim-community-shaders\" target=\"_blank\" rel=\"noopener\">skyrim-community-shaders<\/a><\/td><\/tr><tr><td style=\"text-align:left\"><strong>GitHub Developer Wiki<\/strong><\/td><td style=\"text-align:left\"><strong>进阶<\/strong>：功能对照矩阵、开发者资料<\/td><td style=\"text-align:left\"><a href=\"https://github.com/community-shaders/skyrim-community-shaders/wiki\" target=\"_blank\" rel=\"noopener\">wiki<\/a><\/td><\/tr><tr><td style=\"text-align:left\"><strong>官方 Discord<\/strong><\/td><td style=\"text-align:left\">实时求助、功能预览、测试反馈、实验构建<\/td><td style=\"text-align:left\"><a href=\"https://discord.gg/nkrQybAsyy\" target=\"_blank\" rel=\"noopener\">discord.gg/nkrQybAsyy<\/a><\/td><\/tr><\/tbody><\/table>\n<blockquote><strong>版本号永远以 Nexus 文件页为准<\/strong>。GitHub 上有大量 <code>1.9.0-prXXXX<\/code> 形式的 PR 构建，它们不是「最新版」。<\/blockquote>\n<h3>关于仓库地址的一个细节<\/h3>\n<p>官方 wiki 上的「GitHub Repository」链接指向 <code>doodlum/skyrim-community-shaders<\/code>，而仓库实际位于 <code>community-shaders/skyrim-community-shaders<\/code>（组织化后的地址）。<strong>两者是同一个项目<\/strong>，网上看到旧地址不必怀疑。<\/p>\n<h2>二级来源（社区经验，需交叉验证）<\/h2>\n<ul><li><strong>Nexus 发布页的 Posts 标签<\/strong>：CS 主页面下有近万条回帖，附加特性页也各有数百条。<strong>提问前先搜<\/strong>——高频问题几乎都被答过。<\/li><li><strong>r/skyrimmods<\/strong>：用户实测与踩坑分享，质量参差，当参考不当结论。<\/li><li><strong>MOD 作者自己的页面<\/strong>：Lux、Water for ENB、草 MOD 等的作者说明常包含 CS 相关的重要提示（例如 Lux 作者对 split mesh 的说明）。<\/li><li><strong>入门整体教程<\/strong>：<ul><li><strong>A Dragonborn's Fate<\/strong>（moddinglinked.com）——官方安装指南指名推荐给「从没 mod 过 Skyrim」的人，作者同时也是 Viva New Vegas 的作者；<\/li><li><strong>STEP Modifications Guide<\/strong>——官方 Vanilla 设置指南推荐的另一套整体指南。<\/li><\/ul><\/li><\/ul>\n<h2>三级来源：<strong>别信<\/strong>（内容农场 / AI 聚合站）<\/h2>\n<p>搜索「Community Shaders 怎么装 / CS 和 ENB 哪个好」时，排在前面的大量站点属于<strong>内容农场或 AI 批量生成的聚合站<\/strong>（用户常提到的 CSDN、toolify 就是这一类）。它们靠关键词堆排名，内容由模型根据零散旧闻拼凑，<strong>时效性与准确性都不可靠<\/strong>。<\/p>\n<p>这类站点的典型特征（本次调研中在多个站点上实际观察到）：<\/p>\n<ol><li><strong>模板化文案<\/strong>：通篇「全面解析 / 深度对比 / 一文读懂」，句子平滑但没有具体版本号、具体文件路径、具体命令。<\/li><li><strong>无作者、无更新日期<\/strong>，或日期与内容矛盾（写 2026 年的文章引用 2023 年的旧闻）。<\/li><li><strong>截图与数据是盗用的<\/strong>（常来自 Nexus 图片或 Reddit），但文中结论与之无关。<\/li><li><strong>把官方信息写错也不会被纠正<\/strong>。实测中见到过：<ul><li>把 <strong>XeSS 说成 CS Upscaling 支持的方案<\/strong>——官方已明确 <strong>XeSS 不受支持<\/strong>（作者公开说明是因 Intel 不提供支持）；<\/li><li>把 GPU 需求写成「DirectX 11.1+」而不提官方现行标准是 <strong>Vulkan 1.4+<\/strong>；<\/li><li>编造 ENB 与 CS「可以搭配使用获得最佳效果」的说法——官方是<strong>互斥<\/strong>关系。<\/li><\/ul><\/li><li><strong>推荐清单与本资料库无关<\/strong>：常见把若干 MOD 名堆砌成「2026 最佳组合」，但从未验证过互相之间的兼容性。<\/li><\/ol>\n<p>判断方法一句话：<strong>能追到「官方仓库 / 官方 wiki / Nexus 页」的结论才可用；追不到的，当成不存在。<\/strong><\/p>\n<h2>求助的正确姿势<\/h2>\n<p>官方 FAQ 与 Discord 的隐形门槛，归纳成三条：<\/p>\n<ol><li><strong>先做最小设置隔离<\/strong>（见 <a href=\"common-pitfalls.md\" target=\"_blank\" rel=\"noopener\">实战常见坑<\/a>）。只启 CS + 官方附加特性 + 其依赖。没做这步就问，大概率被请回去重做。<\/li><li><strong>带上信息<\/strong>：截图/录像、硬件（GPU 型号）、日志、CS 版本号、游戏版本号。<\/li><li><strong>走对渠道<\/strong>：<ul><li>功能请求 → Discord <code>#cs-feature-request<\/code>（<strong>不要<\/strong>开 GitHub Issue）；<\/li><li>测试构建的问题 → 回<strong>原帖/原线程<\/strong>，不要发 <code>#support<\/code>；<\/li><li>确认是 bug → 才开 GitHub Issue；<\/li><li>ENB 预设不加载 → 先看 Effects 11 页的安装说明（<code>enbseries<\/code> 目录与 <code>enbseries.ini<\/code> <strong>推荐手动放进游戏根目录<\/strong>，别交给管理器）。<\/li><\/ul><\/li><\/ol>\n<h2>相关条目<\/h2>\n<ul><li><a href=\"../00-overview/version-and-support.md\" target=\"_blank\" rel=\"noopener\">版本与支持策略<\/a>（官方支持边界、版本渠道）<\/li><li><a href=\"../03-reference/faq.md\" target=\"<em>blank\" rel=\"noopener\">FAQ<\/a> · <a href=\"../03-reference/incompatible-mods.md\" target=\"<\/em>blank\" rel=\"noopener\">不兼容 MOD 清单<\/a><\/li><\/ul>", "_file": "06-community/community-resources.md", "_chars": 3008}, {"id": "common-pitfalls", "title": "实战常见坑", "category": "06-community", "version": "1.0.0", "updated": "2026-09-21", "tags": ["社区", "排错", "实战", "性能", "兼容"], "aliases": ["CS 踩坑", "常见坑", "pitfalls", "新手错误"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/86492", "summary": "把官方文档散落各处的警告、Nexus 发布页与用户回帖里的高频问题，按「现象 → 原因 → 处理」整理成一份实战清单。", "content": "<p>本条目把官方 wiki、Nexus 发布页与社区回帖里<strong>反复出现的<\/strong>问题集中成一条清单，按「现象 → 原因 → 处理」组织。原始出处以官方文档为准；标注「社区」的条目来自用户实测反馈，属于经验而非官方保证。<\/p>\n<h2>安装与启动<\/h2>\n<h3>黑屏但能听到声音<\/h3>\n<ul><li><strong>原因<\/strong>：CS 自 1.2.0 起对<strong>独占全屏<\/strong>、或<strong>渲染分辨率与显示器分辨率不一致<\/strong>的配置有问题。<\/li><li><strong>处理<\/strong>：改用<strong>无边框窗口<\/strong>，并把分辨率设成与显示器一致。Windows 10 创意者更新之后，无边框窗口不再有性能损失。<\/li><li><strong>连带<\/strong>：Display Tweaks 的 <code>BorderlessUpscale<\/code> <strong>明确不受支持<\/strong>，要性能请用 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/156952\" target=\"_blank\" rel=\"noopener\">Upscaling<\/a>。<\/li><\/ul>\n<h3>启动弹「Required DLL &lt;...&gt; was missing」<\/h3>\n<ul><li><strong>原因<\/strong>：前置缺失。<strong>最常见的是 <code>EngineFixes.dll<\/code><\/strong>。<\/li><li><strong>处理<\/strong>：核对 Nexus 页需求与 <a href=\"../01-installation/installation-guide.md\" target=\"_blank\" rel=\"noopener\">安装指南<\/a>。注意 Engine Fixes 分两部分：主文件用管理器装，<strong>Preloader 的 <code>d3dx9_42.dll<\/code> 必须手动丢进游戏根目录<\/strong>。<\/li><\/ul>\n<h3>按 END 没打开菜单<\/h3>\n<ul><li><strong>处理<\/strong>：若已装 CS，暂停菜单里应有 <code>Settings &gt; Graphics &gt; Open Community Shaders Menu<\/code>，从那里改键（<code>General &gt; Keybindings<\/code>）。若无此项，确认是不是 CS 1.9.0+。仍然不行 → 禁用 overlay（RTSS / Fraps），<code>Fraps<\/code> 直接删，RTSS 对 <code>SkyrimSE.exe<\/code> 禁用。<\/li><\/ul>\n<h3>字体/菜单卡顿、滚动一格跳很远<\/h3>\n<p>1.8.4 修复过「菜单输入延迟与滚动粒度」。若在旧版遇到，升级即可。<\/p>\n<h2>着色器与缓存<\/h2>\n<h3>红色报错「Shaders failed to compile」<\/h3>\n<ul><li><strong>头号原因<\/strong>：<strong>CS 与附加特性版本混用<\/strong>，或缓存没重新生成。<\/li><li><strong>处理<\/strong>：只保留「最新 Nexus 版」<strong>或<\/strong>「单一测试构建」，<strong>绝不混<\/strong>。然后看游戏内 <code>Feature Issues<\/code> 标签。检查是否还留着已并入核心的旧特性 / 废弃特性，检查是否残留 ENB / Shader Tools（<code>d3d11.dll<\/code>、<code>d3dcompiler_46e.dll<\/code>、Windows 下 <code>d3dcompiler_47.dll<\/code>）。<\/li><\/ul>\n<h3>更新后没弹「Compiling Shaders」<\/h3>\n<ul><li><strong>原因<\/strong>：磁盘缓存没失效。<\/li><li><strong>处理<\/strong>：手动删缓存。MO2 是 <code>Overwrite/ShaderCache<\/code>，Vortex 是 <code>&lt;游戏&gt;/Data/ShaderCache<\/code>；<strong>顺手删 <code>UnifiedWaterCache<\/code><\/strong>。<code>Shaders<\/code> 目录<strong>不要动<\/strong>。<\/li><\/ul>\n<h3>着色器编译卡几小时或直接 CTD<\/h3>\n<ul><li><strong>处理<\/strong>：先装/更新 <strong>VC++ Redistributable X64<\/strong>。弱 CPU 可下调 <code>Background Compiler Threads<\/code> / <code>Compiler Threads<\/code>（<code>SettingsUser.json<\/code>，或首次启动前改 <code>SettingsDefault.json<\/code>）。确认游戏是受支持版本、且用无边框窗口。<\/li><\/ul>\n<h3>装了 ENB Light / ENB Particle Lights 类 MOD 却不发光<\/h3>\n<ul><li><strong>原因<\/strong>：CS <strong>不支持<\/strong> ENB Light / ENB Particle Lights。<\/li><li><strong>处理<\/strong>：改用基于 <strong>CS Light<\/strong> 或 <strong>Light Placer<\/strong> 的补丁。注意 <strong>Light Limit Fix 的粒子光照只是「向后兼容」性质<\/strong>，官方推荐的做法已经是直接用 Light Placer 体系。<\/li><\/ul>\n<h2>兼容性<\/h2>\n<h3>ENB 和 CS 同时装着<\/h3>\n<ul><li><strong>事实<\/strong>：两者<strong>不是设计来协同工作的<\/strong>，做的是同一层次的事。CS <strong>检测到 ENB 会自行禁用<\/strong>以防崩溃。<\/li><li><strong>社区共识<\/strong>：同时装通常只剩「浪费性能」这一个结果。二选一。<\/li><li><strong>例外<\/strong>：想用 ENB 预设的话，走 <strong>Effects 11<\/strong>（只支持未加密预设），依然不是同时运行 ENB 本体。<\/li><\/ul>\n<h3>装了 Lux 之后性能变差<\/h3>\n<ul><li><strong>处理<\/strong>：重装 Lux 时<strong>取消勾选<\/strong> <code>optimized<\/code> / <code>split<\/code> 网格。<strong>Light Limit Fix 已经取代了这些网格<\/strong>，留着只会掉性能。另外<strong>不要勾选任何支持粒子光照的选项<\/strong>，它们与 CS 不兼容。<\/li><\/ul>\n<blockquote>Lux 作者本人也确认过：这些网格是为突破引擎灯限而做的，有 LLF 就不需要；但若不用他的网格，记得删掉他对原版网格做的纹理集改动。<\/blockquote>\n<h3>天气/照明 MOD 之间的冲突<\/h3>\n<ul><li><strong>规则<\/strong>：<strong>同一时间只用一款天气 MOD<\/strong>、<strong>一款室内照明 + 一款室外照明<\/strong>。<\/li><li><strong>已知<\/strong>：<strong>EVLaS 不要用<\/strong>，Sky Sync 已完全取代它（装了 EVLaS，Sky Sync 会自动禁用自己）。<strong>Modern Lighting Overhaul 2 高于 1.3.6 的版本与 CS 不兼容<\/strong>。<\/li><li><strong>Window Shadows Ultimate<\/strong> 与 Window Shadows RT / Lux / ELFX Shadows / Enhanced Lights and FX / Relighting Skyrim (Interiors) / Skyrim is Luminous 互斥。<\/li><\/ul>\n<h2>画面异常<\/h2>\n<h3>地形没视差、或者长出「刺」<\/h3>\n<ul><li><strong>处理<\/strong>：① 用<strong>带视差的地形纹理<\/strong>（如 Atlantean Landscapes、Terrain Blending Fix）；视差纹理<strong>必须完整覆盖<\/strong>，只换一半会导致刺状。② CS 菜单 <code>Extended Materials<\/code> 里勾 <code>Enable Legacy Terrain<\/code>（用 PBR 地形纹理则不需要）。<\/li><\/ul>\n<h3>湿润效果出错、有硬边<\/h3>\n<ul><li><strong>处理<\/strong>：关闭 <code>Skyrim.ini<\/code> 的 <code>[Display]<\/code> 下动态分辨率（<code>bEnableAutoDynamicResolution=0<\/code>）；NVIDIA 控制面板里「Antialiasing - Transparency」设为<strong>关<\/strong>。<\/li><\/ul>\n<h3>反射看起来不对<\/h3>\n<ul><li>动态立方体贴图要靠<strong>捕获屏幕内容<\/strong>来推断环境，<strong>你从没看见过的地方它就是猜的<\/strong>。想验证某个物体有没有反射，用 <a href=\"../04-development/testing-and-debugging.md\" target=\"_blank\" rel=\"noopener\">TESTCUBEMAP 测试模式<\/a>。<\/li><\/ul>\n<h3>眼睛发亮<\/h3>\n<ul><li><strong>处理<\/strong>：装 <strong>Improved Eye<\/strong>。NPC 需自行补丁，或换用没有该问题的替换包（如 COTR）。<\/li><\/ul>\n<h2>性能<\/h2>\n<h3>帧率低于预期<\/h3>\n<ul><li><strong>预期管理<\/strong>：画面增强<strong>一定<\/strong>有代价。叠加的 MOD 越多越慢，这是通例。<\/li><li><strong>先怀疑这几项<\/strong>：Screen Space GI（可关或调 Low）、Effects 11（取决于预设）、Skylighting（低端机可关）、Upscaling（老系统上）。<\/li><li><strong>别过度堆纹理<\/strong>：社区里最贵的错误就是「所有东西都上 8K」。建议大件（山、建筑）用 4K，小件（武器、书）用 2K。<\/li><li><strong>看 Profiling 标签<\/strong>而不是猜。注意 <code>Utility<\/code> 这类开销属于 Bethesda 自身（阴影等），不是 CS 的锅。<\/li><\/ul>\n<h3>CS 报告的可用显存比实际低（社区反馈）<\/h3>\n<p>有用户反馈 CS 报出的可用 VRAM 明显低于显卡实际容量（例如 12 GB 卡显示约 10 GB），官方支持渠道当时也无法给出明确解释。<strong>实践上最有效的做法仍是降低游戏内画质设置与纹理尺寸<\/strong>（纹理尺寸对显存占用影响最大）。<\/p>\n<h3>帧生成（Frame Generation）效果不如预期<\/h3>\n<p>官方要求写得很明确：<\/p>\n<ul><li><strong>只在刷新率 ≥ 120 Hz 时生效<\/strong>；<\/li><li>需要在 <strong>Windowed / Borderless Windowed<\/strong> 模式下用；<\/li><li>建议搭配 <strong>SSE Display Tweaks<\/strong>（否则高帧率与垂直同步不好控）。<\/li><\/ul>\n<blockquote>另需注意：社区里有把 DLSS 多帧生成（MFG）跑到 Skyrim 上的实验分享，但那是<strong>个人实验构建<\/strong>，非官方功能；而且 CS 自己的 F10 性能浮层当时<strong>还不能正确显示 3x/4x 的输出帧率<\/strong>，要看 NVIDIA overlay。<\/blockquote>\n<h2>环境与平台<\/h2>\n<h3>Intel 核显<\/h3>\n<ul><li><strong>官方不支持<\/strong>。贡献者欢迎去修，但别期待能跑。<\/li><\/ul>\n<h3>游戏版本<\/h3>\n<ul><li>只支持 <strong>1.6.1170（Steam）/ 1.6.1179（GOG）/ 1.5.97<\/strong>。<strong>1.6.640、1.7.99、1.7.104 都不行<\/strong>——其中 1.7.99 / 1.7.104 的不兼容原本计划在 1.9.0 解决。<\/li><li>报 <code>REL/ID.h(223): Failed to open address library file<\/code> = 游戏版本不受支持，更新或降级。<\/li><\/ul>\n<h3>报 bug 之前请先做「最小设置」<\/h3>\n<p>官方 FAQ 的隔离法：只启用 Community Shaders、Nexus 页上 <code>Additional Features<\/code> 列出的那些、以及它们的依赖。MO2 用户新建配置档后 <code>Ctrl+A<\/code> 全禁用再逐个开；Vortex 用户新建配置档只开这些。同时确认 VC++ Redist X64 是最新。<\/p>\n<blockquote><strong>跳过这步直接报 bug，大概率被请回去重做。<\/strong> 这一步同时能省下你自己大量时间。<\/blockquote>\n<h2>报告问题的正确姿势<\/h2>\n<ul><li>带上：<strong>截图/录像 + 硬件 + 日志 + 版本号<\/strong>（内存里不带这些的求助基本会被忽略）。<\/li><li>渠道：日常问题 → <a href=\"../06-community/community-resources.md\" target=\"_blank\" rel=\"noopener\">官方 Discord<\/a>；确认是 bug → GitHub Issue；功能请求 → Discord <code>#cs-feature-request<\/code>，<strong>不要<\/strong>开 Issue。<\/li><li>测试构建的问题<strong>不要<\/strong>发到 <code>#support<\/code>，回原帖/原线程。<\/li><\/ul>\n<h2>相关条目<\/h2>\n<ul><li><a href=\"../03-reference/faq.md\" target=\"<em>blank\" rel=\"noopener\">FAQ<\/a> · <a href=\"../03-reference/incompatible-mods.md\" target=\"<\/em>blank\" rel=\"noopener\">不兼容 MOD 清单<\/a><\/li><li><a href=\"../04-development/testing-and-debugging.md\" target=\"_blank\" rel=\"noopener\">测试与调试手法<\/a><\/li><li><a href=\"community-resources.md\" target=\"_blank\" rel=\"noopener\">可信信息源<\/a><\/li><\/ul>", "_file": "06-community/common-pitfalls.md", "_chars": 5029}];
const CATS = {"00-overview": 4, "01-installation": 4, "02-features": 47, "03-reference": 2, "04-development": 3, "05-tools": 2, "06-community": 2};
const CAT_LABELS = {"00-overview": "概览", "01-installation": "安装", "02-features": "功能", "03-reference": "参考", "04-development": "开发", "05-tools": "工具", "06-community": "社区"};
let curCat='all', curQ='', sortBy='cat';

function label(cat){ return CAT_LABELS[cat] || cat; }
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function filtered(){
  const q=curQ.toLowerCase();
  return ENTRIES.filter(e=>{
    if(curCat!=='all' && e.category!==curCat) return false;
    if(q){
      const hay=(e.title+' '+(e.summary||'')+' '+(e.tags||[]).join(' ')+' '+
        (e.aliases||[]).join(' ')+' '+(e.category||'')+' '+label(e.category)).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
// 记录每条命中的原因：优先展示比标题更具体的匹配证据（别名 / 标签 / 正文）
function showWhy(e){
  const q=curQ.toLowerCase(); if(!q) return '';
  if((e.aliases||[]).some(a=>a.toLowerCase().includes(q))) return '别名命中';
  if((e.tags||[]).some(t=>t.toLowerCase().includes(q))) return '标签命中';
  const t=(e.title||'').toLowerCase();
  if(t.includes(q)) return '标题命中';
  if((e.summary||'').toLowerCase().includes(q)) return '摘要命中';
  return '正文提及';
}
function sortEntries(list){
  if(sortBy==='title') return list.sort((a,b)=>(a.title||'').localeCompare(b.title||'','zh'));
  if(sortBy==='updated') return list.sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
  return list; // cat：本已按 category 预排序
}
function renderGrid(){
  const list=sortEntries(filtered());
  const view=document.getElementById('view');
  if(!list.length){view.innerHTML='<div class="empty">没有匹配的条目</div>';return;}
  let html='<div class="grid">';
  for(const e of list){
    const why=showWhy(e);
    html+='<div class="card" data-id="'+esc(e.id)+'"><h3>'+esc(e.title)+'</h3>'+
      (why?'<div><span class="why">'+esc(why)+'</span></div>':'')+
      '<div class="chips" style="margin-bottom:6px">'+
      '<span class="chip">'+esc(label(e.category))+'</span>'+
      (e.kind?'<span class="chip muted">'+esc(e.kind)+'</span>':'')+'</div>'+
      '<p class="sum">'+esc(e.summary||'')+'</p>'+
      '<div class="chips">'+((e.tags||[]).slice(0,4).map(t=>'<span class="chip">'+esc(t)+'</span>').join(''))+'</div></div>';
  }
  html+='</div>';
  view.innerHTML=html;
  view.querySelectorAll('.card').forEach(c=>c.onclick=()=>showDetail(c.dataset.id));
}
function showDetail(id){
  const e=ENTRIES.find(x=>x.id===id); if(!e) return;
  const view=document.getElementById('view');
  const src=e.source?'<a class="btn btn-ghost" href="'+esc(e.source)+'" target="_blank" rel="noopener">官方来源 ↗</a>':'';
  const file=e._file?'<a class="btn btn-primary" href="'+esc(e._file)+'" target="_blank" rel="noopener">打开本地 .md →</a>':'';
  const tags=((e.tags||[]).map(t=>'<span class="chip">'+esc(t)+'</span>').join(''));
  const als=((e.aliases||[]).length?
    '<div class="chips" style="margin:6px 0 0">'+
    (e.aliases||[]).map(a=>'<span class="chip muted">'+esc(a)+'</span>').join('')+'</div>':'');
  view.innerHTML='<button class="back" onclick="renderGrid()">← 返回列表</button>'+
    '<div class="detail"><h2>'+esc(e.title)+'</h2>'+
    '<div class="chips" style="margin-bottom:4px">'+
    '<span class="chip">'+esc(label(e.category))+'</span>'+
    (e.kind?'<span class="chip muted">'+esc(e.kind)+'</span>':'')+
    (e.version?'<span class="chip muted">v'+esc(e.version)+'</span>':'')+
    (e.updated?'<span class="chip muted">'+esc(e.updated)+'</span>':'')+'</div>'+
    '<div class="chips" style="margin:6px 0 10px">'+tags+'</div>'+
    '<div class="article">'+(e.content||'<p>(暂无正文)</p>')+'</div>'+
    '<div class="actions">'+file+src+'</div>'+
    als+
    '<p class="tip">源文件：'+esc(e._file||'')+'</p></div>';
  document.querySelector('main').scrollTop=0;
}
function selectCat(cat,btn){
  curCat=cat;
  document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('active'));
  const target=btn||document.querySelector('#navbox .navbtn[data-cat="'+cat+'"]');
  if(target) target.classList.add('active');
  renderGrid();
}
function setNavCollapsed(collapsed){
  const box=document.getElementById('navbox'), btn=document.getElementById('navtoggle'), side=document.querySelector('aside');
  box.classList.toggle('hidden',collapsed);
  if(side) side.classList.toggle('collapsed',collapsed);
  btn.textContent=collapsed?'展开 ›':'‹ 收起';
  btn.setAttribute('aria-expanded',String(!collapsed));
  try{localStorage.setItem('kb-nav-collapsed',collapsed?'1':'0');}catch(e){}
}
function toggleNav(){
  setNavCollapsed(document.getElementById('navbox').classList.contains('hidden')===false);
}
function renderNav(){
  const nav=document.getElementById('catnav');
  nav.innerHTML=Object.keys(CATS).map(c=>'<button class="navbtn" data-cat="'+c+'">'+esc(label(c))+' <span class="cnt">'+CATS[c]+'</span></button>').join('');
  // 注意：侧栏「全部」按钮和分类按钮必须在这里统一绑定。
  // 只选 [data-cat]（即分类按钮），避开同处 #navbox 内的状态过滤按钮，
  // 否则「全部」按钮会漏绑 → 选中某分类后切不回全部（历史 bug）。
  document.querySelectorAll('#navbox .navbtn[data-cat]').forEach(b=>b.onclick=()=>selectCat(b.dataset.cat,b));
}
function renderStats(){
  const s=document.getElementById('stats');
  const total=ENTRIES.length;
  document.getElementById('allcnt').textContent=total;
  let h='<span class="stat">共 '+total+' 条</span>';
  for(const c in CATS) h+='<span class="stat">'+esc(label(c))+': '+CATS[c]+'</span>';
  s.innerHTML=h;
}
document.getElementById('q').oninput=e=>{curQ=e.target.value;renderGrid();};
document.getElementById('sort').onchange=e=>{sortBy=e.target.value;renderGrid();};
document.getElementById('navtoggle').onclick=toggleNav;
renderStats();renderNav();renderGrid();
// 恢复上次的收起/展开状态
(function(){
  let collapsed=false;
  try{collapsed=localStorage.getItem('kb-nav-collapsed')==='1';}catch(e){}
  if(collapsed) setNavCollapsed(true);
})();
</script>
</body>
</html>
