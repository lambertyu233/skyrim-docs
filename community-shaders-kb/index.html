<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community Shaders 资料库</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#ffffff; --ink:#1f2329; --muted:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --accent2:#0ea5e9; --chip:#eef2ff;
    --green:#16a34a; --amber:#d97706; --gray:#9ca3af; --blue:#2563eb;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
  header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:20px 24px}
  header h1{margin:0;font-size:20px}
  header p{margin:6px 0 0;opacity:.9;font-size:13px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .stat{background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px;font-size:12px}
  .wrap{display:flex;min-height:calc(100vh - 116px)}
  aside{width:230px;flex:0 0 230px;background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow:auto;
        transition:width .16s ease,flex-basis .16s ease}
  aside.collapsed{width:78px;flex:0 0 78px;padding:14px 10px}
  aside.collapsed .sidehead{flex-direction:column;gap:8px;align-items:stretch;margin:0}
  aside.collapsed .sidehead-title{display:none}
  aside.collapsed .navtoggle{padding:6px 4px;width:100%}
  .sidehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .sidehead-title{font-size:12px;color:var(--muted);white-space:nowrap}
  .navtoggle{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);
             font-size:11px;padding:2px 8px;cursor:pointer;line-height:1.5;white-space:nowrap}
  .navtoggle:hover{color:var(--accent);border-color:var(--accent)}
  #navbox.hidden{display:none}
  main{flex:1;padding:20px 24px;overflow:auto}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .navbtn{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:4px;border:1px solid transparent;
          background:none;border-radius:8px;cursor:pointer;color:var(--ink);font-size:13px}
  .navbtn:hover{background:var(--chip)}
  .navbtn.active{background:var(--accent);color:#fff}
  .navbtn .cnt{float:right;opacity:.7;font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s}
  .card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-1px)}
  .card h3{margin:0 0 6px;font-size:15px}
  .card .sum{color:var(--muted);font-size:13px;margin:0 0 8px}
  .card .why{display:inline-block;font-size:11px;color:var(--accent);background:#eff6ff;
    border:1px solid #bfdbfe;border-radius:20px;padding:1px 8px;margin:0 0 8px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--chip);color:#3730a3;font-size:11px;padding:2px 8px;border-radius:20px}
  .chip.muted{background:#f3f4f6;color:var(--muted)}
  .detail{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:880px}
  .detail h2{margin-top:0}
  .back{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;margin-bottom:12px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
  .btn{display:inline-block;padding:9px 14px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost{border:1px solid var(--line);color:var(--accent)}
  a{color:var(--accent)}
  .empty{color:var(--muted);padding:30px;text-align:center}
  .tip{font-size:12px;color:var(--muted);margin-top:8px}
  .article{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 22px 18px;
    font-size:14.5px;line-height:1.8;color:var(--ink);max-width:860px}
  .article h1,.article h2,.article h3,.article h4{line-height:1.35;margin:1.1em 0 .5em}
  .article h1{font-size:1.55em;border-bottom:2px solid var(--line);padding-bottom:.3em}
  .article h2{font-size:1.3em;border-bottom:1px solid var(--line);padding-bottom:.25em}
  .article h3{font-size:1.12em}
  .article p{margin:.6em 0}
  .article ul,.article ol{margin:.5em 0;padding-left:1.6em}
  .article li{margin:.25em 0}
  .article a{color:var(--accent);text-decoration:underline}
  .article code{background:#f1f5f9;border:1px solid var(--line);border-radius:4px;padding:1px 5px;
    font-family:"SFMono-Regular",Consolas,Menlo,monospace;font-size:.92em;color:#be123c}
  .article pre.code{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px 16px;overflow:auto;
    font-family:"SFMono-Regular",Consolas,Menlo,monospace;font-size:13px;line-height:1.6}
  .article pre.code code{background:none;border:none;color:inherit;padding:0}
  .article blockquote{margin:.7em 0;padding:.5em 1em;border-left:4px solid var(--accent);
    background:#f8fafc;color:#374151;border-radius:0 8px 8px 0}
  .article table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:13.5px}
  .article th,.article td{border:1px solid var(--line);padding:7px 10px}
  .article thead th{background:#f1f5f9;font-weight:600}
  .article tbody tr:nth-child(even){background:#fafafa}
  .article hr{border:none;border-top:1px solid var(--line);margin:1.2em 0}
</style>
</head>
<body>
<header>
  <h1>Community Shaders 资料库</h1>
  <p>基于官方用户 wiki（modding.wiki）、官方仓库与 Developer Wiki、Nexus 发布页整理的可维护 Community Shaders 资料库，分层组织、便于增删改查与版本化协作。</p>
  <div class="stats" id="stats"></div>
</header>
<div class="wrap">
  <aside>
    <div class="sidehead">
      <span class="sidehead-title">分类过滤</span>
      <button id="navtoggle" class="navtoggle" type="button" aria-expanded="true"
              aria-controls="navbox" title="收起/展开分类过滤">‹ 收起</button>
    </div>
    <div id="navbox">
      <button class="navbtn active" data-cat="all" type="button">全部 <span class="cnt" id="allcnt"></span></button>
      <div id="catnav"></div>
    </div>
  </aside>
  <main>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索标题、摘要、标签、分类…">
      <select id="sort">
        <option value="cat">按分类</option>
        <option value="title">按标题</option>
        <option value="updated">按更新时间</option>
      </select>
    </div>
    <div id="view"></div>
  </main>
</div>
<script>
const ENTRIES = [{"id": "what-is-cs", "title": "什么是 Community Shaders", "category": "00-overview", "version": "1.1.0", "updated": "2026-09-21", "tags": ["概览", "入门", "框架", "ENB"], "aliases": ["CS 是什么", "Community Shaders 是什么", "community shaders", "画质模组"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders", "summary": "Community Shaders 是开源、模块化的 Skyrim 图形增强框架，提供先进光照、材质与视觉特效。", "content": "<p><strong>Community Shaders（CS）<\/strong> 是一个开源、综合性的 Skyrim 图形增强框架，提供先进的光照、材质与视觉特效。其设计是<strong>模块化<\/strong>的——你可以只启用想要的功能，同时保持良好性能。<\/p>\n<p>官方对自身定位的一句话是：<strong>它不是「游戏之上的一层后处理」，而是直接在引擎层修好并扩建 Skyrim 自己的着色器<\/strong>。Nexus 发布页的表述是「不像 ENB 那样替换整条后处理管线，而是用 bug 修复、现代渲染技法和可选插件增强 Skyrim 现有的着色器」。<\/p>\n<h2>核心定位<\/h2>\n<ul><li><strong>开源<\/strong>：代码完全开放，遵循 GPL-3.0 许可（官方明确承诺「永不闭源」）。<\/li><li><strong>模块化<\/strong>：核心功能随基础安装附带，附加功能可单独下载启用。<\/li><li><strong>用户驱动<\/strong>：由社区维护文档、测试与开发（GitHub + Discord）。<\/li><li><strong>兼容性取向<\/strong>：设计上替代 ENBSeries 的大部分功能，避免与之同时运行。<\/li><li><strong>体量<\/strong>：Nexus 上标注「Mods using this mod」的 MOD 有 <strong>564<\/strong> 个，是当前 Skyrim 画质生态的实际基座。<\/li><\/ul>\n<h2>快速上手<\/h2>\n<ul><li>游戏内按 <strong>END<\/strong> 打开 Community Shaders 菜单。<\/li><li>新手从 <a href=\"../01-installation/installation-guide.md\" target=\"_blank\" rel=\"noopener\">安装指南<\/a> 开始（从没 mod 过的话，官方推荐先读 <em>A Dragonborn's Fate<\/em>）。<\/li><li>想提升画质看 <a href=\"../01-installation/vanilla-setup.md\" target=\"_blank\" rel=\"noopener\">Vanilla 设置指南<\/a>。<\/li><li>从 ENB 迁移看 <a href=\"../01-installation/enb-migration.md\" target=\"_blank\" rel=\"noopener\">ENB 迁移指南<\/a>。<\/li><li>看<strong>哪个功能 CS 有、ENB 有没有<\/strong>：见 <a href=\"feature-matrix.md\" target=\"_blank\" rel=\"noopener\">官方功能对照矩阵<\/a>。<\/li><li>看<strong>版本现状与支持边界<\/strong>：见 <a href=\"version-and-support.md\" target=\"_blank\" rel=\"noopener\">版本与支持策略<\/a>。<\/li><\/ul>\n<h2>与其他方案的对比（要点）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">维度<\/th><th style=\"text-align:left\">Community Shaders<\/th><th style=\"text-align:left\">ENBSeries<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">授权<\/td><td style=\"text-align:left\">开源 (GPL-3.0)<\/td><td style=\"text-align:left\">闭源<\/td><\/tr><tr><td style=\"text-align:left\">架构<\/td><td style=\"text-align:left\">模块化插件，<strong>集成于引擎<\/strong>（SKSE + CommonLibSSE-NG）<\/td><td style=\"text-align:left\">注入式后处理包装层<\/td><\/tr><tr><td style=\"text-align:left\">菜单<\/td><td style=\"text-align:left\">游戏内 ImGui 菜单（END），可<strong>逐天气<\/strong>调参<\/td><td style=\"text-align:left\"><code>enbseries.ini<\/code> 配置<\/td><\/tr><tr><td style=\"text-align:left\">兼容<\/td><td style=\"text-align:left\">与 ENB <strong>互斥<\/strong>（检测即自行禁用）<\/td><td style=\"text-align:left\">—<\/td><\/tr><tr><td style=\"text-align:left\">性能<\/td><td style=\"text-align:left\">常被称为「可能比原版还快」；统一着色器缓存 + 多线程编译，<strong>只需编译一次<\/strong><\/td><td style=\"text-align:left\">视预设而定，差异极大<\/td><\/tr><tr><td style=\"text-align:left\">预设<\/td><td style=\"text-align:left\"><a href=\"https://mod.pub/skyrim-se/415-effects-11\" target=\"_blank\" rel=\"noopener\">Effects 11<\/a> 支持<strong>未加密<\/strong> ENB 预设；后续由 Post Processing 接棒（TBA）<\/td><td style=\"text-align:left\">原生<\/td><\/tr><tr><td style=\"text-align:left\">VR<\/td><td style=\"text-align:left\"><strong>主版本已停止支持<\/strong>（转 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/180419\" target=\"_blank\" rel=\"noopener\">Open Shaders<\/a>）<\/td><td style=\"text-align:left\">有 VR 版本<\/td><\/tr><tr><td style=\"text-align:left\">强项领域<\/td><td style=\"text-align:left\">引擎级修复、PBR、地形/草/水、阴影体系、性能<\/td><td style=\"text-align:left\">后处理（DoF、Bloom、色彩分级）、镜头特效<\/td><\/tr><\/tbody><\/table>\n<blockquote>两边真正的能力差异，一张表看完：<a href=\"feature-matrix.md\" target=\"_blank\" rel=\"noopener\">官方功能对照矩阵<\/a>。<\/blockquote>\n<h2>维护提示<\/h2>\n<p>本资料库以分层结构组织（概览 / 安装 / 功能 / 参考 / 开发 / 工具 / 社区），每个条目独立成文件并带 <code>frontmatter<\/code> 元数据，便于增删改查与版本化协作。新增内容后运行 <code>scripts/build_index.py<\/code> 刷新索引。<\/p>", "_file": "00-overview/what-is-cs.md", "_chars": 2059}, {"id": "feature-matrix", "title": "官方功能对照矩阵与路线图", "category": "00-overview", "version": "1.0.0", "updated": "2026-09-21", "tags": ["概览", "对照", "ENB", "VR", "路线图", "官方"], "aliases": ["CS 功能表", "CS 和 ENB 对比", "功能对照", "roadmap", "feature matrix"], "source": "https://github.com/community-shaders/skyrim-community-shaders/wiki", "summary": "官方 Developer Wiki 的 CS / ENB / CS VR / ENB VR 全功能对照表，以及官方承认的潜在未来功能依赖图。", "content": "<p>本条目译自<strong>官方 GitHub Developer Wiki<\/strong> 的「Current list of features and versions」。它回答一个别的页面都答不了的问题：<strong>同一项功能，CS 和 ENB 谁有、VR 分支有没有<\/strong>。<\/p>\n<blockquote>官方用户 wiki（modding.wiki）面向玩家；这份矩阵只存在于 Developer Wiki，属于「进阶信息」。原表会随版本变动，权威版本请看 <a href=\"https://github.com/community-shaders/skyrim-community-shaders/wiki\" target=\"_blank\" rel=\"noopener\">Developer Wiki 原文<\/a>。<\/blockquote>\n<h2>读法<\/h2>\n<ul><li><code>Yes<\/code> = 已实现；<code>WIP<\/code> = 开发中（Work In Progress）；<code>No<\/code> = 无；<code>Beta<\/code> = 测试阶段；<code>n.a.<\/code> = 不适用。<\/li><li><code>No*<\/code> = CS/ENB 本身不做，但<strong>可由第三方 MOD 达到<\/strong>。<\/li><li>原表个别单元格为空，本表以 <code>—<\/code> 表示「原表未给出」。<\/li><\/ul>\n<h2>Grass（草地）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">功能<\/th><th style=\"text-align:center\">CS<\/th><th style=\"text-align:center\">ENB<\/th><th style=\"text-align:center\">CS VR<\/th><th style=\"text-align:center\">ENB VR<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Grass Collisions 草体碰撞<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">No<\/td><\/tr><tr><td style=\"text-align:left\">Grass Lighting 草体光照<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">No<\/td><\/tr><tr><td style=\"text-align:left\">Procedural grass 程序化草地<\/td><td style=\"text-align:center\">WIP<\/td><td style=\"text-align:center\">No<\/td><td style=\"text-align:center\">WIP<\/td><td style=\"text-align:center\">No<\/td><\/tr><\/tbody><\/table>\n<h2>Water（水）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">功能<\/th><th style=\"text-align:center\">CS<\/th><th style=\"text-align:center\">ENB<\/th><th style=\"text-align:center\">CS VR<\/th><th style=\"text-align:center\">ENB VR<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Water Parallax 水体视差<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">No<\/td><\/tr><tr><td style=\"text-align:left\">Water Blending 水体融合<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">—<\/td><\/tr><tr><td style=\"text-align:left\">Water caustics 水底焦散<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">No<\/td><\/tr><tr><td style=\"text-align:left\">Screen Space Reflections 屏幕空间反射<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">No<\/td><\/tr><\/tbody><\/table>\n<h2>Lights（光照）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">功能<\/th><th style=\"text-align:center\">CS<\/th><th style=\"text-align:center\">ENB<\/th><th style=\"text-align:center\">CS VR<\/th><th style=\"text-align:center\">ENB VR<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Particle Lights 粒子光源<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><\/tr><tr><td style=\"text-align:left\">Light Limit Fix 灯光上限修复<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">No<\/td><\/tr><tr><td style=\"text-align:left\">Indirect Lighting / SSGI 间接光照<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">—<\/td><\/tr><tr><td style=\"text-align:left\">Tree LoD Lighting 树木 LOD 光照<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">No<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">No<\/td><\/tr><tr><td style=\"text-align:left\">Image Based Lighting 基于图像光照<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">—<\/td><\/tr><tr><td style=\"text-align:left\">Inverse Square Lighting 平方反比光照<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">No<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">No<\/td><\/tr><tr><td style=\"text-align:left\">Linear Lighting 线性光照<\/td><td style=\"text-align:center\">WIP<\/td><td style=\"text-align:center\">No<\/td><td style=\"text-align:center\">WIP<\/td><td style=\"text-align:center\">No<\/td><\/tr><\/tbody><\/table>\n<h2>Shadows（阴影）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">功能<\/th><th style=\"text-align:center\">CS<\/th><th style=\"text-align:center\">ENB<\/th><th style=\"text-align:center\">CS VR<\/th><th style=\"text-align:center\">ENB VR<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Normalmap Shadows 法线贴图阴影<\/td><td style=\"text-align:center\">No<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">No<\/td><td style=\"text-align:center\">Yes<\/td><\/tr><tr><td style=\"text-align:left\">Screen-Space Shadows 屏幕空间阴影<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">Yes<\/td><\/tr><tr><td style=\"text-align:lef izable Post-Processing 可自定义后处理<\/td><td style=\"text-align:center\">WIP<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">WIP<\/td><td style=\"text-align:center\">Yes<\/td><\/tr><tr><td style=\"text-align:left\">Lut Loading LUT 加载<\/td><td style=\"text-align:center\">WIP<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">WIP<\/td><td style=\"text-align:center\">Yes<\/td><\/tr><tr><td style=\"text-align:left\">Motion Blur 动态模糊<\/td><td style=\"text-align:center\">WIP<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">WIP<\/td><td style=\"text-align:center\">Yes<\/td><\/tr><tr><td style=\"text-align:left\">HDR output HDR 输出<\/td><td style=\"text-align:center\">WIP<\/td><td style=\"text-align:center\">No<\/td><td style=\"text-align:center\">WIP<\/td><td style=\"text-align:center\">No<\/td><\/tr><\/tbody><\/table>\n<h2>Performance（性能）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">功能<\/th><th style=\"text-align:center\">CS<\/th><th style=\"text-align:center\">ENB<\/th><th style=\"text-align:center\">CS VR<\/th><th style=\"text-align:center\">ENB VR<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Upscaling Technologies 超分辨率<\/td><td style=\"text-align:center\">Beta<\/td><td style=\"text-align:center\">No*<\/td><td style=\"text-align:center\">WIP<\/td><td style=\"text-align:center\">No*<\/td><\/tr><tr><td style=\"text-align:left\">FSR AA / DLAA<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">No*<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">No*<\/td><\/tr><tr><td style=\"text-align:left\">Framegen (DLSS) 帧生成<\/td><td style=\"text-align:center\">Yes<\/td><td style=\"text-align:center\">No*<\/td><td style=\"text-align:center\">No<\/td><td style=\"text-align:center\">No*<\/td><\/tr><\/tbody><\/table>\n<blockquote>上表里 CS 一列大量 <code>Yes<\/code> / <code>WIP<\/code>、ENB 一列成片 <code>No<\/code> 的结构，正是官方对自身定位的表述：<strong>CS 是在引擎层「补上游戏本身缺的东西」，ENB 是在游戏之上「注入一层后处理」<\/strong>（ENB 在少数项目如 Depth of Field、Bloom、Normalmap Shadows 上仍领先，而这几项恰是 CS 标注 <code>WIP<\/code> 的领域）。<\/blockquote>\n<h2>官方承认的潜在未来功能（依赖关系）<\/h2>\n<p>官方强调：<strong>以下只是「潜在功能」的依赖图，不构成任何承诺或路线图<\/strong>。它解释了为什么某些功能迟迟不来——它们在依赖链下游。<\/p>\n<pre class=\"code\"><code>Deferred（延迟渲染地基）\n├── Subsurface Scattering ──&gt; Dynamic Snow Cover\n├── SSGI ──&gt; Skylighting\n├── Better Water ──&gt; Improved Water Lod\n├── Better SSR\n├── Terrain Blending\n└── Tesselation ├──&gt; Water\n                └──&gt; Tesselated Landscape\n\nPBR ├──&gt; Sparkly Snow\n    ├──&gt; Better Water\n    ├──&gt; Procedural Grass\n    ├──&gt; Skin Specular\n    ├──&gt; Linear Lighting\n    └──&gt; Dynamic Snow Cover\n\nImage Based Lighting ──&gt; TOD/Weather\nLinear Lighting ──&gt; TOD/Weather、Postprocessing\nSky Sync ──&gt; TOD/Weather\nDynamic Snow Cover ──&gt; TOD/Weather\nPostprocessing ──&gt; Motion Blur、Depth of Field、Bloom、TOD/Weather、Eye Adaptation\n\nTOD/Weather ├──&gt; Physical Sky\n            ├──&gt; Misc. Weather Elements\n            ├──&gt; Simple Height Fog\n            ├──&gt; Volumetric Fog/Clouds\n            ├──&gt; Procedural Sun\n            └──&gt; (Postprocessing)\n\nWater Parallax ──&gt; Better Water ──&gt; Improved Water Lod\n\n独立支线：Full Ray Tracing（完整光线追踪）<\/code><\/pre>\n<p>要读懂这张图的关键：<strong><code>Deferred<\/code>（延迟渲染重构）和 <code>TOD/Weather<\/code>（时间与天气系统重构）是两个巨型枢纽<\/strong>。绝大多数「玩家呼声很高但一直 WIP」的功能（体积云、大气散射、自定义天气、后处理全家桶）都挂在它们下游。<\/p>\n<h2>相关条目<\/h2>\n<ul><li>想直接看<strong>玩家视角<\/strong>的功能清单与下载入口，见 <a href=\"../02-features/core\" target=\"_blank\" rel=\"noopener\">功能总览<\/a>。<\/li><li>想知道<strong>哪些功能已并入核心、装旧版时该删什么<\/strong>，见 <a href=\"../03-reference/incompatible-mods.md\" target=\"_blank\" rel=\"noopener\">不兼容 MOD - 版本演进<\/a>。<\/li><li>想了解<strong>当前版本号与支持策略<\/strong>，见 <a href=\"version-and-support.md\" target=\"_blank\" rel=\"noopener\">版本与支持策略<\/a>。<\/li><\/ul>", "_file": "00-overview/feature-matrix.md", "_chars": 6222}, {"id": "architecture", "title": "架构与缓存系统", "category": "00-overview", "version": "1.0.0", "updated": "2026-09-20", "tags": ["架构", "缓存", "性能", "引擎"], "aliases": ["CS 架构", "着色器缓存", "shader cache", "CS 怎么工作", "缓存系统"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders#cache-system", "summary": "CS 通过运行时着色器缓存与磁盘缓存替换原版着色器；理解其机制有助于排错与开发。", "content": "<p>Community Shaders 在运行时替换 Skyrim 的原版着色器管线，并以<strong>缓存系统<\/strong>管理编译产物。理解这套机制对排错（尤其是“编译着色器”卡住、黑屏、特效异常）至关重要。<\/p>\n<h2>整体架构（要点）<\/h2>\n<ul><li><strong>基础安装（Core）<\/strong> 携带一组核心特性（见 <a href=\"../02-features/core\" target=\"_blank\" rel=\"noopener\">功能总览<\/a>）。<\/li><li><strong>附加特性（Addons）<\/strong> 单独下载，按需启用。<\/li><li><strong>渲染替换<\/strong>：CS 接管材质/光照/后处理相关着色器，支持 PBR、屏幕空间特效、体积光等。<\/li><li><strong>游戏内菜单<\/strong>：按 END 打开，可实时调整设置、场景管理、性能浮层、RenderDoc 捕获等。<\/li><\/ul>\n<h2>Shader Cache（着色器缓存）<\/h2>\n<p><strong>Shader Cache<\/strong> 是已编译着色器的运行时集合，用于替换 Skyrim 的原版着色器。<\/p>\n<ul><li>清空调色器缓存会强制下次游戏遇到对应着色器时重新编译。<\/li><li>主要用于<strong>着色器开发<\/strong>与热加载，<strong>正常游戏无需清理<\/strong>。<\/li><\/ul>\n<h2>Disk Cache（磁盘缓存）<\/h2>\n<p><strong>Disk Cache<\/strong> 将已编译着色器存储到磁盘，由 Shader Cache 自动填充。<\/p>\n<ul><li>若磁盘缓存缺失、过期或无效，屏幕左上角会出现 <strong>“Compiling Shaders”（正在编译着色器）<\/strong>。<\/li><li>此时游戏<strong>不会冻结<\/strong>，但在编译完成前交互被禁用。<\/li><li>完成后，后续启动应当即时，无额外延迟。<\/li><\/ul>\n<p><strong>位置<\/strong>：<code>Data/ShaderCache<\/code><\/p>\n<p><strong>清理方式<\/strong>：<\/p>\n<ul><li>删除该文件夹；或<\/li><li>在 UI 右上角点击 “Clear Shaders” 按钮。<\/li><\/ul>\n<blockquote>⚠️ 只删除 <code>ShaderCache<\/code> 文件夹，<strong>不要<\/strong>删除 <code>Shaders<\/code> 文件夹。另建议同时删除 <code>UnifiedWaterCache<\/code> 文件夹。<\/blockquote>\n<h2>排错关联<\/h2>\n<ul><li>更新 CS 后若没出现“编译着色器”弹窗 → 手动删除 Disk Cache（MO2: <code>Overwrite/ShaderCache<\/code>；Vortex: <code>&lt;游戏&gt;/Data/ShaderCache<\/code>）。详见 <a href=\"../03-reference/faq.md\" target=\"<em>blank\" rel=\"noopener\">FAQ<\/a> 与 <a href=\"../01-installation/installation-guide.md\" target=\"<\/em>blank\" rel=\"noopener\">安装-更新<\/a>。<\/li><li>“Shaders failed to compile” 红错 → 多为 CS 与附加特性版本混用，或缓存未重生。<\/li><\/ul>", "_file": "00-overview/architecture.md", "_chars": 1365}, {"id": "version-and-support", "title": "版本与支持策略", "category": "00-overview", "version": "1.0.0", "updated": "2026-09-21", "tags": ["概览", "版本", "支持", "VR", "Linux", "更新"], "aliases": ["CS 支持哪些版本", "1.6.640 支持吗", "version support", "LTS", "支持策略"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/86492", "summary": "官方构建政策、支持的游戏版本、VR / Linux 现状、功能并入核心的时间线，以及该找谁求助。", "content": "<p>这一页回答「我该装哪个版本、我的环境受不受支持、出了问题谁能管」。这些规则很硬，踩错通常直接表现为「没人理你」。<\/p>\n<h2>版本号现状（截至 2026-09）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">渠道<\/th><th style=\"text-align:left\">版本<\/th><th style=\"text-align:left\">说明<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Nexus 发布页<\/strong><\/td><td style=\"text-align:left\">稳定正式版（1.8.x 系列，最新补丁 1.8.4 于 2026-08-26）<\/td><td style=\"text-align:left\"><strong>唯一受支持<\/strong>的玩家版本。想稳定就用它<\/td><\/tr><tr><td style=\"text-align:left\">GitHub Releases<\/td><td style=\"text-align:left\"><code>1.9.0-prXXXX<\/code> 形式的 PR 构建（2026-09 仍在迭代，最新一批 2026-09-20）<\/td><td style=\"text-align:left\">开发构建，<strong>只<\/strong>在 Discord 对应线程受支持<\/td><\/tr><tr><td style=\"text-align:left\">Discord 的 Jiaye / post-processing 构建<\/td><td style=\"text-align:left\">非官方<\/td><td style=\"text-align:left\">见下<\/td><\/tr><\/tbody><\/table>\n<blockquote>判断自己装的是哪版：游戏内按 <strong>END<\/strong> 打开 CS 菜单，版本号在界面上直接可见。<\/blockquote>\n<h3>关于「开发构建」<\/h3>\n<ul><li>官方明确定义：<strong>只有官方构建受支持<\/strong>；第三方构建与分叉（fork）不受支持；开发构建只在 Discord 对应线程里受支持。<\/li><li><strong>Jiaye / post-processing 构建<\/strong>：官方 FAQ 专门澄清过——<strong>这不是官方 CS 产品<\/strong>，未经 CS 开发团队审核，也<strong>不以性能为目标<\/strong>。除了 <code>#jiaye<\/code> 前缀的频道，别处问会被请回去；发不出帖说明你得进那个「下载构建的帖子」里说话。<\/li><li>想要设置预设（Presets）：官方 Vanilla 设置指南说明，预设目前<strong>只在实验构建<\/strong>里可用，在官方 Discord 获取。<\/li><\/ul>\n<h3>官方一键安装：Vortex Collection<\/h3>\n<p>Vortex 用户可以直接用官方 <strong>Community Shaders Collection<\/strong>（Nexus Collections 编号 <code>62eesj<\/code>）一键装齐 CS 与全部附加特性。<strong>用了合集就整体更新<\/strong>，不要单独去更新其中某一个特性——两边版本错开会直接导致着色器编译失败。<\/p>\n<h2>支持的游戏版本（硬性）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">版本<\/th><th style=\"text-align:left\">是否支持<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Skyrim SE/AE <strong>1.6.1170<\/strong>（Steam）<\/td><td style=\"text-align:left\">✅ 支持<\/td><\/tr><tr><td style=\"text-align:left\">Skyrim AE <strong>1.6.1179<\/strong>（GOG）<\/td><td style=\"text-align:left\">✅ 支持<\/td><\/tr><tr><td style=\"text-align:left\">Skyrim SE <strong>1.5.97<\/strong><\/td><td style=\"text-align:left\">✅ 长期支持（唯一保留的旧版本）<\/td><\/tr><tr><td style=\"text-align:left\">LE（传奇版）<\/td><td style=\"text-align:left\">❌ 不支持<\/td><\/tr><tr><td style=\"text-align:left\">VR<\/td><td style=\"text-align:left\">❌ 主版本已停止支持，见下<\/td><\/tr><tr><td style=\"text-align:left\">其它 AE 版本，如 <strong>1.6.640、1.7.99、1.7.104<\/strong><\/td><td style=\"text-align:left\">❌ 不支持<\/td><\/tr><tr><td style=\"text-align:left\">Steam 刚推送的新版本<\/td><td style=\"text-align:left\">⏳ 团队会跟进，但需等待<\/td><\/tr><\/tbody><\/table>\n<p>官方立场：<strong>只计划支持 Steam 最新版与 1.5.97<\/strong>。除 1.5.97 之外，<strong>对旧版本没有任何长期支持（LTS）承诺<\/strong>。<\/p>\n<ul><li>游戏刚更新导致 CS 不能用时，官方 FAQ 给的办法是<strong>降级游戏版本<\/strong>（用 downgrader），并把 <code>appmanifest_489830.acf<\/code> 设为只读来锁版本；恢复更新则取消只读 + 校验文件。<\/li><li>降级后别忘了同步更新 <strong>CommonLibSSE / Address Library / Engine Fixes<\/strong>，否则会报 Address Library 相关错误。<\/li><\/ul>\n<h2>VR：已停止支持<\/h2>\n<p><strong>CS 主版本不再支持 VR。<\/strong> 想要在 VR 里用 CS（或继续 VR 方向的开发），请转投社区分支 <strong>Open Shaders<\/strong>。<\/p>\n<blockquote>这也是为什么 <a href=\"feature-matrix.md\" target=\"_blank\" rel=\"noopener\">功能对照矩阵<\/a> 里会单独有一列 <code>CS VR<\/code>——历史与分支的差异仍然记录着。<\/blockquote>\n<h2>Linux：不官方支持，但有活跃社区<\/h2>\n<ul><li>开发团队<strong>不官方支持 Linux<\/strong>（安装问题请找社区）。<\/li><li>官方指路的发行版/管理器：<strong>Fluorine<\/strong>（<code>SulfurNitride/Fluorine-Manager<\/code>）。官方 FAQ 在多处（安装、排错）都指向它。<\/li><li>Nexus 页面另提到 Linux 用户可跟随 <code>SulfurNitride/NaK<\/code> 指南。<\/li><\/ul>\n<h2>功能并入核心的时间线<\/h2>\n<p>CS 会把成熟的附加特性<strong>收进基础安装（Core）<\/strong>。这带来一个高频事故：<strong>升级 CS 后没删掉那个已并入核心的附加 MOD → 文件互相覆盖 → 着色器编译失败<\/strong>。所以升级时务必对照下表清理。<\/p>\n<table><thead><tr><th style=\"text-align:left\">纳入版本<\/th><th style=\"text-align:left\">并入核心的功能<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>1.0+<\/strong><\/td><td style=\"text-align:left\">Dynamic Cubemaps、Complex Parallax Materials、Water Parallax、Tree LOD Lighting<\/td><\/tr><tr><td style=\"text-align:left\"><strong>1.4+<\/strong><\/td><td style=\"text-align:left\">Light Limit Fix、Frame Generation<\/td><\/tr><tr><td style=\"text-align:left\"><strong>1.4.7+<\/strong><\/td><td style=\"text-align:left\">Terrain Shadows、Inverse Square Lighting、Water Effects、Interior Sun、Extended Translucency<\/td><\/tr><tr><td style=\"text-align:left\"><strong>1.5.0+<\/strong><\/td><td style=\"text-align:left\">Screenspace Shadows、Grass Collision、Grass Lighting、Subsurface Scattering<\/td><\/tr><tr><td style=\"text-align:left\"><strong>1.7.0+<\/strong><\/td><td style=\"text-align:left\">Sky Sync<\/td><\/tr><tr><td style=\"text-align:left\"><strong>1.8.0+<\/strong><\/td><td style=\"text-align:left\">Cloud Shadows<\/td><\/tr><\/tbody><\/table>\n<blockquote>完整的「达到某版本必须移除哪些 MOD」清单（含更早的并入项）见 <a href=\"../03-reference/incompatible-mods.md\" target=\"_blank\" rel=\"noopener\">不兼容 MOD - 版本演进<\/a>。<\/blockquote>\n<h2>官方团队与常驻贡献者<\/h2>\n<p>CS 是纯社区项目（GPL-3.0，永不闭源）。以下名字散见于各功能页的 Contributors，便于你知道「这项功能是谁做的、该找谁」：<\/p>\n<ul><li><strong>核心 / 维护<\/strong>：doodlum（创建者、主要负责人、仓库维护）、Nukem（原版着色器与渲染管线逆向）、aers（逆向与引擎修复）、Jonahex（TruePBR、逆向、最早的分片缓存）<\/li><li><strong>主要贡献<\/strong>：alandtse（VR 支持、后端系统）、FlayaN（UI、VR）、ProfJack（TruePBR glints、云影、地形阴影、优化）、hakasapl（PGPatcher、Terrain Helper）、sicsix（平方反比光照、天空同步）、jiaye（动态立方体贴图、次表面散射、水体）、davo0411（水体、UI、Nexus 页维护）、SkrubbySkrubInAShrub（UI 与修复）、ffarrell17 / Dlizzio / Bottle / soda（UI）、RealExist（优化）、Ersh、Maxsu、powerofthree、sheson（xLODGen）<\/li><li><strong>外部/前置作者<\/strong>：sheson（DynDOLOD / xLODGen）、powerofthree（CommonLibSSE）、mindflux / rudy102 / fadingsignal（粒子光照资料）<\/li><\/ul>\n<blockquote>上表依据官方 wiki 各功能页署名整理，非完整名单；权威名单见 Nexus 发布页的 Credits。<\/blockquote>\n<h2>出问题该找谁<\/h2>\n<ol><li>先读 <a href=\"../03-reference/faq.md\" target=\"<em>blank\" rel=\"noopener\">FAQ<\/a> 与 <a href=\"../06-community/common-pitfalls.md\" target=\"<\/em>blank\" rel=\"noopener\">常见坑<\/a>。<\/li><li>再不行 → <strong>官方 Discord<\/strong>（实时求助、功能预览、测试反馈都在这里）。<\/li><li>确认是 bug → 才去 GitHub 开 Issue（功能请求请走 Discord 的 <code>#cs-feature-request<\/code>，别开 Issue）。<\/li><li>官方明确划出的渠道边界：测试构建的问题<strong>不要<\/strong>发到 <code>#support<\/code>，要回原帖/原线程。<\/li><\/ol>\n<blockquote>信息源里哪些可信、哪些是内容农场，见 <a href=\"../06-community/community-resources.md\" target=\"_blank\" rel=\"noopener\">可信信息源<\/a>。<\/blockquote>\n<h2>相关条目<\/h2>\n<ul><li><a href=\"feature-matrix.md\" target=\"_blank\" rel=\"noopener\">官方功能对照矩阵与路线图<\/a><\/li><li><a href=\"../01-installation/requirements.md\" target=\"<em>blank\" rel=\"noopener\">系统与环境需求<\/a> · <a href=\"../01-installation/installation-guide.md\" target=\"<\/em>blank\" rel=\"noopener\">安装指南<\/a><\/li><\/ul>", "_file": "00-overview/version-and-support.md", "_chars": 3942}, {"id": "enb-migration", "title": "ENB 迁移指南", "category": "01-installation", "version": "1.0.0", "updated": "2026-09-20", "tags": ["ENB", "迁移", "Effects11", "兼容"], "aliases": ["ENB 换 CS", "从 ENB 迁移", "ENB 卸载", "enb migration", "转投 CS"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/ENB-Migration-Guide", "summary": "从 ENB 模组列表迁移到以 CS 为核心的配置：移除 ENB 二进制、替换特性、重装相关 MOD。", "content": "<p>将基于 ENB 的 MOD 列表转换为以 Community Shaders 为核心的配置。<\/p>\n<h2>基础转换<\/h2>\n<h3>步骤 1：移除 ENB 二进制<\/h3>\n<p>CS 与 ENB 的 DLL <strong>同时安装会导致游戏崩溃<\/strong>。ENB 二进制位于游戏根目录（或 Rootbuilder 的 <code>Root<\/code> 文件夹），删除： <code>d3d11.dll<\/code> 与 <code>d3dcompiler_46e.dll<\/code>。<\/p>\n<blockquote><strong>无需<\/strong>删除 <code>enbseries<\/code> 文件夹与 ENB ini——加载 ENB 预设（经 Effects 11）时还要用到它们。<\/blockquote>\n<h3>步骤 2：移除 ENB 专属 / 不兼容 MOD<\/h3>\n<p>CS 会在检测到某些不兼容 MOD 时<strong>自我禁用<\/strong>。先查 <a href=\"../03-reference/faq.md\" target=\"_blank\" rel=\"noopener\">FAQ<\/a> 最新清单。常见需移除：<\/p>\n<ul><li>EVLaS/AELaS（被 CS Sky Sync 替代）<\/li><li>KiLoader、ENB Worldspace Weatherlists、ENB Input Disabler、ENB Helper Plus、ENB AO Toggler、ENB Custom UI Color<\/li><li>ENB Anti-Aliasing（被 CS Upscaling 替代）、ENB Frame Generation（被 CS Upscaling 替代）<\/li><li>Skyrim Upscaler（付费/免费均不支持）<\/li><li>ENB Light 及其衍生（有限支持，建议换 Light Placer）<\/li><li>ENB Light Inventory Fix (ELIF)、ENB Terrain Blending Fix（CS 已含）、NVIDIA Reflex（与 CS 同用会卡顿）、Native Mesh Light Flicker Fix（被 CS LLF 替代）、Native Water Light Stabilizer（被 CS LLF 替代）<\/li><\/ul>\n<blockquote>列表非穷举。可在 MOD 列表中搜索含 “ENB” 的项先禁用。<strong>Particle Patch 受 CS 支持，无需移除<\/strong>（放加载顺序靠前让其被覆盖即可）；Water for ENB 完全兼容 CS 且有 CS 专用 FOMOD。 本清单最后更新：2026/06/15。<\/blockquote>\n<h3>步骤 3：安装 CS 前置<\/h3>\n<p>先读 <a href=\"installation-guide.md\" target=\"_blank\" rel=\"noopener\">安装指南<\/a>。必须装：Address Library、SSE Engine Fixes、Crash Logger（可选但推荐）。Engine Fixes 的 SKSE64 Preloader 需放入你之前放 ENB 二进制的根目录。<\/p>\n<h3>步骤 4：安装 CS + Effects 11<\/h3>\n<p>核心 MOD 必装且先加载，随后加载各附加特性。推荐与 Effects 11 搭配：<\/p>\n<ul><li><strong>SSGI<\/strong>：通过光遮挡与反弹带来更真实光照，质量远高于 ENB SSAO/IL（很重）。<\/li><li><strong>Skylighting<\/strong>：为屋檐、树荫、建筑内等遮蔽区增加着色，质量高于 ENB 版。<\/li><\/ul>\n<h3>步骤 5：Effects 11 后处理<\/h3>\n<p>支持大多数 ENB 预设（有兼容限制），于 <a href=\"https://mod.pub/skyrim-se/415-effects-11\" target=\"_blank\" rel=\"noopener\">mod.pub<\/a> 下载。预设安装方式与 ENBSeries 相同：<code>enbseries<\/code> 文件夹与 <code>enbseries.ini<\/code> 放入根目录（也可放 Data，但不推荐）。<\/p>\n<p><strong>兼容注意<\/strong>：<\/p>\n<ul><li><strong>不支持<\/strong>：Depth of Field、Sky Scattering、Prepass Shaders。<\/li><li><strong>加密 ENB 预设无法加载<\/strong>（需先解密），例如 Cabbage、Kauz、Dawnfire、Silent Horizons 2、Picta。<\/li><li>CS 已替代：SSAO/IL→SSGI、Skylighting→Skylighting、抗锯齿→Upscaling、反射/水/水下→Water Effects、SSS→SSS、阴影→Screen Space Shadows。<\/li><\/ul>\n<h3>步骤 6：重装部分 MOD<\/h3>\n<ul><li><strong>Lux<\/strong>：重装并取消所有 particle 与 optimized 网格。<\/li><li><strong>Embers XD<\/strong>：重装并选 CS 选项。<\/li><li><strong>Water for ENB<\/strong>：重装并选 CS 选项（仅当你使用的风格需要）。<\/li><\/ul>\n<h3>步骤 7：收尾<\/h3>\n<p>预设在 CS 菜单 <code>Effects 11<\/code> 标签页微调。仍有问题去 Discord。<\/p>\n<h2>完整转换<\/h2>\n<p>在基础转换之上进一步将整个列表转向 CS：<\/p>\n<ol><li>完成基础转换（游戏已无图形问题）。<\/li><li>移除更多 ENB 专属 MOD（不再需要但无害的，如 Sky Reflection Fix for ENB、Capture Warmer for ENB、Bright Waterfall Fix for ENB、Footprints - ENB patch、ENB Light Detection Fix、Word Wall Transparency Fix for ENB）。清单最后更新 2026/01/31。<\/li><li><strong>天气 MOD<\/strong>：不用 Effects 11 时强烈依赖天气 MOD 决定室外观感。CS 补丁示例：NAT.CS（配 NAT.ENB III）、Obsidian CS（配 Obsidian，移除 Rudy ENB Obsidian 补丁）、Azurite III HDR/CS/Enhanced。<\/li><li><strong>用 Light Placer 替换 ENB Light<\/strong>：搜索列表中的 “ENB Light” 并禁用（注意 MLO2 等未明示的依赖）。社区替代是 <strong>Light Placer + CS Light<\/strong>。<\/li><li>（WIP）未来可用 CS <strong>Post Processing<\/strong> 替代 Effects 11，充分利用 Linear Lighting 与 HDR Display，并支持 DoF 等 Effects 11 不支持的特性。<\/li><\/ol>", "_file": "01-installation/enb-migration.md", "_chars": 2941}, {"id": "vanilla-setup", "title": "Vanilla 设置指南", "category": "01-installation", "version": "2.0.0", "updated": "2026-09-21", "tags": ["画质", "设置", "照明", "天气", "推荐", "PBR", "MOD清单"], "aliases": ["原版设置", "vanilla 配置", "游戏设置怎么调", "CS 前置设置"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/vanilla-setup-guide", "summary": "在已稳定安装 CS 的基础上，按官方推荐搭配照明、天气、窗口阴影、粒子补丁与 PBR 纹理，把画面推到最佳。", "content": "<p>本页面向<strong>已稳定安装完整 CS 套件<\/strong>的玩家，讲如何充分发挥画质潜力。<\/p>\n<blockquote>还没装好 CS 的话，请先走 <a href=\"installation-guide.md\" target=\"_blank\" rel=\"noopener\">安装指南<\/a>。从没 mod 过 Skyrim 的，官方推荐先读 <strong>A Dragonborn's Fate<\/strong>（moddinglinked.com）或 <strong>STEP Modifications Guide<\/strong>，再回来。  提供的 FOMOD 选项仅为<strong>推荐<\/strong>设置。<strong>请务必读你要下载的 MOD 的说明<\/strong>——官方原话是这能替作者和支持省下大量时间。<\/blockquote>\n<h2>照明（Lighting）<\/h2>\n<p>照明 MOD 是让你把 CS 用到位的关键一环。官方点名<strong>当前最流行的两款室内方案是 True Light 与 Lux CS<\/strong>，两者观感都很好，纯按审美选。<\/p>\n<blockquote>✅ <strong>装任何照明 MOD 之前，先装 Light Placer 与 CS Light。<\/strong><\/blockquote>\n<p>规则（官方明确）：<\/p>\n<ul><li>照明 MOD 会<strong>手动放置光源<\/strong>（室内或室外），因此作者常把编辑<strong>拆成两个插件<\/strong>（一个室外、一个室内），方便你跨 MOD 混搭。<\/li><li>⚠️ <strong>同一时间只用一款室内 + 一款室外照明 MOD。<\/strong><\/li><li>⚠️ <strong>你的室外光照同时受天气 MOD 影响。<\/strong><\/li><li>⚠️ <strong>任何用到 ENB Light / ENB Particle Lights 的 MOD 都与 CS 不兼容。<\/strong> 用了的话，<strong>那些物体不会发出任何光<\/strong>。请改找基于 <strong>CS Light 或 Light Placer<\/strong> 的补丁。<\/li><\/ul>\n<h3>True Light<\/h3>\n<blockquote>一套覆盖面广的现代照明 MOD，使用 po3 的 Light Placer 与 CS 的 Inverse Square Lighting 特性。<\/blockquote>\n<p>FOMOD 选项（官方记录的推荐流程）：<code>Next<\/code> → <code>Yes<\/code> → <code>Yes（推荐）<\/code> → <code>Yes（推荐）<\/code> → <code>Regular<\/code> → <strong><code>True Light Exteriors<\/code>（想混搭室内外的话不要选它）<\/strong> → <code>Dwemer Swap BOS<\/code> → <code>FX Glow Remover BOS<\/code> → <code>Install<\/code>。<\/p>\n<h3>Lux CS<\/h3>\n<blockquote>针对 Lux 与 Community Shaders 的色调映射与 Image Space 编辑，带 Light Placer 支持。<\/blockquote>\n<ul><li>Lux CS 的说明页里有 <strong>Lux 本体的 FOMOD 选项指引<\/strong>。<\/li><li>想要<strong>室外光照编辑<\/strong>，用 <strong>Lux Via<\/strong> 与 <strong>Lux Orbis<\/strong>。<\/li><li>⚠️ <strong>Lux CS 与「Ambient Templates for Lighting Mods」「Windows Shadows Ultimate」不兼容。<\/strong><\/li><\/ul>\n<p>FOMOD 选项：<code>LightPlacer addon<\/code> → <code>Bright<\/code> → <code>Install<\/code>。<\/p>\n<h3>其它常见照明 MOD<\/h3>\n<p>以下是<strong>通用型<\/strong>照明 MOD：能与 CS 一起工作，但<strong>不使用 CS 的色调映射器或 Light Placer<\/strong>。<\/p>\n<blockquote>⚠️ <strong>不要用 EVLaS<\/strong>——Sky Sync 已完全取代它。  ⚠️ <strong>Modern Lighting Overhaul 2 高于 1.3.6 的任何版本都与 CS 不兼容。<\/strong><\/blockquote>\n<ul><li><strong>Lux Via / Lux Orbis<\/strong>（仅室外）<\/li><li><strong>ELFX<\/strong>（含室内、室外独立插件）<\/li><li><strong>Luminosity Lighting Overhaul<\/strong>（仅室内）<\/li><li><strong>Relighting Skyrim<\/strong>（含室内、室外独立插件）<\/li><li><strong>Skyrim is Luminous<\/strong>（光源编辑，去说明页确认兼容性）<\/li><li><strong>Lightened Skyrim<\/strong>（含室内、室外独立插件）<\/li><\/ul>\n<h2>天气（Weathers）<\/h2>\n<p>天气 MOD 改写室外光照与天气数据，让 CS 套件充分发挥。<strong>务必读它们的说明页<\/strong>——里面常链接到其它视觉 MOD。<strong>先确认你喜欢的天气 MOD 有没有 CS 移植版。<\/strong><\/p>\n<blockquote>官方鼓励你都试一遍，它们各有审美取向。  ⚠️ <strong>同一时间只用一款天气 MOD。<\/strong><\/blockquote>\n<p>官方给出的（非穷尽）清单：<\/p>\n<ul><li><strong>NAT.CS III<\/strong>（dBottle）<\/li><li><strong>Obsidian CS<\/strong>（dBottle）<\/li><li><strong>Astralite Weathers<\/strong>（Laminin）<\/li><li><strong>Azurite III CS<\/strong>（Dlizzio）<\/li><li><strong>Vanilla CS<\/strong>（dBottle）<\/li><li><strong>Real Weathers Remastered<\/strong>（PixelsSquared）<\/li><li><strong>Nirn Whispers<\/strong>（CarbonDice）<\/li><\/ul>\n<h2>其它视觉增强<\/h2>\n<h3>窗口阴影（室内）<\/h3>\n<p><strong>Window Shadows Ultimate（WSU）<\/strong>是<strong>高度推荐<\/strong>的室内照明 MOD，能产生真实的窗户阴影。别忘了同时看它的 <strong>Patch Hub<\/strong>。<\/p>\n<blockquote>⚠️ <strong>WSU 与以下互斥<\/strong>：Window Shadows RT、<strong>Lux<\/strong>、ELFX Shadows、Enhanced Lights and FX、Relighting Skyrim (Interiors)、Skyrim is Luminous。<\/blockquote>\n<p>FOMOD 选项：先按你的负载装所需补丁 → <code>Brightest<\/code> → <code>Normal<\/code> → <code>Enable<\/code> → <code>Install<\/code>。<\/p>\n<h3>CS Particle Patch<\/h3>\n<p><strong>修复了大量原版网格的光照，强烈推荐。<\/strong><\/p>\n<ul><li>与 <strong>ENB Particle Patch 兼容<\/strong>，但<strong>必须让 CS Particle Patch 覆盖它<\/strong>。<\/li><li>安装时<strong>务必检查它的需求<\/strong>——不是所有需求都是硬性的。<\/li><\/ul>\n<h3>DIAL（Dynamic Interior Ambient Lighting）<\/h3>\n<p>按<strong>一天中的时间<\/strong>调整室内亮度。<strong>高度推荐。<\/strong><\/p>\n<h3>亮度调节<\/h3>\n<ul><li><strong>室内<\/strong>：看 <code>Ambient Templates for Lighting Mods<\/code> 的 FOMOD 亮度选项（<strong>百分比越高越亮<\/strong>）。<\/li><li><strong>室外<\/strong>：由你的天气 MOD 插件决定。可以先用 <strong>KreatE<\/strong> 调亮度值，再把改好的值<strong>复制进 xEdit 里的插件<\/strong>。<\/li><\/ul>\n<h3>去除假辉光（Remove Fake FX）<\/h3>\n<p>要去掉原版光源周围那圈 <strong>2D 假辉光<\/strong>，<strong>True Light 的 FOMOD 提供了 Base Object Swapper 配置<\/strong>。<\/p>\n<h3>立方体贴图（Cubemaps）<\/h3>\n<p><strong>Seamless Dynamic Cubemaps<\/strong> 提供动态立方体贴图纹理，并修复多种改装与原版 cubemap。<strong>与 PBR 纹理搭配良好。<\/strong><\/p>\n<h2>PBR 纹理<\/h2>\n<p>CS 通过 <strong>True PBR<\/strong> 支持 PBR 纹理；用上进阶渲染技法后，PBR 纹理能接近真实生活的观感。<\/p>\n<p><strong>入门推荐<\/strong>（官方清单）：<\/p>\n<ul><li><strong>Faultier's PBR Skyrim<\/strong> — 对原版纹理做了全面重制，适合起步；<\/li><li><strong>Skyland PBR<\/strong><\/li><li><strong>Cathedral Landscapes PBR<\/strong><\/li><li><strong>Vanaheimer Landscapes<\/strong>（主文件里选 PBR 那项）<\/li><\/ul>\n<p>也要<strong>为你已有的纹理 MOD 找 PBR 补丁<\/strong>——建议从 <strong>PBR Hub<\/strong> 开始找。想自己创作 PBR 纹理，看 <a href=\"../04-development/pbr-for-artists.md\" target=\"_blank\" rel=\"noopener\">True PBR 美术家指南<\/a>。<\/p>\n<blockquote>⚠️ <strong>加了 PBR 纹理就必须用 <a href=\"../05-tools/pgpatcher.md\" target=\"_blank\" rel=\"noopener\">PGPatcher<\/a> 修补网格<\/strong>，否则不会正确生效。  好习惯：<strong>为 PGPatcher 的输出单独建一个 output mod<\/strong>，并严格按 PGPatcher 说明里的冲突管理来做。  ✅ 用 <strong>Asset Doctor<\/strong> 确认没有缺失纹理。  ✅ <strong>PBR 纹理受益于「没坏掉的网格」<\/strong>——可以从 <strong>Mesh Improvement Compilation<\/strong> 这类网格修复包起步（网格修复 MOD 的海洋是无尽的）。<\/blockquote>\n<h2>性能<\/h2>\n<p>铁律：<strong>你加的 MOD 越多，性能越差。<\/strong> 除非机器很强，加上这些 MOD 与纹理会带来帧率下降。<\/p>\n<h2>预设（Presets）<\/h2>\n<p>目前设置预设<strong>仅适用于 CS 的实验构建<\/strong>，在该项目的 <strong>Discord<\/strong> 获取。<\/p>\n<h2>相关条目<\/h2>\n<ul><li><a href=\"installation-guide.md\" target=\"<em>blank\" rel=\"noopener\">安装指南<\/a> · <a href=\"enb-migration.md\" target=\"<\/em>blank\" rel=\"noopener\">ENB 迁移指南<\/a> · <a href=\"requirements.md\" target=\"_blank\" rel=\"noopener\">系统与环境需求<\/a><\/li><li><a href=\"../05-tools/light-placer.md\" target=\"<em>blank\" rel=\"noopener\">Light Placer<\/a> · <a href=\"../05-tools/pgpatcher.md\" target=\"<\/em>blank\" rel=\"noopener\">PGPatcher<\/a><\/li><li><a href=\"../06-community/common-pitfalls.md\" target=\"_blank\" rel=\"noopener\">实战常见坑<\/a>（照明/天气冲突的排错）<\/li><\/ul>", "_file": "01-installation/vanilla-setup.md", "_chars": 4280}, {"id": "installation-guide", "title": "安装指南", "category": "01-installation", "version": "1.1.0", "updated": "2026-09-21", "tags": ["安装", "入门", "步骤", "MO2", "Vortex", "合集"], "aliases": ["CS 怎么装", "CS 安装教程", "community shaders install", "MO2 装 CS"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/installation-guide", "summary": "在纯净 Skyrim 上安装 Community Shaders 的完整步骤、前置条件与更新方法。", "content": "<p>本指南覆盖将 Community Shaders 安装到纯净 Skyrim 的全部需求与推荐流程。<\/p>\n<h2>开始前<\/h2>\n<ol><li><strong>移除不兼容 MOD<\/strong>（见 <a href=\"../03-reference/faq.md\" target=\"<em>blank\" rel=\"noopener\">FAQ-不兼容<\/a> 与 <a href=\"../03-reference/incompatible-mods.md\" target=\"<\/em>blank\" rel=\"noopener\">不兼容 MOD<\/a>）。<\/li><li><strong>确认满足所有需求<\/strong>（游戏版本、GPU、VC Redist 等），见 <a href=\"requirements.md\" target=\"_blank\" rel=\"noopener\">需求<\/a>。<\/li><li>将 Skyrim 配置为<strong>无边框窗口<\/strong>：<ul><li><code>SkyrimPrefs.ini<\/code>：<code>bBorderless=1<\/code>、<code>bFull Screen=0<\/code>；<\/li><li>若用 Display Tweaks：<code>SSEDisplayTweaks.ini<\/code> 设 <code>Fullscreen=false<\/code>、<code>Borderless=true<\/code>、<code>BorderlessUpscale=false<\/code>（或用<a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/144637\" target=\"_blank\" rel=\"noopener\">预置配置<\/a>）。<\/li><\/ul><\/li><li><strong>关闭自动更新<\/strong>：Steam 用户找到 <code>&lt;库&gt;/steamapps/appmanifest_489830.acf<\/code>，右键→属性→只读→应用；GOG 直接关闭自动更新。<\/li><\/ol>\n<h2>Vortex 一键安装：官方合集<\/h2>\n<p>Vortex 用户可以直接用官方 <strong>Community Shaders Collection<\/strong>（Nexus Collections 编号 <code>62eesj<\/code>）一键装齐 CS 与全部附加特性。<\/p>\n<blockquote>⚠️ 用了合集就<strong>整体更新<\/strong>，不要单独去更新其中某一个特性——两边版本错开会直接导致着色器编译失败（详见下文「更新」）。<\/blockquote>\n<p>MO2 用户、或想自己掌控每个组件的，按下面的手动流程走。<\/p>\n<h2>新手从哪开始<\/h2>\n<p>从没 mod 过 Skyrim 的，官方安装指南点名推荐先读 <a href=\"https://dragonbornsfate.moddinglinked.com/intro.html\" target=\"_blank\" rel=\"noopener\">A Dragonborn's Fate<\/a>，读到 Community Shaders 这一节再回来。<\/p>\n<h2>安装步骤<\/h2>\n<blockquote>推荐使用 <strong>Mod Organizer 2 (MO2)<\/strong> 或 <strong>Vortex<\/strong>。仅这两款获得官方支持。<\/blockquote>\n<ol><li>安装所有<a href=\"requirements.md\" target=\"_blank\" rel=\"noopener\">前置 MOD<\/a>：<ul><li>SKSE64 <strong>手动<\/strong>拖入游戏根目录（含 <code>SkyrimSE.exe<\/code> 的目录）；<\/li><li>Engine Fixes 分两部分：主文件用管理器正常装，<strong>Preloader 手动<\/strong>将 <code>d3dx9_42.dll<\/code> 拖入根目录；<\/li><li>其余前置用管理器安装，勿手动。<\/li><\/ul><\/li><li>用管理器安装 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/86492\" target=\"_blank\" rel=\"noopener\">Community Shaders<\/a>（Nexus 页是唯一官方支持构建，仅最新版受支持）。<\/li><li>按需安装 <a href=\"../02-features/additional\" target=\"_blank\" rel=\"noopener\">附加特性<\/a>（同样仅在官方源下载、带 CS 标识者受官方支持）。<\/li><\/ol>\n<blockquote>若 CS 或其附加功能文件互相覆盖或被其它 MOD 覆盖，多半操作有误（除非 MOD 页另有说明）。只从官方源下载 CS 特性。<\/blockquote>\n<p>启动 <code>skse64_loader.exe<\/code>（MO2 用户<strong>必须<\/strong>经 MO2 启动以加载 MOD）。出现左上“Compiling Shaders”与 CS 欢迎横幅即成功。关闭弹窗前确认 END 为默认菜单键（点弹窗上的按键区可改键）。<\/p>\n<h2>安装后<\/h2>\n<ul><li>从 ENB 迁移者看 <a href=\"enb-migration.md\" target=\"_blank\" rel=\"noopener\">ENB 迁移指南<\/a>。<\/li><li>想进一步提升画质看 <a href=\"vanilla-setup.md\" target=\"_blank\" rel=\"noopener\">Vanilla 设置指南<\/a>。<\/li><li>使用 Lux 者：重装并<strong>取消<\/strong>“optimized”网格；CS Light Limit Fix 已替代它们。勿勾选支持粒子光照的选项（与 CS 不兼容）。<\/li><\/ul>\n<h2>更新<\/h2>\n<ul><li>若使用 <a href=\"https://www.nexusmods.com/games/skyrimspecialedition/collections/62eesj\" target=\"_blank\" rel=\"noopener\">Community Shaders Collection<\/a>，应整体更新合集，而非单独更新各特性。<\/li><li>CS 更新时，部分附加特性<strong>必须同步更新<\/strong>（非可选）。用 MO2/Vortex 的 Nexus 更新检查判断哪些需更新。<\/li><li>某特性若被并入核心（见 <a href=\"../03-reference/faq.md\" target=\"_blank\" rel=\"noopener\">FAQ-废弃特性<\/a>），升级 CS 时必须从 MOD 列表移除它。<\/li><li>更新后应在 END 菜单确认版本号，并完成着色器编译。<\/li><\/ul>\n<h3>没出现“编译着色器”弹窗？<\/h3>\n<p>手动删除 Disk Cache：<\/p>\n<ul><li>MO2：<code>Overwrite/ShaderCache<\/code>（不了解 Overwrite 请看教程）；<\/li><li>Vortex：<code>&lt;游戏&gt;/Data/ShaderCache<\/code>。<\/li><li><strong>只删 <code>ShaderCache<\/code>，勿删 <code>Shaders<\/code><\/strong>；同时删 <code>UnifiedWaterCache<\/code>。详见 <a href=\"../00-overview/architecture.md\" target=\"_blank\" rel=\"noopener\">架构与缓存<\/a>。<\/li><\/ul>", "_file": "01-installation/installation-guide.md", "_chars": 2637}, {"id": "requirements", "title": "系统与环境需求", "category": "01-installation", "version": "1.1.0", "updated": "2026-09-21", "tags": ["需求", "前置", "兼容性", "安装", "强烈推荐"], "aliases": ["CS 前置", "CS 需要什么", "Vulkan", "系统需求"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/installation-guide#requirements", "summary": "支持的游戏版本、GPU/系统要求，以及必须安装的前置 MOD 清单。", "content": "<p>安装 Community Shaders 前，必须满足以下硬性条件。<\/p>\n<h2>游戏版本<\/h2>\n<ul><li><strong>Skyrim 1.6.1170（Steam） / 1.6.1179（GOG） / 1.5.97<\/strong><\/li><li><strong>不支持<\/strong> LE、VR 以及其它所有 Skyrim 版本。特别地，<strong>1.6.640、1.7.99、1.7.104 都不受支持<\/strong>。<\/li><li>团队只计划支持 Steam 最新版与 1.5.97；新版本发布后会跟进支持。<strong>除 1.5.97 外没有长期支持（LTS）承诺<\/strong>。<\/li><li>CS 主版本<strong>不再支持 VR<\/strong>，VR 用户请看 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/180419\" target=\"_blank\" rel=\"noopener\">Open Shaders<\/a>。<\/li><li>更完整的版本与支持策略见 <a href=\"../00-overview/version-and-support.md\" target=\"_blank\" rel=\"noopener\">版本与支持策略<\/a>。<\/li><\/ul>\n<h2>硬件 / 系统<\/h2>\n<ul><li><strong>GPU<\/strong>：支持 <strong>Vulkan 1.4 或更新<\/strong>（GTX 900 Maxwell 系列、RX 5000 RDNA1 系列或更新）。<ul><li>不确定可查 <a href=\"https://www.techpowerup.com/gpu-specs\" target=\"_blank\" rel=\"noopener\">TechPowerUp<\/a>。<\/li><\/ul><\/li><li><strong>Intel 核显不支持<\/strong>；所有 CPU 均可。<\/li><li><strong>系统<\/strong>：Windows 10 创意者更新或更新（Linux 用户见 <a href=\"https://github.com/SulfurNitride/Fluorine-Manager\" target=\"_blank\" rel=\"noopener\">Fluorine<\/a>）。<\/li><li><strong>运行库<\/strong>：<a href=\"https://learn.microsoft.com/en-us/cpp/windows/latest-supported-vc-redist?view=msvc-170\" target=\"_blank\" rel=\"noopener\">Microsoft Visual C++ Redistributable<\/a>（务必装 X64 最新版）。<\/li><\/ul>\n<h2>必须安装的前置 MOD<\/h2>\n<table><thead><tr><th style=\"text-align:left\">MOD<\/th><th style=\"text-align:left\">说明<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/30379\" target=\"_blank\" rel=\"noopener\">SKSE64<\/a><\/td><td style=\"text-align:left\">脚本扩展，<strong>需手动<\/strong>放入游戏根目录<\/td><\/tr><tr><td style=\"text-align:left\"><a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/32444\" target=\"_blank\" rel=\"noopener\">Address Library<\/a><\/td><td style=\"text-align:left\">SKSE 插件地址库<\/td><\/tr><tr><td style=\"text-align:left\"><a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/17230\" target=\"_blank\" rel=\"noopener\">Engine Fixes<\/a><\/td><td style=\"text-align:left\">引擎修复（含 Preloader，需手动放 <code>d3dx9_42.dll<\/code> 到根目录）<\/td><\/tr><\/tbody><\/table>\n<h2>强烈推荐（官方 Nexus 页）<\/h2>\n<p>这两项不是硬性需求，但官方在 Nexus 发布页专门列了出来：<\/p>\n<table><thead><tr><th style=\"text-align:left\">MOD<\/th><th style=\"text-align:left\">说明<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Crash Logger<\/strong>（SSE AE VR，PDB 支持）<\/td><td style=\"text-align:left\">帮助诊断崩溃。官方 FAQ 反复强调：报 bug 时不带日志基本没人能帮你<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Assorted Mesh Fixes<\/strong><\/td><td style=\"text-align:left\">修复网格问题——<strong>这些问题是 CS 会「照出来」的<\/strong>（原版渲染器一直掩盖着它们，CS 把它们暴露了）<\/td><\/tr><\/tbody><\/table>\n<h2>新手从哪开始<\/h2>\n<p>官方安装指南点名推荐：<strong>从没 mod 过 Skyrim 的人，先读 <a href=\"https://dragonbornsfate.moddinglinked.com/intro.html\" target=\"<em>blank\" rel=\"noopener\">A Dragonborn's Fate<\/a><\/strong>（作者同时也是 <em>Viva New Vegas<\/em> 的作者），读到 Community Shaders 那一节再回来。整体负载构建另可参考 <strong>STEP Modifications Guide<\/strong>（见 <a href=\"vanilla-setup.md\" target=\"<\/em>blank\" rel=\"noopener\">Vanilla 设置指南<\/a>）。<\/p>\n<h2>不兼容 MOD（节选）<\/h2>\n<ul><li>ENBSeries（见 <a href=\"https://mod.pub/skyrim-se/415-effects-11\" target=\"_blank\" rel=\"noopener\">Effects 11<\/a> 以支持未加密预设）<\/li><li>任何阻止 CS 初始化的 MOD（如 NVIDIA Reflex、TAA Sharpen 等）<\/li><\/ul>\n<blockquote>完整不兼容清单见 <a href=\"../03-reference/incompatible-mods.md\" target=\"<em>blank\" rel=\"noopener\">参考-不兼容 MOD<\/a> 与 <a href=\"../03-reference/faq.md\" target=\"<\/em>blank\" rel=\"noopener\">FAQ<\/a>。<\/blockquote>", "_file": "01-installation/requirements.md", "_chars": 2270}, {"id": "advanced-skin", "title": "Advanced Skin 进阶皮肤", "category": "02-features", "kind": "additional", "status": "TBA", "version": "1.0.0", "updated": "2026-09-20", "tags": ["皮肤", "角色"], "aliases": ["皮肤渲染", "advanced skin", "皮肤 shader", "角色皮肤"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home", "summary": "以多种技术增强角色皮肤渲染。[TBA]", "content": "<blockquote>分类：附加特性 · 状态：开发中 (TBA)<\/blockquote>\n<p>以多种技术增强角色皮肤渲染。[TBA]<\/p>\n<h2>说明<\/h2>\n<p>开发中（TBA）。计划用多种技术提升角色皮肤渲染质量。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：附加特性<\/li><li>状态：开发中 (TBA)<\/li><li>标签：皮肤, 角色<\/li><li>官方来源：https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/additional/advanced-skin.md", "_chars": 602}, {"id": "cs-editor", "title": "CS Editor 编辑器", "category": "02-features", "kind": "core", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["开发工具", "天气"], "aliases": ["CS 编辑器", "cs editor", "游戏内调参数"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home", "summary": "实时天气与 imagespace 编辑器，服务所有 MOD 制作需求。", "content": "<blockquote>分类：核心特性 · 状态：已发布<\/blockquote>\n<p>实时天气与 imagespace 编辑器，服务所有 MOD 制作需求。<\/p>\n<h2>说明<\/h2>\n<p>为 MOD 作者提供的实时编辑工具，可调整天气与 imagespace 参数。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：核心特性<\/li><li>状态：已发布<\/li><li>标签：开发工具, 天气<\/li><li>官方来源：https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/core/cs-editor.md", "_chars": 612}, {"id": "cloud-shadows", "title": "Cloud Shadows 云影", "category": "02-features", "kind": "core", "status": "released", "version": "1.1.0", "updated": "2026-09-21", "tags": ["阴影", "户外", "天气", "体积光"], "aliases": ["云影", "云阴影", "cloud shadows"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home/cloud-shadows", "summary": "让云层对世界投射真实阴影的定制技术；与太阳对齐、使用真实云系统而非滚动贴图，且不增加额外 draw call。", "content": "<blockquote>分类：核心特性（1.8.0+ 并入） · 状态：已发布<\/blockquote>\n<p>云层向世界投射阴影。这是 <strong>ProfJack 与 doodlum 合作开发的定制技术<\/strong>，不是现成方案。<\/p>\n<h2>它为什么和别的「云影」不一样<\/h2>\n<ul><li><strong>与太阳对齐、使用真实的云系统<\/strong>，而不是一张滚动贴图。所以云把太阳挡住时，玩家会<strong>真的被笼罩进黑暗<\/strong>。<\/li><li><strong>极快的近似算法<\/strong>：云从<strong>玩家视角<\/strong>渲染，再反投影（unproject）覆盖整个世界。<\/li><li><strong>不增加额外 draw call<\/strong>：云影贴图是在<strong>渲染立方体贴图反射的过程中顺带产出<\/strong>的副作用。<\/li><li><strong>被体积光复用<\/strong>：云影同样作用于体积光，<strong>太阳光束（godrays）会被云遮断<\/strong>。多云天气里云层骤然裂开的瞬间视觉上非常抓眼。<\/li><\/ul>\n<h2>相关条目<\/h2>\n<ul><li><a href=\"volumetric-lighting.md\" target=\"_blank\" rel=\"noopener\">体积光<\/a>（复用云影做遮挡）<\/li><li><a href=\"../../00-overview/feature-matrix.md\" target=\"_blank\" rel=\"noopener\">官方功能对照矩阵<\/a>（CS / ENB / VR 均有此项）<\/li><\/ul>\n<h2>贡献者<\/h2>\n<p>ProfJack、doodlum、alandtse。<\/p>\n<hr>\n<p><em>本条目依据官方功能页精修整理；如与官方页面不一致，以官方为准。<\/em><\/p>", "_file": "02-features/core/cloud-shadows.md", "_chars": 909}, {"id": "dynamic-cubemaps", "title": "Dynamic Cubemaps 动态立方体贴图", "category": "02-features", "kind": "core", "status": "released", "version": "1.1.0", "updated": "2026-09-21", "tags": ["反射", "环境", "材质", "水体"], "aliases": ["动态立方体贴图", "cubemap", "动态反射球", "dynamic cubemaps"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home/dynamic-cubemaps", "summary": "用「屏幕空间反射捕获」让物体反射真实环境而非假场景，并完整支持 ENB 的 dynamic cubemaps 规范。", "content": "<blockquote>分类：核心特性（1.0+ 并入） · 状态：已发布<\/blockquote>\n<p>让物体<strong>反射自己身处的真实环境<\/strong>，而不是一张预先做好的假场景。<\/p>\n<h2>核心原理：Screen-Space Reflection Capture<\/h2>\n<p>把屏幕信息投影到一个球面当作立方体贴图使用。含义是：<strong>只要某处被看见过一次，之后即使离开视野也能取用<\/strong>——代价是精度。该方案受 Minecraft 的 <em>Nostalgia Shader<\/em> 启发，doodlum 在其上做了大量扩展。<\/p>\n<p>在室外，这份数据会与反射立方体贴图混合，<strong>带上随时间与天气变化的天空<\/strong>。<\/p>\n<h3>三阶段流水线（每帧只跑一个，为性能）<\/h3>\n<ol><li><strong>Capture 捕获<\/strong>：把屏幕空间信息投影到原始立方体贴图，并更新用于淡入淡出的位置数据。<\/li><li><strong>Inference 推断<\/strong>：补出因淡出或缺失而丢失的信息。<\/li><li><strong>Specular Irradiance 镜面辐照度<\/strong>：生成用于反射的模糊纹理。<\/li><\/ol>\n<h2>相比 ENB 规范多做了什么<\/h2>\n<p><strong>完整支持 ENBSeries 的 dynamic cubemaps 规范<\/strong>（含 complex material 支持），并额外提供：<\/p>\n<table><thead><tr><th style=\"text-align:left\">扩展<\/th><th style=\"text-align:left\">说明<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>有色反射<\/strong><\/td><td style=\"text-align:left\">原版 cubemap 可用 <strong>sRGB F0 反射率值<\/strong>替代（可从 <a href=\"https://physicallybased.info/\" target=\"_blank\" rel=\"noopener\">physicallybased.info<\/a> 这类 PBR 数值库取）。别把动态 cubemap 做成纯黑——<strong>给它一个颜色<\/strong>。黑色 cubemap 会被映射为 F0 = 1.0<\/td><\/tr><tr><td style=\"text-align:left\"><strong>模糊反射<\/strong><\/td><td style=\"text-align:left\">标准反射做轻微模糊，观感更真实<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Inference 推断<\/strong><\/td><td style=\"text-align:left\">生成更准确的 cubemap<\/td><\/tr><tr><td style=\"text-align:left\"><strong>淡入淡出<\/strong><\/td><td style=\"text-align:left\">依位置淡入淡出数据；配合推断能<strong>估计你身后/头顶/脚下的东西<\/strong>，因此穿过一个 cell 时反射会变化<\/td><\/tr><tr><td style=\"text-align:left\"><strong>室外也加屏幕空间数据<\/strong><\/td><td style=\"text-align:left\">因此夜间能捕获灯光与窗户，以及阴影、草等<\/td><\/tr><\/tbody><\/table>\n<p>此外它加入了 <strong>fresnel<\/strong> 形式的低成本<strong>镜面 GI<\/strong>（面向电介质表面），室内外都生效——所有表面现在都会在掠射角下轻微反射环境。<\/p>\n<h2>联动与调试<\/h2>\n<ul><li><strong>水反射可横跨整个屏幕<\/strong>，并<strong>完全取代室内 cubemap<\/strong>。<\/li><li><a href=\"../additional/skylighting.md\" target=\"_blank\" rel=\"noopener\">Skylighting<\/a> 会判定物体是否被天空遮挡，<strong>阻止动态立方体贴图在不应出现天空反射的地方渲染天空反射<\/strong>。<\/li><li>想检验某物体是否吃到动态 cubemap，用 <a href=\"../../04-development/testing-and-debugging.md\" target=\"_blank\" rel=\"noopener\">TESTCUBEMAP 测试模式<\/a>。<\/li><\/ul>\n<h2>贡献者<\/h2>\n<p>doodlum、jiaye。<\/p>\n<hr>\n<p><em>本条目依据官方功能页精修整理；如与官方页面不一致，以官方为准。<\/em><\/p>", "_file": "02-features/core/dynamic-cubemaps.md", "_chars": 1684}, {"id": "effects-11", "title": "Effects 11 后处理", "category": "02-features", "kind": "additional", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["ENB", "后处理", "预设"], "aliases": ["Effects 11", "后处理效果", "effects shader"], "source": "https://mod.pub/skyrim-se/415-effects-11", "summary": "通过 FX11 框架支持未加密 ENB 预设。", "content": "<blockquote>分类：附加特性 · 状态：已发布<\/blockquote>\n<p>通过 FX11 框架支持未加密 ENB 预设。<\/p>\n<h2>说明<\/h2>\n<p>支持加载未加密的 ENB 预设（FX11 框架）。详见 ENB 迁移指南。注意：不支持 DoF、天空散射、Prepass；加密预设须先解密。可于 mod.pub 获取。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：附加特性<\/li><li>状态：已发布<\/li><li>标签：ENB, 后处理, 预设<\/li><li>官方来源：https://mod.pub/skyrim-se/415-effects-11<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/additional/effects-11.md", "_chars": 592}, {"id": "exponential-height-fog", "title": "Exponential Height Fog 指数高度雾", "category": "02-features", "kind": "additional", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["雾", "天气"], "aliases": ["指数高度雾", "height fog", "EHF", "雾效"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/180146", "summary": "随高度增加密度、更真实的雾效。", "content": "<blockquote>分类：附加特性 · 状态：已发布<\/blockquote>\n<p>随高度增加密度、更真实的雾效。<\/p>\n<h2>说明<\/h2>\n<p>添加随高度指数增长的真实雾效，改善远景雾化表现。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：附加特性<\/li><li>状态：已发布<\/li><li>标签：雾, 天气<\/li><li>官方来源：https://www.nexusmods.com/skyrimspecialedition/mods/180146<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/additional/exponential-height-fog.md", "_chars": 571}, {"id": "extended-materials", "title": "Extended Materials 扩展材质", "category": "02-features", "kind": "core", "status": "released", "version": "1.1.0", "updated": "2026-09-21", "tags": ["材质", "视差", "复杂材质", "地形"], "aliases": ["扩展材质", "extended materials", "材质通道"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home/extended-materials", "summary": "用 Contact Refinement Parallax Mapping 提供高性价比视差与视差阴影，并支持 Complex Material 规范（环境遮罩、真实金属与镜面反射）。", "content": "<blockquote>分类：核心特性 · 状态：已发布<\/blockquote>\n<p>CS 的<strong>材质地基<\/strong>：更省性能的视差、视差阴影，以及 Complex Material 规范支持。<\/p>\n<h2>Parallax 视差<\/h2>\n<ul><li>原版 Skyrim <strong>支持视差，但着色器是坏的<\/strong>；<a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/31963\" target=\"_blank\" rel=\"noopener\">SSE Parallax Shader Fix<\/a> 能修，但物体看上去<strong>依然明显扁平<\/strong>。<\/li><li>CS 用的是高度优化的 <strong>Contact Refinement Parallax Mapping<\/strong>，相比传统 POM / steep parallax，<strong>性能与画质都显著更好<\/strong>。<\/li><li>官方旧基准（用<strong>明显更早的<\/strong> CS 版本测得）：约 <strong>0.22 ms<\/strong> 开销、该场景 <strong>6%<\/strong> 帧率损失。<\/li><\/ul>\n<blockquote>⚠️ <strong>地形视差要求「所有」地形纹理都支持视差。<\/strong> 部分替换会出问题——<a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/88295\" target=\"_blank\" rel=\"noopener\">Vanilla Complex Parallax - Landscapes<\/a> 是官方推荐的完整方案。  💡 CS 自带<strong>大量地形渲染性能优化<\/strong>，用来抵消视差开销。  💡 视差是<strong>带宽瓶颈型<\/strong>效果。想提速可以把视差纹理<strong>重压成 BC4<\/strong>。<\/blockquote>\n<h2>Parallax Shadows 视差阴影<\/h2>\n<p>所有视差材质都带<strong>近似软阴影<\/strong>支持。这是一项<strong>极其廉价<\/strong>的效果，对<strong>所有平行光与点光源<\/strong>生效。<\/p>\n<h2>Complex Material 复杂材质<\/h2>\n<p>支持 <strong>Complex Material 规范<\/strong>（使用环境遮罩 environment mask），包含<strong>视差<\/strong>、更真实的<strong>金属<\/strong>与<strong>镜面反射<\/strong>。官方注明它是<strong>基于 Nexus 上那份 CM 指南<\/strong>实现的，<strong>可能与其它着色器 MOD 的实现不完全一致<\/strong>。<\/p>\n<p>已知支持：Majestic Landscapes、Majestic Mountains Complex Material、Parallax Spell Impacts。<\/p>\n<p>已知注意事项：<\/p>\n<ul><li>对<strong>环境遮罩 alpha 通道非法<\/strong>的改装内容可能出现纹理扭曲（官方举例：<em>Immersive Creatures<\/em> 里的 Durzog）。<\/li><li><strong>不支持皮肤着色器<\/strong>（官方说明：没有 MOD 用到这个特性）。<\/li><li>CS 为此特性附带了一个 bug fix。<\/li><\/ul>\n<h2>需求<\/h2>\n<ul><li><a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/86492\" target=\"_blank\" rel=\"noopener\">Community Shaders<\/a><\/li><li>用 <strong><a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/120946\" target=\"_blank\" rel=\"noopener\">PGPatcher<\/a> 修补过<\/strong>的材质<\/li><\/ul>\n<h2>相关条目<\/h2>\n<ul><li><a href=\"../../05-tools/pgpatcher.md\" target=\"<em>blank\" rel=\"noopener\">PGPatcher<\/a> · <a href=\"../../04-development/pbr-for-artists.md\" target=\"<\/em>blank\" rel=\"noopener\">True PBR 美术师指南<\/a><\/li><li>地形视差排查见 <a href=\"../../06-community/common-pitfalls.md\" target=\"_blank\" rel=\"noopener\">实战常见坑<\/a><\/li><\/ul>\n<h2>贡献者<\/h2>\n<p>aers（原版视差修复与 SSE Engine Fixes）、shadowking97（原始着色器）、jeromeJrm（Complex Material 指南）、Ent、Pfuscher、MJP、thyrn、VishVadeva（基准测试）、hakasapl（Terrain Helper 支持）等。<\/p>\n<hr>\n<p><em>本条目依据官方功能页精修整理；如与官方页面不一致，以官方为准。<\/em><\/p>", "_file": "02-features/core/extended-materials.md", "_chars": 2084}, {"id": "extended-translucency", "title": "Extended Translucency 扩展半透明", "category": "02-features", "kind": "core", "status": "released", "version": "1.1.0", "updated": "2026-09-21", "tags": ["半透明", "材质", "织物", "玻璃"], "aliases": ["扩展半透明", "translucency", "透光", "皮肤透光"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home/extended-translucency", "summary": "让薄织物与脏玻璃呈现近乎照片级的半透明观感；侧看更不透明并产生「边缘轮廓」，支持按 nif 网格覆盖材质模型。", "content": "<blockquote>分类：核心特性（1.4.7+ 并入） · 状态：已发布<\/blockquote>\n<p>为<strong>薄织物<\/strong>与<strong>有杂质的玻璃<\/strong>提供接近照片级的渲染。效果是：<strong>从侧面看时材质更不透明，并产生「边缘轮廓（rim edge）」<\/strong>。例如蕾丝袖口的褶皱会更有结构，玻璃瓶会更「古董」。<\/p>\n<h2>游戏内设置（END → Extended Translucency）<\/h2>\n<h3>Material Models 材质模型<\/h3>\n<p>控制材质不透明度<strong>如何随视角变化<\/strong>：<\/p>\n<table><thead><tr><th style=\"text-align:center\">值<\/th><th style=\"text-align:left\">名称<\/th><th style=\"text-align:left\">说明<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:center\">0<\/td><td style=\"text-align:left\">Disabled<\/td><td style=\"text-align:left\">不做各向异性半透明<\/td><\/tr><tr><td style=\"text-align:center\">1<\/td><td style=\"text-align:left\">Rim Light<\/td><td style=\"text-align:left\">朴素的边缘光效果，<strong>不是<\/strong>基于物理模型<\/td><\/tr><tr><td style=\"text-align:center\">2<\/td><td style=\"text-align:left\">Isotropic Fabric<\/td><td style=\"text-align:left\"><em>假想<\/em>织物：单向排布的线。<strong>尊重法线贴图<\/strong><\/td><\/tr><tr><td style=\"text-align:center\">3<\/td><td style=\"text-align:left\"><strong>Anisotropic Fabric（推荐）<\/strong><\/td><td style=\"text-align:left\">常见织物：切线与副法线双向编织。<strong>但吃不到法线贴图<\/strong>（Skyrim 的切/副法/法线数据不受法线贴图影响）<\/td><\/tr><\/tbody><\/table>\n<blockquote>这是<strong>全局默认值<\/strong>；每个 nif 网格可以设自己的值来覆盖它（见下）。 官方补充：这些模型<strong>虽非专为此设计，但对「低透明度的脏玻璃」效果很好<\/strong>。<\/blockquote>\n<h3>Transparency Increase 透明度提升<\/h3>\n<p>半透明材质<strong>平均而言会变得更不透明<\/strong>，这可能偏离原作者意图。调这个滑块来补偿，并<strong>扩大输出的动态范围<\/strong>。<\/p>\n<blockquote>给 MOD 作者：该效果会<strong>从纹理原始 alpha 反推线材的粗细与密度<\/strong>。例如 alpha 0.5 → 各向同性模型下 <em>线粗:线距 = 1:1<\/em>（沿表面法线看时通光面积为 0.5）。因此 alpha 与织物密度参数基本线性相关。<\/blockquote>\n<h3>Skinned Mesh Only（仅蒙皮网格）<\/h3>\n<p>阻止该效果作用于<strong>静态网格<\/strong>，可用于修复奇怪的透明渲染瑕疵。<\/p>\n<blockquote>⚠️ <strong>此选项目前默认开启<\/strong>。所以你会<strong>看不到<\/strong>炼金瓶、蒸馏器、展示柜等静态网格上的效果。如果没看出任何令人不适的问题，把它关掉并 <strong>SAVE<\/strong> 设置。<\/blockquote>\n<h2>给 MOD 作者 / 进阶用户：按网格覆盖<\/h2>\n<p>需要 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/201\" target=\"<em>blank\" rel=\"noopener\">Outfit Studio<\/a> 或 <a href=\"https://github.com/niftools/nifskope/releases\" target=\"<\/em>blank\" rel=\"noopener\">Nifskope<\/a> 给网格加一个 <code>NiIntegerExtraData<\/code>：<\/p>\n<ul><li>节点名设为 <strong><code>AnisotropicAlphaMaterial<\/code><\/strong>；<\/li><li>值填 0–3（对应上表），<strong>填 0 可在该网格上强制关闭此效果<\/strong>。<\/li><\/ul>\n<blockquote>带显式 <code>AnisotropicAlphaMaterial<\/code> 设置的网格<strong>不受<\/strong>「Transparency Increase」等滑块影响，以尊重作者意图。请把透明度提升<strong>预乘进网格纹理的 alpha 通道<\/strong>。<\/blockquote>\n<h2>兼容性与性能<\/h2>\n<ul><li>与任何 CS 效果一样，<strong>与 ENB 不兼容<\/strong>。<\/li><li>默认套用到某些网格上可能产生非预期渲染，此时给该网格加 <code>AnisotropicAlphaMaterial=0<\/code> 关掉。<\/li><li><strong>性能开销可忽略<\/strong>——本质上只是着色器里几行向量数学：<\/li><\/ul>\n<pre class=\"code\"><code>alpha = alpha / min(1.0, (abs(dot(view, normal)) + 0.001));<\/code><\/pre>\n<h2>许可<\/h2>\n<p>GPL-3.0。若想在别的游戏里用这段着色器代码或数学，<strong>至少<\/strong>需注明出处。<\/p>\n<h2>贡献者<\/h2>\n<p>doodlum（发起与打磨）、alandtse（合并协助与图形管线调试）、davo0411（MOD 页）等。<\/p>\n<hr>\n<p><em>本条目依据官方功能页精修整理；如与官方页面不一致，以官方为准。<\/em><\/p>", "_file": "02-features/core/extended-translucency.md", "_chars": 2077}, {"id": "grass-collision", "title": "Grass Collision 草体碰撞", "category": "02-features", "kind": "core", "status": "released", "version": "1.1.0", "updated": "2026-09-21", "tags": ["草地", "物理", "角色"], "aliases": ["草体碰撞", "草被踩", "grass collision", "草丛互动"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home/grass-collision", "summary": "给草体加上角色碰撞，玩家与 NPC 走过时草会被推开、压弯（1.5.0+ 并入核心）。", "content": "<blockquote>分类：核心特性（1.5.0+ 并入） · 状态：已发布<\/blockquote>\n<p>给草体加上<strong>角色碰撞<\/strong>，让草在被踩到或被推开时<strong>弯曲<\/strong>。<\/p>\n<h2>效果<\/h2>\n<p>草现在会与<strong>玩家和 NPC<\/strong> 碰撞，像被踩到或推挤一样弯折。该效果基于《战神》（God of War）里那套交互式风与植被的技术（官方附了该技术演示视频）。<\/p>\n<h2>为什么这项功能值得注意<\/h2>\n<p>在 CS 之前，「走过草地会分开」是 ENB 阵营的招牌效果之一；Grass Collision 把它带进了 CS，并且因为是在引擎层实现，<strong>不依赖 ENB 的注入式后处理<\/strong>。在<a href=\"../../00-overview/feature-matrix.md\" target=\"_blank\" rel=\"noopener\">官方功能对照矩阵<\/a>中，CS / ENB / CS VR 都有、ENB VR 没有。<\/p>\n<h2>相关条目<\/h2>\n<ul><li><a href=\"grass-lighting.md\" target=\"_blank\" rel=\"noopener\">Grass Lighting 草体光照<\/a><\/li><li><a href=\"../additional/grass-optimizations.md\" target=\"_blank\" rel=\"noopener\">Grass Optimizations 草优化<\/a>（附加特性，重写草渲染）<\/li><\/ul>\n<h2>贡献者<\/h2>\n<ul><li>doodlum：主要贡献者<\/li><li>Nukem：游戏着色器与渲染的原始逆向<\/li><li>Jonahex：逆向、最早的着色器缓存与协助<\/li><li>Maxsu：那套「复杂到我看不懂」的碰撞函数<\/li><li>Ersh：协助<\/li><li>alandtse<\/li><\/ul>\n<hr>\n<p><em>本条目依据官方功能页精修整理；如与官方页面不一致，以官方为准。<\/em><\/p>", "_file": "02-features/core/grass-collision.md", "_chars": 1009}, {"id": "grass-lighting", "title": "Grass Lighting 草体光照", "category": "02-features", "kind": "core", "status": "released", "version": "1.1.0", "updated": "2026-09-21", "tags": ["草地", "光照", "Complex Grass"], "aliases": ["草体光照", "草的光照", "grass lighting", "草颜色太亮"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home/grass-lighting", "summary": "替换草着色器，加入顶点法线方向性光照、背面次表面散射，并修好 ENB 版 Complex Grass 的 UV 映射。", "content": "<blockquote>分类：核心特性（1.5.0+ 并入） · 状态：已发布<\/blockquote>\n<p>替换草着色器，提供更进阶的着色，含 <strong>Complex Grass<\/strong> 支持。<\/p>\n<h2>More Advanced Grass Shading 更进阶的草着色<\/h2>\n<ul><li><strong>用顶点法线着色<\/strong>，为光照加入<strong>方向性<\/strong>（草叶不再是一块均匀亮度的贴片）；<\/li><li>在草的<strong>背面加入次表面散射<\/strong>。<\/li><\/ul>\n<h2>Complex Grass 复杂草<\/h2>\n<ul><li><strong>修正了为 ENB 制作的 Complex Grass 的 UV 映射<\/strong>；<\/li><li>支持<strong>法线与高光贴图<\/strong>；<\/li><li>基于<strong>逆向出的游戏物体光照代码<\/strong>实现。<\/li><\/ul>\n<blockquote>⚠️ <strong>ENB 的 complex grass 设置与 CS 不是一回事<\/strong>，别照搬 ENB 的参数。<\/blockquote>\n<h2>需求<\/h2>\n<ol><li>安装 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/86492\" target=\"_blank\" rel=\"noopener\">Community Shaders<\/a> 及其全部前置（该特性已包含在核心安装里）。<\/li><li><strong>确认你的草 MOD 是否支持 Complex Grass<\/strong>。若不支持，可能需要装一份 complex grass 更新：<ul><li><a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/68640\" target=\"_blank\" rel=\"noopener\">Vanilla Complex Grasses for ENB<\/a>（<strong>虽然名字里有 ENB，但它同样适用于 CS<\/strong>）；<\/li><li><a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/67304\" target=\"_blank\" rel=\"noopener\">Complex Grass - The Official Patch Compendium<\/a>；<\/li><li>或其它来源。<\/li><\/ul><\/li><\/ol>\n<h2>相关条目<\/h2>\n<ul><li><a href=\"grass-collision.md\" target=\"_blank\" rel=\"noopener\">Grass Collision 草体碰撞<\/a><\/li><li><a href=\"../additional/grass-optimizations.md\" target=\"_blank\" rel=\"noopener\">Grass Optimizations 草优化<\/a><\/li><\/ul>\n<h2> : "https://www.nexusmods.com/skyrimspecialedition/mods/149011", "summary": "带真实高光的增强毛发渲染。", "content": "<blockquote>分类：附加特性 · 状态：已发布<\/blockquote>\n<p>带真实高光的增强毛发渲染。<\/p>\n<h2>说明<\/h2>\n<p>为角色毛发提供增强的真实高光。可与 True PBR 的 Marschner 毛发模型互补（后者偏实验性）。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：附加特性<\/li><li>状态：已发布<\/li><li>标签：毛发, 高光<\/li><li>官方来源：https://www.nexusmods.com/skyrimspecialedition/mods/149011<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/additional/hair-specular.md", "_chars": 575}, {"id": "horizon-fix", "title": "Horizon Fix 地平线修复", "category": "02-features", "kind": "additional", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["地平线", "天空"], "aliases": ["地平线修复", "horizon fix", "地平线接缝", "远景接缝"], "source": "https://www.nexusmods.com/skyrimspecialedition/mods/184607", "summary": "改善地平线外观。", "content": "<blockquote>分类：附加特性 · 状态：已发布<\/blockquote>\n<p>改善地平线外观。<\/p>\n<h2>说明<\/h2>\n<p>修正/改善游戏地平线的视觉表现。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：附加特性<\/li><li>状态：已发布<\/li><li>标签：地平线, 天空<\/li><li>官方来源：https://www.nexusmods.com/skyrimspecialedition/mods/184607<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/additional/horizon-fix.md", "_chars": 525}, {"id": "image-based-lighting", "title": "Image Based Lighting 基于图像光照", "category": "02-features", "kind": "core", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["光照", "IBL"], "aliases": ["基于图像光照", "image based lighting", "ibl 怎么用", "环境贴图光照", "image based light"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home", "summary": "用立方体贴图球谐推导的物理化 IBL 替换游戏环境光。", "content": "<blockquote>分类：核心特性 · 状态：已发布<\/blockquote>\n<p>用立方体贴图球谐推导的物理化 IBL 替换游戏环境光。<\/p>\n<h2>说明<\/h2>\n<p>以 cubemap 球谐（spherical harmonics）推导的基于图像光照替换原版环境光，提升整体光照一致性与真实感。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：核心特性<\/li><li>状态：已发布<\/li><li>标签：光照, IBL<\/li><li>官方来源：https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/core/image-based-lighting.md", "_chars": 697}, {"id": "interior-sun", "title": "Interior Sun 室内阳光", "category": "02-features", "kind": "core", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["室内", "阴影", "光照"], "aliases": ["室内阳光", "interior sun", "室内透光"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home", "summary": "室内随昼夜变化的进阶阴影投射，需支持的照明 MOD。", "content": "<blockquote>分类：核心特性 · 状态：已发布<\/blockquote>\n<p>室内随昼夜变化的进阶阴影投射，需支持的照明 MOD。<\/p>\n<h2>说明<\/h2>\n<p>为室内空间带来随时间变化的阴影投射，需要配套支持的照明 MOD。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：核心特性<\/li><li>状态：已发布<\/li><li>标签：室内, 阴影, 光照<\/li><li>官方来源：https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/core/interior-sun.md", "_chars": 601}, {"id": "inverse-square-lighting", "title": "Inverse Square Lighting 平方反比光照", "category": "02-features", "kind": "core", "status": "released", "version": "1.1.0", "updated": "2026-09-21", "tags": ["光照", "物理", "xEdit", "LightPlacer", "开发"], "aliases": ["平方反比", "inverse square", "光照衰减", "光衰减"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home/inverse-square-lighting", "summary": "用「光源有尺寸」+「衰减截断值」把光照衰减换成平方反比，性能几乎无代价；附带实时灯光编辑器，并给出 xEdit 与 Light Placer 两种配置法。", "content": "<blockquote>分类：核心特性（1.4.7+ 并入） · 状态：已发布<\/blockquote>\n<p>让光照衰减更接近真实世界。原版 Skyrim 只有一套<strong>粗糙的衰减函数<\/strong>，会让灯看起来像<strong>聚光灯<\/strong>——中心极亮、边缘生硬；换成平方反比后光会自然得多。<\/p>\n<blockquote>⚠️ <strong>这项功能自己什么都不做<\/strong>，它不修改任何现有光照。你必须额外安装<strong>为平方反比光照设计<\/strong>的照明 MOD，才能吃到效果。<\/blockquote>\n<h2>特性<\/h2>\n<ul><li>新的平方反比衰减函数，<strong>每个光源<\/strong>可单独设 intensity / size / cutoff。<\/li><li><strong>自动计算光半径<\/strong>：半径不是直接指定的，而是由「强度」与「截断值」实时算出来的；强度会<strong>平滑衰减到截断值<\/strong>。<\/li><li>与半径相同的普通衰减灯相比，<strong>性能差异几乎为零<\/strong>。<\/li><li>内置<strong>游戏内灯光编辑器<\/strong>，MOD 作者可实时预览改灯效果。<\/li><\/ul>\n<h2>用法<\/h2>\n<h3>玩家<\/h3>\n<p>装一个用到该特性的<strong>受支持照明 MOD<\/strong> 即可（特性本身已随核心安装）。<\/p>\n<h3>照明 MOD 作者<\/h3>\n<p>直接把衰减写成 <code>1/d²<\/code> 是不现实的——光源处会无限亮，而且照射距离无限远。本算法用两个手段解决：<\/p>\n<ul><li><strong>给光源一个「尺寸」<\/strong>：尺寸让距离为 0 处的亮度有限，且光源附近的亮度分布随尺寸变化；<\/li><li><strong>用「截断值（cutoff）」<\/strong>：设定一个光强阈值，低于它光就归零。<strong>光的半径由强度（fade）与截断值实时算出<\/strong>，不是直接设定。<\/li><\/ul>\n<p>参数默认值：cutoff 未指定或填 1.0 时，<strong>普通灯默认 0.05、阴影灯默认 0.022<\/strong>。<\/p>\n<blockquote>⚠️ cutoff 越低越真实，但<strong>光半径会更大<\/strong>，可能得反过来调小光的半径来<strong>控制光溢出（light bleed）<\/strong>。  官方给了一个 <a href=\"https://www.desmos.com/calculator/qrol6ltk9g\" target=\"_blank\" rel=\"noopener\">Desmos 图表<\/a>帮助理解三者关系：红线是原版衰减（F 控制 fade、r 控制半径），绿线是平方反比（I 控制强度、s 控制尺寸、c 控制截断）。<\/blockquote>\n<p>有两种方式把灯设为平方反比：<\/p>\n<ol><li><strong>xEdit<\/strong>：打开一个 <code>LIGH<\/code> 记录 → 双击 <strong>Flags (sorted)<\/strong> → 勾上 <strong>Unknown: 14<\/strong>。这个原本未使用的 flag 被<strong>挪用<\/strong>来表示「使用平方反比衰减」。<ul><li><strong>Fade<\/strong> 控制强度；<\/li><li><strong>FOV<\/strong> 参数控制尺寸；<\/li><li><strong>Falloff Exponent<\/strong> 参数控制截断值。<\/li><li>注：较新版本的 xEdit 很快会直接显示为 <em>Inverse Square Falloff<\/em> 而不是 Unknown 14。<\/li><\/ul><\/li><li><strong>Light Placer<\/strong>（3.1.1 起完整支持）：在灯光的 <code>\"flags\"<\/code> 字段里加上 <strong><code>InverseSquare<\/code><\/strong> 即可。此时 <strong>fade<\/strong> 控强度、<strong>size<\/strong> 控尺寸、<strong>cutoff<\/strong> 控截断。<\/li><\/ol>\n<h3>Light Editor 灯光编辑器<\/h3>\n<p>打开 CS 菜单 → Inverse Square Lighting 设置即可进入。可以<strong>实时预览<\/strong>改灯效果，包括开关平方反比、调光色与强度等。<\/p>\n<blockquote>⚠️ 官方警告两条：编辑器<strong>不面向游戏玩法<\/strong>，使用期间<strong>不建议存档<\/strong>（可能引发问题）；改动<strong>不能直接保存<\/strong>，只能把数值抄进 xEdit 或 Light Placer 的配置文件。<\/blockquote>\n<h2>兼容性<\/h2>\n<ul><li><strong>与所有照明 MOD 兼容<\/strong>，但只有<strong>为平方反比设计<\/strong>的照明 MOD 才会真正使用新的衰减。<\/li><li>兼容 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/127557\" target=\"<em>blank\" rel=\"noopener\">Light Placer<\/a> 与 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/135822\" target=\"<\/em>blank\" rel=\"noopener\">Light Placer VR<\/a>（已加入直接支持，作者可把灯标记为 <code>InverseSquare<\/code>）。<\/li><\/ul>\n<h2>相关条目<\/h2>\n<ul><li><a href=\"../../05-tools/light-placer.md\" target=\"_blank\" rel=\"noopener\">Light Placer<\/a><\/li><li><a href=\"../../04-development/testing-and-debugging.md\" target=\"_blank\" rel=\"noopener\">测试与调试手法<\/a>（Light Editor 与 A/B 测试）<\/li><li>官方推荐的照明 MOD 见 <a href=\"../../01-installation/vanilla-setup.md\" target=\"_blank\" rel=\"noopener\">Vanilla 设置指南<\/a><\/li><\/ul>\n<h2>贡献者<\/h2>\n<p>sicsix、Bottle、SkrubbySkrubInAShrub。<\/p>\n<hr>\n<p><em>本条目依据官方功能页精修整理；如与官方页面不一致，以官方为准。<\/em><\/p>", "_file": "02-features/core/inverse-square-lighting.md", "_chars": 2481}, {"id": "lod-blending", "title": "LOD Blending LOD 混合", "category": "02-features", "kind": "core", "status": "released", "version": "1.0.0", "updated": "2026-09-20", "tags": ["LOD", "光照"], "aliases": ["LOD 混合", "lod blending", "远景过渡", "LOD 接缝"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home", "summary": "对 LOD 物体与地形的光照特性做精细控制。", "content": "<blockquote>分类：核心特性 · 状态：已发布<\/blockquote>\n<p>对 LOD 物体与地形的光照特性做精细控制。<\/p>\n<h2>说明<\/h2>\n<p>提供 LOD 物体与地形光照特性的微调控制，缓解近景与远景光照差异。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：核心特性<\/li><li>状态：已发布<\/li><li>标签：LOD, 光照<\/li><li>官方来源：https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home<\/li><\/ul>\n<hr>\n<p><em>本条目由 gen_features.py 自动生成，修改请编辑脚本后重跑，或直接在源站更新后同步。<\/em><\/p>", "_file": "02-features/core/lod-blending.md", "_chars": 603}, {"id": "light-limit-fix", "title": "Light Limit Fix 光源上限修复", "category": "02-features", "kind": "core", "status": "released", "version": "1.1.0", "updated": "2026-09-21", "tags": ["光照", "性能", "引擎修复", "粒子光", "调试"], "aliases": ["光源上限", "light limit fix", "光太多闪烁", "4 光源限制"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home/light-limit-fix", "summary": "用聚簇着色（clustered shading，Starfield 同款）真正解除动态光源数量限制，并让 ENB 粒子光以真实光源形式接入；附带 LLFDEBUG 可视化。", "content": "<blockquote>分类：核心特性（1.4+ 并入） · 状态：已发布<\/blockquote>\n<p>解除光源数量限制，并加入粒子光等功能。<\/p>\n<blockquote>⚠️ <strong>阴影数量上限尚未解除。<\/strong> 被解除的是<strong>光源<\/strong>数量。<\/blockquote>\n<h2>特性<\/h2>\n<ul><li>自研的 <strong>clustered shading（聚簇着色）<\/strong>，高性能、可扩展——<strong>Starfield 也用的是这套<\/strong>。<\/li><li><strong>无限光源<\/strong>：火把、魔法光等不再受限。<\/li><li>对「ENB light」粒子光提供<strong>受限支持<\/strong>。<\/li><li>为<strong>草地<\/strong>提供高性能光照。<\/li><\/ul>\n<h3>Clustered Shading 聚簇着色<\/h3>\n<p>这是让整个项目成立的魔法：无 bug、可扩展的灯光，从而实现<strong>真正的光源上限修复<\/strong>与<strong>优化的粒子光<\/strong>。官方配了一张用 ELFX Shadows 演示的可视化图——红方块标出原版「灯限已达」的位置，而这些灯现在<strong>完全不再参与灯限计算<\/strong>。<\/p>\n<p>实现参考：<code>pezcode/Cluster<\/code>、<code>mateeeeeee/Adria-DX11<\/code> 工程，以及 <em>Practical Clustered Shading<\/em> 演示。<\/p>\n<h3>Unlimited Dynamic Lights 无限动态光源<\/h3>\n<p>火把、投射物、法术危险区、室外灯光<strong>全部无限制<\/strong>。室内仍有大量灯未被修好，但它们<strong>不再与动态放置的灯冲突<\/strong>。<\/p>\n<h3>Unlimited Magic Lights 无限魔法光<\/h3>\n<p><strong>魔法光上限从 4 提升到 2,147,483,647<\/strong>。现在每个角色都能无限制地施放光。<\/p>\n<h3>Particle Lights 粒子光（重要）<\/h3>\n<blockquote>⚠️ <strong>CS 1.4 到 1.7 之间不支持 ENB 粒子光；1.8 起为受限支持。<\/strong>  ⚠️ <strong>粒子光只是为了向后兼容才保留的。官方推荐改用替代方案，例如 <a href=\"https://www.nexusmods.com/skyrimspecialedition/mods/127557\" target=\"_blank\" rel=\"noopener\">Light Placer<\/a>。<\/strong><\/blockquote>\n<p>粒子光的做法是：利用逆向出的渲染器信息在 CPU 上重建光的颜色，从而生成<strong>真实的、可被聚簇着色系统使用、也能被 NPC 感知<\/strong>的光源。因此<strong>大多数提供「ENB light」的 MOD 是兼容的<\/strong>（如 ENB Light、ENB Lights For Effect Shaders、Rudy102 的 ENB Light 系列）。<\/p>\n<p>相比 ENB 的粒子光，它的优点：<\/p>\n<ul><li>走聚簇着色而非延迟着色，<strong>可扩展性好得多<\/strong>；<\/li><li>有<strong>真正的镜面光照<\/strong>，金属与头发能被正确照亮；<\/li><li>支持<strong>视差阴影<\/strong>；<\/li><li><strong>透明物体<\/strong>（玻璃、Blended Roads）也能被粒子光照亮；<\/li><li><strong>第一人称网格<\/strong>可以发光；<\/li><li><strong>不渲染粒子光网格<\/strong>，彻底消除 overdraw，性能大幅提升；<\/li><li>没有 FOV 问题与畸变；<\/li><li>没有假阳性光源（例如白色闪烁的火把）；<\/li><li>半径无限制，光可以任意大。<\/li><\/ul>\n<h3>Light Limit Visualization（LLFDEBUG）<\/h3>\n<p>在 <strong>Advanced → Shader Defines<\/strong> 里加入 <code>LLFDEBUG<\/code> 后可开启三种可视化：<\/p>\n<ul><li>可视化灯限：达到<strong>严格灯限<\/strong>（portal-strict）时显示<strong>红色<\/strong>；<\/li><li>可视化严格灯数；<\/li><li>可视化聚簇灯数。<\/li><\/ul>\n<blockquote>官方注明这是<strong>开发者调试功能，不面向正常游戏<\/strong>。<\/blockquote>\n<h2>安装相关的常见事故<\/h2>\n<ul><li><strong>装了 Lux：重装时取消勾选 <code>optimized<\/code> / <code>split<\/code> 网格。<\/strong> LLF 已取代这些网格（它们原本就是为了绕开引擎灯限），留着只会掉性能。<\/li><li><strong>别勾选任何「支持粒子光照」的选项<\/strong>——那些选项与 CS 不兼容。<\/li><li>装了 <strong>ENB Light 类 MOD 不会发光<\/strong>，改用 CS Light / Light Placer 的补丁。<\/li><\/ul>\n<h2>相关条目<\/h2>\n<ul><li><a href=\"../../05-tools/light-placer.md\" target=\"<em>blank\" rel=\"noopener\">Light Placer<\/a> · <a href=\"../../04-development/testing-and-debugging.md\" target=\"<\/em>blank\" rel=\"noopener\">测试与调试手法<\/a><\/li><li><a href=\"../../06-community/common-pitfalls.md\" target=\"_blank\" rel=\"noopener\">实战常见坑<\/a><\/li><\/ul>\n<h2>贡献者<\/h2>\n<p>doodlum（VR 之外全部功能的原始实现）、alandtse（VR 支持与重构）、Nukem（渲染器文档）、jonahex（光照与草着色器原始逆向）、powerofthree（粒子逆向与 CommonLibSSE）、rudy102 / fadingsignal / mindflux（粒子光资料）、mwilsnd、ProfJack、sicsix（ISL 支持）。<\/p>\n<hr>\n<p><em>本条目依据官方功能页精修整理；如与官方页面不一致，以官方为准。<\/em><\/p>", "_file": "02-features/core/light-limit-fix.md", "_chars": 2490}, {"id": "linear-lighting", "title": "Linear Lighting 线性光照", "category": "02-features", "kind": "additional", "status": "TBA", "version": "1.0.0", "updated": "2026-09-20", "tags": ["光照", "色彩空间"], "aliases": ["线性光照", "linear lighting", "光照线性化"], "source": "https://modding.wiki/en/skyrim/developers/community-shaders/Features-Home", "summary": "内部色彩空间转换以提升光照计算精度。[TBA]", "content": "<blockquote>分类：附加特性 · 状态：开发中 (TBA)<\/blockquote>\n<p>内部色彩空间转换以提升光照计算精度。[TBA]<\/p>\n<h2>说明<\/h2>\n<p>开发中（TBA）。在内部做色彩空间转换，提高光照计算精度。<\/p>\n<h2>维护信息<\/h2>\n<ul><li>类型：附加特性<\/li><li>状态：开发中 (TBA)<\/l
