<style>
  :root{
    --bg:#f7f8fa; --panel:#ffffff; --ink:#1f2329; --muted:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --accent2:#0ea5e9; --chip:#eef2ff;
    --green:#16a34a; --amber:#d97706; --gray:#9ca3af; --blue:#2563eb;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
  header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:20px 24px}
  header h1{margin:0;font-size:20px}
  header p{margin:6px 0 0;opacity:.9;font-size:13px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .stat{background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px;font-size:12px}
  .wrap{display:flex;min-height:calc(100vh - 116px)}
  aside{width:230px;flex:0 0 230px;background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow:auto}
  /* 收起 = 侧栏整条消失（不再留窄条），改由左侧半圆悬浮按钮 #navfab 唤出 */
  aside.collapsed{display:none}
  .sidehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .sidehead-title{font-size:12px;color:var(--muted);white-space:nowrap}
  #navbox.hidden{display:none}
  /* 收起/展开共用同一个半圆把手外形：展开态在侧栏右缘（‹），收起态在视口左缘（›） */
  .navfab{position:fixed;top:50%;transform:translateY(-50%);z-index:60;
          align-items:center;justify-content:center;width:26px;height:58px;padding:0;margin:0;
          border:1px solid var(--line);border-left:none;border-radius:0 30px 30px 0;
          background:var(--panel);color:var(--accent);cursor:pointer;font-size:20px;line-height:1;
          font-family:inherit;box-shadow:2px 0 10px rgba(15,23,42,.12);
          transition:background .15s,color .15s,border-color .15s}
  .navfab span{display:block;margin-left:-3px}
  .navfab:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  /* 收起把手贴在侧栏右缘（230px = aside 的固定宽度）；侧栏收起时由 aside 的 display:none 一并隐藏 */
  #navtoggle{left:230px;display:flex}
  /* 展开把手贴视口左缘，只在收起态出现 */
  #navfab{left:0;display:none}
  #navfab.show{display:flex}
  main{flex:1;padding:20px 24px;overflow:auto;transition:padding-left .16s ease}
  /* 侧栏收起后给左侧让位，避免半圆悬浮按钮压住正文首列 */
  aside.collapsed + main{padding-left:44px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=search]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .navbtn{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:4px;border:1px solid transparent;
          background:none;border-radius:8px;cursor:pointer;color:var(--ink);font-size:13px}
  .navbtn:hover{background:var(--chip)}
  .navbtn.active{background:var(--accent);color:#fff}
  .navbtn .cnt{float:right;opacity:.7;font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s}
  .card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-1px)}
  .card h3{margin:0 0 6px;font-size:15px}
  .card .sum{color:var(--muted);font-size:13px;margin:0 0 8px}
  .card .why{display:inline-block;font-size:11px;color:var(--accent);background:#eff6ff;
    border:1px solid #bfdbfe;border-radius:20px;padding:1px 8px;margin:0 0 8px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--chip);color:#3730a3;font-size:11px;padding:2px 8px;border-radius:20px}
  .chip.muted{background:#f3f4f6;color:var(--muted)}
  .detail{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:880px}
  .detail h2{margin-top:0}
  .back{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;margin-bottom:12px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
  .btn{display:inline-block;padding:9px 14px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:600}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost{border:1px solid var(--line);color:var(--accent)}
  a{color:var(--accent)}
  .empty{color:var(--muted);padding:30px;text-align:center}
  .tip{font-size:12px;color:var(--muted);margin-top:8px}
  .article{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 22px 18px;
    font-size:14.5px;line-height:1.8;color:var(--ink);max-width:860px}
  .article h1,.article h2,.article h3,.article h4{line-height:1.35;margin:1.1em 0 .5em}
  .article h1{font-size:1.55em;border-bottom:2px solid var(--line);padding-bottom:.3em}
  .article h2{font-size:1.3em;border-bottom:1px solid var(--line);padding-bottom:.25em}
  .article h3{font-size:1.12em}
  .article p{margin:.6em 0}
  .article ul,.article ol{margin:.5em 0;padding-left:1.6em}
  .article li{margin:.25em 0}
  .article a{color:var(--accent);text-decoration:underline}
  .article code{background:#f1f5f9;border:1px solid var(--line);border-radius:4px;padding:1px 5px;
    font-family:"SFMono-Regular",Consolas,Menlo,monospace;font-size:.92em;color:#be123c}
  .article pre.code{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px 16px;overflow:auto;
    font-family:"SFMono-Regular",Consolas,Menlo,monospace;font-size:13px;line-height:1.6}
  .article pre.code code{background:none;border:none;color:inherit;padding:0}
  .article blockquote{margin:.7em 0;padding:.5em 1em;border-left:4px solid var(--accent);
    background:#f8fafc;color:#374151;border-radius:0 8px 8px 0}
  .article table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:13.5px}
  .article th,.article td{border:1px solid var(--line);padding:7px 10px}
  .article thead th{background:#f1f5f9;font-weight:600}
  .article tbody tr:nth-child(even){background:#fafafa}
  .article hr{border:none;border-top:1px solid var(--line);margin:1.2em 0}
</style>

<script>
const ENTRIES = [{"id": "usvfs-role", "title": "USVFS 在 MO2 中的角色", "category": "00-overview", "version": "1.0.0", "updated": "2026-09-20", "tags": ["概览", "USVFS", "VFS", "架构"], "aliases": ["USVFS 是什么", "USVFS 作用", "虚拟文件系统", "VFS 干嘛的"], "source": "https://github.com/ModOrganizer2/usvfs", "summary": "USVFS（用户态虚拟文件系统）是 MO2 的核心组件，用 API hooking 把\"别处\"的文件呈现给指定进程。", "kind": "concept", "content": "<p><strong>USVFS（User Space Virtual File System，用户态虚拟文件系统）<\/strong> 是 MO2 的心脏。官方定义：<\/p>\n<blockquote>USVFS 让 Windows 程序创建<strong>只对一组选定进程可见<\/strong>的文件/目录链接；它靠 <strong>API hooking<\/strong> 骗过文件访问函数，使它们\"发现/打开\"其实位于别处的文件。<\/blockquote>\n<h2>它在 MO2 里做什么<\/h2>\n<ol><li><strong>不改动游戏目录<\/strong>：mod 实际在 <code>mods\\<\/code> 各自的文件夹里，USVFS 在游戏/工具进程启动的那一刻，把合并后的视图\"塞\"进该进程的眼中。<\/li><li><strong>进程级可见<\/strong>：链接只对 MO2 启动的游戏/工具进程可见；其它程序（包括资源管理器）看到的仍是真实目录。<\/li><li><strong>优先级叠加<\/strong>：多个 mod 文件夹 + Overwrite + 游戏原文件，按优先级叠加成一份统一的虚拟 Data 目录。<\/li><li><strong>会话级生命周期<\/strong>：MO2 关闭或进程结束，虚拟链接随之消失，不留下任何残留。<\/li><\/ol>\n<h2>与 MO2 其它子系统的关系<\/h2>\n<ul><li><strong>DirectoryRefresher<\/strong>：在 mod 变动时后台多线程重建虚拟目录树（见 <a href=\"../03-architecture/directory-refresher.md\" target=\"_blank\" rel=\"noopener\">DirectoryRefresher<\/a>）。<\/li><li><strong>UsvfsConnector<\/strong>：启动游戏时把\"虚拟路径 → 真实路径\"的映射表交给 usvfs（见 <a href=\"../03-architecture/usvfs-connector.md\" target=\"_blank\" rel=\"noopener\">UsvfsConnector<\/a>）。<\/li><li><strong>VFS 节点类<\/strong>：DirectoryEntry / FileEntry / FilesOrigin 等描述虚拟目录树（见 <a href=\"../03-architecture/vfs-node-classes.md\" target=\"_blank\" rel=\"noopener\">VFS 节点类<\/a>）。<\/li><\/ul>\n<blockquote>USVFS 自身仍是\"进行中（alpha）\"状态，但作为 MO2 核心组件接受了大量真实世界测试。当前许可为 GPLv3。<\/blockquote>", "_file": "00-overview/usvfs-role.md", "_chars": 1191}, {"id": "what-is-mo2", "title": "什么是 Mod Organizer 2", "category": "00-overview", "version": "1.0.0", "updated": "2026-09-20", "tags": ["概览", "入门", "MO2", "虚拟文件系统"], "aliases": ["MO2 是什么", "Mod Organizer 2", "模组管理器"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "MO2 是开源 mod 管理工具，靠虚拟文件系统（VFS）在运行时合并 mod，保持游戏真实目录干净。", "kind": "concept", "content": "<p><strong>Mod Organizer 2（MO2）<\/strong> 是一个开源的 PC 游戏 mod 管理工具，目标是让 mod 的安装与管理对初学者与老手都一样简单、干净。它最关键的革命性设计是：<strong>mod 不写入游戏目录，而是在运行时通过一个\"虚拟文件系统（VFS）\"合并呈现给游戏进程<\/strong>。<\/p>\n<h2>关键定位<\/h2>\n<ul><li><strong>开源<\/strong>：代码开放，社区持续维护（Tannin 开创，后由社区接手为 MO2）。<\/li><li><strong>虚拟部署<\/strong>：mod 各自独立存放，运行时统一\"叠加\"成游戏看到的 Data 目录；关闭 MO2 后游戏目录原样如初。<\/li><li><strong>mod 隔离<\/strong>：游戏目录始终保持干净，启用/禁用 mod 不会互相破坏。<\/li><li><strong>Profile（档案）<\/strong>：可为同一游戏保存多套不同的 mod 组合与加载顺序，无缝切换。<\/li><li><strong>冲突解决<\/strong>：多个 mod 提供同名文件时，按优先级决定\"谁胜出\"。<\/li><li>另外还提供 <strong>BSA 解包（Bethesda 游戏）、Nexus 集成、BAIN/FOMOD 安装器、存档查看器、归档失效（archive invalidation）、可定制分类<\/strong> 等。<\/li><\/ul>\n<h2>为什么需要 VFS<\/h2>\n<p>传统方案（如直接覆盖游戏文件，或是 NTFS 符号链接/连接点）要么污染游戏目录、要么需要管理员权限、要么全局可见。MO2 的 VFS（由 <strong>USVFS<\/strong> 实现）解决了这些痛点——它才是 MO2 的\"心脏\"。<\/p>\n<blockquote>想理解 VFS 本身的工作原理，见 <a href=\"usvfs-role.md\" target=\"<em>blank\" rel=\"noopener\">USVFS 在 MO2 中的角色<\/a> 与 <a href=\"../01-mechanism/api-hooking.md\" target=\"<\/em>blank\" rel=\"noopener\">核心机制：API Hooking<\/a>。<\/blockquote>", "_file": "00-overview/what-is-mo2.md", "_chars": 1060}, {"id": "session-scoped-links", "title": "会话级、免管理员、跨文件系统的链接", "category": "01-mechanism", "version": "1.0.0", "updated": "2026-09-20", "tags": ["机制", "会话", "权限", "跨文件系统"], "aliases": ["会话级链接", "免管理员", "session scoped", "不用管理员权限"], "source": "https://github.com/ModOrganizer2/usvfs", "summary": "虚拟链接在会话结束时消失，无需管理员权限，且不依赖具体文件系统（FAT32/只读/网络盘均可）。", "kind": "concept", "content": "<p>USVFS 的链接相比 NTFS 符号链接，有三项关键便利：<\/p>\n<h2>1. 会话级生命周期<\/h2>\n<ul><li>链接在\"会话结束\"时自动消失（MO2 关闭或进程退出）。<\/li><li><strong>不需要写权限到链接目标目录<\/strong>，也<strong>不需要管理员权限<\/strong>（安装与使用都不需要）。<\/li><li>这对\"不想动系统、不想提权\"的普通玩家极其友好。<\/li><\/ul>\n<h2>2. 跨文件系统<\/h2>\n<ul><li>NTFS 符号链接被锁死在 NTFS 上；USVFS 的链接<strong>与文件系统无关<\/strong>。<\/li><li>因此你可以在 <strong>FAT32 驱动器、只读介质、甚至网络盘<\/strong>上建立\"链接\"。<\/li><\/ul>\n<h2>3. 不需要先创建真实的链接对象<\/h2>\n<p>NTFS 符号链接是文件系统中真实存在的对象（需要创建/删除权限与目标写权限）。USVFS 纯在进程内重定向，<strong>不落任何真实链接对象<\/strong>，所以没有这些限制。<\/p>\n<blockquote>代价与边界见 <a href=\"../02-features/usvfs-drawbacks.md\" target=\"_blank\" rel=\"noopener\">USVFS 的代价与风险<\/a>。<\/blockquote>", "_file": "01-mechanism/session-scoped-links.md", "_chars": 746}, {"id": "overlay-links", "title": "多目录叠加（Overlay）", "category": "01-mechanism", "version": "1.0.0", "updated": "2026-09-20", "tags": ["机制", "overlay", "叠加", "优先级"], "aliases": ["多目录叠加", "覆盖机制", "文件叠加"], "source": "https://github.com/ModOrganizer2/usvfs", "summary": "USVFS 可把多个目录叠加到同一个目标上，按优先级决定哪个\"赢\"，这正是 mod 合并的原理。", "kind": "concept", "content": "<p>USVFS 能把<strong>多个目录叠加（overlay）到同一个目标目录上<\/strong>——这正是 MO2\"把几十个 mod 合并成一份 Data\"的实现基础。<\/p>\n<h2>叠加如何工作<\/h2>\n<ul><li>游戏真实 <code>Data\\<\/code>、各个 mod 的 <code>mods\\ModA\\...<\/code>、<code>mods\\ModB\\...<\/code>、以及 <code>overwrite\\<\/code>，都被\"铺\"在同一棵虚拟目录树上。<\/li><li>当进程请求 <code>Data\\Textures\\rock.dds<\/code> 时，usvfs 在所有叠加层中查找该文件，按<strong>优先级<\/strong>返回最上面那一份。<\/li><li>排在最前（优先级最高）的来源即为\"赢家\"，被进程读取；其它来源对该路径\"隐藏\"。<\/li><\/ul>\n<h2>这与冲突解决是同一件事<\/h2>\n<p>叠加 + 优先级 = MO2 的<strong>冲突解决<\/strong>规则。优先级由 mod 列表顺序、profile、BSA 等因素决定（见 <a href=\"../05-usage/conflict-resolution.md\" target=\"<em>blank\" rel=\"noopener\">冲突解决与优先级<\/a> 与 <a href=\"../03-architecture/fileentry-priority.md\" target=\"<\/em>blank\" rel=\"noopener\">FileEntry 优先级冲突<\/a>）。<\/p>\n<blockquote>启动游戏时，这份\"虚拟路径→真实来源\"的映射由 <a href=\"../03-architecture/usvfs-connector.md\" target=\"_blank\" rel=\"noopener\">UsvfsConnector<\/a> 交给 usvfs。<\/blockquote>", "_file": "01-mechanism/overlay-links.md", "_chars": 873}, {"id": "api-hooking", "title": "核心机制：API Hooking", "category": "01-mechanism", "version": "1.0.0", "updated": "2026-09-20", "tags": ["机制", "hooking", "重定向", "Win32"], "aliases": ["API Hook", "hook 机制", "api hooking", "HOOK 原理"], "source": "https://github.com/ModOrganizer2/usvfs", "summary": "USVFS 通过 hook 文件访问类 Win32 API，拦截进程发起的路径请求并重写为真实路径。", "kind": "concept", "content": "<p>USVFS 的本质是 <strong>API hooking（应用程序接口挂钩）<\/strong>：在目标进程里\"替换/拦截\"它用来访问文件系统的 Win32 函数，从而把一次\"打开 A\"的请求，悄悄改到\"打开 B\"。<\/p>\n<h2>它是怎么骗过文件访问函数的<\/h2>\n<ol><li>当 MO2 启动游戏（或工具）时，usvfs 被注入该进程。<\/li><li>进程调用 <code>CreateFileW<\/code>、<code>GetFileAttributesW<\/code>、<code>FindFirstFileW<\/code> 等文件 API 时，会先经过 usvfs 的 <strong>hook<\/strong>（所有 hook 函数统一命名为 <code>hook_&lt;原函数名&gt;<\/code>，见 <a href=\"../04-debugging/debugging-usvfs.md\" target=\"_blank\" rel=\"noopener\">调试 usvfs<\/a>）。<\/li><li>hook 检查请求的路径是否落在被管理的虚拟目录里：<ul><li>命中 → 把路径<strong>重定向<\/strong>到该文件真实所在的 mod 文件夹，再调用底层原生函数。<\/li><li>未命中 → 原样放行。<\/li><\/ul><\/li><li>进程完全不知道自己打开的是 <code>mods\\ModA\\...<\/code> 而不是 <code>Data\\...<\/code>，对它而言一切正常。<\/li><\/ol>\n<h2>为什么叫\"用户态\"<\/h2>\n<p>重定向发生在<strong>进程自己的地址空间内<\/strong>，不依赖任何文件系统/内核特性。这正是它能做到\"只对指定进程可见\"\"跨文件系统\"\"无需管理员\"的根本原因。<\/p>\n<blockquote>直观感受：打开 usvfs 调试日志，你会看到每一行都打印进程请求的<strong>原始路径<\/strong>和被 usvfs <strong>重定向后的真实路径<\/strong>——这是理解\"重定向\"最直观的材料。<\/blockquote>", "_file": "01-mechanism/api-hooking.md", "_chars": 983}, {"id": "virtual-delete", "title": "虚拟删除（让文件\"消失\"或\"被替换\"）", "category": "01-mechanism", "version": "1.0.0", "updated": "2026-09-20", "tags": ["机制", "虚拟删除", "隐藏"], "aliases": ["让文件消失", "屏蔽文件", "virtual delete", "隐藏原版文件"], "source": "https://github.com/ModOrganizer2/usvfs", "summary": "USVFS 可以\"虚拟地\"取消链接，使某文件对进程不可见，或用一个文件替换另一个真实文件。", "kind": "concept", "content": "<p>USVFS 还能\"虚拟地\"<strong>取消链接（unlink）<\/strong>一个文件：<\/p>\n<ul><li>让某个真实存在的文件在进程眼里<strong>完全消失<\/strong>（像被删了一样，但磁盘上毫发无损）。<\/li><li>或用一个（来自某 mod 的）文件<strong>替换<\/strong>另一个真实文件，而无需改动磁盘。<\/li><\/ul>\n<h2>典型用途<\/h2>\n<ul><li><strong>屏蔽文件<\/strong>：想禁用游戏/某 mod 里的某个文件，但又不真删——在虚拟层把它\"藏\"起来即可。<\/li><li><strong>覆盖而不修改<\/strong>：用高优先级 mod 的文件\"盖住\"低优先级或原版文件，原版文件物理上仍在。<\/li><\/ul>\n<blockquote>注意：被\"虚拟删除\"的文件并非真的删除，MO2 关闭后它依旧存在。这与 <a href=\"../05-usage/overwrite-dir.md\" target=\"_blank\" rel=\"noopener\">Overwrite 目录<\/a> 的\"工具产出物\"是相反方向的概念（一个是隐藏，一个是暴露工具写出的新文件）。<\/blockquote>", "_file": "01-mechanism/virtual-delete.md", "_chars": 678}, {"id": "process-local-links", "title": "进程级可见的虚拟链接", "category": "01-mechanism", "version": "1.0.0", "updated": "2026-09-20", "tags": ["机制", "进程可见", "隔离"], "aliases": ["进程级链接", "只对该进程可见", "process local", "进程隔离"], "source": "https://github.com/ModOrganizer2/usvfs", "summary": "USVFS 创建的链接只对调用者选定的进程可见，其它程序（含资源管理器）看到的是真实目录。", "kind": "concept", "content": "<p>与 NTFS 符号链接\"对全系统所有程序可见\"不同，USVFS 的链接<strong>只对一组被选中的进程可见<\/strong>。<\/p>\n<h2>这意味着什么<\/h2>\n<ul><li>只有<strong>通过 MO2 启动<\/strong>的游戏/Tool（如 xEdit、LOOT、BodySlide）才会\"看到\"虚拟合并后的 Data 目录。<\/li><li>直接双击游戏 exe、或用资源管理器打开游戏目录，看到的仍是<strong>未经修改的真实目录<\/strong>——mod 文件物理上并不在那里。<\/li><li>因此多个程序可以各自拥有不同的\"视图\"，互不干扰。<\/li><\/ul>\n<h2>对比 NTFS 符号链接<\/h2>\n<table><thead><tr><th style=\"text-align:left\">维度<\/th><th style=\"text-align:left\">USVFS<\/th><th style=\"text-align:left\">NTFS 符号链接/连接点<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">可见范围<\/td><td style=\"text-align:left\">仅选定进程<\/td><td style=\"text-align:left\">所有进程（全局）<\/td><\/tr><tr><td style=\"text-align:left\">是否改动真实目录<\/td><td style=\"text-align:left\">否<\/td><td style=\"text-align:left\">是（创建了真实链接对象）<\/td><\/tr><\/tbody><\/table>\n<blockquote>这是 mod 隔离与\"游戏目录保持干净\"能够成立的基础，详见 <a href=\"../05-usage/mod-isolation.md\" target=\"_blank\" rel=\"noopener\">mod 隔离<\/a>。<\/blockquote>", "_file": "01-mechanism/process-local-links.md", "_chars": 757}, {"id": "vs-ntfs-symlink", "title": "USVFS vs NTFS 符号链接", "category": "02-features", "version": "1.0.0", "updated": "2026-09-20", "tags": ["特性", "对比", "NTFS", "符号链接"], "aliases": ["NTFS symlink", "USVFS 和软链接", "symlink 区别"], "source": "https://github.com/ModOrganizer2/usvfs", "summary": "逐项对比 USVFS 与 NTFS 符号链接在可见性、权限、生命周期、文件系统、overlay、虚拟删除上的差异。", "kind": "reference", "content": "<p>下面基于 USVFS 的\"最终目标\"整理（来自官方 README 的 Comparison to symbolic links）。与 NTFS 符号链接相比：<\/p>\n<table><thead><tr><th style=\"text-align:left\">特性<\/th><th style=\"text-align:left\">USVFS<\/th><th style=\"text-align:left\">NTFS 符号链接 / 连接点<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">可见范围<\/td><td style=\"text-align:left\">只对调用者选定的进程可见<\/td><td style=\"text-align:left\">对所有应用程序可见<\/td><\/tr><tr><td style=\"text-align:left\">生命周期<\/td><td style=\"text-align:left\">会话结束时消失<\/td><td style=\"text-align:left\">持久存在于文件系统<\/td><\/tr><tr><td style=\"text-align:left\">目标写权限<\/td><td style=\"text-align:left\">不需要<\/td><td style=\"text-align:left\">需要<\/td><\/tr><tr><td style=\"text-align:left\">管理员权限<\/td><td style=\"text-align:left\">安装与使用都不需要<\/td><td style=\"text-align:left\">创建某些链接需要<\/td><\/tr><tr><td style=\"text-align:left\">文件系统依赖<\/td><td style=\"text-align:left\">跨文件系统（FAT32/只读/网络盘均可）<\/td><td style=\"text-align:left\">限 NTFS<\/td><\/tr><tr><td style=\"text-align:left\">多目录叠加<\/td><td style=\"text-align:left\">支持（overlay 到同一目标）<\/td><td style=\"text-align:left\">不支持<\/td><\/tr><tr><td style=\"text-align:left\">虚拟删除/替换<\/td><td style=\"text-align:left\">支持（让文件不可见或被替换）<\/td><td style=\"text-align:left\">不支持<\/td><\/tr><\/tbody><\/table>\n<h2>一句话总结<\/h2>\n<p>NTFS 符号链接是<strong>文件系统级的、全局的、持久的、需要权限的<\/strong>；USVFS 是<strong>进程级的、会话级的、免权限的、与文件系统无关的、可叠加可隐藏的<\/strong>。<\/p>\n<blockquote>USVFS 不是要\"取代\"符号链接，而是用一套更适合 mod 管理的范式，规避了符号链接在权限、可见性、清理上的麻烦。其代价见 <a href=\"usvfs-drawbacks.md\" target=\"_blank\" rel=\"noopener\">USVFS 的代价与风险<\/a>。<\/blockquote>", "_file": "02-features/vs-ntfs-symlink.md", "_chars": 924}, {"id": "usvfs-drawbacks", "title": "USVFS 的代价与风险", "category": "02-features", "version": "1.0.0", "updated": "2026-09-20", "tags": ["特性", "风险", "性能", "杀软", "调试"], "aliases": ["VFS 缺点", "USVFS 风险", "代价", "drawbacks", "VFS 有问题吗"], "source": "https://github.com/ModOrganizer2/usvfs", "summary": "USVFS 带来内存/CPU 开销、初始化时机限制、新 bug 源，以及易触发杀软误报。", "kind": "reference", "content": "<p>USVFS 强大，但也有明确代价（来自官方 README）：<\/p>\n<ul><li><strong>性能开销<\/strong>：每个被 hook 的文件调用都会经过 usvfs，必然带来一定的内存与 CPU 开销（理想情况下很小，但并非零）。<\/li><li><strong>初始化时机<\/strong>：usvfs 仅在<strong>每个进程初始化阶段<\/strong>才激活。若某依赖 DLL 在 usvfs 就位前就被加载，它可能错过重定向。<\/li><li><strong>新的 bug 源<\/strong>：注入式 hook 会引入一类\"难以诊断\"的问题，可能让受影响进程出现诡异故障。<\/li><li><strong>杀软误报<\/strong>：所用技术与部分恶意软件相似，<strong>容易被杀软/反恶意软件拦截或干扰<\/strong>（且常常毫无提示）。需要把整个 MO2 安装目录加入排除项，必要时甚至要卸载某些顽固杀软。<\/li><\/ul>\n<blockquote>实际排错与缓解见 <a href=\"../06-reference/troubleshooting-vfs.md\" target=\"_blank\" rel=\"noopener\">VFS/USVFS 常见排错<\/a>，以及杀软清单与 HVCI 章节。<\/blockquote>", "_file": "02-features/usvfs-drawbacks.md", "_chars": 724}, {"id": "bsa-priority-resolution", "title": "BSA 归档的优先级解析", "category": "03-architecture", "version": "1.0.0", "updated": "2026-09-20", "tags": ["架构", "BSA", "优先级", "归档"], "aliases": ["BSA 优先级", "bsa 加载顺序", "bsa priority", "归档优先级"], "source": "https://deepwiki.com/ModOrganizer2/modorganizer", "summary": "BSA 归档内容会被拉进虚拟目录，与 loose file 一起参与优先级判定，决定冲突谁胜。", "kind": "reference", "content": "<p>BSA（Bethesda Archive）是 Bethesda 游戏把资源打包成的归档文件。USVFS 不会忽略它们——<strong>BSA 的内容也会被拉进虚拟目录，参与优先级判定<\/strong>。<\/p>\n<h2>机制要点<\/h2>\n<ul><li>MO2 解析每个启用 mod 的 BSA，把其中的文件路径\"展开\"进虚拟目录树，作为该 mod 的贡献来源。<\/li><li>这样，BSA 里的 <code>Textures\\rock.dds<\/code> 和某个 loose file 的 <code>Textures\\rock.dds<\/code> 就是<strong>同一路径的两个来源<\/strong>，照常按优先级排序。<\/li><li>BSA 本身也有优先级顺序（通常与其所属 mod 的优先级一致，并受\"存档失效/archive invalidation\"与 BSA 加载顺序影响）。<\/li><\/ul>\n<h2>实际影响<\/h2>\n<ul><li>想用 loose file 覆盖某 BSA 内的资源？只要让该 loose file 所在 mod 优先级更高即可。<\/li><li>反之，高优先级 mod 的 BSA 会盖过低优先级 mod 的 loose file——这正是 STEP 指南里\"BSA Priorities\"要讲清楚的坑。<\/li><\/ul>\n<blockquote>使用层面的冲突处理见 <a href=\"../05-usage/conflict-resolution.md\" target=\"<em>blank\" rel=\"noopener\">冲突解决与优先级<\/a>；mod 隔离与游戏目录干净见 <a href=\"../05-usage/mod-isolation.md\" target=\"<\/em>blank\" rel=\"noopener\">mod 隔离<\/a>。<\/blockquote>", "_file": "03-architecture/bsa-priority-resolution.md", "_chars": 937}, {"id": "directory-refresher", "title": "DirectoryRefresher：多线程重建虚拟目录树", "category": "03-architecture", "version": "1.0.0", "updated": "2026-09-20", "tags": ["架构", "DirectoryRefresher", "多线程", "重建"], "aliases": ["重建目录树", "多线程刷新", "目录刷新"], "source": "https://deepwiki.com/ModOrganizer2/modorganizer", "summary": "DirectoryRefresher 是后台服务，mod 变动时在独立线程上重建虚拟文件树，保持 UI 响应。", "kind": "reference", "content": "<p><code>DirectoryRefresher<\/code> 是 MO2 的一个<strong>后台服务<\/strong>，负责在 mod 增删改时<strong>重建虚拟文件树<\/strong>。<\/p>\n<h2>为什么需要它<\/h2>\n<ul><li>mod 数量可能成百上千，逐个扫描目录、计算优先级、构建树是磁盘密集型操作。<\/li><li>放在 UI 线程会卡死界面，所以放到<strong>独立的工作线程<\/strong>上执行（MO2 整体是多线程架构，UI 与磁盘操作分离）。<\/li><\/ul>\n<h2>它做什么<\/h2>\n<ol><li>扫描各 mod 文件夹与游戏 Data 目录。<\/li><li>调用 VFS 节点类（<code>DirectoryEntry<\/code> / <code>FileEntry<\/code> / <code>FilesOrigin<\/code>）重建 <code>VirtualFileTree<\/code>。<\/li><li>计算好每个文件的来源与优先级，供冲突检测与启动游戏时使用。<\/li><li>完成后通知 UI 刷新（如左侧 mod 列表的冲突标记）。<\/li><\/ol>\n<blockquote>这也是为什么改动 mod 后，MO2 有时会短暂\"刷新中\"——它在后台重建树。相关类见 <a href=\"vfs-node-classes.md\" target=\"_blank\" rel=\"noopener\">VFS 节点类<\/a>。<\/blockquote>", "_file": "03-architecture/directory-refresher.md", "_chars": 814}, {"id": "fileentry-priority", "title": "FileEntry 多来源优先级冲突", "category": "03-architecture", "version": "1.0.0", "updated": "2026-09-20", "tags": ["架构", "FileEntry", "优先级", "冲突"], "aliases": ["FileEntry 优先级", "多来源冲突", "同文件多来源"], "source": "https://deepwiki.com/ModOrganizer2/modorganizer", "summary": "同名文件可来自多个 mod；FileEntry 按优先级排序，排在最前的\"赢家\"被进程读取。", "kind": "reference", "content": "<p>当<strong>同一个相对路径<\/strong>（例如 <code>Textures\\rock.dds<\/code>）同时存在于多个来源时，就发生了冲突。<code>FileEntry<\/code> 的处理方式：<\/p>\n<h2>规则：按优先级排序，第一名获胜<\/h2>\n<ul><li><code>FileEntry<\/code> 持有该文件的<strong>所有来源<\/strong>（来自不同 mod、Overwrite、游戏原文件），每个来源带一个优先级。<\/li><li>这些来源按优先级排序，<strong>排在第一位的即为\"赢家\"<\/strong>，被进程实际读取。<\/li><li>其它来源对该路径\"隐藏\"，但 MO2 仍会在 UI 中标出它们（冲突提示）。<\/li><\/ul>\n<h2>优先级由什么决定<\/h2>\n<ul><li><strong>mod 在列表中的顺序<\/strong>（越靠下优先级越高，覆盖上面的）。<\/li><li><strong>profile<\/strong> 的启用状态与顺序。<\/li><li><strong>BSA 归档<\/strong>也有自己的优先级，且可与 loose file 混合参与排序（见 <a href=\"bsa-priority-resolution.md\" target=\"_blank\" rel=\"noopener\">BSA 的优先级解析<\/a>）。<\/li><li><strong>Overwrite<\/strong> 目录通常优先级最高，直接\"盖\"住一切。<\/li><\/ul>\n<blockquote>这套规则在实际使用层面就是 <a href=\"../05-usage/conflict-resolution.md\" target=\"<em>blank\" rel=\"noopener\">冲突解决与优先级<\/a>。正是叠加 + 优先级（<a href=\"../01-mechanism/overlay-links.md\" target=\"<\/em>blank\" rel=\"noopener\">多目录叠加<\/a>）让 MO2 既能合并又能解决冲突。<\/blockquote>", "_file": "03-architecture/fileentry-priority.md", "_chars": 913}, {"id": "usvfs-connector", "title": "UsvfsConnector：启动游戏时交付映射表", "category": "03-architecture", "version": "1.0.0", "updated": "2026-09-20", "tags": ["架构", "UsvfsConnector", "映射", "启动"], "aliases": ["映射表", "启动游戏注入", "connector"], "source": "https://deepwiki.com/ModOrganizer2/modorganizer", "summary": "游戏启动时，UsvfsConnector 把\"虚拟路径→真实路径\"的映射表交给 usvfs 完成注入。", "kind": "reference", "content": "<p>当你通过 MO2 点击\"运行\"时，<strong><code>UsvfsConnector<\/code><\/strong> 负责把 MO2 算好的虚拟视图\"交给\" usvfs。<\/p>\n<h2>它做什么<\/h2>\n<ul><li>把构建好的虚拟目录树翻译成一份 <strong>映射表<\/strong>：每条记录是一个\"进程会请求的路径\"→\"真实磁盘上该文件的位置\"。<\/li><li>例如：<code>Data\\Textures\\rock.dds<\/code> → <code>C:\\MO2\\mods\\ModA\\Textures\\rock.dds<\/code>。<\/li><li>在启动游戏进程的同时，把这份映射交给 usvfs，usvfs 据此注入进程并开始重定向。<\/li><\/ul>\n<h2>为什么这一步关键<\/h2>\n<ul><li>此前所有工作（<a href=\"directory-refresher.md\" target=\"<em>blank\" rel=\"noopener\">DirectoryRefresher 建树<\/a>、<a href=\"fileentry-priority.md\" target=\"<\/em>blank\" rel=\"noopener\">FileEntry 定优先级<\/a>、<a href=\"bsa-priority-resolution.md\" target=\"_blank\" rel=\"noopener\">BSA 拉入<\/a>）都是为了产出这份映射。<\/li><li>映射一旦交付，进程对自己打开的是\"别处\"的文件<strong>毫无察觉<\/strong>。<\/li><\/ul>\n<blockquote>注入与重定向的实际行为，可用 <a href=\"../04-debugging/debugging-usvfs.md\" target=\"_blank\" rel=\"noopener\">调试 usvfs<\/a> 的日志亲眼看到。<\/blockquote>", "_file": "03-architecture/usvfs-connector.md", "_chars": 874}, {"id": "vfs-node-classes", "title": "VFS 节点类：DirectoryEntry / FileEntry / FilesOrigin", "category": "03-architecture", "version": "1.0.0", "updated": "2026-09-20", "tags": ["架构", "类", "DirectoryEntry", "FileEntry", "FilesOrigin"], "aliases": ["VFS 节点类", "DirectoryEntry FileEntry FilesOrigin", "vfs node", "类结构"], "source": "https://deepwiki.com/ModOrganizer2/modorganizer", "summary": "虚拟目录树由 DirectoryEntry（目录）、FileEntry（文件，可多来源）、FilesOrigin（来源追踪）等类构成。", "kind": "reference", "content": "<p>MO2 在内存里用一棵树表示虚拟文件系统的\"合并视图\"。DeepWiki 给出的核心类：<\/p>\n<table><thead><tr><th style=\"text-align:left\">类<\/th><th style=\"text-align:left\">职责<\/th><th style=\"text-align:left\">源码路径<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><code>DirectoryEntry<\/code><\/td><td style=\"text-align:left\">表示一个虚拟目录，内含文件与子目录<\/td><td style=\"text-align:left\"><code>src/shared/directoryentry.h<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><code>FileEntry<\/code><\/td><td style=\"text-align:left\">表示单个文件，<strong>可能同时存在于多个 mod 中<\/strong><\/td><td style=\"text-align:left\"><code>src/shared/fileentry.h<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><code>FilesOrigin<\/code><\/td><td style=\"text-align:left\">追踪某个文件究竟由哪些 mod 提供<\/td><td style=\"text-align:left\"><code>src/shared/filesorigin.h<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><code>FileRegister<\/code><\/td><td style=\"text-align:left\">集中登记 VFS 中所有文件的注册表<\/td><td style=\"text-align:left\"><code>src/shared/fileregister.h<\/code><\/td><\/tr><tr><td style=\"text-align:left\"><code>VirtualFileTree<\/code><\/td><td style=\"text-align:left\">游戏 Data 目录的合并虚拟表示<\/td><td style=\"text-align:left\"><code>src/core/virtualfiletree.h<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>这些类如何协作<\/h2>\n<ol><li>每个 mod 是一个\"来源（origin）\"，由 <code>FilesOrigin<\/code> 记录它贡献了哪些文件。<\/li><li><code>FileEntry<\/code> 聚合同名文件的所有来源；最终\"哪个来源胜出\"由优先级决定（见 <a href=\"fileentry-priority.md\" target=\"_blank\" rel=\"noopener\">FileEntry 优先级冲突<\/a>）。<\/li><li><code>DirectoryEntry<\/code> 把文件和子目录组织成树，<code>VirtualFileTree<\/code> 是整棵树的入口。<\/li><li><code>FileRegister<\/code> 让 MO2 能快速按名查找任意文件、列出冲突。<\/li><\/ol>\n<blockquote>这棵树由 <a href=\"directory-refresher.md\" target=\"<em>blank\" rel=\"noopener\">DirectoryRefresher<\/a> 在 mod 变动时重建，再由 <a href=\"usvfs-connector.md\" target=\"<\/em>blank\" rel=\"noopener\">UsvfsConnector<\/a> 在启动游戏时翻译成 usvfs 能用的映射。<\/blockquote>", "_file": "03-architecture/vfs-node-classes.md", "_chars": 1304}, {"id": "debugging-usvfs", "title": "调试 usvfs：hook 命名与日志", "category": "04-debugging", "version": "1.0.0", "updated": "2026-09-20", "tags": ["调试", "hook", "日志", "重定向"], "aliases": ["调试 USVFS", "usvfs 日志", "hook 命名", "VFS 调试"], "source": "https://github.com/ModOrganizer2/modorganizer/wiki/Debugging-usvfs", "summary": "开启 MO2 调试日志后即可看到 usvfs 的 hook 调用、原始路径与重定向后路径；附 spawn_delay 与 Process Monitor 用法。", "kind": "tutorial", "content": "<p>打开 MO2 的<strong>调试日志（debug logs）<\/strong>，usvfs 也会输出对应日志——这是看\"重定向到底发生了什么\"最直观的途径。<\/p>\n<h2>日志格式<\/h2>\n<p>大多形如：<\/p>\n<pre class=\"code\"><code>timestamp &lt;pid:tid&gt; [L] message [param] [param]...<\/code><\/pre>\n<p>示例（来自官方 wiki）：<\/p>\n<pre class=\"code\"><code>07:52:53.161 &lt;19328:40984&gt; [D] hook_GetFileAttributesW [lpFileName=\\??\\C:\\skyrim\\data\\] [reroute.fileName()=C:\\mo\\overwrite] [res=10] [originalError=0] [fixedError=0]<\/code><\/pre>\n<h2>字段含义<\/h2>\n<table><thead><tr><th style=\"text-align:left\">片段<\/th><th style=\"text-align:left\">含义<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><code>07:52:53.161<\/code><\/td><td style=\"text-align:left\">消息的本地时间<\/td><\/tr><tr><td style=\"text-align:left\"><code>&lt;19328:40984&gt;<\/code><\/td><td style=\"text-align:left\">进程 ID 19328、线程 ID 40984（多个进程在 usvfs 下运行时，pid 很有用）<\/td><\/tr><tr><td style=\"text-align:left\"><code>hook_GetFileAttributesW<\/code><\/td><td style=\"text-align:left\"><strong>所有 usvfs hook 都以 <code>hook_<\/code> 开头，并包含原函数名<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><code>lpFileName=\\??\\C:\\skyrim\\data\\<\/code><\/td><td style=\"text-align:left\">进程<strong>原始请求<\/strong>的路径<\/td><\/tr><tr><td style=\"text-align:left\"><code>reroute.fileName()=C:\\mo\\overwrite<\/code><\/td><td style=\"text-align:left\">usvfs <strong>重定向后<\/strong>实际使用的真实路径<\/td><\/tr><tr><td style=\"text-align:left\"><code>res=10<\/code><\/td><td style=\"text-align:left\">底层 <code>GetFileAttributesW()<\/code> 的返回值（此处为属性位）<\/td><\/tr><tr><td style=\"text-align:left\"><code>originalError=0<\/code><\/td><td style=\"text-align:left\">调用后 <code>GetLastError()<\/code> 的结果<\/td><\/tr><tr><td style=\"text-align:left\"><code>fixedError=0<\/code><\/td><td style=\"text-align:left\">同上，但部分错误被重映射（如 <code>ERROR_PATH_NOT_FOUND<\/code> → <code>ERROR_FILE_NOT_FOUND<\/code>）<\/td><\/tr><\/tbody><\/table>\n<h2>读懂\"重定向\"<\/h2>\n<ul><li><code>lpFileName<\/code> → <code>reroute.fileName()<\/code> 这一对，就是\"进程以为打开 A，实际打开 B\"的铁证。<\/li><li>注意：部分调用<strong>若最终未被重定向则不会打印<\/strong>（例如 <code>DeleteFile()<\/code> 在未重定向时不打日志），以避免刷屏、但也因此可能掩盖某些问题。<\/li><\/ul>\n<h2>辅助调试手段<\/h2>\n<ul><li><strong>spawn_delay（启动延迟）<\/strong>：在 MO2 的 INI 中加<\/li><\/ul>\n<p>``<code>ini [Settings] spawn_delay = X   # 单位：秒 <\/code>`` 让 MO2 启动进程后先挂起若干秒，方便你 attach 调试器或重置 Process Monitor。<\/p>\n<ul><li><strong>Process Monitor<\/strong>（Sysinternals）：按目标进程加筛选、开启\"Show File System Activity\"，可看到每一次文件系统调用，作为日志的补充。<\/li><li><strong>Visual Studio<\/strong>：打开 usvfs 解决方案后可 attach 到 MO2 直接或间接启动的任意进程；配合 <code>spawn_delay<\/code> 更易下断点。调试会派生子进程时可用 Child Process Debugging Power Tool。<\/li><\/ul>\n<blockquote>看到 hook 行为却仍不对？大概率是注入被安全软件挡了，见 <a href=\"../06-reference/troubleshooting-vfs.md\" target=\"_blank\" rel=\"noopener\">VFS/USVFS 常见排错<\/a>。<\/blockquote>", "_file": "04-debugging/debugging-usvfs.md", "_chars": 1884}, {"id": "bsa-management-usage", "title": "BSA 管理与解包（使用侧）", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "BSA", "解包", "Unmanaged", "Archive Invalidation"], "aliases": ["BSA 解包", "BSA 管理", "查看 bsa", "解包 bsa"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "勾选 Have MO manage archives 后 BSA 被当作 loose file 参与 mod 优先级；真实 Data 中的 BSA 会以 Unmanaged 前缀参与冲突裁决。", "kind": "tutorial", "content": "<blockquote>底层解析见<a href=\"../03-architecture/bsa-priority-resolution.md\" target=\"_blank\" rel=\"noopener\">BSA 的优先级解析<\/a>；这里讲操作与影响。<\/blockquote>\n<h2>Archives 标签页<\/h2>\n<ul><li>若某 mod 的资源装在 BSA 里，会在右窗格 <strong>Archives<\/strong> 标签页、以该 mod 之名下列出。<\/li><li>右键 BSA → <code>Extract…<\/code> 可把内容解包到你指定的任意文件夹。<\/li><\/ul>\n<h2>Have MO manage archives<\/h2>\n<p>勾选后（默认行为）：<\/p>\n<ul><li><strong>所有 BSA 都完全等同于 loose file<\/strong>：其优先级<strong>只取决于 mod 优先级顺序<\/strong>，与插件优先级顺序（加载顺序）<strong>无关<\/strong>。<\/li><li>在此模式下勾选某个 BSA，<strong>无需 dummy plugin<\/strong> 即可加载其资源。举例：可以勾选 Skyrim 高清材质包的 BSA 并取消其插件，<strong>省下 3 个插件位<\/strong>。<\/li><\/ul>\n<p>取消勾选后：<\/p>\n<ul><li>回到游戏内置的\"BSA vs loose file\"规则：BSA 按<strong>插件加载顺序<\/strong>加载，且<strong>必须通过 dummy plugin<\/strong> 加载 BSA。<\/li><\/ul>\n<h2>Unmanaged mod 与冲突裁决<\/h2>\n<p>MO 的 BSA 管理让 <strong>mod 优先级更重要<\/strong>。为了让冲突裁决正确，MO 会把<strong>真实 Data 目录里所有含 BSA 的 mod/DLC<\/strong> 也列进左窗格，作为 <code>Non-MO<\/code> mod，并加 <strong><code>Unmanaged:<\/code><\/strong> 前缀。<\/p>\n<ul><li>使用经验：<strong>让这些 Non-MO mod 排到尽可能低的优先级，同时保持冲突裁决正确<\/strong>。<\/li><li>一个便捷的判断依据：<strong>观察你的加载顺序<\/strong>——DLC 以及夹在它们之间的 mod，其顺序一般应与加载顺序大致一致，这样才会用到正确的资源。<\/li><\/ul>\n<h3>典型案例<\/h3>\n<p>Dragonborn DLC 与 Unofficial Skyrim Patch：<\/p>\n<ul><li>若把 <code>Unofficial Skyrim Patch<\/code> 放在 Dragonborn DLC（左窗格显示为 <code>Unmanaged:<\/code>）<strong>之上<\/strong>，<code>dragonactorscript.pex<\/code> 会错误地覆盖 Dragonborn 版本，导致<strong>无法吸收龙魂<\/strong>。<\/li><li>修复方法：让 <code>Unofficial Skyrim Patch<\/code> 的优先级<strong>低于<\/strong> Dragonborn。<\/li><\/ul>\n<h2>已知限制<\/h2>\n<ul><li>若报错 <code>failed to remove limit on archive list!<\/code>，这类用户<strong>只能以勾选方式加载约 80 个 BSA<\/strong>。应对办法：解包部分 BSA，或改为加载对应的 ESP——这样游戏会用默认机制加载该 BSA。<\/li><\/ul>\n<h2>Archive Invalidation（存档失效）<\/h2>\n<ul><li>Bethesda 游戏默认让 BSA 覆盖 loose file。若你用了 loose file 想盖过原版 BSA 内容，就需要 Archive Invalidation。<\/li><li>Skyrim 的替代方案是 <strong>Back-date BSAs<\/strong>（Settings → <code>Workarounds<\/code>）：<strong>跑 Skyrim 且未启用 Archive Invalidation 时，必须勾选它<\/strong>，否则原版 BSA 可能覆盖你的 loose file，出问题后极难排查。<\/li><li>详见<a href=\"settings-tabs.md\" target=\"<em>blank\" rel=\"noopener\">设置页参考<\/a>与<a href=\"load-mechanism.md\" target=\"<\/em>blank\" rel=\"noopener\">加载机制与 Steam App ID<\/a>。<\/li><\/ul>", "_file": "05-usage/bsa-management-usage.md", "_chars": 1887}, {"id": "overwrite-dir", "title": "Overwrite 目录与维护", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "Overwrite", "维护", "工具产出"], "aliases": ["Overwrite 目录", "覆盖目录", "overwrite 是什么", "overwrite 要不要清"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "工具写出的新文件落入 Overwrite；应定期把其中内容归档进正式 mod，保持 Overwrite 干净。", "kind": "tutorial", "content": "<p><code>Overwrite<\/code> 是 MO2 里一个特殊的高优先级文件夹：<strong>工具（而非游戏）通过 VFS 写出的新文件，会落到这里<\/strong>。<\/p>\n<h2>文件怎么进 Overwrite 的<\/h2>\n<ul><li>BodySlide 生成的 <code>_cbbe.dds<\/code>、xEdit 清洗出的 <code>.esp<\/code>、LOOT 排序结果、FNIS 输出等，经 usvfs 写出时，默认写入 <code>overwrite\\<\/code>。<\/li><li>因为 Overwrite 优先级最高，它\"盖\"住一切同名文件——这正是你期望的行为（工具产物立即生效）。<\/li><\/ul>\n<h2>为什么要维护一个干净的 Overwrite<\/h2>\n<ul><li>若不清理，Overwrite 会越积越乱，文件名冲突、难以追溯\"这文件是哪来的\"。<\/li><li>它应是一个<strong>中转站<\/strong>，而不是长期仓库。<\/li><\/ul>\n<h2>维护流程<\/h2>\n<ol><li>定期打开 <code>Overwrite<\/code>，查看里面的文件。<\/li><li>把属于某个具体 mod 的产出，<strong>移动/归类<\/strong>到对应的正式 mod 文件夹里（必要时新建一个\"工具输出\"mod）。<\/li><li>只保留真正需要\"临时覆盖一切\"的文件在 Overwrite 中。<\/li><li>删除已归档的重复项，避免 Overwrite 与正式 mod 互相打架。<\/li><\/ol>\n<blockquote>Overwrite 与 <a href=\"../01-mechanism/virtual-delete.md\" target=\"_blank\" rel=\"noopener\">虚拟删除<\/a> 方向相反：一个是\"暴露工具写出的新文件\"，一个是\"隐藏某文件\"。<\/blockquote>", "_file": "05-usage/overwrite-dir.md", "_chars": 961}, {"id": "profile-switching", "title": "Profile（档案）切换", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "profile", "档案", "切换"], "aliases": ["档案切换", "多套配置", "换存档配置"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "每个 profile 保存独立的 mod 勾选与加载顺序，可在多套配置间无缝切换。", "kind": "tutorial", "content": "<p>MO2 的 profile（档案）系统让你为同一游戏保存<strong>多套不同的 mod 组合与加载顺序<\/strong>，互不干扰。<\/p>\n<h2>profile 包含什么<\/h2>\n<ul><li>哪些 mod 被<strong>启用/禁用<\/strong>。<\/li><li>mod 的<strong>顺序（优先级）<\/strong>。<\/li><li>插件（ESP/ESM/ESL）的<strong>加载顺序<\/strong>。<\/li><li>各自的 INI/存档关联等。<\/li><\/ul>\n<h2>切换时发生了什么<\/h2>\n<ul><li>切换 profile 只是改变 MO2 接下来要喂给 usvfs 的\"视图定义\"。<\/li><li>下一次启动游戏/工具时，<a href=\"../03-architecture/usvfs-connector.md\" target=\"_blank\" rel=\"noopener\">UsvfsConnector<\/a> 按新 profile 重建映射——磁盘上的 mod 文件一个都没动。<\/li><\/ul>\n<h2>实用提示<\/h2>\n<ul><li>新建空白 profile 时可选 <code>DefaultGameSettings<\/code>，用于排查\"是不是 mod 导致的故障\"。<\/li><li>排错时：先在空 profile 跑通，再逐步加 mod，能快速定位是哪个 mod 惹的祸。<\/li><\/ul>\n<blockquote>切换 profile 偶尔会让 MO2 崩溃？先排查安全软件与 <a href=\"../06-reference/troubleshooting-vfs.md\" target=\"_blank\" rel=\"noopener\">VFS 排错<\/a> 中的\"Windows Event Log 服务\"。<\/blockquote>", "_file": "05-usage/profile-switching.md", "_chars": 862}, {"id": "mod-isolation", "title": "mod 隔离与游戏目录干净", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "隔离", "游戏目录"], "aliases": ["mod 隔离", "游戏目录干净", "isolation", "为什么不污染游戏"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "每个 mod 独立存放，游戏目录保持原样；启用/禁用不会互相破坏。", "kind": "concept", "content": "<p>MO2 的官方特性之一就是 <strong>mod isolation（游戏目录保持干净）<\/strong>。<\/p>\n<h2>它为什成立<\/h2>\n<ul><li>每个 mod 是 <code>mods\\<\/code> 下的独立文件夹，互不叠加在磁盘上。<\/li><li>真正的\"合并视图\"只存在于被 usvfs 注入的进程的<strong>内存<\/strong>里（见 <a href=\"../01-mechanism/process-local-links.md\" target=\"_blank\" rel=\"noopener\">进程级可见的虚拟链接<\/a>）。<\/li><li>因此没有哪个 mod 会\"踩\"到另一个 mod 的文件，游戏原文件也不会被覆盖。<\/li><\/ul>\n<h2>带来的能力<\/h2>\n<ul><li>随便启用/禁用/重排序 mod，磁盘零改动。<\/li><li>出错时只需调整 MO2 里的勾选与顺序，不必去游戏目录里翻找、删除残留。<\/li><li>与 Steam/平台\"验证游戏文件完整性\"完全兼容（游戏目录没被动过）。<\/li><\/ul>\n<blockquote>工具（如 BodySlide、xEdit）写出的新文件不会进游戏目录，而是进 <a href=\"overwrite-dir.md\" target=\"_blank\" rel=\"noopener\">Overwrite 目录<\/a>。<\/blockquote>", "_file": "05-usage/mod-isolation.md", "_chars": 725}, {"id": "downloads-and-nexus", "title": "下载管理与 Nexus 集成", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "下载", "Nexus", "meta", "nxmhandler"], "aliases": ["下载管理", "Nexus 集成", "MO2 下载", "nexus 怎么连"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "MO 通过 NXM 链接下载并收集 meta（名称/版本/Nexus ID），缺失可 Query Info 补全；nxmhandler 可让多款管理器共存。", "kind": "tutorial", "content": "<h2>下载<\/h2>\n<ul><li>在 Nexus mod 页面点 <code>Download with Manager<\/code>（需先按<a href=\"install-and-setup.md\" target=\"_blank\" rel=\"noopener\">安装与首次启动设置<\/a>完成 NXM 注册），下载会出现在右窗格 <strong>Downloads<\/strong> 标签页。<\/li><li>也可手动下载，然后用工具栏 <strong>Archive<\/strong> 按钮安装。<\/li><li>手动下载的文件<strong>不会<\/strong>自动出现在 Downloads 标签页；想让它出现，需手动拷进 MO 的 <code>downloads<\/code> 文件夹，再按下面的步骤补 meta。<\/li><\/ul>\n<h2>meta 信息<\/h2>\n<ul><li>下载完成后 MO 会收集 meta：mod 名称、版本、Nexus ID。安装时它决定 MO 建议的 mod 名；装好后 Nexus ID 与版本号会写进该 mod 的信息里。<\/li><li>若没收到 meta，Downloads 里该文件前会出现警告图标。补全方法：<ol><li>右键该下载文件 → <code>Query Info<\/code>；<\/li><li>若让你在<strong>两个或更多 Nexus ID<\/strong> 中选，选正确那个（<strong>通常是数字更大的<\/strong>）；都不对就取消；<\/li><li>若让你<strong>输入 Nexus ID<\/strong>，填正确数字（即 <code>nexusmods.com/mods/&lt;数字&gt;<\/code> 末尾的数字）；<\/li><li>若让你<strong>选择正确的文件<\/strong>，选对；列表里没有就取消。<\/li><\/ol><\/li><li><strong>补全失败的三种常见原因<\/strong>：<ol><li>作者没给该文件设版本号；<\/li><li>该 mod 的文件超过 30 个，而 MO 探到的 30 个里没有正确那一个；<\/li><li>该文件在 Nexus 上不存在。<\/li><\/ol><\/li><li>可直接用文本编辑器（如记事本）编辑 <code>downloads<\/code> 文件夹里的 <code>&lt;modname&gt;.meta<\/code>，像普通 ini 一样填。这些信息<strong>不影响 MO 功能<\/strong>，只用于标明来源；留空 MO 也照常工作。<\/li><li>注意：若安装时把多个 mod <strong>合并<\/strong>成一个，之后卸载该 mod 时<strong>只有一个<\/strong> <code>&lt;modname&gt;.meta<\/code> 会更新，可能出现在 Downloads 里仍显示\"已安装\"的假象。<\/li><li>你可能会看到 <code>1 orphaned meta file will be deleted<\/code> 之类的提示——那是下载期间作占位符的临时文件被清理，属正常。<\/li><\/ul>\n<h3>Downloads 中的状态<\/h3>\n<ul><li><code>Done<\/code> = 下载完成但未安装；<code>Installed<\/code> = 已安装；<code>Uninstalled<\/code> = 已卸载。<\/li><li>文件可<strong>删除<\/strong>（移入回收站）或<strong>从视图移除<\/strong>（仍留在 MO 的 downloads 文件夹）；勾选左下角 <code>Show Hidden<\/code> 可再次看到被移除的文件。<\/li><li>通过 MO 下载的 mod 存放在 <code>&lt;ModOrganizer&gt;/downloads<\/code>。<\/li><\/ul>\n<h2>首选下载服务器<\/h2>\n<ul><li>Settings → <code>Nexus<\/code> 标签页底部：把左框里的服务器<strong>拖到右框<\/strong>即设为首选（服务器只在首次下载某个 mod 时才被识别）。<\/li><li><strong>Premium 用户<\/strong>可借此把 Premium 服务器排到前面以获得更快速度。<\/li><\/ul>\n<h2>Download with Manager 点了没反应？<\/h2>\n<p>按顺序排查：<\/p>\n<ul><li>点一下工具栏的 <strong>globe<\/strong> 按钮。<\/li><li>Settings → <code>Nexus<\/code> → 点 <code>Associate with \"Download with manager\" links<\/code>。<\/li><li>进入 ModOrganizer 目录运行 <strong>nxmhandler<\/strong>：若它指向 MO，点 <code>Register Active<\/code> → 提示处点\"是\" → 关闭；若没指向 MO，在窗口里右键 <code>Add<\/code>，选所处理的游戏，浏览到对应的 <code>ModOrganizer.exe<\/code>，OK 后点 <code>Register Active<\/code> 并确认。<\/li><li><strong>Google Chrome<\/strong>（旧版方法）：关闭 Chrome → 打开 <code>%LOCALAPPDATA%/Google/Chrome/User Data/Local State<\/code> → 搜索 <code>nxm<\/code> → 删除 <code>\"nxm\": false<\/code> 那一行（即使是 true 也删）→ 保存 → 下次点击时 Chrome 会弹窗询问，点 <code>Launch<\/code>。<ul><li>⚠️ 该 Chrome 方法在<strong>较新版本的 Chrome 上已失效<\/strong>。<\/li><\/ul><\/li><li><strong>Firefox<\/strong>：在选项的\"应用程序\"里搜索 <code>nxm<\/code>，指向 ModOrganizer 目录内的 nxmhandler。<\/li><\/ul>\n<h2>与其它 mod 管理器共存（多游戏）<\/h2>\n<p>MO 首次运行会独占 nxm 链接关联，而 MO 只支持部分游戏（而 Nexus Mod Manager 支持更多）。如果你同时用别的管理器管其它游戏，就会冲突。解决办法：<\/p>\n<ol><li>运行 MO 目录下的 <code>nxmhandler.exe<\/code>；<\/li><li>在空白处右键 → <code>Add<\/code>；<\/li><li>支持的游戏里选 <code>Other<\/code>，用文件浏览按钮指向另一个客户端（如 NMM 的 <code>NexusClient.exe<\/code>），OK；<\/li><li>到 Nexus 的<a href=\"https://www.nexusmods.com/games/about/games/\" target=\"_blank\" rel=\"noopener\">游戏列表<\/a>点开目标游戏主页，看 URL 末段即游戏标识（例：Dragon Age 2 是 <code>dragonage2<\/code>），复制它；<\/li><li>回到 nxmhandler，<strong>双击<\/strong> <code>other<\/code> 改名并粘贴，关闭即可并存。<\/li><li>需要多个游戏交给同一客户端时，重复上述步骤，用<strong>逗号<\/strong>分隔多个游戏名。<\/li><\/ol>\n<blockquote>注意：nxmhandler 产生的实际设置，<strong>只存在于你第一份 MO 安装的顶层 INI<\/strong> 里。<\/blockquote>\n<blockquote>相关：<a href=\"install-mods.md\" target=\"<em>blank\" rel=\"noopener\">安装 mod<\/a>（装完如何安装/更新）、<a href=\"third-party-executables.md\" target=\"<\/em>blank\" rel=\"noopener\">第三方程序配置<\/a>。<\/blockquote>", "_file": "05-usage/downloads-and-nexus.md", "_chars": 2851}, {"id": "usage-faq", "title": "使用类常见问答（mod 管理）", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "FAQ", "排错", "常见问题"], "aliases": ["MO2 使用问答", "使用类 FAQ", "常见操作问题"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "收集 STEP 指南里高频的实操疑问：什么能/不能作为 mod 安装、MO 是否在正常工作、窗口异常、卸载 MO 等。", "kind": "reference", "content": "<blockquote>关于 VFS/USVFS 层面的疑问见<a href=\"../06-reference/faq.md\" target=\"_blank\" rel=\"noopener\">常见问题（FAQ）<\/a>。<\/blockquote>\n<h2>诊断与验证<\/h2>\n<p><strong>Q：装了个 mod 但它不工作！<\/strong> A：怎么判断的？<strong>唯一可靠的指标是游戏本身<\/strong>。Skyrim 启动器<strong>不会<\/strong>显示 MO 装的 mod；Data 目录里也不会出现新文件。装完后<strong>启动游戏看效果<\/strong>。若确实无效，检查目录结构——很多 mod 打包不佳，你需要在安装时或安装后移动文件（见 <a href=\"hide-files-and-filetree.md\" target=\"_blank\" rel=\"noopener\">Filetree 面板<\/a>）。<\/p>\n<p><strong>Q：怎么知道 MO 在工作？<\/strong> A：装一个<strong>效果肉眼可见<\/strong>的 mod。另外确认 <code>modorganizer.log<\/code> 有被生成。<\/p>\n<p><strong>Q：怎么看 MO 的虚拟文件系统（VFS）在干活？<\/strong> A：用 Free Commander（FCXE）或其它合适的文件管理器，<strong>从 MO 内启动<\/strong>它再去看 <code>&lt;Skyrim&gt;/data<\/code>。详见<a href=\"tool-recipes.md\" target=\"_blank\" rel=\"noopener\">常用工具配置配方<\/a>。<\/p>\n<blockquote>注意：BSA 内的文件<strong>不会<\/strong>显示成 Data 下的散文件。<\/blockquote>\n<p><strong>Q：为什么我的 <code>&lt;skyrim&gt;Data<\/code> 里看不到任何 mod 文件？<\/strong> A：正常。每个 mod 装在各自的文件夹里（默认 <code>&lt;ModOrganizer&gt;/Mods/<\/code>）。<code>&lt;skyrim&gt;Data<\/code> 里只有 Skyrim、Dawnguard、Hearthfire、Dragonborn、高清材质包与 Creation Kit 这些官方文件。MO 创建 VFS，把官方内容与当前 profile 已激活的 mod 在<strong>运行时<\/strong>合并——这正是 MO 的核心功能，让 <code>&lt;skyrim&gt;Data<\/code> <strong>保持纯净不被改动<\/strong>。<\/p>\n<h2>能 / 不能作为 mod 安装<\/h2>\n<table><thead><tr><th style=\"text-align:left\">对象<\/th><th style=\"text-align:left\">结论<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>SKSE 本身<\/strong><\/td><td style=\"text-align:left\">❌ 不能（否则 SKSE 脚本不加载）。<strong>SKSE 脚本可以<\/strong>作为 mod 安装。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>ScriptDragon 本身<\/strong><\/td><td style=\"text-align:left\">❌ 不能（目前是禁区）。其脚本<strong>也许可以<\/strong>，前提是放进 data 目录或 <code>&lt;skyrim&gt;/Data/asi<\/code>。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>ENB<\/strong><\/td><td style=\"text-align:left\">❌ 不能。但其附加资源（Shaders、Textures 等）<strong>可以<\/strong>作为 mod 安装。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>SweetFX Shader Suite<\/strong><\/td><td style=\"text-align:left\">❌ 不能。其附加资源（Shaders、Textures）<strong>可以<\/strong>。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>FXAA Post Process Injector<\/strong><\/td><td style=\"text-align:left\">❌ 不能。同理，其附加资源<strong>可以<\/strong>。<\/td><\/tr><\/tbody><\/table>\n<h2>安装与校验<\/h2>\n<p><strong>Q：用 C# 脚本的 FOMOD（如 SkyUI）装不上？<\/strong> A：需要正确的 <strong>.NET Framework<\/strong>。<\/p>\n<p><strong>Q：每次跑 Skyrim，Overwrite 的 <code>meshes/cache<\/code> 里都会多出 <code>.tri<\/code> 文件？<\/strong> A：那是 <strong>RaceMenu 的 CharGen 扩展<\/strong>生成的缓存。RaceMenu 每次运行都会删除旧的、生成新的，你可以<strong>放心删除<\/strong>。<\/p>\n<p><strong>Q：我设了自动解包 BSA，现在想改回来怎么办？<\/strong> A：点击工具栏 wrench 打开 Settings → 点 <code>Reset Dialogs<\/code> → 提示处点\"是\"。<\/p>\n<h2>Nexus 与更新<\/h2>\n<p><strong>Q：MO 会自动检查 mod 更新吗？<\/strong> A：<strong>不会<\/strong>——作者不想给 Nexus 制造无谓流量。但你可以右键 mod 列表 → <code>Check all for update<\/code>，它会检查所有 mod 的最新版本，并把有更新的标红。<\/p>\n<p><strong>Q：为什么 MO 仍显示我\"未登录\"？<\/strong> A：MO <strong>不会自动轮询<\/strong> Nexus 核对这类信息。你的账号信息会一直保存，<strong>直到你真正使用过它们<\/strong>为止。执行一次会用到账号的操作后，注意标题栏的变化。<\/p>\n<p><strong>Q：装了 mod 为什么没打上 endorsement 标记？<\/strong> A：出于技术原因，负责安装的<a href=\"plugins-extensibility.md\" target=\"_blank\" rel=\"noopener\">插件<\/a>无法设置该标记。到左窗格右键 → <code>check all for updates<\/code>，这也会顺带设置 endorsement 标记。<\/p>\n<p><strong>Q：为什么我无法对某个下载的 mod 执行 \"Query Info\"？<\/strong> A：取决于具体 mod。<strong>Nexus 一次最多允许 MO 查询 30 个文件<\/strong>；若该 mod 的下载页超过 30 个文件，正确名字可能不在给出的 30 个答案里，只能自己按命名规则核对调整。也可以考虑请作者清理下载页。<\/p>\n<p><strong>Q：只用 MO 管部分游戏、其它游戏用 NMM 等管理器？<\/strong> A：用 MO 目录里的 <code>NXMHandler<\/code>，见<a href=\"downloads-and-nexus.md\" target=\"_blank\" rel=\"noopener\">下载管理与 Nexus 集成<\/a>。<\/p>\n<h2>加载机制<\/h2>\n<p><strong>Q：该用哪种加载机制？<\/strong> A：<strong>默认的就好<\/strong>，除非它出问题。装了脚本扩展又不想用 MO 界面时，可以改成 <code>Script Extender<\/code> 机制，但<strong>要知道：这样经 MO 装的脚本扩展插件将不工作<\/strong>，必须手动装进 data 目录；而且<strong>游戏每次更新 SE 都会失效，MO 随之失效<\/strong>。<\/p>\n<ul><li><code>Proxy DLL<\/code> <strong>只作为最后手段<\/strong>；用它时，<strong>每次游戏更新后都必须至少启动一次 MO<\/strong>。<\/li><li>Oblivion 用 <code>Script Extender<\/code> 机制最好；Skyrim 用 <code>Mod Organizer<\/code> 机制最好。<\/li><\/ul>\n<p><strong>Q：用了 proxy-dll 加载机制后 MO/Skyrim 不工作了，怎么办？<\/strong> A：见<a href=\"load-mechanism.md\" target=\"_blank\" rel=\"noopener\">加载机制与 Steam App ID<\/a> 中的修复步骤。<\/p>\n<h2>杂项<\/h2>\n<p><strong>Q：能用 PS4 / Xbox / Steam 手柄配 MO 吗？<\/strong> A：可以，但 <strong>MO 必须以非管理员权限安装<\/strong>。<\/p>\n<p><strong>Q：窗口老是自动缩回小尺寸，怎么固定？<\/strong> A：Settings → <code>Nexus<\/code>，取消勾选 <code>Use HTTP Proxy (Use System Settings)<\/code>。<\/p>\n<p><strong>Q：想卸载 MO，该怎么做？<\/strong> A：<\/p>\n<ol><li>在 MO 内进 Settings，把加载机制选为 <code>Mod Organizer<\/code>；<\/li><li>关闭 MO，之后不再使用即可；<\/li><li>确认不需要其中内容（如 mod 归档）后，可以删除 ModOrganizer 目录。<strong>MO 不写注册表、也不写自身目录以外的任何位置<\/strong>，除此之外无需任何卸载操作。<\/li><\/ol>\n<blockquote>注意：<strong>NXM 关联仍然存在<\/strong>，需要另行处理（见<a href=\"downloads-and-nexus.md\" target=\"_blank\" rel=\"noopener\">下载管理与 Nexus 集成<\/a>）。<\/blockquote>\n<blockquote>相关：<a href=\"ui-layout.md\" target=\"<em>blank\" rel=\"noopener\">界面总览<\/a>、<a href=\"saves-management.md\" target=\"<\/em>blank\" rel=\"noopener\">存档查看与 Fix Mods<\/a>、<a href=\"warnings-and-order-problems.md\" target=\"_blank\" rel=\"noopener\">警告面板与潜在 mod 顺序问题<\/a>。<\/blockquote>", "_file": "05-usage/usage-faq.md", "_chars": 3330}, {"id": "portable-vs-instance", "title": "便携安装 vs 实例安装", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "安装模式", "instance", "portable", "LocalAppData"], "aliases": ["便携安装", "实例安装", "portable instance", "两种安装方式"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "portable 每个游戏一份 MO；instanced 用一份 MO 管多游戏/多套构建，各实例数据存于 %LocalAppData%/ModOrganizer。", "kind": "concept", "content": "<p>MO（含 MO2）可以按两种模式使用：<strong>portable（便携）<\/strong>与 <strong>instanced（实例）<\/strong>。<\/p>\n<h2>便携模式（portable）<\/h2>\n<ul><li>每个要管理的游戏，都要<strong>单独安装一份 MO<\/strong>。<\/li><li>历史最久、最正统的用法。<\/li><li>没有已知问题；唯一缺点是 MO 程序本身冗余——MO 需要升级、换主题等时要一份份维护，时间久了是个麻烦。<\/li><\/ul>\n<h2>实例模式（instanced）<\/h2>\n<ul><li><strong>一份 MO 安装<\/strong>即可管理多个游戏，和/或同一游戏的多套 mod 构建。<\/li><li>每个实例的数据存放在 <code>%LocalAppData%/ModOrganizer<\/code> 下。<\/li><li>可以把实例理解为 <strong>profile 系统的扩展<\/strong>：<ul><li><strong>普通 profile<\/strong> 允许独立管理游戏配置（INI 文件）、启用的 mod、启用的插件、mod 优先级等，但它们<strong>都属于同一个游戏，且共享同一个 mod 列表<\/strong>。<\/li><li>想为同一游戏管理两套完全不同的构建时，这个限制很明显：两套 mod 会被合并进同一份 mod 列表，充斥大量永远不会被启用的\"噪音\"。<\/li><li><strong>实例<\/strong>则让<strong>所有东西<\/strong>都能分区独立，效果等同于便携模式，却不需要多份（冗余的）MO。<\/li><\/ul><\/li><li>点击工具栏上的 instance 按钮即可切换实例。<\/li><\/ul>\n<h2>该选哪个<\/h2>\n<ul><li><strong>STEP 强烈推荐 instanced<\/strong>。<\/li><li>需要注意的是：由于两种安装方式并存，第三方工具作者常常只针对自己使用的模式做适配。便携模式存在的时间远长于实例模式，因此<strong>通常与第三方软件的开箱兼容性更好<\/strong>。<\/li><li>了解两者的差异，就能轻松规避绝大部分潜在问题。<\/li><\/ul>\n<blockquote>相关：<a href=\"install-and-setup.md\" target=\"<em>blank\" rel=\"noopener\">安装与首次启动设置<\/a>（首次启动时选 New 建实例或选 Portable）、<a href=\"profile-switching.md\" target=\"<\/em>blank\" rel=\"noopener\">Profile 切换<\/a>、<a href=\"backup-and-restore.md\" target=\"_blank\" rel=\"noopener\">备份与恢复<\/a>（重装前要备份 <code>profiles<\/code> 等目录）。<\/blockquote>", "_file": "05-usage/portable-vs-instance.md", "_chars": 1256}, {"id": "conflict-resolution", "title": "冲突解决与优先级", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "冲突", "优先级", "赢家"], "aliases": ["冲突解决", "mod 冲突", "谁覆盖谁", "conflict resolution", "冲突怎么排"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "同名文件冲突时，mod 列表中靠下者（优先级高）覆盖靠上者；BSA 亦参与排序。", "kind": "tutorial", "content": "<p>当多个启用 mod（或 mod 与游戏原文件）提供<strong>同一相对路径<\/strong>的文件，就产生冲突。MO2 用\"优先级\"裁决谁被读取。<\/p>\n<h2>核心规则<\/h2>\n<ul><li>在左侧 mod 列表中，<strong>越靠下优先级越高<\/strong>，会覆盖（盖住）上面的 mod。<\/li><li>对该路径，优先级最高的来源即\"赢家\"，被进程读取；其余来源被隐藏（但 MO2 会在 UI 标红提示冲突）。<\/li><li>这与底层 <a href=\"../03-architecture/fileentry-priority.md\" target=\"_blank\" rel=\"noopener\">FileEntry 多来源优先级冲突<\/a> 是同一套规则——叠加 + 排序。<\/li><\/ul>\n<h2>BSA 与 loose file<\/h2>\n<ul><li>BSA 内容也被拉进虚拟目录（见 <a href=\"../03-architecture/bsa-priority-resolution.md\" target=\"_blank\" rel=\"noopener\">BSA 的优先级解析<\/a>），参与同一套排序。<\/li><li>想用 loose file 盖过某个 BSA 内的资源：让该 loose file 所在 mod 优先级高于 BSA 所属 mod 即可。<\/li><li>反之高优先级 mod 的 BSA 会压过低优先级 mod 的 loose file——注意\"存档失效（archive invalidation）\"与 BSA 加载顺序的影响。<\/li><\/ul>\n<h2>操作步骤<\/h2>\n<ol><li>在 mod 列表里上下拖动调整顺序（或右键设置优先级）。<\/li><li>用 MO2 的冲突筛选/高亮确认谁覆盖谁。<\/li><li>必要时把想\"永久胜出\"的文件放进高优先级 mod，或利用 <a href=\"overwrite-dir.md\" target=\"_blank\" rel=\"noopener\">Overwrite 目录<\/a>。<\/li><\/ol>\n<blockquote>想看 usvfs 实际把请求重定向到了哪个文件？开 <a href=\"../04-debugging/debugging-usvfs.md\" target=\"_blank\" rel=\"noopener\">调试 usvfs<\/a> 日志。<\/blockquote>", "_file": "05-usage/conflict-resolution.md", "_chars": 1070}, {"id": "load-mechanism", "title": "加载机制与 Steam App ID", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "加载机制", "Steam AppID", "proxy dll", "排错"], "aliases": ["启动机制", "App ID", "MO2 怎么启动游戏"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "默认用 Mod Organizer 加载机制；Script Extender 与 Proxy DLL 各有代价；Steam App ID 决定游戏与工具能否正确启动。", "kind": "reference", "content": "<h2>Load Mechanism（Settings → Workarounds）<\/h2>\n<p>决定 MO 以何种方式作用于游戏。<strong>若默认机制不出问题，就不要改。<\/strong><\/p>\n<table><thead><tr><th style=\"text-align:left\">机制<\/th><th style=\"text-align:left\">行为与代价<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Mod Organizer<\/strong>（默认）<\/td><td style=\"text-align:left\">游戏经 MO 启动时被 hook，加载你的 mod。<strong>推荐默认使用<\/strong>。Skyrim 用它效果最好。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Script Extender<\/strong><\/td><td style=\"text-align:left\">经游戏的脚本扩展加载器把 MO 作为插件加载。代价：<strong>经 MO 安装的脚本扩展插件不会生效<\/strong>，必须手动装进 Data；且<strong>游戏一更新 SE 就失效，MO 也随之失效<\/strong>。Oblivion 用它效果最好。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Proxy DLL<\/strong><\/td><td style=\"text-align:left\">以 DLL 应用扩展方式加载 MO，属于\"比较大的 hack\"，<strong>应尽最大努力避免<\/strong>。用它还必须<strong>每次游戏更新后至少启动一次 MO<\/strong>。<\/td><\/tr><\/tbody><\/table>\n<h3>Proxy DLL 出问题后的修复<\/h3>\n<p>现象：用了 proxy-dll 之后 MO/Skyrim 不工作了。按以下步骤<strong>逐条照做<\/strong>：<\/p>\n<ol><li>先在 MO 里<strong>停用<\/strong> proxy-dll 加载，然后关闭 MO。<\/li><li>看游戏目录里 <code>steam_api.dll<\/code> 的大小：<ul><li>若约 <strong>116 KB<\/strong> → 删除 <code>steam_api_orig.dll<\/code>；<\/li><li>若约 <strong>11 KB<\/strong> → 删除 <code>steam_api.dll<\/code>，然后把 <code>steam_api_orig.dll<\/code> 改名为 <code>steam_api.dll<\/code>。<\/li><\/ul><\/li><li>两种情况下你最终都应得到：一个约 116 KB 的 <code>steam_api.dll<\/code>，且<strong>没有<\/strong>第二个叫 <code>steam_api*<\/code> 的文件。<\/li><li>重新启动 MO，再重新启用 proxy-dll。<\/li><\/ol>\n<h2>Steam App ID<\/h2>\n<ul><li>MO 会按所管游戏<strong>自动填入<\/strong> Steam App ID：<\/li><\/ul>\n<table><thead><tr><th style=\"text-align:left\">游戏<\/th><th style=\"text-align:left\">App ID<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Skyrim<\/td><td style=\"text-align:left\">72850<\/td><\/tr><tr><td style=\"text-align:left\">Fallout NV<\/td><td style=\"text-align:left\">22380<\/td><\/tr><tr><td style=\"text-align:left\">Fallout 3<\/td><td style=\"text-align:left\">22300<\/td><\/tr><tr><td style=\"text-align:left\">Oblivion<\/td><td style=\"text-align:left\">22330<\/td><\/tr><\/tbody><\/table>\n<ul><li>只有游戏或某个 Steam 工具启动不正确时才需要调整（<strong>很罕见<\/strong>）。<\/li><li>获取正确 App ID 的方法：<ol><li>打开 Steam → <code>Library<\/code>；<\/li><li>右键该游戏 → <code>Properties<\/code>；<\/li><li><code>General<\/code> 标签页点 <code>CREATE DESKTOP SHORTCUT<\/code>，提示处选 OK；<\/li><li>在桌面上右键该快捷方式 → <code>Properties<\/code>；<\/li><li><code>URL<\/code> 字段形如 <code>steam://rungameid/202480<\/code>，那个数字就是 Steam App ID（此例为 Creation Kit）。<\/li><\/ol><\/li><\/ul>\n<h3>补充说明<\/h3>\n<ul><li><strong>Fallout 3 年度版（GOTY）的 App ID 是 22370<\/strong>——若你用该版本，这可能解决 Fallout 3 的崩溃问题。<\/li><li><strong>Skyrim Creation Kit 的 App ID 是 202480<\/strong>。若没在 <code>Configure Executables<\/code> 里勾选 <code>Overwrite Steam AppID<\/code> 并填 202480，<strong>CK 将看不到你的 mod<\/strong>。<\/li><\/ul>\n<blockquote>相关：<a href=\"settings-tabs.md\" target=\"<em>blank\" rel=\"noopener\">设置页参考<\/a>、<a href=\"third-party-executables.md\" target=\"<\/em>blank\" rel=\"noopener\">配置第三方程序与快捷方式<\/a>（Overwrite Steam AppID 字段）、<a href=\"tool-recipes.md\" target=\"_blank\" rel=\"noopener\">常用工具配置配方<\/a>（SKSE 的加载机制相关注意）。<\/blockquote>", "_file": "05-usage/load-mechanism.md", "_chars": 1985}, {"id": "enable-and-activate", "title": "启用 mod 与激活插件", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "启用", "插件", "加载顺序", "备份"], "aliases": ["启用 mod", "激活插件", "勾选 mod", "激活顺序"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "左窗格勾选启用 mod（仅对当前 profile 生效）；右窗格 Plugins 勾选激活 ESP/ESM，插件必须在 mod 根目录才会被识别。", "kind": "tutorial", "content": "<p>要真正在游戏里生效，分两步：<strong>先启用 mod，再激活其插件<\/strong>。<\/p>\n<h2>启用 mod<\/h2>\n<ul><li>在左窗格<strong>勾选复选框<\/strong>。<strong>只对当前 profile 生效<\/strong>。<\/li><li>若 <code>Flags<\/code> 列出现闪电图标，说明它有些文件与其它已启用 mod 冲突——见 <a href=\"conflict-resolution.md\" target=\"_blank\" rel=\"noopener\">冲突解决与优先级<\/a>。<\/li><li><strong>批量操作<\/strong>：Shift 连选一段、或 Ctrl 逐个多选，然后按<strong>空格键<\/strong>切换这批 mod 的启用状态。<\/li><\/ul>\n<h2>激活插件（Plugins 标签页）<\/h2>\n<ul><li>已启用 mod 中，<strong>位于 mod 根目录<\/strong>的 ESM/ESP 会出现在右窗格 Plugins 标签页；<strong>放在子文件夹里的插件不会被使用<\/strong>。<\/li><li>勾选复选框即激活。<\/li><li>插件名前有警告图标 = <strong>缺少某个 master<\/strong>，悬停可看到是哪个。<\/li><li>悬停任意 ESM/ESP 会显示：来源、作者、描述、Enabled Masters，以及有关联 ini 文件时的<strong>回形针<\/strong>提示。<\/li><\/ul>\n<h3>加载顺序<\/h3>\n<ul><li><strong>拖放<\/strong>即可调整顺序（详见 <a href=\"conflict-resolution.md\" target=\"_blank\" rel=\"noopener\">冲突解决与优先级<\/a> 中的加载顺序部分）。<\/li><li>右键标签页内有三个选项：<ul><li><code>Enable all<\/code>：激活全部 ESM/ESP。<\/li><li><code>Disable all<\/code>：取消激活全部，<strong>但保留 Skyrim.esm 与 Update.esm<\/strong>（游戏运行必需）。<\/li><li><code>Lock load order<\/code>：把选中的插件<strong>锁定<\/strong>在该顺序（仅对已激活插件可用）。之后其它插件可以插进它们<strong>之间<\/strong>，但它们彼此的相对顺序固定。<\/li><\/ul><\/li><\/ul>\n<h3>备份与恢复插件列表<\/h3>\n<ul><li><strong>备份<\/strong>：点 Plugins 标签页右上的 <code>Create Backup<\/code> 按钮。<\/li><li><strong>恢复<\/strong>：点其左侧的 <code>Restore Backup…<\/code> 按钮。<\/li><li>恢复后的效果：备份时未激活的插件会被取消勾选；备份之后的所有优先级/加载顺序改动被回退；备份之后新增的插件会被取消勾选、按字母顺序置于列表底部。<\/li><li><strong>注意：备份插件列表不含 INI 文件、BSA 顺序与 mod 列表<\/strong>（mod 列表另有备份入口，见 <a href=\"backup-and-restore.md\" target=\"_blank\" rel=\"noopener\">备份与恢复<\/a>）。<\/li><\/ul>\n<h3>Sort 按钮<\/h3>\n<ul><li>Plugins 标签页左上角的 <code>Sort<\/code> 按钮使用 LOOT 自动排序插件。<\/li><li>你在<strong>外部 LOOT 应用<\/strong>里写过的规则会被沿用，但<strong>不装独立 LOOT 程序就无法写规则<\/strong>。<\/li><li>注意：内置 <code>Sort<\/code> 就是 LOOT，但<strong>缺少报告窗口与元数据编辑功能<\/strong>——需要这些就用外部 LOOT（见 <a href=\"tool-recipes.md\" target=\"_blank\" rel=\"noopener\">常用工具配置配方<\/a>）。<\/li><\/ul>\n<blockquote>相关：<a href=\"ui-layout.md\" target=\"<em>blank\" rel=\"noopener\">界面总览<\/a>（右窗格标签页）、<a href=\"bsa-management-usage.md\" target=\"<\/em>blank\" rel=\"noopener\">BSA 管理与解包<\/a>（插件与 BSA 的顺序关系）。<\/blockquote>", "_file": "05-usage/enable-and-activate.md", "_chars": 1616}, {"id": "backup-and-restore", "title": "备份与恢复", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "备份", "恢复", "modlist", "插件列表"], "aliases": ["备份 MO2", "恢复存档", "backup", "防丢档"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "左窗格可备份/恢复 mod 列表，Plugins 页可备份/恢复插件加载顺序；重装前要备份 downloads/mods/profiles 等目录。", "kind": "tutorial", "content": "<h2>备份 mod 列表（左窗格）<\/h2>\n<ul><li><strong>备份<\/strong>：点 profile 下拉框右侧的 <code>Create Backup<\/code>（保存磁盘图标）按钮。<\/li><li><strong>恢复<\/strong>：点它左侧的 <code>Restore Backup…<\/code> 按钮。<\/li><li>恢复后的效果：<ul><li>备份时<strong>未启用<\/strong>的 mod 会被取消勾选；<\/li><li>备份之后的<strong>所有优先级改动被回退<\/strong>；<\/li><li>备份之后<strong>新增<\/strong>的 mod 会被取消勾选，并按字母顺序<strong>置于 mod 列表底部<\/strong>。<\/li><\/ul><\/li><\/ul>\n<h2>备份插件列表（右窗格 Plugins 页）<\/h2>\n<ul><li><strong>备份<\/strong>：Plugins 标签页右上的 <code>Create Backup<\/code>。<\/li><li><strong>恢复<\/strong>：其左侧的 <code>Restore Backup…<\/code>。<\/li><li>详见<a href=\"enable-and-activate.md\" target=\"_blank\" rel=\"noopener\">启用 mod 与激活插件<\/a>。<\/li><\/ul>\n<h2>三者互不包含<\/h2>\n<table><thead><tr><th style=\"text-align:left\">备份对象<\/th><th style=\"text-align:left\">入口<\/th><th style=\"text-align:left\">不包含<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">mod 列表<\/td><td style=\"text-align:left\">左窗格 <code>Create Backup<\/code><\/td><td style=\"text-align:left\">INI 文件、BSA 顺序、插件（加载顺序）列表<\/td><\/tr><tr><td style=\"text-align:left\">插件列表<\/td><td style=\"text-align:left\">Plugins 页 <code>Create Backup<\/code><\/td><td style=\"text-align:left\">INI 文件、BSA 顺序、mod 列表<\/td><\/tr><\/tbody><\/table>\n<blockquote>所以完整保底要<strong>两边都备份<\/strong>。<\/blockquote>\n<h2>备份整个 MO 安装（重装/迁移前）<\/h2>\n<p>升级或重装前，应备份以下内容：<\/p>\n<ul><li><strong><code>downloads<\/code><\/strong>：所有来自 Nexus 的归档。<\/li><li><strong><code>mods<\/code><\/strong>：左窗格里\"已安装\"的 mod 实体。<\/li><li><strong><code>profiles<\/code><\/strong>：你定义的全部 <strong>profile<\/strong>，包括其中的存档（如果你选了保存游戏到 profile）。<\/li><li>若改过分类，还有 <strong><code>categories.dat<\/code><\/strong>（见<a href=\"mod-categories.md\" target=\"_blank\" rel=\"noopener\">自定义 mod 分类<\/a>）。<\/li><\/ul>\n<blockquote>若是 instanced 安装，设置本身存放在 <code>%LocalAppData%/ModOrganizer<\/code>，与 MO 程序目录分开，所以删掉程序目录内容不会丢设置（见<a href=\"portable-vs-instance.md\" target=\"_blank\" rel=\"noopener\">便携安装 vs 实例安装<\/a>）。<\/blockquote>\n<blockquote>相关：<a href=\"update-and-uninstall.md\" target=\"<em>blank\" rel=\"noopener\">更新、合并与卸载<\/a>、<a href=\"saves-management.md\" target=\"<\/em>blank\" rel=\"noopener\">存档查看与 Fix Mods<\/a>。<\/blockquote>", "_file": "05-usage/backup-and-restore.md", "_chars": 1349}, {"id": "saves-management", "title": "存档查看与 Fix Mods", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "存档", "Saves", "Fix Mods"], "aliases": ["存档管理", "存档查看", "MO2 存档在哪", "存档坏了怎么办", "Fix Mods 是干嘛的"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "Saves 标签页显示存档及其缺失插件；右键 Fix Mods… 可把该存档所需的 mod 一键恢复回原配置。", "kind": "tutorial", "content": "<h2>Saves 标签页<\/h2>\n<ul><li>位置：右窗格 <strong>Saves<\/strong> 标签页，显示你的存档。<\/li><li><strong>悬停<\/strong>某个存档会弹出信息，其中包括<strong>该存档用到、但当前 profile 缺失的 ESP<\/strong>。<ul><li>提示：界面里 <code>Missing ESPs<\/code> 这一行<strong>只是表头<\/strong>，并不是在断言该存档有问题。<\/li><\/ul><\/li><li><strong>右键<\/strong>存档 → <code>Fix Mods…<\/code>：列出缺失的 ESP，以及<strong>可能包含这些插件<\/strong>的 mod（如果有的话）。<ul><li>这是把某个存档对应的整套 mod <strong>恢复回原始配置<\/strong>的快捷途径——想接着老存档继续玩时非常有用。<\/li><\/ul><\/li><\/ul>\n<h2>与 profile 的关系<\/h2>\n<ul><li>存档是跟 profile 走的（若你在创建 profile 时选择了保存游戏）。因此，切换/备份 profile 也就意味着切换/备份了对应的存档集合。<\/li><li>重装或迁移整个 MO 安装前，别忘了 <code>profiles<\/code> 目录（见<a href=\"backup-and-restore.md\" target=\"_blank\" rel=\"noopener\">备份与恢复<\/a>）。<\/li><\/ul>\n<blockquote>相关：<a href=\"profile-switching.md\" target=\"<em>blank\" rel=\"noopener\">Profile 切换<\/a>、<a href=\"enable-and-activate.md\" target=\"<\/em>blank\" rel=\"noopener\">启用 mod 与激活插件<\/a>（缺失插件也常表现为\"插件带警告图标 = 缺 master\"）。<\/blockquote>", "_file": "05-usage/saves-management.md", "_chars": 902}, {"id": "install-mods", "title": "安装 mod：四种途径与三大打包格式", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "安装", "FOMOD", "BAIN", "手动安装", "Mod Exists"], "aliases": ["怎么装 mod", "安装 mod", "打 mod 流程", "mod 打包格式"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "用 Downloads 双击、Archive 按钮、右键 Install Mod 或 Steam Workshop 安装；Simple/BAIN/FOMOD 三格式，都不是则走手动安装。", "kind": "tutorial", "content": "<h2>开始安装的四种方式<\/h2>\n<ol><li>通过 MO 从 Nexus 下载归档，完成后在右窗格 <strong>Downloads<\/strong> 标签页<strong>双击该文件<\/strong>安装。<\/li><li>点工具栏的 <strong>Archive<\/strong> 按钮，浏览到归档包，选中并打开。<\/li><li>在<strong>左窗格右键<\/strong> → <code>Install Mod…<\/code>，浏览到归档包并打开。<\/li><li>通过 <strong>Steam Workshop<\/strong> 安装（需先经 MO 启动游戏启动器，见下）。<\/li><\/ol>\n<h2>Mod Exists 对话框（同名 mod 已存在）<\/h2>\n<p>当要安装的 mod 与现有 mod 同名（装可选文件或更新时经常出现）会弹出此框：<\/p>\n<table><thead><tr><th style=\"text-align:left\">按钮<\/th><th style=\"text-align:left\">何时用<\/th><th style=\"text-align:left\">行为<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Merge<\/strong><\/td><td style=\"text-align:left\">安装 mod 的<strong>可选文件/附加组件<\/strong><\/td><td style=\"text-align:left\">把文件<strong>追加<\/strong>进现有 mod，<strong>覆盖同名文件<\/strong>。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Replace<\/strong><\/td><td style=\"text-align:left\"><strong>把 mod 升级到含全部资源的新版本<\/strong><\/td><td style=\"text-align:left\"><strong>先删除<\/strong> mod 内所有文件，再装入新文件。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Rename<\/strong><\/td><td style=\"text-align:left\">想<strong>独立保留<\/strong>内容，或<strong>并存两个版本<\/strong><\/td><td style=\"text-align:left\">以另一个名字安装。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Cancel<\/strong><\/td><td style=\"text-align:left\">—<\/td><td style=\"text-align:left\">终止安装。<\/td><\/tr><\/tbody><\/table>\n<ul><li>勾选 <strong>Keep Backup<\/strong> 再配合 Merge 或 Replace，会在安装前<strong>备份 mod<\/strong>。<\/li><li>恢复备份的方法：右键 mod → <code>Open in explorer<\/code> → 删除高亮的 mod 文件夹 → 把紧邻其下、名字带 <code>_backup<\/code> 后缀的文件夹改名回原 mod 名。<\/li><\/ul>\n<h2>命名<\/h2>\n<ul><li>打开多数归档时，<code>Name<\/code> 框会显示从下载时收集的 meta 信息解析出的名字；没有 meta 则显示\"文件名去掉附加的 Nexus ID 与版本号\"。<\/li><li>点下拉箭头可给出建议名（同 Nexus ID 的其它 mod、归档名、带 ID/版本号的归档名、Nexus 上的真实 mod 名）。<\/li><\/ul>\n<h2>三大打包格式<\/h2>\n<ul><li><strong>Simple（简单归档）<\/strong>：最常见也最省事，弹出 <code>Quick Install<\/code> 窗口只有三个选择——<code>OK<\/code> 直接安装、<code>Manual<\/code> 进手动安装对话框、<code>Cancel<\/code> 取消。<ul><li>在 Settings → Plugins 里把 <code>Simple Installer<\/code> 的 <code>enabled<\/code> 设为 <code>false<\/code> 可关闭快速安装；把 <code>silent<\/code> 设为 <code>true<\/code> 则简单归档<strong>全自动安装<\/strong>（省一次点击），某些必须手动装的 mod 需临时关掉该设置。<\/li><\/ul><\/li><li><strong>BAIN（Bash Installer）<\/strong>：打开 BAIN 包安装窗口，按 mod 页面或 readme 说明<strong>勾选所需选项<\/strong>后点 <code>OK<\/code>；<code>Package.txt<\/code> 按钮可打开包内 package.txt（没有则置灰）；<code>Manual<\/code> 进手动安装。<\/li><li><strong>FOMOD（Fallout Mod）<\/strong>：按脚本格式二选一——<strong>XML 脚本<\/strong>走内置 FOMOD 插件，<strong>C# 脚本<\/strong>走外部 NCC 插件。按向导提示安装即可。<\/li><li>不属于以上三类的归档会打开<strong>手动安装对话框<\/strong>。<\/li><\/ul>\n<blockquote>任何一次新装 mod 都会<strong>自动取得最高数值优先级<\/strong>；启用后就会覆盖冲突的低优先级 mod 文件。另外：<strong>目前不能同时安装多个 mod<\/strong>。<\/blockquote>\n<h2>手动安装<\/h2>\n<ul><li>打开手动安装对话框后，注意左下角：<strong>红字 <code>No game data at top level<\/code><\/strong> 表示尚未定位到数据目录；第一次出现会有小教程引导。当它变成<strong>绿字 <code>Looks good<\/code><\/strong> 时，才能点 <code>OK<\/code> 安装。<\/li><li>大多数情况是\"一个 data 文件夹 + 一个 readme\"：<strong>右键 data 文件夹 → <code>Set data directory<\/code><\/strong> 即可；选错了就右键 <code>Unset data directory<\/code>。<\/li><li>复杂归档需要自己整理：<ul><li>右键某层级 → <code>Create directory<\/code> 新建文件夹；<\/li><li><strong>拖放<\/strong>移动文件（Ctrl+左键可多选一起拖）；<\/li><li><strong>取消勾选<\/strong>某个文件/文件夹即不安装；<\/li><li>右键 readme → <code>Open<\/code> 查看内容。<\/li><\/ul><\/li><li>装歪了也不要紧，可在已安装 mod 的 <a href=\"hide-files-and-filetree.md\" target=\"_blank\" rel=\"noopener\">Filetree 面板<\/a>里继续调整。<\/li><\/ul>\n<h2>FOMOD 安装出问题时<\/h2>\n<ul><li><strong>强制用外部 NCC 插件安装<\/strong>（内置插件装错文件，或该 FOMOD 的 XML mod 检测脚本只认外部安装器）：<ol><li>点工具栏 wrench 打开 Settings → <code>Plugins<\/code> 标签页；<\/li><li>点 <code>FOMOD Installer<\/code>，把 <code>prefer<\/code> 的值双击改为 <code>False<\/code>；<\/li><li>OK 后重装该 FOMOD。装好后<strong>建议把 <code>prefer<\/code> 改回 <code>true<\/code><\/strong> 恢复默认行为。<\/li><\/ol><\/li><li><strong>用 FOMM 安装<\/strong>（Fallout 系）：确保 Overwrite 为空 → 经 MO 启动 FOMM → Package Manager → Add Package 选 FOMOD（问是否拷贝选否）→ 按需安装并退出 → 右键 Overwrite → <code>Create Mod<\/code> 命名即可。<ul><li>需要识别\"已装其它 mod\"的 FOMOD（如根据已装内容改写菜单文件的 HUD 类 mod）<strong>必须在 VFS 激活时安装<\/strong>，而 MO 安装 mod 时 VFS 未激活，所以要用上面这种绕行办法。<\/li><\/ul><\/li><li><strong>命令行方式被弃用<\/strong>：自 1.2.17 起必须用 FOMM 的场景已越来越少。<\/li><\/ul>\n<h2>Steam Workshop mod 的安装<\/h2>\n<ol><li>确保 Overwrite 为空。<\/li><li>在 Steam Workshop 订阅该 mod。<\/li><li><strong>通过 MO 启动游戏启动器<\/strong>，等文件下载完后退出启动器。<\/li><li>右键 Overwrite → <code>Create Mod<\/code>，命名并确定。<\/li><li>在 Steam Workshop 退订该 mod，对下一个 mod 重复以上步骤。<\/li><li>更新 Workshop mod：重复整个流程并移除旧版本。<\/li><\/ol>\n<blockquote>相关：<a href=\"enable-and-activate.md\" target=\"<em>blank\" rel=\"noopener\">启用 mod 与激活插件<\/a>、<a href=\"update-and-uninstall.md\" target=\"<\/em>blank\" rel=\"noopener\">更新、合并与卸载<\/a>、<a href=\"plugins-extensibility.md\" target=\"_blank\" rel=\"noopener\">插件体系：安装器<\/a>。<\/blockquote>", "_file": "05-usage/install-mods.md", "_chars": 3153}, {"id": "install-and-setup", "title": "安装与首次启动设置", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "安装", "首次启动", "NXM", "Nexus"], "aliases": ["MO2 怎么装", "install setup", "MO2 安装设置"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "安装 MO2、首次启动选择游戏与 instance、关联 NXM 链接；跑游戏前必须先手动启动游戏一次让 MO 建立注册表信息。", "kind": "tutorial", "content": "<h2>安装<\/h2>\n<ol><li>从 Nexus 登录并下载 MO 的主文件，双击安装。<\/li><li>安装时可选组件，<strong>推荐勾选 \"Handle Nexus Links\"<\/strong>。<\/li><li>建议把 MO 和所有 modding 工具装在 <strong>UAC 受控目录之外<\/strong>（即不要放进 <code>C:\\Program Files<\/code> 之类需要提权的路径）。<\/li><li>若安装程序无法运行，先确认杀毒软件没有拦截该可执行文件——有则加排除后重试。<\/li><\/ol>\n<h2>首次启动前的关键前置<\/h2>\n<blockquote><strong>在第一次运行 MO 之前，必须先至少启动一次游戏本体<\/strong>，以建立 MO 用来识别游戏及其安装路径所需的注册表设置。 很多游戏需要从 Steam 启动一次，等主菜单加载出来后再退出。<\/blockquote>\n<h2>首次启动流程<\/h2>\n<p>首次启动时 MO 会让你选择初始化模式：<strong>portable（便携）或 instanced（实例）<\/strong>，详见 <a href=\"portable-vs-instance.md\" target=\"_blank\" rel=\"noopener\">便携安装 vs 实例安装<\/a>（STEP 强烈推荐 instanced）。<\/p>\n<ol><li>启动 MO。<\/li><li>在 Choose Instance 窗口选 <strong>New<\/strong> 新建实例。若想用便携模式，选 <strong>Portable<\/strong> 并跳到第 4 步。<\/li><li>在下一个窗口从下拉框选一个实例名，或自己输入（名字随意，不必是所管游戏的名字）。<\/li><li>选择要管理的游戏。列表里没有就选 <strong>Browse…<\/strong> 定位到游戏主目录，然后点 OK。<\/li><li>弹出教程询问时可以选择查看交互式教程，<strong>首次使用者建议看一遍<\/strong>。<\/li><li>可能询问是否把 nxm 链接注册给 MO 处理（影响能否在 Nexus 点 \"Download with Manager\" 下载），<strong>一般选 Yes<\/strong>。<\/li><\/ol>\n<h2>首次上手值得改的设置<\/h2>\n<ul><li><strong>让工具栏图标带文字<\/strong>：<code>View<\/code> → <code>Toolbars<\/code> → <code>Icons and Text<\/code>，新手上手更快。<\/li><li><strong>换皮肤<\/strong>：工具栏 <code>Settings<\/code> → <code>General<\/code> → <code>Style<\/code> 下拉选皮肤，<code>dark.qss<\/code> 大概是最流行的。<\/li><li><strong>改路径<\/strong>：Settings → <code>Paths<\/code> 标签页，自定义 mod/下载等文件的存放位置（多硬盘用户尤其需要）。<\/li><li><strong>关联 NexusMods 账号<\/strong>：Settings → <code>Nexus<\/code> → 点 <code>Connect to the Nexus<\/code>，浏览器里登录并 <code>Authorise<\/code>；成功后按钮变成 <code>Nexus API Key Stored<\/code>，点 OK 并按提示重启 MO。<\/li><\/ul>\n<h2>更新 MO<\/h2>\n<ul><li>工具栏右上角的更新按钮<strong>变色<\/strong>即表示有新版本，点击按提示更新；也可在 <code>Help<\/code> 菜单里找到它。<\/li><li>若 MO 没能检测到更新，可手动下载最新版并覆盖安装/解压到 MO 现有目录。<\/li><\/ul>\n<h3>干净安装式更新（不推荐，仅在常规更新出问题时用）<\/h3>\n<ol><li>进入 MO 安装目录。<\/li><li>视安装方式二选一：<ul><li><strong>instanced<\/strong>：删除 Mod Organizer 文件夹内的<strong>全部内容<\/strong>（设置保存在 <code>%LocalAppData%/ModOrganizer<\/code>，不会丢）。<\/li><li><strong>portable<\/strong>：删除该文件夹内的全部文件与子文件夹，<strong>但必须保留<\/strong>：<code>downloads<\/code>、<code>mods<\/code>、<code>overwrite<\/code>、<code>profiles<\/code>、<code>webcache<\/code>、<code>categories.dat<\/code>、<code>ModOrganizer.ini<\/code>、<code>nxmhandler.ini<\/code>。<\/li><\/ul><\/li><li>按上面的安装步骤装新版本。<\/li><\/ol>\n<blockquote>下一步：了解 <a href=\"portable-vs-instance.md\" target=\"<em>blank\" rel=\"noopener\">便携安装 vs 实例安装<\/a> 的取舍；装好后按<a href=\"install-mods.md\" target=\"<\/em>blank\" rel=\"noopener\">安装 mod<\/a>开始；工具要从 MO 内启动，见<a href=\"third-party-executables.md\" target=\"_blank\" rel=\"noopener\">配置第三方程序<\/a>。<\/blockquote>", "_file": "05-usage/install-and-setup.md", "_chars": 1999}, {"id": "tool-recipes", "title": "常用工具在 MO2 中的配置配方", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "工具", "LOOT", "xEdit", "Wrye Bash", "FNIS", "SkyProc", "SKSE", "Creation Kit"], "aliases": ["工具配置配方", "LOOT xEdit 配置", "tool recipes", "常用工具配置"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "LOOT、xEdit、Wrye Bash、FNIS、SkyProc、SKSE、Creation Kit、BodySlide、SBW、FreeCommander 的配置步骤与注意事项。", "kind": "reference", "content": "<p>以下步骤都从<a href=\"third-party-executables.md\" target=\"_blank\" rel=\"noopener\">配置第三方程序<\/a>的 <code>Modify Executables<\/code> 对话框出发（未特别说明即：点齿轮 → 填 Title → 浏览 Binary → Add → Close）。<\/p>\n<h2>LOOT<\/h2>\n<ol><li>Title 填 <code>LOOT<\/code>，Binary 选 <code>LOOT.exe<\/code>。<\/li><li>若你用 LOOT 管多个游戏，在 <code>Argument<\/code> 里加 <code>--game=&lt;name&gt;<\/code>，其中 <code>&lt;name&gt;<\/code> 为 <code>Skyrim<\/code>、<code>FalloutNV<\/code>、<code>Fallout3<\/code> 或 <code>Oblivion<\/code>。<\/li><\/ol>\n<blockquote>注意：插件页内置的 <code>Sort<\/code> 按钮就是 LOOT，但<strong>缺少报告窗口与元数据编辑功能<\/strong>。<\/blockquote>\n<h2>xEdit（TES5Edit / TES4Edit / FNVEdit / FO3Edit）<\/h2>\n<ul><li>Binary 选 <code>xEdit.exe<\/code>；在 <code>Arguments<\/code> 里加 <code>-tes5 -edit<\/code>（<code>tes5<\/code>=Skyrim、<code>tes4<\/code>=Oblivion、<code>fo3<\/code>=Fallout 3、<code>fnv<\/code>=Fallout NV）。<\/li><li><strong>取消勾选 <code>Close MO when Started<\/code><\/strong>。<\/li><li>另一种省事做法：把 xEdit 重命名成与游戏对应的名字（如 Skyrim 就叫 TES5Edit）。<\/li><li>关于保存位置：勾选 <code>Backup Plugins<\/code> 时文件写回原位置并覆盖，同时在 Overwrite 的 <code>TES5Edit Backups<\/code> 文件夹里生成备份；<strong>不勾选<\/strong>时直接覆盖原文件、不生成备份。（这与老版本 MO 行为不同——老版本无论如何都把改动写进 Overwrite。）<\/li><\/ul>\n<h2>Wrye Bash<\/h2>\n<ul><li><strong>独立版<\/strong>：Binary 选 <code>Wrye Bash.exe<\/code>（通常在安装目录的 <code>Mopy<\/code> 文件夹里，一般在游戏目录内）。<\/li><li><strong>Python 版<\/strong>：Binary 选 32 位的 <code>pythonw.exe<\/code>（如 <code>C:/Python27<\/code>），<code>Start in<\/code> 指向 Mopy 目录，<code>Arguments<\/code> 填 <code>\"…/Mopy/Wrye Bash Launcher.pyw\"<\/code> 的完整路径（在资源管理器里 Shift+右键该文件 → <code>复制为路径<\/code>）。<\/li><li>注意事项：<ul><li>从 MO 启动 Wrye Bash 时，它能识别 MO 的插件（esp/esm），但会把它们<strong>当作手动安装<\/strong>处理。<\/li><li>关闭 Wrye Bash 的 <strong>Auto-Ghost<\/strong> 功能，可避免 ESP 文件被从各自文件夹搬到 Data。<\/li><li>有些版本（如 Fallout 3 的 Wrye Flash）没有独立版，只能用 Python 方案。<\/li><\/ul><\/li><\/ul>\n<h2>FNIS（Fore's New Idles for Skyrim）<\/h2>\n<ul><li>Binary 指向 <code>&lt;ModOrganizer&gt;/mods/Fores New Idles in Skyrim - FNIS/tools/GenerateFNIS_for_Users/GenerateFNISforUsers.exe<\/code>。<\/li><li><strong>跑完 FNIS 后 Overwrite 里会出现文件<\/strong>：右键 Overwrite → <code>Create Mod<\/code>，命名如 <code>FNIS Output<\/code>，取消勾选改为勾选启用。<\/li><li>以后每次更新 FNIS 行为，都要打开 Overwrite，把新文件<strong>拖回该 mod<\/strong>。<\/li><li>若报 \"This application cannot be started\"，多半是<strong>忘了在左窗格启用该 mod<\/strong>。<\/li><\/ul>\n<h2>SkyProc Patchers（ASIS / Automatic Variants / Reproccer 等）<\/h2>\n<ul><li>它们是 Java 的 <code>.jar<\/code>，不是真正的 exe。添加方式：<ol><li>在右窗格 <strong>Data<\/strong> 标签页找到 <code>SkyProc Patchers<\/code> 目录，展开到目标程序；<\/li><li>右键 <code>.jar<\/code> → <code>Add as executable<\/code>；命名并完成。<\/li><\/ol><\/li><li>明说事项：<ul><li>需要 <strong>32 位 Java<\/strong>；可能要求你指定 Java 可执行文件，通常是 <code>Program Files<\/code> 下 <code>.../Java/jre7/bin/javaw.exe<\/code>。<\/li><li>也可以不改可执行列表，直接在 Data 标签页右键该 jar → <code>Open/Execute<\/code>。<\/li><li>在 <code>Arguments<\/code> 末尾加 <code> -noboss<\/code> 可绕过 BOSS。<\/li><\/ul><\/li><li>排错：<ul><li><strong>报缺 master、esp 排序错<\/strong>：把该 esp 放到它依赖的 master 之后；再给参数加 <code> -noboss<\/code>；重跑。替代方案：用 SUM（SkyProc Unified Manager）启动，把 SUM 设置成不跑 BOSS。<\/li><li><strong>报找不到东西或随机错误<\/strong>：Java 过期 → 装最新 Windows x86 离线版 JRE。<\/li><li><strong>报内存相关错误<\/strong>：用 SUM 在 Other Settings 里分配更多内存；和/或关闭所有 Java 程序后，给 <code>java.exe<\/code>、<code>javaw.exe<\/code> 打 <strong>4GB patch<\/strong>。<\/li><\/ul><\/li><\/ul>\n<h2>SKSE（Skyrim Script Extender）<\/h2>\n<ul><li>默认会被自动识别；否则手动把 <code>skse_loader.exe<\/code> 加为可执行程序，并勾选 <code>Close MO when started<\/code>。<\/li><li><strong>SKSE 本身不能作为 mod 安装<\/strong>（这样 SKSE 脚本不会加载）。但<strong>可以把 SKSE 的脚本、以及 SKSE 插件作为 mod 安装<\/strong>（前提是<strong>没有<\/strong>把加载机制改成 Script Extender）。<\/li><li>排错 \"Couldn't read arguments\"：说明参数写错。在 <code>Modify Executables<\/code> 里选中 SKSE，删除/修正参数，点 <code>Modify<\/code> 保存。SKSE 的合法参数包括：<code>-h<\/code>、<code>-help<\/code>、<code>-editor<\/code>、<code>-priority &lt;level&gt;<\/code>、<code>-altexe &lt;path&gt;<\/code>、<code>-altdll &lt;path&gt;<\/code>、<code>-crconly<\/code>、<code>-waitforclose<\/code>、<code>-fpslimit &lt;max fps&gt;<\/code>、<code>-v<\/code>、<code>-msinfo<\/code>、<code>-noskiplauncher<\/code>、<code>-launchsteam<\/code>、<code>-affinity &lt;mask&gt;<\/code>、<code>-forcesteamloader<\/code>。<ul><li>改完后，<strong>在这个错误参数下创建的 SKSE 快捷方式都要删掉重建<\/strong>。<\/li><\/ul><\/li><\/ul>\n<h2>Creation Kit（CK）<\/h2>\n<ul><li>通常自动识别，无需配置。若需手动添加：Binary 选 <code>CreationKit.exe<\/code>，并<strong>勾选 <code>Overwrite Steam AppID<\/code> 填 <code>202480<\/code><\/strong>，否则 CK 看不到你的 mod。<\/li><li>通过 MO 用 CK 的已知限制：<ul><li>CK 运行期间，往 mod 目录里新增的文件<strong>要重启 CK 才可见<\/strong>；<\/li><li>保存后 esp <strong>会被移进 Overwrite<\/strong>；<\/li><li>CK 的脚本编译器是 64 位程序，MO 处理不了——要编译脚本只能把脚本临时放进 Data，或使用 <em>Papyrus Compiler Patch for x64 Systems<\/em>。<\/li><\/ul><\/li><\/ul>\n<h2>BodySlide 2 and Outfit Studio<\/h2>\n<ol><li>装归档时 MO 检测不到游戏数据：选 <code>Set data directory<\/code> → <code>OK<\/code> → 提示处选 <code>Ignore<\/code>。<\/li><li>左窗格会出现<strong>红 X<\/strong> 标记：右键 mod → <code>Ignore missing data<\/code>。<\/li><li>勾选启用该 mod。<\/li><li>再按通用步骤把 <code>BodySlide.exe<\/code> 加为可执行程序（该 mod 内的其它程序同理）。<\/li><\/ol>\n<h2>Simple Borderless Window（SBW）<\/h2>\n<ul><li>Binary 选 Skyrim 目录下的 <code>SBW.exe<\/code>，<strong>勾选 <code>Close MO when started<\/code><\/strong>。<\/li><li>注意：要让 Skyrim 以窗口模式启动，<strong>每个 profile 的 <code>skyrimprefs.ini<\/code> 都要把 <code>bFull Screen<\/code> 改为 0<\/strong>。<\/li><li>效果：游戏内看起来仍是全屏，只是没有边框。<\/li><\/ul>\n<h2>Free Commander XE（FCXE）<\/h2>\n<ul><li><strong>必须装 32 位版本<\/strong>（MO 只支持 32 位程序）。<\/li><li>用途：从 MO 内启动它，导航到 <code>&lt;Skyrim&gt;/data<\/code>，即可<strong>看到 MO 暴露给所有 MO 内启动程序的 VFS 视图<\/strong>——这是验证 MO 是否正常工作最直观的方式（用资源管理器看同一目录只会看到干净的原版文件）。<\/li><li>⚠️ 注意 FCXE <strong>不是 VFS 的完整还原<\/strong>：BSA 内的文件仍留在 BSA 里，不会显示成 Data 下的散文件，所以别把它当成 VFS 的真实全貌。<\/li><li>⚠️ 出于技术原因，<strong>不能用 Windows 资源管理器或基于它的程序<\/strong>做这件事；Total Commander（TC）等替代文件管理器可用，FCXE 与 TC 均实测正常。<\/li><\/ul>\n<blockquote>相关：<a href=\"third-party-executables.md\" target=\"<em>blank\" rel=\"noopener\">配置第三方程序与快捷方式<\/a>、<a href=\"enable-and-activate.md\" target=\"<\/em>blank\" rel=\"noopener\">启用 mod 与激活插件<\/a>、<a href=\"overwrite-dir.md\" target=\"_blank\" rel=\"noopener\">Overwrite 目录与维护<\/a>。<\/blockquote>", "_file": "05-usage/tool-recipes.md", "_chars": 4477}, {"id": "plugins-extensibility", "title": "插件体系：扩展、安装器与工具", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "插件", "安装器", "扩展", "黑名单"], "aliases": ["MO2 插件", "扩展开发", "installer 插件", "plugins"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "MO 插件分 extensions / installers / tools 三类，在 Settings → Plugins 里配置开关与参数；有崩溃嫌疑的插件会被列入黑名单。", "kind": "concept", "content": "<p>MO 可通过插件扩展。插件可用 <strong>C++/Qt<\/strong> 或 <strong>Python<\/strong> 编写（Python API 目前比 C++ 略受限，且要求用户自行安装 Python）。配置入口：<code>Settings<\/code> → <code>Plugins<\/code> 标签页。<\/p>\n<p>插件分三类：<strong>extensions（扩展）<\/strong>、<strong>installers（安装器）<\/strong>、<strong>tools（工具）<\/strong>。<\/p>\n<h2>Extensions（扩展）<\/h2>\n<p>为 MO 增加对新编程语言的支持能力。<\/p>\n<ul><li><strong>Python Proxy<\/strong>：让 MO 能运行 Python 插件；也可指定代理使用的 Python 位置。<ul><li><code>enabled<\/code>（布尔，默认 <code>true<\/code>）：启用/禁用该插件。<\/li><li><code>python-dir<\/code>（文本）：Python 安装根目录，例如 <code>C:/Python27<\/code>。<\/li><\/ul><\/li><\/ul>\n<h2>Installers（安装器）<\/h2>\n<p>让 MO 处理各式各样打包方式的 mod 归档。<\/p>\n<table><thead><tr><th style=\"text-align:left\">插件<\/th><th style=\"text-align:left\">作用与参数<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>BAIN Installer<\/strong><\/td><td style=\"text-align:left\">安装为 Wrye Bash 包管理器打包的归档。<strong>目前不支持 wizards<\/strong>。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Bundle Installer<\/strong><\/td><td style=\"text-align:left\">处理\"包中包\"（如 <code>.7z<\/code> 里套一个 FOMOD）的代理安装器。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Fomod Installer<\/strong><\/td><td style=\"text-align:left\">安装用 XML 描述安装选项的归档（FOMOD = <em>Fallout Mod<\/em>，源自 Fallout Mod Manager）。&lt;br&gt;<code>enabled<\/code>（默认 <code>true<\/code>）；<code>prefer<\/code>（默认 <code>true<\/code>）——设为 <code>true<\/code> 时接管所有 xml FOMOD；设为 <code>false<\/code> 则只要外部 NCC 插件还能用就不使用它。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Manual Installer<\/strong><\/td><td style=\"text-align:left\">几乎能装任何包，但需要用户交互。通常是最后兜底方案。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Fomod Installer external<\/strong><\/td><td style=\"text-align:left\">调用基于 NMM 的外部工具 <strong>NCC<\/strong> 来装 FOMOD。比内置的慢、集成度差，但<strong>兼容性更好<\/strong>（NCC 除 xml 外还支持 <strong>C# 脚本<\/strong>）。&lt;br&gt;⚠️ <strong>当 FOMOD 使用 C# 脚本时，无论设置如何都必定调用这个外部安装器。<\/strong><\/td><\/tr><tr><td style=\"text-align:left\"><strong>Simple Installer<\/strong><\/td><td style=\"text-align:left\">一键安装\"简单数据层格式\"的 mod。&lt;br&gt;<code>enabled<\/code>（默认 <code>true<\/code>）：关闭后总是弹出手动安装窗口；<code>silent<\/code>（默认 <code>false<\/code>）：设为 <code>true<\/code> 则所有简单归档<str
