ong>自动安装<\/strong>，跳过 Quick Install 菜单。<\/td><\/tr><\/tbody><\/table>\n<blockquote>关于 FOMOD 的实战取舍见<a href=\"install-mods.md\" target=\"_blank\" rel=\"noopener\">安装 mod<\/a>（可临时把 <code>prefer<\/code> 设为 <code>false<\/code> 强制走 NCC）。<\/blockquote>\n<h2>Tools（工具）<\/h2>\n<p>这类插件行为类似独立工具，但<strong>可能干扰 MO 主程序<\/strong>（例如请求当前 profile 信息、在虚拟目录里解析文件名）。<\/p>\n<table><thead><tr><th style=\"text-align:left\">插件<\/th><th style=\"text-align:left\">作用与参数<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>BSA Extractor<\/strong><\/td><td style=\"text-align:left\">安装 mod 时解包其中的 BSA。<code>enabled<\/code>（默认 <code>false<\/code>）：启用后，下次安装含 BSA 的 mod 会弹出对话框询问是否解包，并可选\"记住该设置\"。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>FNIS Checker<\/strong><\/td><td style=\"text-align:left\">提示你该在启动游戏前跑 FNIS。<code>enabled<\/code>（默认 <code>false<\/code>）；<code>sensitive<\/code>（默认 <code>false<\/code>）——设为 <code>true<\/code> 会更激进地提示（几乎每次改动 profile 元素都提示）。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>INI Editor<\/strong><\/td><td style=\"text-align:left\">编辑游戏配置的基础文本编辑器。<code>external<\/code>（默认 <code>false<\/code>）决定 ini 是否用外部 Windows 文本编辑器打开；<code>associated<\/code>（默认 <code>true<\/code>）决定用\"打开（Open）\"的关联程序，为 <code>false<\/code> 时用 Windows 的\"编辑（Edit）\"命令（通常仍是记事本，可在注册表里改）。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>NMM Import<\/strong><\/td><td style=\"text-align:left\">把通过 NMM 安装的 mod 导入 MO。<strong>测试不足<\/strong>。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Preview Base<\/strong><\/td><td style=\"text-align:left\">提供预览各类文件的能力。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Basic Diagnosis Plugin<\/strong><\/td><td style=\"text-align:left\">检查与其它插件无关的问题，见下。<\/td><\/tr><\/tbody><\/table>\n<h3>Basic Diagnosis Plugin 的检查项<\/h3>\n<table><thead><tr><th style=\"text-align:left\">参数<\/th><th style=\"text-align:left\">默认<\/th><th style=\"text-align:left\">含义<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><code>check_errorlog<\/code><\/td><td style=\"text-align:left\"><code>true<\/code><\/td><td style=\"text-align:left\">上次运行某个程序时发生错误则警告。<\/td><\/tr><tr><td style=\"text-align:left\"><code>check_overwrite<\/code><\/td><td style=\"text-align:left\"><code>true<\/code><\/td><td style=\"text-align:left\">Overwrite 目录里有文件则警告（见 <a href=\"overwrite-dir.md\" target=\"_blank\" rel=\"noopener\">Overwrite 目录<\/a>）。<\/td><\/tr><tr><td style=\"text-align:left\"><code>check_font<\/code><\/td><td style=\"text-align:left\"><code>true<\/code><\/td><td style=\"text-align:left\">字体配置引用了<strong>未安装的字体<\/strong>时警告。配置文件是 <code>Data/interface/fontconfig.txt<\/code>；缺字体时字母会显示成方框，通常是字体替换 mod 装坏了。<\/td><\/tr><tr><td style=\"text-align:left\"><code>check_conflict<\/code><\/td><td style=\"text-align:left\"><code>true<\/code><\/td><td style=\"text-align:left\">有与 MO 功能冲突的 mod 被安装时警告（目前只检查 Nitpick，而 MO 已内置该 mod 的修复）。<\/td><\/tr><tr><td style=\"text-align:left\"><code>check_missingmasters<\/code><\/td><td style=\"text-align:left\"><code>true<\/code><\/td><td style=\"text-align:left\">有插件缺 master 时警告。<\/td><\/tr><tr><td style=\"text-align:left\"><code>ow_ignore_empty<\/code><\/td><td style=\"text-align:left\"><code>false<\/code><\/td><td style=\"text-align:left\">检查 Overwrite 时忽略空目录。<\/td><\/tr><tr><td style=\"text-align:left\"><code>ow_ignore_log<\/code><\/td><td style=\"text-align:left\"><code>false<\/code><\/td><td style=\"text-align:left\">检查 Overwrite 时忽略 <code>*.log<\/code> 文件与空目录。<\/td><\/tr><\/tbody><\/table>\n<h2>Blacklisted Plugins（插件黑名单）<\/h2>\n<ul><li>此处列出已被<strong>列入黑名单、禁止启用<\/strong>的插件。<\/li><li>当 MO 检测到某插件<strong>可能引起崩溃<\/strong>时，会把它拉黑。<\/li><li>在列表里按 <strong>Delete 键<\/strong>可移除条目。<\/li><\/ul>\n<blockquote>相关：<a href=\"install-mods.md\" target=\"<em>blank\" rel=\"noopener\">安装 mod<\/a>（安装器实际表现）、<a href=\"settings-tabs.md\" target=\"<\/em>blank\" rel=\"noopener\">设置页参考<\/a>、<a href=\"overwrite-dir.md\" target=\"_blank\" rel=\"noopener\">Overwrite 目录与维护<\/a>。<\/blockquote>", "_file": "05-usage/plugins-extensibility.md", "_chars": 3078}, {"id": "hide-files-and-filetree", "title": "文件树、隐藏文件与冲突面板", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "文件树", "Filetree", ".mohidden", "冲突"], "aliases": ["隐藏文件", "冲突面板", "遮蔽单个文件"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "Conflicts 页显示谁覆盖谁并可 Hide 文件（加 .mohidden 后缀）；Filetree 页可新建/改名/删除/隐藏/拖动文件。", "kind": "tutorial", "content": "<h2>打开 Mod Information<\/h2>\n<p><strong>双击<\/strong>左窗格里的某个 mod，或右键 → <code>Information<\/code>。各标签页如下。<\/p>\n<table><thead><tr><th style=\"text-align:left\">标签页<\/th><th style=\"text-align:left\">作用<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Textfiles<\/strong><\/td><td style=\"text-align:left\">显示 mod 内所有文本文件（含 readme）。左侧列表点文件名即可查看，可编辑并用底部 <code>Save<\/code> 保存。<strong>只显示 ASCII 格式的 <code>*.txt<\/code><\/strong>。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>INI-Files<\/strong><\/td><td style=\"text-align:left\">显示并编辑 mod 内的 ini 文件；也可在左下框右键 → <code>Create Tweak<\/code> 新建 ini tweak（见 <a href=\"ini-and-tweaks.md\" target=\"_blank\" rel=\"noopener\">游戏 INI 与 ini tweaks<\/a>）。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Images<\/strong><\/td><td style=\"text-align:left\">查看 mod 内的图片。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Optional ESPs<\/strong><\/td><td style=\"text-align:left\">把本 mod 的插件移到<strong>非激活的可选位置<\/strong>——文件还在手边，但不会误启用。注意：放在这里的插件<strong>不会<\/strong>触发 MO 平时\"该 mod 含多个 ESP\"的提示。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Conflicts<\/strong><\/td><td style=\"text-align:left\">所有冲突文件总览（见下）。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Categories<\/strong><\/td><td style=\"text-align:left\">修改该 mod 的分类。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Nexus Info<\/strong><\/td><td style=\"text-align:left\">显示 Mod ID 对应 Nexus 页面的文本。Mod ID 不对要改，否则版本信息也跟着错；<code>Version<\/code> 也可在此修正；点蓝色 <code>Visit on Nexus<\/code> 打开网页。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Notes<\/strong><\/td><td style=\"text-align:left\">为 mod 写备注；悬停左窗格的便签图标即可看到。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Filetree<\/strong><\/td><td style=\"text-align:left\">显示 mod 内全部文件（含 MO 生成的 <code>meta.ini<\/code>——<strong>别动它<\/strong>），见下。<\/td><\/tr><\/tbody><\/table>\n<h2>Conflicts 面板<\/h2>\n<p>右侧三个数字，从上到下依次是：<\/p>\n<ol><li><strong>处于冲突中、且正在覆盖其它 mod<\/strong> 的文件数；<\/li><li><strong>处于冲突中、正被其它 mod 覆盖<\/strong> 的文件数；<\/li><li><strong>不与任何已启用 mod 冲突<\/strong> 的文件数。<\/li><\/ol>\n<ul><li><strong>上框<\/strong>：本 mod <strong>覆盖低优先级 mod<\/strong> 的文件。左侧是文件路径，右侧按<strong>优先级从低到高<\/strong>列出冲突文件的来源。<ul><li>想让<strong>别的 mod<\/strong>来提供该文件？把本 mod 的优先级调到那个 mod 之前。<\/li><li>或者右键某个冲突文件 → <code>Hide<\/code>，等效于把该文件从本 mod 移除。<\/li><\/ul><\/li><li><strong>下框<\/strong>：本 mod <strong>被高优先级 mod 覆盖<\/strong>的文件。左侧是路径，右侧是提供该文件的 mod 名（只有一个）。<strong>此框中无法 Hide 任何文件。<\/strong><\/li><\/ul>\n<h2>Hide 的实质：<code>.mohidden<\/code><\/h2>\n<ul><li><code>Hide<\/code> 实际是给文件<strong>追加 <code>.mohidden<\/code> 扩展名<\/strong>，让它不生效。<\/li><li>恢复：进入 <code>Filetree<\/code> 标签页，右键该文件 → <code>Unhide<\/code>。<\/li><li>这也是高级用法：两个 mod 互相覆盖<strong>不同<\/strong>文件、而你更想要两者各一部分时，可以用 Hide 精确取舍（详见<a href=\"conflict-resolution.md\" target=\"_blank\" rel=\"noopener\">冲突解决与优先级<\/a>）。<\/li><\/ul>\n<h2>Filetree 面板<\/h2>\n<ul><li>显示 mod 内<strong>全部文件<\/strong>，包含 MO 生成的 <code>meta.ini<\/code>（<strong>勿动<\/strong>，MO 把 mod 信息存在里面）。<\/li><li>右键菜单可：<strong>新建文件夹<\/strong>（<code>New Folder<\/code>，在所在层级下创建）、<strong>打开文件<\/strong>（<code>Open<\/code>）、<strong>重命名<\/strong>（<code>Rename<\/code>，也可双击文件改名）、<strong>删除<\/strong>（<code>Delete<\/code>）、<strong>隐藏<\/strong>（<code>Hide<\/code>）。<\/li><li>支持<strong>拖放<\/strong>在 mod 内移动文件/文件夹。<\/li><li>最适合用来核对\"东西到底装对目录没有\"，尤其是 <strong>FOMOD 装歪<\/strong>的情况。<\/li><\/ul>\n<blockquote>相关：<a href=\"conflict-resolution.md\" target=\"<em>blank\" rel=\"noopener\">冲突解决与优先级<\/a>、<a href=\"../01-mechanism/virtual-delete.md\" target=\"<\/em>blank\" rel=\"noopener\">虚拟删除<\/a>、<a href=\"overwrite-dir.md\" target=\"_blank\" rel=\"noopener\">Overwrite 目录与维护<\/a>。<\/blockquote>", "_file": "05-usage/hide-files-and-filetree.md", "_chars": 2075}, {"id": "update-and-uninstall", "title": "更新、合并与卸载 mod", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "更新", "卸载", "合并", "回收站"], "aliases": ["更新 mod", "卸载 mod", "合并 mod", "uninstall merge"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "用 Check all for update 查更新，全量替换用 Replace、部分更新用 Merge；卸载分\"仅当前 profile\"与\"全局删除（进回收站）\"。", "kind": "tutorial", "content": "<h2>检查更新<\/h2>\n<ul><li>在左窗格右键 → <code>Check all for update<\/code>。它按 Nexus 查各 mod 的新版本与 endorsement 状态，并把筛选视图切到 <code>&lt;Update&gt;<\/code>。<\/li><li>检测成败<strong>取决于 meta 信息是否正确<\/strong>（Nexus ID 与版本号）。有些作者版本号规则很怪，MO 可能识别不了——所以<strong>建议在 Nexus 上 Track 所有已装 mod<\/strong>，以跟踪中心为准。<\/li><li>MO <strong>不会<\/strong>自动轮询更新（作者不想给 Nexus 添无谓流量）；每次更新后版本号变绿/变红即反映结果（见 <a href=\"ui-layout.md\" target=\"_blank\" rel=\"noopener\">界面总览<\/a>）。<\/li><\/ul>\n<h2>更新<\/h2>\n<ol><li>下载新版本归档。<\/li><li>安装到<strong>原来同一个 mod<\/strong>上：<ul><li><strong>全量替换<\/strong>（新版本包含全部资源）→ 选 <code>Replace<\/code>；<\/li><li><strong>只更新部分文件<\/strong> → 选 <code>Merge<\/code>。<\/li><\/ul><\/li><li>更新后<strong>务必重新评估文件冲突<\/strong>，并按需调整优先级（见 <a href=\"conflict-resolution.md\" target=\"_blank\" rel=\"noopener\">冲突解决与优先级<\/a>）。<\/li><\/ol>\n<h2>卸载<\/h2>\n<ul><li><strong>仅从当前 profile 卸载<\/strong>：在左窗格<strong>取消勾选<\/strong>该 mod 即可——这是 profile 级操作，不影响其它 profile。<\/li><li><strong>从所有 profile 卸载<\/strong>：左窗格右键 → <code>Remove<\/code>，mod 文件夹会被<strong>删除到回收站<\/strong>。<ul><li>误删可从回收站<strong>还原该文件夹<\/strong>，MO 会重新认得它；但它会被当作<strong>新 mod<\/strong>处理：未勾选、且排在优先级最末。<\/li><\/ul><\/li><\/ul>\n<blockquote>相关：<a href=\"install-mods.md\" target=\"<em>blank\" rel=\"noopener\">安装 mod<\/a>（Merge/Replace 与备份）、<a href=\"enable-and-activate.md\" target=\"<\/em>blank\" rel=\"noopener\">启用 mod 与激活插件<\/a>（批量勾选/空格键）、<a href=\"backup-and-restore.md\" target=\"_blank\" rel=\"noopener\">备份与恢复<\/a>。<\/blockquote>", "_file": "05-usage/update-and-uninstall.md", "_chars": 1179}, {"id": "ini-and-tweaks", "title": "游戏 INI 与 ini tweaks", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "INI", "tweaks", "Configurator", "INI Editor"], "aliases": ["ini tweaks", "游戏 INI 编辑", "MO2 改 ini", "skyrim.ini 编辑"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "MO 首次启动会复制一份游戏 INI；用 Puzzle 菜单的 Configurator/INI Editor 编辑；可为 mod 建 ini tweak 覆盖任意 ini 设置。", "kind": "tutorial", "content": "<h2>编辑游戏 INI<\/h2>\n<ul><li>MO <strong>首次启动时会复制一份游戏 INI<\/strong>。此后你对默认游戏 INI 文件的修改<strong>不会<\/strong>反映到 MO 里。<\/li><li>编辑入口：打开 <strong>Puzzle 菜单<\/strong>（工具栏 tools 按钮）：<ul><li>选 <code>Configurator<\/code> 启动 GUI 版 INI 编辑器；<\/li><li>或点 <code>INI Editor<\/code> 启动文本版编辑器。<\/li><\/ul><\/li><li>INI Editor 是分标签页的文本编辑器，编辑的是<strong>当前 MO profile<\/strong> 对应的游戏 ini 文件；顶部下拉框可选择 <code>[Display]<\/code> 之类的节，直接跳到该节。<\/li><\/ul>\n<h2>ini tweaks<\/h2>\n<p><strong>ini tweak<\/strong> 是\"随 mod 一起生效的 ini 设置\"，用来避免手工反复改 ini。<\/p>\n<h3>创建 tweak<\/h3>\n<ol><li><strong>双击<\/strong>左窗格任意 mod（比如你的补丁 mod）打开信息面板。<\/li><li>切到 <strong>INI-Files<\/strong> 标签页。<\/li><li>在<strong>左下方小框里右键<\/strong> → <code>Create Tweak<\/code>。<\/li><li>输入名字（如 <code>Particle Tweak<\/code>）→ OK。<\/li><li>在右侧大框里粘贴你要的设置，例如先写节名 <code>[Particles]<\/code>，下一行写 <code>iMaxDesired=6000<\/code>。<\/li><li>点 <code>Save<\/code> 保存，关闭信息面板；重新打开该面板，tweak 旁会有一个复选框，<strong>勾选即激活<\/strong>。<\/li><\/ol>\n<ul><li>也可以直接为一个具体 mod 创建它需要的 tweak（例：Skyrim Flora Overhaul 需要 <code>[Grass]<\/code> 下的 <code>iMaxGrassTypesPerTexure=XX<\/code>），这样该 mod 启用时 tweak 也随之启用。<\/li><\/ul>\n<h3>一个便捷的起步方式（用来存放\"自定义 ini tweaks\"）<\/h3>\n<ol><li>让 Overwrite 里<strong>有文件<\/strong>时（没有就先随便跑个会产出的工具，或按旧做法：关闭 MO，在 <code>mods<\/code> 目录里新建一个空文件夹再启动 MO）；<\/li><li>右键 Overwrite → <code>Create Mod<\/code>，命名如 <code>Custom ini Tweaks<\/code>；<\/li><li>双击该新 mod 打开信息面板 → INI-Files 标签页 → 按上面的办法创建 tweak。<\/li><\/ol>\n<h3>ini tweak 的语义（重要）<\/h3>\n<p>据 Tannin 原话，ini tweaks <strong>不是去修改<\/strong> <code>skyrim.ini<\/code> / <code>skyrimprefs.ini<\/code>，而是<strong>替代<\/strong>它们：<\/p>\n<ul><li>若某设置在 ini tweak 中存在，那么该设置<strong>优先于任何其它 ini<\/strong>；<\/li><li>按当时的实现，ini tweak 甚至<strong>应当能覆盖其它 ini 文件的设置<\/strong>（例如 SKSE 插件的）——不过他本人未验证过。<\/li><\/ul>\n<h3>为什么有用<\/h3>\n<ul><li>把\"随配置变化\"的设置（如 STEP 推荐的各项设置、Darnified UI 需要的 <code>[Fonts]<\/code> 段）做成 tweak 放进一个 mod。<\/li><li>这样<strong>切换 profile 时只需启用/禁用该 mod<\/strong>，不必去手工编辑 ini 本身。<\/li><\/ul>\n<blockquote>相关：<a href=\"hide-files-and-filetree.md\" target=\"<em>blank\" rel=\"noopener\">文件树、隐藏文件与冲突面板<\/a>（INI-Files 标签页）、<a href=\"profile-switching.md\" target=\"<\/em>blank\" rel=\"noopener\">Profile 切换<\/a>、<a href=\"overwrite-dir.md\" target=\"_blank\" rel=\"noopener\">Overwrite 目录与维护<\/a>。<\/blockquote>", "_file": "05-usage/ini-and-tweaks.md", "_chars": 1870}, {"id": "ui-layout", "title": "界面总览：工具栏、左窗格与右窗格", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "界面", "工具栏", "左窗格", "右窗格", "图标"], "aliases": ["MO2 界面", "工具栏 左窗格 右窗格", "ui layout", "界面总览"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "工具栏六按钮加三状态位；左窗格管 mod 与优先级（含 Flags 图例），右窗格管插件、归档、Data、存档、下载。", "kind": "reference", "content": "<h2>工具栏<\/h2>\n<p>左上六个按钮（依次为 archive、globe、profile、gear、puzzle、wrench）：<\/p>\n<table><thead><tr><th style=\"text-align:left\">按钮<\/th><th style=\"text-align:left\">作用<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>archive（归档）<\/strong><\/td><td style=\"text-align:left\">浏览并打开 mod 归档包来安装 mod。<strong>注意：只能安装归档包内的 mod<\/strong>，非归档形式无法用它安装。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>globe（地球）<\/strong><\/td><td style=\"text-align:left\">用浏览器打开所管游戏的 Nexus 主页；同时把 MO 设置为可通过 <code>Download with Manager<\/code> 下载该游戏的 mod。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>profile（档案）<\/strong><\/td><td style=\"text-align:left\">设置不同的 mod 配置组合，见 <a href=\"profile-switching.md\" target=\"_blank\" rel=\"noopener\">Profile 切换<\/a>。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>gear（齿轮）<\/strong><\/td><td style=\"text-align:left\">管理可在 MO 内运行的第三方可执行程序，见 <a href=\"third-party-executables.md\" target=\"_blank\" rel=\"noopener\">配置第三方程序<\/a>。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>tools（工具）<\/strong><\/td><td style=\"text-align:left\">打开各类可扩展插件：默认含 INI Editor、NMM Import、Configurator。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>settings（设置）<\/strong><\/td><td style=\"text-align:left\">配置 MO 的各方面行为，见 <a href=\"settings-tabs.md\" target=\"_blank\" rel=\"noopener\">设置页参考<\/a>。<\/td><\/tr><\/tbody><\/table>\n<p>右上还有三个：<\/p>\n<ul><li><strong>warning 图标<\/strong>：提示 MO 设置存在<strong>潜在问题<\/strong>。点击后会在窗口底部日志里显示检测到的问题；<strong>图标灰掉表示一切正常<\/strong>。<\/li><li><strong>update 按钮<\/strong>：更新 MO 到最新版。<strong>变色 = 有更新可点<\/strong>；灰 = 暂无更新。<\/li><li><strong>help 菜单<\/strong>：需要帮助时用它。点击 help 后，把光标指向界面控件，<strong>能解释的控件会变成问号<\/strong>，左键点击即可阅读说明；还含 MO wiki 链接、<code>Report Issue<\/code>（跳官方 bug 追踪器）、以及各引导教程入口。<\/li><\/ul>\n<h2>左窗格（mod 列表）<\/h2>\n<ul><li>按当前 profile 显示<strong>全部已安装 mod<\/strong>、它们的<strong>优先级顺序<\/strong>与<strong>启用状态<\/strong>。<\/li><li>可按名称、标记（flag）、分类、版本号、优先级、安装日期、Nexus ID 排序。<\/li><li><strong>Ctrl+左键可多选<\/strong>，再按<strong>空格键<\/strong>批量切换选中状态。<\/li><\/ul>\n<h3>Flags 列图标图例<\/h3>\n<table><thead><tr><th style=\"text-align:left\">图标<\/th><th style=\"text-align:left\">含义<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">闪电 + 绿加号<\/td><td style=\"text-align:left\">该 mod 会覆盖低优先级 mod 的文件，<strong>且自身文件不会被任何人覆盖<\/strong>。<\/td><\/tr><tr><td style=\"text-align:left\">闪电 + 红减号<\/td><td style=\"text-align:left\">该 mod 不覆盖任何 mod，但<strong>有文件会被高优先级 mod 覆盖<\/strong>。<\/td><\/tr><tr><td style=\"text-align:left\">闪电 + 绿加号与红减号<\/td><td style=\"text-align:left\">既覆盖低优先级 mod，也有文件被高优先级 mod 覆盖。<\/td><\/tr><tr><td style=\"text-align:left\">闪电（无加减号）<\/td><td style=\"text-align:left\">该 mod 会被其它 mod 完全覆盖——<strong>装了等于没装<\/strong>。<\/td><\/tr><tr><td style=\"text-align:left\">红 X<\/td><td style=\"text-align:left\">MO 不认为该 mod 含有效数据（名称变灰且斜体）。右键选 <code>Ignore missing data<\/code> 可清除该标记（会在 mod 目录里放一个空的 textures 文件夹凑成\"有效\"）。<\/td><\/tr><tr><td style=\"text-align:left\">心形问号<\/td><td style=\"text-align:left\">该 mod 尚未 endorsement。<\/td><\/tr><tr><td style=\"text-align:left\">便签<\/td><td style=\"text-align:left\">你给该 mod 添加过 notes。<\/td><\/tr><\/tbody><\/table>\n<h3>版本列的颜色<\/h3>\n<ul><li><strong>绿色<\/strong> = 已是最新版；<strong>红色<\/strong> = 有新版可用；<strong>红色且前置警告图标<\/strong> = 你的版本号数字更高，但与 Nexus 当前版本对不上。<\/li><\/ul>\n<h3>优先级列<\/h3>\n<ul><li>数值越大，资源覆盖优先级越高；同名冲突时<strong>高数值者覆盖低数值者<\/strong>。<\/li><li>默认且推荐<strong>按优先级升序排序<\/strong>，方便直接拖放调整。<\/li><\/ul>\n<blockquote>提示：只有在左窗格使用 <code>No groups<\/code> 分组方式<strong>且<\/strong> <code>Priorities<\/code> 列激活时才能拖放排序。<strong>自 1.2.15 起所有分组方式都支持拖放<\/strong>，若你没看到该功能，请升级 MO。<\/blockquote>\n<h2>右窗格（标签页）<\/h2>\n<ul><li><strong>Plugins<\/strong>：所有已启用 ESM/ESP 的加载顺序管理（见 <a href=\"enable-and-activate.md\" target=\"_blank\" rel=\"noopener\">启用 mod 与激活插件<\/a>）。<\/li><li><strong>Archives<\/strong>：mod 内含 BSA 时在此列出，可解包（见 <a href=\"bsa-management-usage.md\" target=\"_blank\" rel=\"noopener\">BSA 管理与解包<\/a>）。<\/li><li><strong>Data<\/strong>：展示\"通过 MO 启动的程序\"所看到的 Data 目录——File 列是文件名，Mod 列是来源 mod；<strong>来源名显示红色<\/strong>表示另有激活的 mod 提供了同名文件并正在覆盖它（悬停红名可看冲突文件位置）。勾选底部 <code>Show only conflicts<\/code> 只看冲突文件。<ul><li>右键菜单：<code>Open/Execute<\/code>、<code>Add as Executable<\/code>（把 Data 里的程序快速加进可执行列表）、<code>Hide<\/code>（加 <code>.mohidden<\/code> 后缀使其失效）、<code>Write to file<\/code>（导出整个虚拟 Data 目录及来源清单）、<code>Refresh<\/code>。<\/li><\/ul><\/li><li><strong>Saves<\/strong>：存档与缺失插件（见 <a href=\"saves-management.md\" target=\"_blank\" rel=\"noopener\">存档查看与 Fix Mods<\/a>）。<\/li><li><strong>Downloads<\/strong>：所有通过 MO 下载的 mod（见 <a href=\"downloads-and-nexus.md\" target=\"_blank\" rel=\"noopener\">下载管理与 Nexus 集成<\/a>）。<\/li><\/ul>\n<h2>其它相关页面<\/h2>\n<ul><li><a href=\"filters-and-grouping.md\" target=\"_blank\" rel=\"noopener\">筛选、分组与冲突高亮<\/a><\/li><li><a href=\"hide-files-and-filetree.md\" target=\"_blank\" rel=\"noopener\">文件树、隐藏文件与冲突面板<\/a><\/li><li><a href=\"mod-categories.md\" target=\"_blank\" rel=\"noopener\">自定义 mod 分类<\/a><\/li><li><a href=\"warnings-and-order-problems.md\" target=\"_blank\" rel=\"noopener\">警告面板与潜在 mod 顺序问题<\/a><\/li><\/ul>", "_file": "05-usage/ui-layout.md", "_chars": 2785}, {"id": "filters-and-grouping", "title": "筛选、分组与冲突高亮", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "筛选", "分组", "冲突高亮", "Namefilter"], "aliases": ["filters", "按类型分组", "怎么筛 mod", "冲突颜色怎么看", "按 mod 类型过滤"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "可按分类或 Nexus ID 分组，Filter 侧栏提供预置与自定义筛选并支持 And/Or 组合；选中 mod 时用红/绿高亮输赢双方。", "kind": "tutorial", "content": "<h2>分组（Grouping）<\/h2>\n<ul><li>位置：左窗格<strong>底部中间的下拉菜单<\/strong>。<\/li><li>目前有两种分组方式：<strong>按分类<\/strong>（Categories）或<strong>按 Nexus ID<\/strong>。<\/li><li>视觉提示：分组激活时，mod 列表会被框在<strong>绿色<\/strong>框里。选 <code>No Grouping<\/code> 关闭分组。<\/li><li>⚠️ <strong>分组开启时无法用拖放改优先级<\/strong>（自 1.2.15 起已支持在所有分组方式下拖放）。<\/li><\/ul>\n<h2>冲突高亮<\/h2>\n<p>除了 <code>Flags<\/code> 列的图标（见<a href=\"ui-layout.md\" target=\"_blank\" rel=\"noopener\">界面总览<\/a>），MO 还会给与<strong>当前选中 mod<\/strong> 存在冲突的 mod 上色：<\/p>\n<ul><li><strong>绿色<\/strong> = \"输\"的一方：这些 mod 有文件不会进游戏。<\/li><li><strong>红色<\/strong> = \"赢\"的一方：这些 mod 会替换掉所选 mod 的文件。<\/li><\/ul>\n<h2>筛选（Filters）<\/h2>\n<ul><li>入口：左窗格<strong>左下角的 <code>Filter<\/code> 按钮<\/strong>，会从左弹出侧栏。<\/li><li>用<strong>左键<\/strong>选择筛选条件；按住 <strong>Ctrl + 左键<\/strong>可多选。<\/li><li><strong>取消<\/strong>某个筛选：右键高亮项 → <code>Deselect filter<\/code>；或 Ctrl+点击它；或点击侧栏内任意空白处。<\/li><li><strong>组合逻辑<\/strong>：侧栏底部的 <code>And<\/code> / <code>Or<\/code>。<code>And<\/code> 只显示<strong>同时满足所有<\/strong>所选条件的 mod；<code>Or<\/code> 显示满足<strong>任意一个<\/strong>条件的 mod。<\/li><li>视觉提示：筛选激活时，mod 列表会被框在<strong>红色<\/strong>框里。<\/li><\/ul>\n<h3>预置筛选<\/h3>\n<table><thead><tr><th style=\"text-align:left\">筛选<\/th><th style=\"text-align:left\">选中什么<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><code>&lt;Checked&gt;<\/code><\/td><td style=\"text-align:left\">当前 profile 中<strong>已启用<\/strong>的 mod。<\/td><\/tr><tr><td style=\"text-align:left\"><code>&lt;Unchecked&gt;<\/code><\/td><td style=\"text-align:left\">当前 profile 中<strong>未启用<\/strong>的 mod。<\/td><\/tr><tr><td style=\"text-align:left\"><code>&lt;Update&gt;<\/code><\/td><td style=\"text-align:left\">有可用新版本的 mod（执行 <code>Check all for update<\/code> 后会自动选中）。<\/td><\/tr><tr><td style=\"text-align:left\"><code>&lt;Managed by MO&gt;<\/code><\/td><td style=\"text-align:left\">安装进 MO 的 mod。<\/td><\/tr><tr><td style=\"text-align:left\"><code>&lt;Managed outside MO&gt;<\/code><\/td><td style=\"text-align:left\">非 MO 管理的 mod。<\/td><\/tr><tr><td style=\"text-align:left\"><code>&lt;No Category&gt;<\/code><\/td><td style=\"text-align:left\">未分配分类的 mod。<\/td><\/tr><tr><td style=\"text-align:left\"><code>&lt;Conflicted&gt;<\/code><\/td><td style=\"text-align:left\">已启用、且与其它已启用 mod 存在文件冲突的 mod。<\/td><\/tr><tr><td style=\"text-align:left\"><code>&lt;Not Endorsed&gt;<\/code><\/td><td style=\"text-align:left\">尚未 endorsement 的 mod（含被标记为 <code>Won't Endorse<\/code> 的）。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Filter Categories<\/strong><\/td><td style=\"text-align:left\">在所有 <code>&lt;...&gt;<\/code> 预置之后，按 Category 列属性筛选，自定义分类也会出现在这里。要新增分类：右键筛选侧栏 → <code>Edit Categories<\/code>（详见<a href=\"mod-categories.md\" target=\"_blank\" rel=\"noopener\">自定义 mod 分类<\/a>）。<\/td><\/tr><\/tbody><\/table>\n<h2>Namefilter<\/h2>\n<p>在侧栏里直接<strong>输入 mod 名称的片段<\/strong>即可快速定位。<\/p>\n<blockquote>相关：<a href=\"ui-layout.md\" target=\"<em>blank\" rel=\"noopener\">界面总览<\/a>、<a href=\"conflict-resolution.md\" target=\"<\/em>blank\" rel=\"noopener\">冲突解决与优先级<\/a>、<a href=\"hide-files-and-filetree.md\" target=\"_blank\" rel=\"noopener\">文件树、隐藏文件与冲突面板<\/a>。<\/blockquote>", "_file": "05-usage/filters-and-grouping.md", "_chars": 1721}, {"id": "mod-categories", "title": "自定义 mod 分类", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "分类", "categories.dat", "Nexus ID"], "aliases": ["自定义分类", "mod 分类", "categories", "给 mod 分组"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "在 Settings → Configure Mod Categories 里增删分类、关联 Nexus 分类 ID、设置父子层级；配置存于 categories.dat。", "kind": "tutorial", "content": "<p>MO 内置的分类很有限，装 mod 时常看到有些有分类、有些没有。可自行补齐。<\/p>\n<h2>入口<\/h2>\n<p><code>Settings<\/code> → <code>General<\/code> 标签页底部的 <strong><code>Configure Mod Categories<\/code><\/strong> 按钮。会打开一个列出所有现有分类的窗口（看不全就把窗口往左右拖宽一点）。<\/p>\n<h2>基本操作<\/h2>\n<ul><li><strong>单击<\/strong>某分类选中它（整行高亮）。<\/li><li><strong>双击<\/strong> <code>ID<\/code>、<code>Name<\/code>、<code>Nexus IDs<\/code>、<code>Parent ID<\/code> 任一项即可进入编辑框。<\/li><li><strong>右键<\/strong>任意分类 → 弹出菜单可<strong>添加 / 删除<\/strong>分类。选 Add entry 会在高亮项<strong>上方<\/strong>新建一个空白分类，MO 会给它分配新 ID，名字初始为 <code>new<\/code>。<\/li><li><code>ID<\/code> 列显示的编号主要用于参照，一般无需修改；<strong>最左侧无标题列<\/strong>是分类在列表中的出现次序，可<strong>点击拖动<\/strong>调整位置。<\/li><li>其余字段都可双击（或选中后按 F2）编辑。<\/li><\/ul>\n<h2>关联 Nexus 分类<\/h2>\n<ol><li>打开 Nexus 对应游戏的 Categories 页面（在 Nexus 主页把鼠标悬停在 <code>Files<\/code> 上，选 <code>Categories<\/code>）。<\/li><li>悬停某个分类，浏览器里会显示链接预览，<strong>末尾的 <code>CAT=&lt;数字&gt;<\/code><\/strong> 就是 Nexus 分类 ID（例：<code>CAT=67<\/code> 对应 Abodes - Player Homes）。<\/li><li>回到 MO，选中你的新分类，<strong>双击 <code>Nexus IDs<\/code> 字段<\/strong>填入该数字。<\/li><li><strong>双击 <code>Name<\/code> 字段<\/strong>把 <code>new<\/code> 改成你想要的分类名。<\/li><\/ol>\n<h2>建立层级（父子分类）<\/h2>\n<ul><li>MO 有些分类是嵌套的子分类，做法是填 <strong><code>Parent ID<\/code><\/strong>（窗口最右列）。<\/li><li>例：新建分类 <code>FOOD<\/code>，MO 分配 ID 为 25；再建一个 <code>ROTTEN<\/code>，把它的 <code>Parent ID<\/code> 设为 25，<code>ROTTEN<\/code> 就成了 <code>FOOD<\/code> 的子分类。<\/li><li>删除分类：高亮后右键 → remove。<\/li><\/ul>\n<h2>给单个 mod 改分类<\/h2>\n<p>在左窗格右键任意 mod：<\/p>\n<ul><li><code>Add/Remove Categories<\/code>：下拉菜单里增删分类；<\/li><li><code>Replace Categories<\/code>：整组替换分类；<\/li><li><code>Primary Category<\/code>：设置显示在 Category 列里的主分类。<\/li><\/ul>\n<h2>备份分类<\/h2>\n<p>分类数据存放在 <strong><code>categories.dat<\/code><\/strong>。编辑满意后，关掉 MO，到 MO 文件夹复制一份 <code>categories.dat<\/code> 存好——将来重装 MO 时把它放回主目录，你的分类就回来了。<\/p>\n<blockquote>相关：<a href=\"filters-and-grouping.md\" target=\"<em>blank\" rel=\"noopener\">筛选、分组与冲突高亮<\/a>（分类也可用作筛选条件）、<a href=\"backup-and-restore.md\" target=\"<\/em>blank\" rel=\"noopener\">备份与恢复<\/a>。<\/blockquote>", "_file": "05-usage/mod-categories.md", "_chars": 1584}, {"id": "warnings-and-order-problems", "title": "警告面板与潜在 mod 顺序问题", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "警告", "mod 顺序", "排错"], "aliases": ["警告面板", "mod 顺序问题", "warnings", "顺序警告"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "工具栏警告图标提示\"潜在 mod 顺序问题\"，可点 Fix 让 MO 重排；它管资源（贴图/网格）顺序，与 LOOT 管的插件顺序不同。", "kind": "tutorial", "content": "<h2>警告图标<\/h2>\n<ul><li>工具栏有时会亮起 <strong>warning 图标<\/strong>，表示左窗格的 mod 顺序存在<strong>潜在问题<\/strong>。<\/li><li>点击它 → 显示需要处理的 <code>Problems<\/code>；选中上方面板里的 <code>Potential Mod order Problem<\/code>，下方会给出<strong>所需调整的说明<\/strong>。<\/li><\/ul>\n<h2>怎么处理<\/h2>\n<ul><li>最好的做法通常是直接点 <strong><code>Fix<\/code><\/strong>，让 MO 帮你重排这些 mod。<\/li><li>若你做了大量改动、甚至<strong>整体重装了所有 mod<\/strong>，可以先<strong>手动排序<\/strong>再 Fix。<\/li><li>手动排序的技巧：<strong>从列表底部往上调<\/strong>，这样在处理高位 mod 时，可能某些冲突已经被顺带解决了。<\/li><\/ul>\n<h2>\"潜在\"是什么意思<\/h2>\n<ul><li>正如对话框标题所说，这些是<strong>潜在<\/strong>问题。<\/li><li>通常游戏<strong>仍能跑起来<\/strong>、未必会 CTD，但<strong>很可能出现贴图/网格（或其它资源）缺失，或至少是错的那一份<\/strong>。<\/li><li>这个功能相当于对\"作者页面上关于该 mod 应装在哪个位置、与谁先后顺序\"的提醒做了一次自动复核。<\/li><li>原理：所有 mod 都被\"装\"进 MO 的<strong>虚拟游戏数据目录<\/strong>，所以<strong>游戏引擎实际的加载顺序<\/strong>可以通过在左窗格重排这些 mod 来改变。<\/li><\/ul>\n<h2>与 LOOT / Sort 的区别（重要）<\/h2>\n<table><thead><tr><th style=\"text-align:left\"><\/th><th style=\"text-align:left\">管什么<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>本警告面板 / 左窗格顺序<\/strong><\/td><td style=\"text-align:left\"><strong>资源<\/strong>（textures / meshes / menus 等）的覆盖关系<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Plugins 页的 <code>Sort<\/code>、LOOT、BOSS<\/strong><\/td><td style=\"text-align:left\"><strong>插件<\/strong>（esp/esm）的加载顺序<\/td><\/tr><\/tbody><\/table>\n<blockquote>二者性质不同：mod 顺序问题不是 LOOT 或 BOSS 能处理的范畴。<\/blockquote>\n<blockquote>相关：<a href=\"conflict-resolution.md\" target=\"<em>blank\" rel=\"noopener\">冲突解决与优先级<\/a>、<a href=\"enable-and-activate.md\" target=\"<\/em>blank\" rel=\"noopener\">启用 mod 与激活插件<\/a>、<a href=\"ui-layout.md\" target=\"_blank\" rel=\"noopener\">界面总览<\/a>（warning 图标）。<\/blockquote>", "_file": "05-usage/warnings-and-order-problems.md", "_chars": 1216}, {"id": "settings-tabs", "title": "设置页参考（General / Nexus / Plugins / Workarounds）", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "设置", "Settings", "Workarounds", "Log Level"], "aliases": ["MO2 设置", "settings tabs", "General Nexus Plugins", "设置页"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "齿轮按钮打开设置：General 管语言/皮肤/日志/路径/分类，Nexus 管账号与服务器，Workarounds 管加载机制等特殊开关。", "kind": "reference", "content": "<p>入口：工具栏 <code>settings<\/code>（wrench）按钮。<\/p>\n<h2>General 标签页<\/h2>\n<ul><li><strong>Language<\/strong>：界面语言下拉。当前支持英语（美式）、捷克语、荷兰语、法语、德语、日语、韩语、俄语、西班牙语、土耳其语，以及<strong>中文（简体与繁体）<\/strong>。<\/li><li><strong>Style<\/strong>：选择皮肤。<code>dark.qss<\/code> 大概是最流行的。<\/li><li><strong>Log Level<\/strong>：控制写入 <code>ModOrganizer.log<\/code> 的内容量。<ul><li><code>Debug<\/code> 最详细、排错最有用；<code>Info<\/code> 信息较少、遇到 bug 时帮助有限；<code>Error<\/code> 只记录错误、几乎不提供上下文。<\/li><li>日志<strong>只在 MO 建立 VFS 的初始化阶段<\/strong>产生；游戏实际加载阶段的开销可忽略。Tannin 的说法是：性能上\"没有值得一提的 CPU 影响，都是磁盘 I/O；即便 Debug 级别 MO 也不会产生很多日志，实际游戏中几乎没有（MO 的活动主要在启动和加载阶段）\"。<\/li><\/ul><\/li><li><strong>Advanced<\/strong>：可修改 <code>downloads<\/code>、<code>mods<\/code>、<code>webcache<\/code> 的存放目录。用 SSD 且不想把下载归档放上去时很有用；多份 MO 共用一处已装 mod 时也有用。<\/li><li><strong>User Interface<\/strong>：紧凑下载界面 / 下载元信息显示的开关组合。<\/li><li><strong>Reset Dialogs<\/strong>：重置所有勾选过\"记住选择（Remember Selection）\"的位置。<ul><li>典型用途：你曾在安装含 BSA 的 mod 时选了\"总是解包\"，现在想恢复询问——用 Reset Dialogs 即可。<\/li><\/ul><\/li><li><strong>Configure Mod Categories<\/strong>：编辑 mod 分类，见<a href=\"mod-categories.md\" target=\"_blank\" rel=\"noopener\">自定义 mod 分类<\/a>。<\/li><\/ul>\n<h2>Nexus 标签页<\/h2>\n<ul><li><strong>Login Info<\/strong>：填 Nexus 账号密码可免去每次输入；勾选可让 MO 自动登录。<strong>以加密形式存于 <code>ModOrganizer.ini<\/code><\/strong>。<\/li><li><strong>Offline Mode<\/strong>：勾选后 MO 不访问互联网。<\/li><li><strong>Proxy Settings<\/strong>：<code>Use HTTP Proxy<\/code> 让 MO 使用系统代理设置。<\/li><li><strong>Associate with \"Download with manager\" links<\/strong>：把 Nexus 上的 Download with Manager 链接关联到你所管游戏对应的 MO。<\/li><li><strong>Servers<\/strong>：下载过 mod 后，MO 会记录已知服务器及其连接速度。把左框里的服务器<strong>拖到右框<\/strong>即设为首选——<strong>Premium 用户<\/strong>可借此指定 Premium 服务器以获更快速度。<\/li><\/ul>\n<h2>Plugins 标签页<\/h2>\n<ul><li>各插件的具体开关与参数都在这里配置，见<a href=\"plugins-extensibility.md\" target=\"_blank\" rel=\"noopener\">插件体系<\/a>。<\/li><\/ul>\n<h2>Workarounds 标签页<\/h2>\n<table><thead><tr><th style=\"text-align:left\">项<\/th><th style=\"text-align:left\">说明<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Steam App ID<\/strong><\/td><td style=\"text-align:left\">Steam 用于该游戏的 ID。<strong>除非你确信它错了，否则别动<\/strong>。详见<a href=\"load-mechanism.md\" target=\"_blank\" rel=\"noopener\">加载机制与 Steam App ID<\/a>。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Load Mechanism<\/strong><\/td><td style=\"text-align:left\">MO 作用于游戏的方式：<code>Mod Organizer<\/code>（默认）、<code>Script Extender<\/code>、<code>Proxy DLL<\/code>。<strong>默认机制不出问题就别改<\/strong>；<code>Proxy DLL<\/code> 是个\"大 hack\"，应优先避免。详见<a href=\"load-mechanism.md\" target=\"_blank\" rel=\"noopener\">加载机制与 Steam App ID<\/a>。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>NMM Version<\/strong><\/td><td style=\"text-align:left\">MO 作为 user agent 时声称的 NMM 版本。若 Nexus 封禁了某个 NMM 版本，可能需要调高。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Hide inactive ESPs/ESMs<\/strong><\/td><td style=\"text-align:left\">隐藏未激活的插件。<strong>当前有 bug，勿用<\/strong>。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Force-enable game files<\/strong><\/td><td style=\"text-align:left\">勾选则强制加载基础游戏文件（如 Skyrim 的 <code>Skyrim.esm<\/code> 及其相关 BSA）；<strong>取消勾选<\/strong>可禁用基础文件——在做\"基于该引擎的整体转换 mod\"时可能有用。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Display mods installed outside MO<\/strong><\/td><td style=\"text-align:left\">控制是否把真实 Data 目录里的所有\"插件 + BSA\" mod 显示为 Non-MO mod。关闭只会移除装在 Data 里的 mod，不会移除官方 DLC。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Back-date BSAs<\/strong><\/td><td style=\"text-align:left\">仅 Skyrim 的 Archive Invalidation 替代方案。<strong>跑 Skyrim 且未启用 Archive Invalidation 时必须勾选<\/strong>，否则原版 BSA 可能覆盖你的 loose file，非常难排查。见 <a href=\"bsa-management-usage.md\" target=\"_blank\" rel=\"noopener\">BSA 管理与解包<\/a>。<\/td><\/tr><\/tbody><\/table>\n<blockquote>相关：<a href=\"ui-layout.md\" target=\"<em>blank\" rel=\"noopener\">界面总览<\/a>、<a href=\"plugins-extensibility.md\" target=\"<\/em>blank\" rel=\"noopener\">插件体系<\/a>、<a href=\"load-mechanism.md\" target=\"<em>blank\" rel=\"noopener\">加载机制与 Steam App ID<\/a>、<a href=\"downloads-and-nexus.md\" target=\"<\/em>blank\" rel=\"noopener\">下载管理与 Nexus 集成<\/a>。<\/blockquote>", "_file": "05-usage/settings-tabs.md", "_chars": 2715}, {"id": "runtime-deploy", "title": "运行时部署 mod（不写入游戏目录）", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "部署", "运行时", "VFS"], "aliases": ["运行时部署", "不写入游戏目录", "runtime deploy", "部署方式"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "MO2 在游戏进程启动的瞬间用 VFS 合并 mod，磁盘上的游戏目录始终未被修改。", "kind": "tutorial", "content": "<p>MO2 的核心体验是：<strong>mod 从不写进游戏目录<\/strong>。所有合并都发生在\"运行时\"。<\/p>\n<h2>流程<\/h2>\n<ol><li>你把 mod 装进 MO2 的 <code>mods\\<\/code> 目录（各自独立文件夹）。<\/li><li>你勾选要启用的 mod，调整顺序决定优先级。<\/li><li>点\"运行游戏\"——此时 <a href=\"../03-architecture/usvfs-connector.md\" target=\"_blank\" rel=\"noopener\">UsvfsConnector<\/a> 把合并视图交给 usvfs，注入游戏进程。<\/li><li>游戏进程\"看到\"的 <code>Data\\<\/code> 是几十个 mod 叠加后的结果；<strong>磁盘上的真实游戏目录一字未改<\/strong>。<\/li><li>关闭 MO2 / 退出游戏，虚拟链接消失，游戏目录恢复如初。<\/li><\/ol>\n<h2>好处<\/h2>\n<ul><li>游戏目录始终干净、可验证（Verify integrity 不会报\"被改过\"）。<\/li><li>启用/禁用 mod 只是改视图，不碰文件，不会破坏其它 mod 或游戏本身。<\/li><li>同一游戏可同时拥有多套互不相干的配置（profile）。<\/li><\/ul>\n<blockquote>这与 <a href=\"mod-isolation.md\" target=\"<em>blank\" rel=\"noopener\">mod 隔离<\/a> 是一体两面；冲突如何裁决见 <a href=\"conflict-resolution.md\" target=\"<\/em>blank\" rel=\"noopener\">冲突解决与优先级<\/a>。<\/blockquote>", "_file": "05-usage/runtime-deploy.md", "_chars": 840}, {"id": "third-party-executables", "title": "配置第三方程序与快捷方式", "category": "05-usage", "version": "1.0.0", "updated": "2026-09-20", "tags": ["使用", "可执行文件", "工具", "快捷方式", "Steam AppID"], "aliases": ["第三方程序", "添加 exe", "快捷方式配置", "executables", "LOOT 怎么加"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "所有 mod 相关工具都必须从 MO 内启动；用齿轮按钮配置 Binary/Start in/Arguments 等字段，并可创建（profile 专属）快捷方式。", "kind": "tutorial", "content": "<h2>核心原则<\/h2>\n<ul><li>所有与 mod 打交道的程序（BOSS、Wrye Bash、游戏启动器、SkyEdit、Creation Kit 等），以及你用的各种 <strong>launcher<\/strong>（如 SKSE、SBW），<strong>都应该从 MO 内部启动<\/strong>。否则它们看不到 VFS 合并后的视图。<\/li><li>部分知名工具会被<strong>自动检测<\/strong>并加入可执行列表；其余需手动添加。<\/li><li>要从 MO 启动某程序：在右上角的可执行程序下拉框里选中它，点 <code>Run<\/code>。<\/li><\/ul>\n<h2>Modify Executables（点齿轮按钮打开）<\/h2>\n<table><thead><tr><th style=\"text-align:left\">字段<\/th><th style=\"text-align:left\">说明<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\"><strong>Title<\/strong><\/td><td style=\"text-align:left\">显示在下拉菜单里的名字，随你取。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Binary<\/strong><\/td><td style=\"text-align:left\">要运行的可执行文件完整路径。<strong>只有 <code>.exe<\/code> / <code>.bat<\/code> 算可执行文件<\/strong>；<code>.jar<\/code> / <code>.py<\/code> 等需要<strong>解释器<\/strong>（Java、Python），此时把<strong>解释器<\/strong>设为 Binary。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Start in<\/strong><\/td><td style=\"text-align:left\">程序的工作目录，通常可留空。跑 <code>.jar<\/code> / <code>.py<\/code> 时可能需要设为该文件所在路径。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Arguments<\/strong><\/td><td style=\"text-align:left\">传给二进制文件的命令行参数。Java 应用：Binary 设 <code>java.exe<\/code>/<code>javaw.exe<\/code>，参数填 <code>-jar &lt;xxx.jar&gt;<\/code>；Python 应用：Binary 设 <code>python.exe<\/code>/<code>pythonw.exe<\/code>，参数填 <code>&lt;xxx.py&gt;<\/code>。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Overwrite Steam AppID<\/strong><\/td><td style=\"text-align:left\">仅用于<strong>通过 Steam 分发、但不是游戏本身<\/strong>的程序（已知场景就是 Creation Kit，且会自动配好）。<\/td><\/tr><tr><td style=\"text-align:left\"><strong>Close MO when started<\/strong><\/td><td style=\"text-align:left\">勾选则启动该程序时关闭 MO。按个人偏好选。<\/td><\/tr><\/tbody><\/table>\n<h3>通用配置步骤<\/h3>\n<ol><li>点齿轮按钮打开 <code>Modify Executables<\/code>。<\/li><li><code>Title<\/code> 填入你想叫的名字。<\/li><li><code>Binary<\/code> 右侧的省略号按钮（\"Browse filesystem\"）→ 浏览到程序并选中。<\/li><li>（如需）设置 <code>Start in<\/code>。<\/li><li>（如需）填 <code>Arguments<\/code>。<\/li><li>（如需）勾选 <code>Overwrite Steam AppID<\/code> 并填数字 / 勾选 <code>Close MO when started<\/code>。<\/li><li>点 <code>Add<\/code> 加入列表 → 点 <code>Close<\/code> 关闭。<\/li><\/ol>\n<blockquote>若程序文件与可执行文件在同一目录（如 <code>TESV.exe<\/code> 就在 Skyrim 目录），可跳过 Start in 相关步骤。<strong>多数情况只需要 Title + Binary。<\/strong><\/blockquote>\n<h2>自动识别的可执行文件<\/h2>\n<ul><li>只有装在<strong>默认位置<\/strong>才会被自动加入，<strong>MO 不会去搜索整个文件系统<\/strong>。它们都需要位于游戏根目录（<code>&lt;游戏安装目录&gt;/<\/code>）。<\/li><li>支持的游戏包括 Skyrim、Oblivion、Fallout 3、Fallout New Vegas。<\/li><li>BOSS 早期要求装在 Data 下，后来有了自己的目录，因此 MO 当前会看两处：<strong>游戏根目录下的 <code>BOSS<\/code> 文件夹<\/strong>与<strong>根目录下的 <code>Data<\/code> 文件夹<\/strong>。<\/li><\/ul>\n<table><thead><tr><th style=\"text-align:left\">游戏<\/th><th style=\"text-align:left\">自动识别<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">Skyrim<\/td><td style=\"text-align:left\"><code>skse_loader.exe<\/code>、<code>SBW.exe<\/code>、<code>TESV.exe<\/code>、<code>SkyrimLauncher.exe<\/code>、<code>CreationKit.exe<\/code>、<code>BOSS/BOSS.exe<\/code><\/td><\/tr><tr><td style=\"text-align:left\">Oblivion<\/td><td style=\"text-align:left\"><code>obse_loader.exe<\/code>、<code>oblivion.exe<\/code>、<code>OblivionModManager.exe<\/code>、<code>TESConstructionSet.exe<\/code>、<code>OblivionLauncher.exe<\/code>、<code>BOSS/BOSS.exe<\/code> 或 <code>Data/BOSS.exe<\/code><\/td><\/tr><tr><td style=\"text-align:left\">Fallout 3<\/td><td style=\"text-align:left\"><code>fose_loader.exe<\/code>、<code>fallout3.exe<\/code>、<code>fomm/fomm.exe<\/code>、<code>geck.exe<\/code>、<code>FalloutLauncher.exe<\/code>、<code>BOSS/BOSS.exe<\/code><\/td><\/tr><tr><td style=\"text-align:left\">Fallout NV<\/td><td style=\"text-align:left\"><code>nvse_loader.exe<\/code>、<code>falloutnv.exe<\/code>、<code>fomm/fomm.exe<\/code>、<code>geck.exe<\/code>、<code>FalloutNVLauncher.exe<\/code>、<code>BOSS/BOSS.exe<\/code><\/td><\/tr><\/tbody><\/table>\n<h2>通用故障排查<\/h2>\n<table><thead><tr><th style=\"text-align:left\">现象<\/th><th style=\"text-align:left\">可能原因<\/th><th style=\"text-align:left\">解决<\/th><\/tr><\/thead><tbody><tr><td style=\"text-align:left\">报 \"This application could not be started. Do you want to view information about this issue?\"<\/td><td style=\"text-align:left\">该程序以 mod 形式装在 MO 里，但<strong>在左窗格没勾选<\/strong><\/td><td style=\"text-align:left\">在左窗格勾选它所在的 mod<\/td><\/tr><tr><td style=\"text-align:left\">启动失败：MO 卡住几秒后解锁、什么都没发生<\/td><td style=\"text-align:left\">同上<\/td><td style=\"text-align:left\">同上<\/td><\/tr><tr><td style=\"text-align:left\">报 \"Elevation required\"<\/td><td style=\"text-align:left\">该程序需要管理员权限<\/td><td style=\"text-align:left\">信任该程序就点 <code>Yes<\/code><\/td><\/tr><tr><td style=\"text-align:left\">程序能启动，但<strong>不采用<\/strong>你填的自定义参数<\/td><td style=\"text-align:left\">快捷方式是在你添加参数<strong>之前<\/strong>创建的<\/td><td style=\"text-align:left\">展开 <code>Shortcut<\/code> 下拉 → 移除所有快捷方式（手动改过名的需手动删）→ 重新创建<\/td><\/tr><\/tbody><\/table>\n<h2>快捷方式<\/h2>\n<p>从可执行程序下拉选中程序 → 点 <code>Shortcut<\/code> 下拉 → 选择目标即可<strong>切换<\/strong>（再选一次即移除）：<\/p>\n<ul><li><code>Desktop<\/code>：桌面快捷方式。<\/li><li><code>Start Menu<\/code>：开始菜单快捷方式。<\/li><li><code>Toolbar<\/code>：放在 MO 自己的工具栏上。<\/li><\/ul>\n<blockquote>⚠️ 在 <code>Modify Executables<\/code> 里改动的参数或选项<strong>不会影响此前创建的快捷方式<\/strong>；要让快捷方式吃上新设置，必须删掉重建。<\/blockquote>\n<h3>改快捷方式图标<\/h3>\n<p>默认情况下经 MO 创建的快捷方式显示 MO 的图标。要换成程序自己的图标： 右键快捷方式 → <code>Properties<\/code> → <code>Change Icon…<\/code> → <code>Browse…<\/code> → 定位到程序（或图标文件）→ <code>Open<\/code> → <code>OK<\/code> → <code>Apply<\/code> → <code>OK<\/code>。<\/p>\n<h3>Profile 专属快捷方式<\/h3>\n<p><strong>仅对桌面与开始菜单快捷方式有效<\/strong>——这样它只会在指定 profile 下运行：<\/p>\n<ol><li>先按上面的方式创建快捷方式。<\/li><li>右键快捷方式 → <code>Properties<\/code>。<\/li><li><code>Target<\/code> 字段原本形如 <code>\"&lt;ModOrganizer&gt;/ModOrganizer.exe\" \"&lt;ApplicationFolder&gt;/Application.exe\"<\/code>。<\/li><li>在<strong>两个引号字符串之间<\/strong>插入 <code> -p \"Profile 名\"<\/code>，替换成你的 profile 名。<\/li><li>结果应为 <code>\"&lt;ModOrganizer&gt;/ModOrganizer.exe\" -p \"Profile 名\" \"&lt;ApplicationFolder&gt;/Application.exe\"<\/code>。<\/li><li>点 <code>Apply<\/code> → <code>OK<\/code>；（可选）把快捷方式改名以标明它对应哪个 profile。<\/li><\/ol>\n<blockquote>具体工具的配置配方见<a href=\"tool-recipes.md\" target=\"<em>blank\" rel=\"noopener\">常用工具配置配方<\/a>；加载机制与 Steam AppID 见<a href=\"load-mechanism.md\" target=\"<\/em>blank\" rel=\"noopener\">加载机制与 Steam App ID<\/a>。<\/blockquote>", "_file": "05-usage/third-party-executables.md", "_chars": 3566}, {"id": "troubleshooting-vfs", "title": "VFS/USVFS 常见排错", "category": "06-reference", "version": "1.0.0", "updated": "2026-09-20", "tags": ["参考", "排错", "杀软", "HVCI", "事件日志"], "aliases": ["VFS 报错", "USVFS 排错", "mod 不生效", "游戏起不来 MO2", "troubleshooting vfs"], "source": "https://github.com/ModOrganizer2/modorganizer/wiki/Troubleshooting", "summary": "注入被拦、HVCI/Core Isolation 阻止受保护 exe、Windows 事件日志服务异常、系统日志被清等排查。", "kind": "reference", "content": "<p>usvfs 靠<strong>注入<\/strong>工作，所以很多\"怪问题\"其实是注入没成功或被干扰。<\/p>\n<h2>1. 杀软 / 反恶意软件拦截注入<\/h2>\n<ul><li>usvfs 的 hook 技术与部分恶意软件相似，易被拦截且<strong>常常毫无提示<\/strong>。<\/li><li><strong>把整个 MO2 安装目录<\/strong>（不只是 exe）加入排除/例外项；顽固者可能需彻底卸载。<\/li><li>已知会干扰的（非穷举）：Acronis（含反勒索模块）、Avast、Bitdefender、Malwarebytes、VIPRE、Windows Defender。<\/li><\/ul>\n<h2>2. HVCI / Core Isolation（硬件强制栈保护）阻止受保护 exe<\/h2>\n<ul><li>Windows 的 <strong>Hardware-enforced Stack Protection（需 Intel CET / AMD Shadow Stack 硬件）<\/strong> 可能阻止受保护的可执行文件通过 usvfs 运行。<\/li><li>用户侧解决：Windows 安全中心 → 应用和浏览器控制 → 漏洞利用保护设置 → 程序设置 → 添加该程序 → 找到 exe → 关闭\"硬件强制栈保护\"（Override system settings → Off）。<\/li><li>开发者侧：用 <code>/CETCOMPAT:NO<\/code> 编译，或 .NET 项目设 <code>&lt;CETCompat&gt;false&lt;/CETCompat&gt;<\/code>。<\/li><\/ul>\n<h2>3. Windows Event Log 服务异常<\/h2>\n<ul><li>未知原因下，该服务对正确 hook 像 LOOT/Wrye Bash/xEdit 这类程序<strong>至关重要<\/strong>。MO2 2.1.4+ 会在运行可执行文件时警告服务异常。<\/li><li>检查\"Windows Event Log\"服务状态应为\"正在运行\"、启动类型\"自动\"；若拒绝启动，可能是 Windows 日志损坏（超出本 wiki 范围）。<\/li><\/ul>\n<h2>4. 清空了 Windows 系统日志<\/h2>\n<ul><li>系统日志被清（手动或 CCleaner 的\"Windows Event Logs\"）后，必须<strong>重启<\/strong>（用\"重启\"而非\"关机\"）MO2 才能恢复正常。CCleaner 可关闭该项避免。<\/li><\/ul>\n<h2>5. 通用排查顺序<\/h2>\n<ul><li>在 MO2 之外测试该程序是否正常。<\/li><li>新建<strong>空白 profile<\/strong>（选 DefaultGameSettings）测试。<\/li><li>确认游戏目录/Data 里没有残留 mod。<\/li><li>确认脚本扩展器（SKSE 等）版本匹配且为最新。<\/li><li>关闭杀软、完成 Windows 更新、真正\"重启\"电脑。<\/li><\/ul>\n<blockquote>想确认 usvfs 到底有没有在重定向，开 <a href=\"../04-debugging/debugging-usvfs.md\" target=\"_blank\" rel=\"noopener\">调试 usvfs<\/a> 看日志。<\/blockquote>", "_file": "06-reference/troubleshooting-vfs.md", "_chars": 1538}, {"id": "faq", "title": "常见问题（FAQ）", "category": "06-reference", "version": "1.0.0", "updated": "2026-09-20", "tags": ["参考", "FAQ", "排错"], "aliases": ["MO2 常见问题", "MO2 FAQ", "mod organizer faq"], "source": "https://stepmodifications.org/wiki/Guide:Mod_Organizer", "summary": "关于 VFS/USVFS 的高频疑问：mod 不显示、profile 崩溃、与符号链接区别等。", "kind": "reference", "content": "<h2>mod 在游戏里不显示 / LOOT、xEdit、Wrye Bash 看不到？<\/h2>\n<ul><li>确认你是<strong>通过 MO2 启动<\/strong>游戏或工具（直接双击 exe 看不到虚拟视图）。<\/li><li>确认 mod 已勾选启用、且顺序正确（见 <a href=\"../05-usage/conflict-resolution.md\" target=\"_blank\" rel=\"noopener\">冲突解决<\/a>）。<\/li><li>检查是否被安全软件拦截（见 <a href=\"troubleshooting-vfs.md\" target=\"_blank\" rel=\"noopener\">VFS 排错<\/a>）。<\/li><\/ul>\n<h2>为什么游戏目录里找不到我的 mod 文件？<\/h2>\n<ul><li>正常。mod 物理上在 <code>mods\\<\/code>，通过 VFS 只在被注入的进程内\"可见\"（见 <a href=\"../01-mechanism/process-local-links.md\" target=\"_blank\" rel=\"noopener\">进程级可见<\/a>）。资源管理器看到的是真实目录。<\/li><\/ul>\n<h2>这和 NTFS 符号链接有什么不同？<\/h2>\n<ul><li>见 <a href=\"../02-features/vs-ntfs-symlink.md\" target=\"_blank\" rel=\"noopener\">USVFS vs NTFS 符号链接<\/a>：进程级/会话级/免权限/跨文件系统/可叠加可隐藏。<\/li><\/ul>\n<h2>切换 profile 时 MO2 崩溃？<\/h2>\n<ul><li>见排错：禁用杀软、检查 Windows Event Log 服务、重启（而非关机）。<\/li><\/ul>\n<h2>会不会有性能影响？<\/h2>\n<ul><li>会有少量内存/CPU 开销（见 <a href=\"../02-features/usvfs-drawbacks.md\" target=\"_blank\" rel=\"noopener\">USVFS 的代价与风险<\/a>），通常可忽略。<\/li><\/ul>\n<h2>关闭 MO2 后 mod 还在吗？<\/h2>\n<ul><li>虚拟链接随会话消失；mod 文件本身仍在 <code>mods\\<\/code>，下次启动照常生效。<\/li><\/ul>", "_file": "06-reference/faq.md", "_chars": 988}];
const CATS = {"00-overview": 2, "01-mechanism": 5, "02-features": 2, "03-architecture": 5, "04-debugging": 1, "05-usage": 26, "06-reference": 2};
const CAT_LABELS = {"00-overview": "概览", "01-mechanism": "核心机制", "02-features": "特性对比", "03-architecture": "源码级架构", "04-debugging": "调试排错", "05-usage": "使用与运维", "06-reference": "参考"};
let curCat='all', curQ='', sortBy='cat';

function label(cat){ return CAT_LABELS[cat] || cat; }
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function filtered(){
  const q=curQ.toLowerCase();
  return ENTRIES.filter(e=>{
    if(curCat!=='all' && e.category!==curCat) return false;
    if(q){
      const hay=(e.title+' '+(e.summary||'')+' '+(e.tags||[]).join(' ')+' '+
        (e.aliases||[]).join(' ')+' '+(e.category||'')+' '+label(e.category)).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
// 记录每条命中的原因：优先展示比标题更具体的匹配证据（别名 / 标签 / 正文）
function showWhy(e){
  const q=curQ.toLowerCase(); if(!q) return '';
  if((e.aliases||[]).some(a=>a.toLowerCase().includes(q))) return '别名命中';
  if((e.tags||[]).some(t=>t.toLowerCase().includes(q))) return '标签命中';
  const t=(e.title||'').toLowerCase();
  if(t.includes(q)) return '标题命中';
  if((e.summary||'').toLowerCase().includes(q)) return '摘要命中';
  return '正文提及';
}
function sortEntries(list){
  if(sortBy==='title') return list.sort((a,b)=>(a.title||'').localeCompare(b.title||'','zh'));
  if(sortBy==='updated') return list.sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
  return list; // cat：本已按 category 预排序
}
function renderGrid(){
  const list=sortEntries(filtered());
  const view=document.getElementById('view');
  if(!list.length){view.innerHTML='<div class="empty">没有匹配的条目</div>';return;}
  let html='<div class="grid">';
  for(const e of list){
    const why=showWhy(e);
    html+='<div class="card" data-id="'+esc(e.id)+'"><h3>'+esc(e.title)+'</h3>'+
      (why?'<div><span class="why">'+esc(why)+'</span></div>':'')+
      '<div class="chips" style="margin-bottom:6px">'+
      '<span class="chip">'+esc(label(e.category))+'</span>'+
      (e.kind?'<span class="chip muted">'+esc(e.kind)+'</span>':'')+'</div>'+
      '<p class="sum">'+esc(e.summary||'')+'</p>'+
      '<div class="chips">'+((e.tags||[]).slice(0,4).map(t=>'<span class="chip">'+esc(t)+'</span>').join(''))+'</div></div>';
  }
  html+='</div>';
  view.innerHTML=html;
  view.querySelectorAll('.card').forEach(c=>c.onclick=()=>showDetail(c.dataset.id));
}
function showDetail(id){
  const e=ENTRIES.find(x=>x.id===id); if(!e) return;
  const view=document.getElementById('view');
  const src=e.source?'<a class="btn btn-ghost" href="'+esc(e.source)+'" target="_blank" rel="noopener">官方来源 ↗</a>':'';
  const file=e._file?'<a class="btn btn-primary" href="'+esc(e._file)+'" target="_blank" rel="noopener">打开本地 .md →</a>':'';
  const tags=((e.tags||[]).map(t=>'<span class="chip">'+esc(t)+'</span>').join(''));
  const als=((e.aliases||[]).length?
    '<div class="chips" style="margin:6px 0 0">'+
    (e.aliases||[]).map(a=>'<span class="chip muted">'+esc(a)+'</span>').join('')+'</div>':'');
  view.innerHTML='<button class="back" onclick="renderGrid()">← 返回列表</button>'+
    '<div class="detail"><h2>'+esc(e.title)+'</h2>'+
    '<div class="chips" style="margin-bottom:4px">'+
    '<span class="chip">'+esc(label(e.category))+'</span>'+
    (e.kind?'<span class="chip muted">'+esc(e.kind)+'</span>':'')+
    (e.version?'<span class="chip muted">v'+esc(e.version)+'</span>':'')+
    (e.updated?'<span class="chip muted">'+esc(e.updated)+'</span>':'')+'</div>'+
    '<div class="chips" style="margin:6px 0 10px">'+tags+'</div>'+
    '<div class="article">'+(e.content||'<p>(暂无正文)</p>')+'</div>'+
    '<div class="actions">'+file+src+'</div>'+
    als+
    '<p class="tip">源文件：'+esc(e._file||'')+'</p></div>';
  document.querySelector('main').scrollTop=0;
}
function selectCat(cat,btn){
  curCat=cat;
  document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('active'));
  const target=btn||document.querySelector('#navbox .navbtn[data-cat="'+cat+'"]');
  if(target) target.classList.add('active');
  renderGrid();
}
function setNavCollapsed(collapsed){
  const box=document.getElementById('navbox'), btn=document.getElementById('navtoggle'),
        fab=document.getElementById('navfab'), side=document.querySelector('aside');
  box.classList.toggle('hidden',collapsed);
  if(side) side.classList.toggle('collapsed',collapsed);
  // 侧栏内的按钮只在侧栏可见时有意义：文案恒为「‹ 收起」，收起态的唤出入口交给 #navfab
  if(btn) btn.setAttribute('aria-expanded',String(!collapsed));
  if(fab){ fab.classList.toggle('show',collapsed); fab.setAttribute('aria-expanded',String(!collapsed)); }
  try{localStorage.setItem('kb-nav-collapsed',collapsed?'1':'0');}catch(e){}
}
function toggleNav(){
  setNavCollapsed(document.getElementById('navbox').classList.contains('hidden')===false);
}
function renderNav(){
  const nav=document.getElementById('catnav');
  nav.innerHTML=Object.keys(CATS).map(c=>'<button class="navbtn" data-cat="'+c+'">'+esc(label(c))+' <span class="cnt">'+CATS[c]+'</span></button>').join('');
  // 注意：侧栏「全部」按钮和分类按钮必须在这里统一绑定。
  // 只选 [data-cat]（即分类按钮），避开同处 #navbox 内的状态过滤按钮，
  // 否则「全部」按钮会漏绑 → 选中某分类后切不回全部（历史 bug）。
  document.querySelectorAll('#navbox .navbtn[data-cat]').forEach(b=>b.onclick=()=>selectCat(b.dataset.cat,b));
}
function renderStats(){
  const s=document.getElementById('stats');
  const total=ENTRIES.length;
  document.getElementById('allcnt').textContent=total;
  let h='<span class="stat">共 '+total+' 条</span>';
  for(const c in CATS) h+='<span class="stat">'+esc(label(c))+': '+CATS[c]+'</span>';
  s.innerHTML=h;
}
document.getElementById('q').oninput=e=>{curQ=e.target.value;renderGrid();};
document.getElementById('sort').onchange=e=>{sortBy=e.target.value;renderGrid();};
document.getElementById('navtoggle').onclick=toggleNav;
// 用 IIFE 包一层：TESTS 里也有同名变量，顶层重名会 SyntaxError（check_index_ui 会把两段拼在一起跑）
(function(){ const f=document.getElementById('navfab'); if(f) f.onclick=()=>setNavCollapsed(false); })();
renderStats();renderNav();renderGrid();
// 恢复上次的收起/展开状态
